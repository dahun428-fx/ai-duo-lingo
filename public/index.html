\"\n\n---\n\n<details>\n<summary>정답 보기<\/summary>\n\n**손계산**\n1. 평균 CE = −ln 0.25 = ln 4 → PPL = **4**\n2. e^1.758 ≈ **5.8** / 평균 CE ≈ **1.548**로 약 0.21 nat 줄어야 함\n3. w: 0 → 0 − 1.1×(−6) = 6.6 → 6.6 − 1.1×(7.2) = −1.32 → … 3을 넘어 반대편으로 점점 더 크게 튀며 **발산**. 학습률이 너무 크면 학습이 망가짐.\n4. q = [0.5, 0.5] → [0.5, −0.5]\n\n**코드**\n- 관찰: q → 대략 [0.8, 0.2, 0.0x]. **데이터 빈도에 수렴**. (크로스엔트로피 최소화 = 데이터 분포 따라하기)\n- (a) 0.05: 너무 느림 / 5: 빠르게 수렴 / 50: 진동하거나 불안정할 수 있음\n- (b) H([0.8,0.2]) ≈ 0.500 nat. CE는 H(p) 아래로 못 내려감 (H(p,q) ≥ H(p)). 학습이 길어질수록 0.500에 접근.\n- (c)\n  ```python\n  def loss(z): return -np.log(softmax(z)[data]).mean()\n  eps = 1e-5; z2 = z.copy(); z2[0] += eps\n  print((loss(z2) - loss(z)) / eps)   # 같은 z에서 구한 grad[0]과 거의 같아야 함\n  ```\n\n**퀴즈**\n1. 매 단어마다 평균 4.7개 후보 중에서 고민하는 정도의 불확실성\n2. 기울기는 손실이 *증가*하는 방향이라, 반대로 가야 손실이 줄기 때문\n3. 최솟값을 지나쳐 진동하거나 발산\n4. 음수 (q−1, q<1이므로)\n5. 모멘텀(이전 걸음 방향을 조금 이어 가는 기법) 없는 SGD, 학습률 0.7 (5에폭 후부터 반 에폭마다 절반으로 줄임)\n<\/details>\n", "link": "논문 연결: 3.3절 , 3.4절", "lesson": true}, {"id": "day09", "short": "중심극한정리: 무작위를 많이 더하면 종 모양이 된다", "md": "# Day 09. 중심극한정리: 무작위를 많이 더하면 종 모양이 된다\n\n30분 · 논문 연결: **3.4절** \"We initialized all of the LSTM's parameters with the uniform distribution between −0.08 and 0.08\", 배치 128문장, 기울기 g를 128로 나눠 평균을 쓴다는 대목\n\n---\n\n## 오늘의 목표\n1. 기댓값(평균)과 분산을 계산하고, 표본평균의 분산이 $\\sigma^2/n$으로 줄어든다는 걸 설명할 수 있다.\n2. 중심극한정리(CLT)를 한 문장으로 말하고 시뮬레이션으로 확인한다.\n3. 논문의 (a) 균등분포 초기화와 (b) 배치 128 평균 기울기가 CLT와 어떻게 연결되는지 설명할 수 있다.\n\n**복습 (1분):** SGD는 왜 전체 데이터 대신 미니배치로 기울기를 구하나요? (답: 빠르니까. 그런데 \"추정\"이 믿을 만한가? → 오늘의 질문)\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 기댓값과 분산\n- **기댓값** $E[X]$: 무한히 반복했을 때의 평균\n- **분산** $\\text{Var}(X) = E[(X - E[X])^2]$: 평균에서 얼마나 흩어지나\n- **표준편차** $\\sigma = \\sqrt{\\text{Var}}$: 원래 단위로 본 흩어짐\n\n주사위: E = 3.5, Var = 35/12 ≈ 2.917, σ ≈ 1.708 (표로 계산하는 과정은 [기댓값과 분산](#ev01))\n\n### 1-2. 더하고 평균 내면 생기는 일 (독립일 때)\n- 합: $\\text{Var}(X_1 + \\dots + X_n) = n\\,\\sigma^2$\n- 평균: $\\text{Var}(\\bar X) = \\sigma^2 / n$ → 표준편차는 $\\sigma/\\sqrt n$\n\n**n개를 평균내면 흔들림이 √n분의 1로 줄어듭니다.** (4배 모으면 흔들림 절반)\n\n### 1-3. 중심극한정리 (CLT)\n> 독립이고 같은 분포를 따르며 **분산이 유한한**(값이 끝없이 튀지 않는) 무작위 값들을 충분히 많이 더하면(또는 평균 내면), **원래 분포 모양과 상관없이** 그 합은 **정규분포(종 모양)** 에 가까워진다.\n\n$$\\bar X \\approx \\mathcal N\\Big(\\mu,\\ \\frac{\\sigma^2}{n}\\Big)$$\n\n주사위 하나는 평평한(균등) 분포인데, 주사위 30개의 평균은 3.5 근처에 몰린 종 모양이 됩니다.\n\n### 1-4. 논문 연결 ① 초기화 (선택, 결과만 읽기)\n모든 파라미터를 $U(-0.08, 0.08)$에서 뽑습니다. 균등분포 $U(-a, a)$(−a와 a 사이에서 아무 수나 똑같은 확률로 뽑기)의 분산은 $a^2/3$. 이 값은 증명 없이 결과만 쓰면 됩니다.\n뉴런 하나의 입력은 $z = \\sum_{i=1}^{1000} w_i x_i$, 즉 **무작위 값 1000개의 합** → CLT에 의해 z는 대략 정규분포!\n분산 = 1000 × Var(w) × Var(x). 이 값이 너무 크면 tanh·sigmoid가 포화(평평한 끝)되어 학습이 안 되고, 너무 작으면 신호가 사라집니다. **초기화 범위(0.08)를 고르는 건 결국 \"합의 분산\"을 조절하는 일**이에요.\n\n> **68-95-99.7 규칙.** 정규분포(종 모양)에서는 평균 ± 1σ 안에 약 68%, ± 2σ 안에 약 95%, ± 3σ 안에 약 99.7%가 들어갑니다. 그래서 2σ 넘게 위로 벗어나는 경우는 약 2.5%(어림으로 2~3%)뿐입니다.\n\n### 1-5. 논문 연결 ② 미니배치 기울기\n배치 128개 문장의 기울기를 더한 뒤 128로 나눕니다 (3.4절). 128개 기울기의 **평균** → CLT에 의해 \"진짜 기울기\" 주위의 정규분포를 따르고, 흔들림은 $1/\\sqrt{128} ≈ 1/11.3$로 줄어듭니다. 그래서 일부 데이터만 봐도 꽤 믿을 만한 방향을 얻습니다.\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n**① 표본평균의 흔들림:** 주사위 σ ≈ 1.708\n- 주사위 4개 평균의 σ = 1.708/√4 ≈ **0.854**\n- 주사위 100개 평균의 σ = 1.708/10 ≈ **0.171** → 평균이 대략 3.5 ± 0.34(2σ) 안에 95% 확률로 들어옴\n\n**② 논문 초기화의 분산:** a = 0.08\n- Var(w) = 0.08²/3 = 0.0064/3 ≈ **0.00213**, σ_w ≈ 0.046\n- 입력 x들이 분산 1이라고 하면, z = Σ₁₀₀₀ wᵢxᵢ의 분산 ≈ 1000 × 0.00213 = **2.13**, σ_z ≈ **1.46**\n- → z는 대략 N(0, 1.46²). 약 96%가 −3 ~ 3 안에 들어옴. tanh는 |z|가 2를 넘으면 이미 평평해지기 시작하므로, \"포화가 전혀 없다\"가 아니라 \"출력이 ±1에 완전히 붙어 버리지는 않는다\" 정도로 읽으세요. (입력의 분산이 1이라는 것은 계산을 쉽게 하려는 가정입니다.)\n\n---\n\n## 직접 만져보기\n\n<div class=\"widget\" data-w=\"clt\"><\/div>\n\n## 3. 능동 연습 (10분)\n\n### 손계산\n1. 동전(앞=1, 뒤=0)의 기댓값과 분산은?\n2. 동전 100번 던진 앞면 개수의 기댓값과 표준편차는? CLT로 보면 앞면이 60개 이상 나올 일은 흔한가요? (힌트: 평균에서 몇 σ 떨어졌나)\n3. 배치 크기를 128에서 512로 늘리면 기울기 추정의 표준편차는 몇 배가 되나요?\n4. 입력이 1000개가 아니라 4000개인 층에서 z의 분산을 1000개일 때와 같게 하려면 균등분포 범위 a를 몇 배로 해야 하나요?\n\n### 코드: CLT를 눈으로 보기\n```python\nimport numpy as np\nrng = np.random.default_rng(0)\n\ndef text_hist(x, bins=15, width=40):\n    counts, edges = np.histogram(x, bins=bins)\n    for c, e in zip(counts, edges):\n        print(f\"{e:7.2f} | \" + \"#\" * int(width * c / counts.max()))\n\n# 1) 주사위 1개 vs 주사위 30개의 평균\none = rng.integers(1, 7, size=100_000)\nmean30 = rng.integers(1, 7, size=(100_000, 30)).mean(axis=1)\nprint(\"주사위 1개\"); text_hist(one, bins=6)\nprint(\"\\n주사위 30개 평균\"); text_hist(mean30)\nprint(\"예측 σ:\", 1.708 / np.sqrt(30), \" 실제 σ:\", mean30.std())\n\n# 2) 논문 초기화: z = Σ w_i x_i\nW = rng.uniform(-0.08, 0.08, size=(5000, 1000))   # 뉴런 5000개\nx = rng.standard_normal(1000)\nz = W @ x\nprint(\"\\n초기화 후 z 분포 (σ 예측 ≈ 1.46):\", z.std().round(3)); text_hist(z)\n```\n\n**도전 과제 (선택: 시간이 남을 때만)**\n- (a) 주사위 대신 **아주 비대칭인 분포**(예: `rng.exponential(1, size=(100_000, n))`)로 n = 1, 5, 50의 평균 히스토그램을 그려 보세요. n이 커질수록 어떻게 변하나요?\n- (b) 초기화 범위를 0.08 → 0.5로 바꾸고 `np.tanh(z)`의 히스토그램을 그려 보세요. 값이 ±1에 몰리는 \"포화\"가 보이나요? 이게 왜 학습에 나쁠까요? (힌트: tanh 그래프 끝부분의 기울기)\n- (c) 미니배치 실험: 평균 2, 표준편차 5인 \"기울기 샘플\"을 만들고, 배치 크기 1, 16, 128로 평균을 1000번씩 구해 표준편차를 비교하세요.\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n\n1. CLT를 한 문장으로 말하면?\n2. n개 평균의 표준편차는 원래 표준편차의 몇 배?\n3. O/X: CLT는 원래 분포가 정규분포일 때만 성립한다.\n4. 논문의 초기화에서 CLT가 적용되는 \"많은 무작위 값의 합\"은 무엇인가요?\n5. 미니배치 크기를 키우면 얻는 것과 잃는 것은?\n\n---\n\n## 한 줄 정리\n> \"무작위를 많이 더하면 종 모양이 되고 흔들림은 √n분의 1로 준다 — 초기화 범위와 배치 128은 이 원리 위에 서 있다.\"\n\n---\n\n<details>\n<summary>정답 보기<\/summary>\n\n**손계산**\n1. E = 0.5, Var = E[X²] − E[X]² = 0.5 − 0.25 = **0.25**\n2. 기댓값 50, 분산 100×0.25 = 25 → σ = **5**. 60개는 평균보다 2σ 위 → 정규분포에서 약 2.3% 정도로 **드문 편**.\n3. √(128/512) = **1/2배**\n4. 분산 = n × a²/3를 같게 → a² 을 1/4로 → a를 **1/2배** (0.04). (이것이 Xavier/He 초기화의 아이디어: 범위를 1/√n에 비례하게)\n\n**코드 도전**\n- (a) n=1은 한쪽으로 긴 꼬리, n=5는 조금 덜 비대칭, n=50은 거의 대칭 종 모양.\n- (b) 대부분 ±1 근처로 몰림. 그 영역에선 tanh 기울기가 거의 0 → 기울기가 전달되지 않아 학습이 멈춤 ([Day 11](#day11) \"기울기 소실\"과 연결).\n- (c)\n  ```python\n  for B in [1, 16, 128]:\n      means = rng.normal(2, 5, size=(1000, B)).mean(axis=1)\n      print(B, means.std().round(3))   # ≈ 5, 1.25, 0.44\n  ```\n\n**퀴즈**\n1. 독립·동일분포이고 분산이 유한한 무작위 값을 많이 더하면(평균 내면) 원래 분포와 무관하게 정규분포에 가까워진다.\n2. 1/√n\n3. X\n4. 뉴런 입력 z = Σ wᵢxᵢ (1000개 항의 합)\n5. 얻는 것: 기울기 추정이 덜 흔들림. 잃는 것: 스텝당 계산·메모리 증가 (같은 계산량으로 걸음 수가 줄어듦)\n<\/details>\n", "link": "논문 연결: 3.4절 , 배치 128문장, 기울기 g를 128로 나눠 평균을 쓴다는 대목", "lesson": true}, {"id": "day10", "short": "RNN 한 스텝 손계산 + Teacher Forcing", "md": "# Day 10. RNN 한 스텝 손계산 + Teacher Forcing\n\n30분 · 논문 연결: **2장** 디코더가 $y_1, \\dots, y_{t-1}$을 보고 $y_t$를 예측하는 구조, **3.2절** 학습 목표 $\\log p(T\\mid S)$ (정답 문장 T를 그대로 조건으로 씀)\n\n---\n\n## 오늘의 목표\n1. 순환신경망(RNN)의 한 스텝 $h_t = \\tanh(W_h h_{t-1} + W_x x_t + b)$를 손으로 계산할 수 있다.\n2. **Teacher forcing**이 무엇인지, 왜 학습할 때 쓰는지 설명할 수 있다.\n3. Teacher forcing의 약점(**exposure bias**, 학습-추론 불일치)을 코드로 직접 본다.\n\n**복습 (1분):** 논문 식 (1)에서 $y_t$를 예측할 때 조건으로 쓰는 두 가지는? (답: v, 그리고 앞 단어 $y_1..y_{t-1}$)\n\n---\n\n## 1. 개념 A: RNN 한 스텝 (4분)\n\n문장은 길이가 제각각이라, **같은 계산을 단어마다 반복**하면서 \"기억(은닉 상태) h\"를 갱신합니다.\n$$h_t = \\tanh(W_h\\,h_{t-1} + W_x\\,x_t + b)$$\n- $x_t$: t번째 단어 벡터 (Day 01)\n- $h_{t-1}$: 지금까지 읽은 내용의 요약 (기억)\n- $W_h, W_x, b$: **모든 스텝이 공유**하는 파라미터 (Day 02의 `Wx+b`가 두 개 더해진 것)\n- tanh: 값을 −1 ~ 1로 눌러 주는 비선형 함수\n\n인코더는 이걸 입력 문장 끝까지 반복하고, 마지막 h가 **v**가 됩니다. 디코더는 v에서 시작해 같은 방식으로 h를 갱신하며, 각 h에서 소프트맥스로 다음 단어를 예측합니다.\n\n> 논문은 단순 RNN 대신 **LSTM**을 씁니다. 긴 문장에서 기억이 사라지는 문제를 막기 위해 \"게이트\"를 더한 RNN이에요 ([Day 11](#day11)). 오늘의 손계산 원리는 똑같습니다.\n\n## 2. 개념 B: Teacher Forcing (5분)\n\n디코더는 \"앞 단어를 보고 다음 단어\"를 예측합니다. 그럼 **학습할 때 앞 단어로 무엇을 넣을까요?**\n\n| 방식 | 디코더 입력으로 넣는 앞 단어 | 언제 |\n|---|---|---|\n| **Teacher forcing** | **정답** 문장의 앞 단어 $y_{t-1}$ | 학습 |\n| Free running (자기회귀) | **모델이 방금 만든** 단어 $\\hat y_{t-1}$ | 추론(실제 번역) |\n\n비유: 받아쓰기 연습에서 학생이 한 글자 틀려도 **선생님이 정답 글자를 알려주고** 다음 글자를 쓰게 하는 것. 그래서 \"teacher forcing\".\n\n**장점**\n1. 앞에서 틀린 게 뒤로 번지지 않아 학습이 안정적이고 빠르다.\n2. 모든 위치의 입력을 미리 알기 때문에 위치별 손실을 한 번에 계산할 수 있다.\n3. 수학적으로 정확하다: 식 (1)의 $p(y_t\\mid v, y_{<t})$는 *정답* 앞 단어를 조건으로 하므로, $\\log p(T\\mid S)$를 계산하는 것 자체가 teacher forcing이다.\n\n> 논문 본문에 \"teacher forcing\"이라는 단어가 직접 나오지는 않습니다. 하지만 3.2절의 학습 목표(정답 번역 T의 로그 확률 최대화)를 계산하는 표준 방법이 바로 teacher forcing입니다. (용어는 Williams & Zipser, 1989에서 유래)\n\n> `<BOS>`(문장 시작 표시)에 대해: 논문은 `<BOS>`를 따로 두지 않고 `<EOS>` 하나를 문장의 끝이자 디코더의 시작 신호로 씁니다. 이 교재는 읽기 쉽도록 시작 표시 `<BOS>`를 따로 둡니다.\n\n**약점: Exposure bias (노출 편향)**\n학습 때는 항상 정답 앞 단어만 봤는데, 실제 번역할 때는 자기가 만든 (틀릴 수도 있는) 단어를 봅니다. 한 번 틀리면 **처음 보는 상황**에 빠져 오류가 연쇄적으로 번질 수 있어요. 이 문제를 학습 방식에서 직접 줄이려는 시도가 scheduled sampling(Bengio 외, 2015)입니다. 논문이 추론 때 쓰는 **빔 서치**(3.2절, [Day 12](#day12))는 노출 편향을 고치는 방법은 아니고, 후보를 여러 개 들고 가서 한 번의 나쁜 선택에 덜 휘둘리게 하는 탐색 방법입니다.\n\n---\n\n## 3. 예제 따라하기 (6분): RNN 두 스텝\n\n은닉 2차원, 입력은 숫자 하나(1차원). b = 0.\n```\nW_x = [[ 1],      W_h = [[0.5, 0  ],      h_0 = [0, 0]\n       [-1]]             [0,   0.5]]\n```\n입력 x₁ = 1, x₂ = 2\n\n**스텝 1:** W_h h₀ = [0, 0], W_x x₁ = [1, −1]\nh₁ = tanh([1, −1]) ≈ **[0.762, −0.762]** (tanh 값표: tanh(0.5) ≈ 0.462, tanh(1) ≈ 0.762, tanh(2) ≈ 0.964, 음수는 부호만 반대. [준비 6](#prep06))\n\n**스텝 2:** W_h h₁ = [0.381, −0.381], W_x x₂ = [2, −2]\n합 = [2.381, −2.381] → h₂ = tanh(...) ≈ **[0.983, −0.983]**\n\nh₂에는 x₁과 x₂의 정보가 함께 섞여 있습니다. 이게 \"기억\"입니다.\n\n---\n\n## 직접 만져보기\n\n<div class=\"widget\" data-w=\"rnn\"><\/div>\n\n<div class=\"widget\" data-w=\"tf\"><\/div>\n\n## 4. 능동 연습 (10분)\n\n### 손계산\n1. 위 예제에서 x₃ = −1일 때 h₃를 구하세요. (tanh(−0.508) ≈ −0.469)\n2. 정답 번역이 \"나는 밥을 먹었다 <EOS>\"입니다. Teacher forcing으로 학습할 때 디코더의 각 스텝 **입력**과 **예측 목표**를 표로 쓰세요. (첫 입력은 시작 기호 `<BOS>`)\n3. 위 2번에서 모델이 첫 스텝에 \"나는\" 대신 \"너는\"을 예측했다고 합시다. Teacher forcing이면 두 번째 스텝 입력은? Free running이면?\n\n### 코드 ① RNN 스텝\n```python\nimport numpy as np\n\nW_x = np.array([[1.0], [-1.0]])\nW_h = np.array([[0.5, 0.0], [0.0, 0.5]])\nh = np.zeros(2)\nfor t, x in enumerate([1.0, 2.0, -1.0], start=1):\n    h = np.tanh(W_h @ h + W_x @ np.array([x]))\n    print(f\"h_{t} =\", h.round(3))\n```\n\n### 코드 ② Teacher forcing vs Free running\n간단한 \"디코더\"를 표 하나로 흉내 냅니다: 앞 단어 → 다음 단어 확률. 이 모델은 **\"나는\" 다음을 살짝 틀리게** 배웠습니다.\n```python\nimport numpy as np\n\nV = [\"<BOS>\", \"나는\", \"밥을\", \"빵을\", \"먹었다\", \"<EOS>\"]\n#        <BOS>  나는  밥을  빵을  먹었다 <EOS>\nP = {\"<BOS>\":  [0.00, 0.90, 0.04, 0.03, 0.02, 0.01],\n     \"나는\":   [0.00, 0.00, 0.45, 0.50, 0.04, 0.01],   # 실수: 빵을 > 밥을\n     \"밥을\":   [0.00, 0.02, 0.03, 0.03, 0.90, 0.02],\n     \"빵을\":   [0.00, 0.02, 0.03, 0.55, 0.38, 0.02],   # 빵을 다음에 또 빵을...\n     \"먹었다\": [0.00, 0.03, 0.02, 0.02, 0.03, 0.90]}\n\ntarget = [\"나는\", \"밥을\", \"먹었다\", \"<EOS>\"]\n\n# (1) Teacher forcing: 입력은 항상 정답 앞 단어\nprev, loss = \"<BOS>\", 0.0\nfor y in target:\n    q = P[prev][V.index(y)]\n    loss += -np.log(q)\n    print(f\"입력 {prev:6s} → 정답 {y:6s}  q={q:.2f}  -log q={-np.log(q):.3f}\")\n    prev = y                                   # ← 정답을 다음 입력으로!\nprint(\"teacher forcing 문장 손실:\", round(loss, 3))\n\n# (2) Free running: 입력은 모델이 직접 고른 단어 (greedy = 매번 argmax)\nprev, out = \"<BOS>\", []\nfor _ in range(8):\n    nxt = V[int(np.argmax(P[prev]))]\n    out.append(nxt)\n    if nxt == \"<EOS>\":\n        break\n    prev = nxt                                 # ← 내 예측을 다음 입력으로!\nprint(\"free running 결과:\", \" \".join(out))\n```\n\n**관찰 질문**\n- Teacher forcing 손실 계산에서는 \"나는\" 다음 실수가 손실을 조금 키울 뿐, 뒤 단어들은 정상적으로 평가됩니다. \n- Free running에서는 무슨 일이 생겼나요? 한 번의 실수가 어떻게 번졌는지 설명해 보세요. 이것이 **exposure bias**입니다.\n\n**도전 과제 (선택: 시간이 남을 때만)**\n- (a) `P[\"나는\"]`의 0.45와 0.50을 바꿔(밥을 0.50, 빵을 0.45) 다시 실행하세요. free running 결과는?\n- (b) 학습이 teacher forcing 손실을 줄인다면 `P[\"나는\"]`의 \"밥을\" 확률은 올라갈까요 내려갈까요? Day 08의 기울기 q − y로 설명해 보세요.\n- (c) **Greedy 대신 상위 2개 후보를 계속 들고 가면** 어떨까요? 노트에 \"나는 밥을…\"과 \"나는 빵을…\" 두 갈래를 그리고 각 경로의 확률 곱을 비교해 보세요. (→ Day 12 빔 서치 예습)\n\n---\n\n## 5. 셀프 체크 퀴즈 (4분)\n\n1. RNN에서 모든 스텝이 같은 $W_h, W_x$를 쓰는 것의 장점은?\n2. Teacher forcing에서 디코더 입력으로 넣는 것은?\n3. Teacher forcing이 학습을 안정적으로 만드는 이유는?\n4. Exposure bias를 한 문장으로 설명하면?\n5. 논문은 추론할 때 어떤 방법으로 더 좋은 번역을 찾나요? (3.2절)\n\n---\n\n## 2주차 마무리\n이제 논문 **2장 전체와 3.2~3.4절**을 읽을 수 있는 재료가 다 모였습니다. 시간이 남으면 3.2절(Decoding and Rescoring)을 소리 내어 읽고, 수식마다 \"이건 Day 몇에서 배운 거다\"를 옆에 적어 보세요.\n\n3주차는 논문의 모델을 직접 해부합니다: [LSTM 게이트](#day11), [입력 뒤집기와 빔 서치](#day12), [BLEU 점수](#day13).\n\n---\n\n## 한 줄 정리\n> \"학습 땐 정답을 앞 단어로 넣어 주고(teacher forcing), 번역 땐 내 예측을 넣는다 — 이 차이가 exposure bias를 만든다.\"\n\n---\n\n<details>\n<summary>정답 보기<\/summary>\n\n**손계산**\n1. W_h h₂ = [0.4915, −0.4915], W_x x₃ = [−1, 1] → 합 [−0.508, 0.508] → h₃ ≈ **[−0.469, 0.469]**\n2. | 스텝 | 입력 | 예측 목표 |\n   |---|---|---|\n   | 1 | `<BOS>` | 나는 |\n   | 2 | 나는 | 밥을 |\n   | 3 | 밥을 | 먹었다 |\n   | 4 | 먹었다 | `<EOS>` |\n3. Teacher forcing: **\"나는\"** (정답). Free running: **\"너는\"** (모델 예측).\n\n**코드**\n- 코드 ① 출력: h_1 ≈ [0.762, −0.762], h_2 ≈ [0.983, −0.983], h_3 ≈ [−0.469, 0.469]\n- 코드 ② teacher forcing 손실 ≈ 0.105 + 0.799 + 0.105 + 0.105 ≈ **1.115**\n- Free running: `나는 빵을 빵을 빵을 ...` 처럼 \"빵을\"이 반복되다가 길이 제한에 걸림. 한 번 \"빵을\"로 빠지자 학습 때 거의 못 본 상황이 되어 오류가 계속 이어짐 = exposure bias.\n- (a) `나는 밥을 먹었다 <EOS>` (정답)\n- (b) 올라감. 정답 \"밥을\" 칸의 기울기는 q − 1 < 0이라 경사하강으로 빼면 점수가 증가.\n- (c) 나는(0.9)→밥을(0.45)→먹었다(0.9)→<EOS>(0.9) = 0.328 / 나는→빵을(0.5)→빵을(0.55)… 경로는 점점 작아짐. 후보를 여러 개 들고 가면 \"밥을\" 경로가 결국 이김.\n\n**퀴즈**\n1. 길이에 상관없이 같은 파라미터로 처리할 수 있고, 파라미터 수가 문장 길이에 따라 늘지 않음.\n2. 정답 문장의 이전 단어\n3. 앞의 예측 실수가 뒤로 번지지 않고, 모든 위치를 정확한 조건에서 학습할 수 있어서\n4. 학습 때는 정답 앞 단어만 보다가, 추론 때는 자기 예측(오류 포함)을 보게 되어 생기는 불일치와 오류 누적\n5. 빔 서치 (left-to-right beam search decoder). 빔 크기 1~2로도 효과가 크다고 보고.\n<\/details>\n", "link": "논문 연결: 2장 디코더가 을 보고 를 예측하는 구조, 3.2절 학습 목표 (정답 문장 T를 그대로 조건으로 씀)", "lesson": true}, {"id": "day11", "short": "LSTM 게이트: 기억을 지키는 밸브", "md": "# Day 11. LSTM 게이트: 기억을 지키는 밸브\n\n30분 · 논문 연결: **1장** LSTM은 멀리 떨어진 단어 사이의 관계를 배울 수 있다, **3.4절** 4층 LSTM, 층마다 셀 1000개\n\n---\n\n## 오늘의 목표\n1. 단순 RNN이 긴 문장을 잊어버리는 이유를 \"같은 수를 계속 곱하기\"로 설명할 수 있다.\n2. LSTM의 세 게이트(망각, 입력, 출력)가 각각 무엇을 여닫는지 말할 수 있다.\n3. 숫자 하나짜리 LSTM 한 스텝을 손으로 계산할 수 있다.\n\n**복습 (1분):** 시그모이드 σ(x)의 출력 범위는? (답: 0과 1 사이. [준비 6](#prep06))\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 단순 RNN은 왜 잊어버릴까\n[Day 10](#day10)의 RNN은 단어를 하나 읽을 때마다 기억 h에 **곱셈**을 한 번씩 합니다. 문장 맨 앞 단어의 흔적은 뒤로 갈수록 그 곱셈을 계속 맞습니다.\n\n귓속말 전달 게임을 떠올리세요. 한 사람 건널 때마다 소리가 10%씩 작아지면 50번째 사람에게는 거의 안 들립니다. 매 스텝 0.9가 곱해진다고 해 봅시다.\n\n| 스텝 수 | 0.9를 곱한 결과 | 1.1을 곱한 결과 |\n|---|---|---|\n| 10 | 0.35 | 2.6 |\n| 30 | 0.04 | 17 |\n| 50 | **0.005** | **117** |\n\n- 1보다 조금 작은 수: 50단어 뒤에는 0.5%만 남습니다. 학습할 때는 \"틀렸다\"는 신호(기울기)가 문장 끝에서 앞으로 거꾸로 전달되는데, 이 신호도 같은 곱셈을 스텝마다 맞아서 앞 단어에 닿을 즈음엔 거의 사라집니다 → **기울기 소실**. 그래서 앞 단어에 대해서는 못 배웁니다.\n- 1보다 조금 큰 수: 117배로 부풉니다 → **기울기 폭발**.\n\n[준비 4](#prep04)에서 작은 확률을 계속 곱하면 0이 되던 것과 같은 구조입니다.\n\n### 1-2. LSTM의 생각: 곱하지 말고 더하자\nLSTM(Long Short-Term Memory, 장단기 기억)은 기억 통로를 하나 더 둡니다.\n\n- **셀 상태 c**: 장기 기억. 컨베이어 벨트처럼 문장 끝까지 흘러갑니다.\n- **은닉 상태 h**: 지금 바깥에 내보이는 작업 기억.\n\n그리고 c를 고칠 때 **\"조금 지우고, 조금 더한다\"**만 합니다. 지울지 말지를 정하는 값이 1에 가까우면 기억은 거의 그대로 다음 스텝으로 넘어갑니다. 0.9를 강제로 곱하던 RNN과 달리, **얼마나 남길지를 모델이 스스로 배웁니다.**\n\n### 1-3. 게이트 = 0과 1 사이의 밸브\n게이트는 시그모이드로 만든 0~1 사이 숫자입니다. 어떤 값에 곱해서 **얼마나 통과시킬지** 정합니다.\n\n- 게이트 1 → 전부 통과 (값 × 1)\n- 게이트 0 → 완전히 막음 (값 × 0)\n- 게이트 0.5 → 절반만\n\n| 게이트 | 기호 | 여닫는 것 | 비유 |\n|---|---|---|---|\n| 망각 (forget) | f | 옛 기억 c를 얼마나 **남길지** | 메모장 지우개 |\n| 입력 (input) | i | 새 정보를 얼마나 **적을지** | 연필 |\n| 출력 (output) | o | 기억을 얼마나 **내보일지** | 메모장을 보여 주는 손 |\n\n> 이름 주의: 망각 게이트 f가 **1이면 기억을 지킨다**는 뜻입니다. \"잊는 정도\"가 아니라 \"남기는 비율\"이에요.\n\n### 1-4. 한 스텝의 식\n새로 적을 후보 값을 g라고 부릅니다 (tanh로 만들어 −1 ~ 1 사이).\n\n$$c_t = f \\cdot c_{t-1} + i \\cdot g$$\n$$h_t = o \\cdot \\tanh(c_t)$$\n\n읽는 법\n1. 옛 기억 $c_{t-1}$에 f를 곱해 **남길 만큼 남기고**\n2. 새 후보 g에 i를 곱해 **적을 만큼 더합니다** → 새 기억 $c_t$\n3. $c_t$를 tanh로 −1 ~ 1 사이로 누른 뒤 o를 곱해 **내보입니다** → $h_t$\n\n게이트 값은 모델이 지금 단어와 직전 기억을 보고 스스로 계산합니다. 오늘은 그 값이 이미 주어졌다고 치고 계산만 연습합니다.\n\n> 논문의 실제 크기: 한 층에 셀 1000개, 4층이니 문장 하나를 **8000개 숫자**(c와 h 각각 4000개)로 기억합니다. 칸마다 게이트가 따로 있어요.\n\n> (선택) 더 알고 싶다면: 게이트는 [Day 02](#day02)의 `Wx + b`에 시그모이드를 씌워 만듭니다. 입력으로 지금 단어 $x_t$와 직전 $h_{t-1}$을 함께 넣습니다. 논문에서 칸끼리 곱하기는 기호 ⊙로 씁니다.\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n**문제.** 직전 기억 $c_{t-1} = 0.8$. 게이트와 후보가 다음과 같을 때 새 c와 h는?\n\n| f (망각) | i (입력) | g (후보) | o (출력) |\n|---|---|---|---|\n| 0.9 | 0.5 | 0.6 | 0.7 |\n\n**1) 남기기:** 0.9 × 0.8 = 0.72\n**2) 더하기:** 0.5 × 0.6 = 0.30 → $c_t$ = 0.72 + 0.30 = **1.02**\n**3) 내보이기:** tanh(1.02) ≈ 0.77 → $h_t$ = 0.7 × 0.77 ≈ **0.54**\n\n옛 기억의 90%가 살아남았고, 새 정보가 절반 세기로 더해졌습니다.\n\n**게이트는 어떻게 나올까?** 시그모이드에 넣는 값이 크면 열리고 작으면 닫힙니다.\n\n| 넣는 값 z | −2 | 0 | 2 |\n|---|---|---|---|\n| σ(z) | 0.12 | 0.5 | 0.88 |\n\n---\n\n## 3. 능동 연습 (10분)\n\n### 손계산\n1. $c_{t-1} = 1.0$, f = 0.5, i = 1.0, g = −0.4일 때 $c_t$는?\n2. 1번에서 o = 0.5이면 $h_t$는? (tanh(0.1) ≈ 0.1)\n3. f = 1, i = 0이면 $c_t$는 $c_{t-1}$과 어떤 관계인가요?\n4. f = 0, i = 1이면 $c_t$는?\n5. 0.9를 10번 곱하면 약 0.35입니다. 0.99를 10번 곱하면 대략 얼마일까요? (0.90, 0.50, 0.10 중 고르기)\n6. 망각 게이트가 **항상** 1이고 입력 게이트도 항상 열려 있으면 긴 글에서 어떤 문제가 생길까요?\n\n### 미니 챌린지\n문장 \"나는 프랑스에서 자랐고 … (30단어) … 그래서 ___를 잘한다.\" 빈칸을 맞히려면 \"프랑스\"를 30단어 동안 기억해야 합니다. 그동안 f는 어떤 값이어야 할까요? 문장이 끝나고 새 문장이 시작되면?\n\n### 코드 (선택)\n```python\nimport numpy as np\nprint(0.9 ** 50, 1.1 ** 50)            # 0.005...  117.39...\n\nc_prev = 0.8\nf, i, g, o = 0.9, 0.5, 0.6, 0.7\nc = f * c_prev + i * g\nh = o * np.tanh(c)\nprint(c, h)                            # 1.02  0.539...\n\nc = 1.0                                # f = 1, i = 0이면 50스텝 뒤에도 그대로\nfor t in range(50):\n    c = 1.0 * c + 0.0 * 0.3\nprint(c)                               # 1.0\n```\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n1. 단순 RNN이 긴 문장 앞부분을 잊는 이유를 한 문장으로 말해 보세요.\n2. 망각 게이트가 1에 가까우면 옛 기억은 어떻게 되나요?\n3. O/X: 게이트 값은 −1과 1 사이다.\n4. LSTM의 두 기억 통로 c와 h의 역할 차이는?\n\n---\n\n## 한 줄 정리\nLSTM은 기억 c를 \"f만큼 남기고 i만큼 새로 더하는\" 방식으로 고쳐서, 긴 문장에서도 앞 단어를 잊지 않는다.\n\n---\n\n<details>\n<summary>정답 보기 (먼저 풀고 열기!)<\/summary>\n\n**손계산**\n1. 0.5 × 1.0 + 1.0 × (−0.4) = 0.5 − 0.4 = **0.1**\n2. 0.5 × tanh(0.1) ≈ 0.5 × 0.1 = **0.05**\n3. **똑같습니다.** 1 × $c_{t-1}$ + 0 × g = $c_{t-1}$. 기억을 그대로 들고 갑니다.\n4. $c_t$ = **g**. 옛 기억을 다 지우고 새 정보만 적습니다.\n5. 약 **0.90**. 1에 가까울수록 훨씬 천천히 줄어듭니다.\n6. 지우지 않고 계속 쌓기만 해서 c가 아주 커질 수 있고, 이미 끝난 문장의 내용이 새 문장에 섞입니다. 그래서 \"잊는 능력\"도 필요합니다.\n\n**미니 챌린지**\n30단어 동안은 \"프랑스\"를 담은 칸의 f가 **1 가까이**, 문장이 끝나면 **0 가까이**로 내려가 메모장을 비우는 것이 좋습니다. 이런 여닫기를 사람이 정해 주지 않고 학습으로 얻습니다.\n\n**퀴즈**\n1. 스텝마다 1보다 작은 수가 계속 곱해져 앞 단어의 신호(기울기)가 0에 가까워지기 때문입니다.\n2. 거의 그대로 다음 스텝으로 넘어갑니다.\n3. X. 게이트는 시그모이드라 **0과 1 사이**입니다. −1 ~ 1은 tanh(후보 g)입니다.\n4. c는 오래 들고 가는 장기 기억, h는 그중 지금 내보이는 부분(다음 층과 예측에 쓰는 값)입니다.\n<\/details>\n", "link": "논문 연결: 1장 LSTM은 멀리 떨어진 단어 사이의 관계를 배울 수 있다, 3.4절 4층 LSTM, 층마다 셀 1000개", "lesson": true}, {"id": "day12", "short": "입력 뒤집기와 빔 서치", "md": "# Day 12. 입력 뒤집기와 빔 서치\n\n30분 · 논문 연결: **3.3절** 입력 문장을 거꾸로 넣기, **3.2절** 빔 서치로 번역 고르기, **표 1** 빔 크기별 점수\n\n---\n\n## 오늘의 목표\n1. 입력 문장을 뒤집으면 왜 학습이 쉬워지는지 \"단어 사이 거리\"로 설명할 수 있다.\n2. 한 번에 최선만 고르는 방법(greedy)이 왜 가장 좋은 문장을 놓칠 수 있는지 안다.\n3. 빔 크기 2인 빔 서치를 손으로 따라갈 수 있다.\n\n**복습 (1분):** 문장 전체의 확률은 단어별 확률을 어떻게 해서 구하나요? (답: 모두 곱합니다. [Day 03](#day03)의 연쇄법칙)\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 이상한 실험: 입력을 거꾸로\n논문은 영어 문장을 **뒤집어서** 넣었습니다. \"a b c\"를 \"c b a\"로요. 프랑스어 출력은 그대로 둡니다. 그랬더니\n\n| | 그대로 | 뒤집기 |\n|---|---|---|\n| perplexity (낮을수록 좋음) | 5.8 | **4.7** |\n| BLEU (높을수록 좋음) | 25.9 | **30.6** |\n\nBLEU는 번역 점수입니다. 다음 레슨에서 배우니 오늘은 \"높을수록 좋다\"만 알면 됩니다. 모델은 한 글자도 안 바꿨는데 성적이 올랐습니다. 왜일까요?\n\n### 1-2. 단어 사이의 거리를 세어 보자\n영어 \"a b c\"가 프랑스어 \"α β γ\"로 번역된다고 합시다 (a↔α, b↔β, c↔γ). 모델은 입력을 다 읽고 나서 출력을 씁니다.\n\n**그대로 넣을 때:** a b c → α β γ\n\n| 짝 | 사이 스텝 수 |\n|---|---|\n| a → α | 3 |\n| b → β | 3 |\n| c → γ | 3 |\n\n**뒤집어 넣을 때:** c b a → α β γ\n\n| 짝 | 사이 스텝 수 |\n|---|---|\n| a → α | **1** |\n| b → β | 3 |\n| c → γ | 5 |\n\n평균은 둘 다 3으로 같습니다. 하지만 뒤집으면 **첫 단어 짝이 바로 붙습니다.** [Day 11](#day11)에서 본 것처럼 가까운 관계는 배우기 쉽습니다. 문장 앞부분을 먼저 제대로 번역하게 되면, 그걸 발판으로 뒷부분도 배웁니다. 논문은 이를 \"최소 시간 지연(minimal time lag)이 줄었다\"고 표현합니다.\n\n### 1-3. 번역을 고르는 문제\n학습이 끝난 모델은 단어마다 확률을 내놓습니다. 우리가 원하는 것은 **문장 전체 확률이 가장 큰 번역**입니다. 그런데 단어가 80,000개, 길이가 10이면 가능한 문장은 $80000^{10}$개. 전부 계산해 볼 수 없습니다.\n\n**Greedy(탐욕) 방법:** 매번 확률이 제일 큰 단어 하나만 고릅니다. 빠르지만, 처음에 좋아 보인 선택이 나중에 막다른 길일 수 있습니다.\n\n### 1-4. 빔 서치: 후보를 B개 들고 간다\n**빔 크기 B** = 계속 들고 갈 후보 문장의 수.\n\n1. 지금 들고 있는 후보 B개 각각에 다음 단어를 붙여 본다\n2. 새로 생긴 문장들의 확률(지금까지의 곱)을 계산한다\n3. 그중 **상위 B개만** 남기고 나머지는 버린다\n4. 후보가 `<EOS>`(문장 끝)로 끝나면 완성 문장으로 따로 둔다\n\nB = 1이면 greedy와 같습니다. 길 찾기 앱이 경로 하나만 보는 것과, 유력한 경로 2~3개를 같이 따라가 보는 것의 차이입니다.\n\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n모델이 내놓은 확률이 다음과 같습니다.\n\n**첫 단어:** 나는 0.6 · 저는 0.4\n\n**둘째 단어:**\n\n| 앞 단어 | 밥 | 빵 | 물 |\n|---|---|---|---|\n| 나는 | 0.4 | 0.35 | 0.25 |\n| 저는 | 0.9 | 0.1 | 0 |\n\n**Greedy (B = 1)**\n- 첫 단어: 0.6 > 0.4 → \"나는\"\n- 둘째 단어: \"밥\" 0.4 → \"나는 밥\" = 0.6 × 0.4 = **0.24**\n\n**빔 서치 (B = 2)**\n- 첫 단어: \"나는\"(0.6)과 \"저는\"(0.4) **둘 다** 남긴다\n- 둘째 단어를 모두 붙여 본다\n\n| 후보 | 확률 |\n|---|---|\n| 저는 밥 | 0.4 × 0.9 = **0.36** |\n| 나는 밥 | 0.6 × 0.4 = **0.24** |\n| 나는 빵 | 0.6 × 0.35 = 0.21 |\n| 나는 물 | 0.6 × 0.25 = 0.15 |\n| 저는 빵 | 0.4 × 0.1 = 0.04 |\n\n- 상위 2개: \"저는 밥\"(0.36), \"나는 밥\"(0.24)\n\nGreedy는 첫 걸음에서 \"저는\"을 버려서 0.36짜리 문장을 영영 못 찾았습니다. 빔 서치는 2등 후보를 살려 둔 덕에 찾았습니다.\n\n> 실제 구현은 확률을 곱하는 대신 **로그 확률을 더합니다** ([준비 4](#prep04)). ln 0.4 + ln 0.9 ≈ −1.02, ln 0.6 + ln 0.4 ≈ −1.43. −1.02가 더 크니 순위는 같습니다.\n\n### 논문의 결과 (표 1)\n| 모델 (LSTM 5개 앙상블) | BLEU |\n|---|---|\n| 빔 크기 1 | 33.00 |\n| 빔 크기 2 | 34.50 |\n| 빔 크기 12 | 34.81 |\n\n1 → 2에서 1.5점이 오르고, 2 → 12에서는 0.31점만 오릅니다. **빔 크기 2면 이득의 대부분을 얻습니다.** (앙상블은 따로 학습한 모델 여러 개의 예측을 평균 내는 방법입니다.)\n\n---\n\n## 3. 능동 연습 (10분)\n\n### 손계산\n1. 길이 4인 문장 \"a b c d\" → \"α β γ δ\"를 **그대로** 넣을 때, 짝마다 사이 스텝 수는?\n2. 같은 문장을 **뒤집어** \"d c b a\"로 넣을 때 네 짝의 스텝 수는? 평균은?\n3. 첫 단어 A 0.7, B 0.3. A 다음은 X 0.6 / Y 0.4, B 다음은 X 1.0. Greedy가 고르는 문장과 그 확률은?\n4. 3번에서 빔 크기 2라면 둘째 단어까지 본 뒤 남는 상위 2개 후보와 확률은?\n5. 3~4번에서 greedy는 가장 확률 높은 문장을 찾았나요?\n6. 단어 5개, 길이 3이면 가능한 문장은 모두 몇 개인가요?\n\n### 미니 챌린지\n빔 크기를 아주 크게 하면 언제나 더 좋은 번역이 나올까요? 논문 표 1의 숫자(2 → 12에서 0.31점)와 계산 시간을 근거로 생각해 보세요.\n\n### 코드 (선택)\n처음 보는 문법이 있어도 괜찮습니다. 그대로 붙여 넣어 실행하고, 출력이 손계산과 같은지만 확인하세요.\n```python\nfirst = {\"나는\": 0.6, \"저는\": 0.4}\nsecond = {\"나는\": {\"밥\": 0.4, \"빵\": 0.35, \"물\": 0.25},\n          \"저는\": {\"밥\": 0.9, \"빵\": 0.1}}\n\nB = 2\nbeam = sorted(first.items(), key=lambda kv: -kv[1])[:B]     # 상위 B개\ncands = []\nfor w1, p1 in beam:\n    for w2, p2 in second[w1].items():\n        cands.append((w1 + \" \" + w2, p1 * p2))\nfor sent, p in sorted(cands, key=lambda kv: -kv[1])[:B]:\n    print(sent, round(p, 2))        # 저는 밥 0.36 / 나는 밥 0.24\n```\n`B = 1`로 바꾸면 greedy 결과(\"나는 밥 0.24\")가 나옵니다.\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n1. 입력을 뒤집어도 단어 짝 사이의 평균 거리는 같습니다. 그런데 왜 도움이 되나요?\n2. 빔 크기 1인 빔 서치의 다른 이름은?\n3. O/X: 빔 서치는 가능한 모든 문장의 확률을 계산한다.\n4. 논문에서 빔 크기를 1에서 2로 키웠을 때와 2에서 12로 키웠을 때, 어느 쪽 이득이 컸나요?\n\n---\n\n## 한 줄 정리\n입력을 뒤집으면 문장 앞 단어끼리 가까워져 배우기 쉽고, 빔 서치는 후보 B개를 들고 가며 greedy가 놓치는 더 좋은 문장을 찾는다.\n\n---\n\n<details>\n<summary>정답 보기 (먼저 풀고 열기!)<\/summary>\n\n**손계산**\n1. 모두 **4** (a→α 4, b→β 4, c→γ 4, d→δ 4)\n2. a→α **1**, b→β **3**, c→γ **5**, d→δ **7**. 평균 (1 + 3 + 5 + 7) ÷ 4 = **4**로 같습니다.\n3. \"A\"(0.7) 다음 X(0.6) → **\"A X\", 0.7 × 0.6 = 0.42**\n4. \"A X\" 0.42, \"B X\" 0.3 × 1.0 = 0.30, \"A Y\" 0.7 × 0.4 = 0.28 → 상위 2개는 **\"A X\" 0.42, \"B X\" 0.30**\n5. **네.** 이번에는 greedy의 0.42가 최고였습니다. Greedy가 항상 틀리는 것은 아니고, **놓칠 수 있다**는 것이 문제입니다.\n6. 5 × 5 × 5 = $5^3$ = **125개**\n\n**미니 챌린지**\n아닙니다. 후보를 늘릴수록 계산은 그만큼 느려지는데 이득은 빠르게 줄어듭니다(2 → 12에서 0.31점). 게다가 모델의 확률이 완벽하지 않아서, 확률이 더 높은 문장이 사람이 보기에 더 좋은 번역이라는 보장도 없습니다.\n\n**퀴즈**\n1. 문장 앞쪽 단어 짝이 아주 가까워져(거리 1) 그 관계를 먼저 쉽게 배우고, 그것이 나머지를 배우는 발판이 되기 때문입니다.\n2. Greedy(탐욕) 디코딩\n3. X. 상위 B개만 남기고 나머지는 버립니다. 전부 계산하는 것은 불가능합니다.\n4. 1 → 2 (33.00 → 34.50, +1.5점). 2 → 12는 +0.31점입니다.\n<\/details>\n", "link": "논문 연결: 3.3절 입력 문장을 거꾸로 넣기, 3.2절 빔 서치로 번역 고르기, 표 1 빔 크기별 점수", "lesson": true}, {"id": "day13", "short": "BLEU로 번역 채점하기", "md": "# Day 13. BLEU로 번역 채점하기\n\n30분 · 논문 연결: **3.6절, 표 1** 이 논문의 대표 성적 \"BLEU 34.81, 기존 번역기 33.30\"\n\n---\n\n## 오늘의 목표\n1. BLEU가 \"기계 번역이 사람 번역과 얼마나 겹치는지\"를 세는 점수라는 걸 설명할 수 있다.\n2. 1-gram, 2-gram 정밀도를 손으로 셀 수 있다.\n3. 짧은 번역 벌점까지 넣어 작은 예제의 BLEU를 계산할 수 있다.\n\n**복습 (1분):** √(0.5 × 0.5)는? (답: 0.5. [준비 3](#prep03))\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 번역을 어떻게 채점할까\n번역 수만 문장을 사람이 일일이 채점할 수는 없습니다. 그래서 **사람이 미리 해 둔 번역(참조 번역)**과 기계 번역이 얼마나 겹치는지 자동으로 셉니다. 이 점수가 **BLEU**(블루, 2002년)입니다.\n\n### 1-2. n-gram: 연속한 단어 n개\n- **1-gram**: 단어 하나. \"the cat sat\" → the / cat / sat\n- **2-gram**: 연속한 단어 둘. \"the cat sat\" → the cat / cat sat\n\n단어 N개짜리 문장에는 1-gram이 N개, 2-gram이 N − 1개 있습니다. 1-gram은 **단어를 맞게 골랐는지**, 2-gram 이상은 **순서까지 자연스러운지**를 봅니다.\n\n### 1-3. 정밀도: 내가 쓴 것 중 몇 개가 맞았나\n$$\\text{n-gram 정밀도} = \\frac{\\text{참조에도 있는 내 n-gram 수}}{\\text{내 n-gram 전체 수}}$$\n\n분모가 **기계 번역 쪽**이라는 점을 기억하세요.\n\n### 1-4. 꼼수 막기 ①: 같은 단어 도배\n참조가 \"the cat is on the mat\"인데 기계가 \"the the the the\"라고 하면? the는 참조에 있으니 4개 전부 맞은 걸로 치면 정밀도 100%가 됩니다.\n\n그래서 **참조에 나온 횟수까지만** 인정합니다. the는 참조에 2번 → 2개만 인정 → 2/4 = 0.5. 이것을 **클리핑**(잘라 내기)이라고 합니다.\n\n### 1-5. 꼼수 막기 ②: 너무 짧은 번역\n기계가 \"the cat\"만 내놓으면 쓴 단어는 다 맞으니 정밀도 100%입니다. 하지만 번역의 절반 이상이 빠졌죠.\n\n그래서 기계 번역 길이 c가 참조 길이 r보다 짧으면 **짧은 번역 벌점(BP)**을 곱합니다.\n\n$$BP = \\begin{cases} 1 & (c \\ge r) \\\\ e^{\\,1 - r/c} & (c < r) \\end{cases}$$\n\n읽는 법: 기계 번역이 참조만큼 길면 벌점 없음(× 1), 짧으면 짧을수록 많이 깎임.\n\n| 기계 번역 길이 | 참조의 80% | 50% | 33% |\n|---|---|---|---|\n| 곱하는 값 BP | 0.78 | 0.37 | 0.14 |\n\nc = 2, r = 6이면 $e^{1-3} = e^{-2} \\approx 0.14$. 점수가 14%로 깎입니다.\n\n### 1-6. 합치기\n$$\\text{BLEU} = BP \\times (\\text{정밀도들의 기하평균})$$\n\n**기하평균**은 n개를 곱해서 n제곱근을 구하는 평균입니다. 둘이면 $\\sqrt{p_1 \\times p_2}$. 하나라도 0이면 전체가 0이 되어, **모든 항목을 고루 잘해야** 점수가 나옵니다.\n\n표준 BLEU는 1~4-gram 네 개를 씁니다(BLEU-4). 오늘은 손계산을 위해 1~2-gram만 쓰는 **BLEU-2**로 연습합니다. 값은 0~1이고, 논문은 100을 곱해 0~100으로 적습니다.\n\n> 로그로 쓰면: 기하평균 = $\\exp\\left(\\frac{1}{n}\\sum \\ln p_k\\right)$. 로그를 평균 내고 exp로 되돌린 것입니다. Day 08의 perplexity와 같은 모양이에요.\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n- 참조: **the cat sat on the mat** (6단어)\n- 기계: **the cat is on the mat** (6단어)\n\n**1-gram 정밀도**\n\n| 기계의 단어 | the | cat | is | on | the | mat |\n|---|---|---|---|---|---|---|\n| 참조에 있나 | ✓ | ✓ | | ✓ | ✓ | ✓ |\n\nthe는 참조에도 2번 나오니 둘 다 인정. → **5/6**\n\n**2-gram 정밀도**\n\n| 기계의 2-gram | the cat | cat is | is on | on the | the mat |\n|---|---|---|---|---|---|\n| 참조에 있나 | ✓ | | | ✓ | ✓ |\n\n→ **3/5**\n\n**기하평균:** $\\frac{5}{6} \\times \\frac{3}{5} = \\frac{15}{30} = 0.5$, $\\sqrt{0.5} \\approx 0.707$\n\n**벌점:** 길이가 6으로 같으니 BP = 1\n\n**BLEU-2 ≈ 0.707** (100점 척도로 70.7)\n\n단어 하나(is)만 틀렸는데 2-gram은 두 개가 깨졌습니다. BLEU는 순서와 이웃 단어까지 봅니다.\n\n---\n\n## 3. 능동 연습 (10분)\n\n참조: **a dog runs very fast** (5단어) · 기계: **a dog runs fast** (4단어)\n\n### 손계산\n1. 기계 번역의 1-gram 정밀도는?\n2. 기계 번역의 2-gram을 모두 적고, 2-gram 정밀도를 구하세요.\n3. 두 정밀도의 기하평균은? (√0.667 ≈ 0.816)\n4. 짧은 번역 벌점 BP는? ($e^{-0.25} \\approx 0.78$)\n5. BLEU-2는?\n6. 참조가 \"I like cats\"이고 기계가 \"cats cats cats\"일 때, 클리핑을 적용한 1-gram 정밀도는?\n\n### 미니 챌린지\n참조 \"나는 매우 기쁘다\", 기계 \"저는 정말 행복합니다\". 뜻은 같은데 BLEU는 몇 점일까요? 이것이 BLEU의 어떤 약점을 보여 주나요?\n\n### 논문의 성적표 읽기\n| 시스템 | BLEU |\n|---|---|\n| 기존 통계 번역기 (기준선) | 33.30 |\n| LSTM 5개 앙상블, 빔 12 | **34.81** |\n| 기존 번역기의 후보 1000개를 LSTM으로 다시 채점 | 36.5 |\n| 당시 WMT'14 최고 기록 | 37.0 |\n\n신경망 하나의 구조만으로 수십 년 다듬은 통계 번역기를 처음 넘었다는 것이 이 논문의 뉴스였습니다.\n\n### 코드 (선택)\n```python\nimport math\nfrom collections import Counter\n\ndef precision(cand, ref, n):\n    c = Counter(tuple(cand[i:i+n]) for i in range(len(cand) - n + 1))\n    r = Counter(tuple(ref[i:i+n]) for i in range(len(ref) - n + 1))\n    hit = sum(min(cnt, r[g]) for g, cnt in c.items())    # 클리핑\n    return hit / sum(c.values())\n\ndef bleu2(cand, ref):\n    p1, p2 = precision(cand, ref, 1), precision(cand, ref, 2)\n    bp = 1 if len(cand) >= len(ref) else math.exp(1 - len(ref) / len(cand))\n    return bp * math.sqrt(p1 * p2)\n\nprint(bleu2(\"the cat is on the mat\".split(), \"the cat sat on the mat\".split()))  # 0.707...\nprint(bleu2(\"a dog runs fast\".split(), \"a dog runs very fast\".split()))          # 0.635...\n```\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n1. BLEU는 무엇과 무엇이 겹치는 정도를 세나요?\n2. 클리핑은 어떤 꼼수를 막나요?\n3. O/X: 기계 번역이 참조보다 길면 짧은 번역 벌점을 받는다.\n4. 정밀도들을 그냥 평균 내지 않고 기하평균을 쓰면 어떤 점이 달라지나요?\n\n---\n\n## 한 줄 정리\nBLEU = (참조와 겹치는 n-gram 정밀도의 기하평균) × (짧은 번역 벌점). 높을수록 사람 번역에 가깝다.\n\n---\n\n<details>\n<summary>정답 보기 (먼저 풀고 열기!)<\/summary>\n\n**손계산**\n1. a, dog, runs, fast 모두 참조에 있음 → 4/4 = **1**\n2. a dog ✓ / dog runs ✓ / runs fast (참조는 runs very, very fast) → **2/3**\n3. √(1 × 2/3) = √0.667 ≈ **0.816**\n4. c = 4, r = 5 → $e^{1 - 5/4} = e^{-0.25}$ ≈ **0.78**\n5. 0.78 × 0.816 ≈ **0.64** (100점 척도로 약 64)\n6. cats는 참조에 1번 → 1개만 인정 → **1/3**\n\n**미니 챌린지**\n겹치는 단어가 하나도 없어 **0점**입니다. BLEU는 뜻이 아니라 **단어가 겹치는지**만 보기 때문에, 같은 뜻의 다른 표현을 알아보지 못합니다. 그래서 실제 평가는 참조 번역을 여러 개 쓰거나, 문장 하나가 아니라 시험용 문장 수천 개를 통째로 모아 점수를 냅니다.\n\n**퀴즈**\n1. 기계 번역과 사람이 한 참조 번역의 n-gram\n2. 같은 단어를 여러 번 써서 정밀도를 부풀리는 것\n3. X. 벌점은 **짧을 때만** 받습니다. 길게 쓴 번역은 정밀도의 분모가 커져서 자연히 손해를 봅니다.\n4. 하나라도 0에 가까우면 전체가 크게 깎입니다. 단어만 맞고 순서가 엉망인 번역이 높은 점수를 받지 못합니다.\n<\/details>\n", "link": "논문 연결: 3.6절, 표 1 이 논문의 대표 성적", "lesson": true}, {"id": "roadmap", "short": "3주차 안내", "md": "# Seq2Seq 코스 3주차 안내\n\n3주차는 논문의 모델을 직접 해부하는 세 챕터입니다.\n\n| 챕터 | 주제 | 논문 연결 |\n|---|---|---|\n| [Day 11](#day11) | LSTM 게이트: 기억을 지키는 밸브 | 1장, 3.4절 |\n| [Day 12](#day12) | 입력 뒤집기와 빔 서치 | 3.2절, 3.3절, 표 1 |\n| [Day 13](#day13) | BLEU로 번역 채점하기 | 3.6절, 표 1 |\n\n처음 계획했던 나머지 주제는 9단계 로드맵에서 더 알맞은 자리로 옮겼습니다.\n\n- 기울기 자르기(gradient clipping): 3단계 \"기울기 소실과 폭발\"\n- 미니 프로젝트(숫자열 뒤집기 seq2seq): 3단계 \"PyTorch로 첫 모델\"\n- 다음 논문(어텐션): 5단계 \"어텐션과 Transformer\"\n", "link": ""}];

function sfx(kind) {

    if (actx.state === "suspended") actx.resume();
    const seq = { ok: [[660, 0, .09], [880, .09, .14]], bad: [[220, 0, .16], [180, .14, .2]], done: [[523, 0, .1], [659, .1, .1], [784, .2, .1], [1047, .3, .22]], tap: [[520, 0, .04]] }[kind] || [];

      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.16, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + len);

}

document.addEventListener("keydown", e => {
  const root = document.getElementById("practice");
  if (!root || root.hidden || e.target.closest("input,textarea")) return;
  if (/^[1-4]$/.test(e.key)) { root.querySelector(`.pr-opt[data-i="${+e.key - 1}"]`)?.click(); }
  if (e.key === "o" || e.key === "O") root.querySelector('.pr-oxb[data-v="O"]')?.click();
  if (e.key === "x" || e.key === "X") root.querySelector('.pr-oxb[data-v="X"]')?.click();
  if (e.key === "Enter" && !e.target.closest("button")) { const b = document.getElementById("prgo"); if (b && !b.disabled) { e.preventDefault(); b.click(); } }
});

/* ---------- markdown ---------- */
function renderMD(md) {
  const codes = [], maths = [];
  md = md.replace(/```[\s\S]*?```/g, m => { codes.push(m); return `KXCODE${codes.length - 1}KX`; });
  md = md.replace(/`[^`\n]+`/g, m => { codes.push(m); return `KXCODE${codes.length - 1}KX`; });
  md = md.replace(/\$\$([\s\S]+?)\$\$/g, (m, t) => { maths.push([t, true]); return `KXMATH${maths.length - 1}KX`; });
  md = md.replace(/\$([^$\n]+?)\$/g, (m, t) => { maths.push([t, false]); return `KXMATH${maths.length - 1}KX`; });
  md = md.replace(/KXCODE(\d+)KX/g, (m, i) => codes[+i]);
  let html = window.marked ? marked.parse(md) : "<pre>" + md.replace(/</g, "&lt;") + "</pre>";
  html = html.replace(/KXMATH(\d+)KX/g, (m, i) => {
    const [t, disp] = maths[+i];
    if (!window.katex) return disp ? `<div class="calc">${t}</div>` : `<code>${t}</code>`;
    try { return katex.renderToString(t, { displayMode: disp, output: "mathml", throwOnError: false, strict: false }); } catch (e) { return `<code>${t}</code>`; }
  });
  return html;
}
function hlPy(code) {
  const esc = t => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const re = /(#[^\n]*)|([fr]?"(?:[^"\\\n]|\\.)*"|[fr]?'(?:[^'\\\n]|\\.)*')|\b(\d+(?:_\d+)*(?:\.\d+)?(?:e-?\d+)?)\b|\b(import|from|as|def|return|for|in|if|elif|else|while|lambda|True|False|None|and|or|not|with|class|try|except|print|range|len|sum|zip|enumerate)\b/g;
  let out = "", last = 0, m;
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index));
    const cls = m[1] ? "co" : m[2] ? "st" : m[3] ? "nu" : "kw";
    out += `<span class="${cls}">${esc(m[0])}</span>`;
    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}

  return { v: 1, done: [...DONE].filter(x => LESSON_RE.test(x)).sort(), days: STATS.days.filter(x => DAY_RE.test(x)).sort(), best: pick(STATS.best, 100), spoke: pick(STATS.spoke, 100000),
    xp_by: Object.fromEntries(Object.entries(STATS.xpBy).filter(([k]) => KEY_RE.test(k)).map(([k, v]) => [k, cleanInt(v, 10000000)])) };
}
// 진도 코드: 서버 없이 이 기기의 진도를 글자 한 줄로 만들어 다른 기기에 붙여 넣는다
function b64(o) { return btoa(unescape(encodeURIComponent(JSON.stringify(o)))); }
function unb64(t) { return JSON.parse(decodeURIComponent(escape(atob(t)))); }
function exportCode() { return "AIDUO2." + b64(snapshot()); }
function importCode(code) {
  const m = String(code).trim().match(/^AIDUO([12])\.([A-Za-z0-9+/=]+)$/);
  if (!m) throw new Error("진도 코드 형식이 아니에요.");
  let d; try { d = unb64(m[2]); } catch (_) { d = null; }
  if (!d || !Array.isArray(d.done)) throw new Error("진도 코드를 읽을 수 없어요.");
  if (m[1] === "2") { mergeIn(d); return; }
  // 예전 코드(총 XP만 있음): 모자란 만큼을 이 기기 칸에 더한다
  const st = d.stats || {};
  mergeIn({ done: d.done, days: st.days, best: st.best, spoke: st.spoke });
  const more = cleanInt(st.xp, 10000000) - STATS.xp;
  if (more > 0) { addXp(more); saveStats(STATS); updateChips(); }
}
/* ---------- my-planner 서버와 자동으로 맞추기 ---------- */

function normUrl(raw) {
  let u; try { u = new URL(String(raw).trim()); } catch (_) { throw new Error("서버 주소를 읽을 수 없어요. https://로 시작하는 주소를 넣어 주세요."); }

  if (u.protocol !== "https:" && !(u.protocol === "http:" && local)) throw new Error("서버 주소는 https://로 시작해야 해요.");

}
const SYNC_ERR = { 401: "토큰이 맞지 않아요. 공부 토큰(STUDY_TOKEN)인지 확인해 주세요.", 404: "서버에 공부 진도 경로가 없어요. 서버에 STUDY_TOKEN을 넣고 다시 켰는지 확인해 주세요.", 422: "서버가 진도를 합치지 못했어요.", 429: "잠시 뒤에 다시 해 주세요.", 503: "서버가 안전 모드예요." };
async function syncOnce(cfg) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 8000);
  try {
    const r = await fetch(cfg.url + "/api/v1/study/progress", { method: "PUT", headers: { "Authorization": "Bearer " + cfg.token, "Content-Type": "application/json" }, body: JSON.stringify(snapshot()), signal: ctl.signal, cache: "no-store" });
    if (!r.ok) throw new Error(SYNC_ERR[r.status] || `서버가 ${r.status}로 답했어요.`);
    mergeIn(await r.json());
  } catch (e) {
    if (e.name === "AbortError" || e instanceof TypeError) throw new Error("서버에 닿지 않아요. 노트북과 Tailscale이 켜져 있는지, 서버의 허용 출처에 이 주소가 있는지 확인해 주세요.");

}
async function syncNow() {
  if (!SYNC) return false;
  if (syncBusy) { syncAgain = true; return false; }

  let ok = false;
  try { await syncOnce(SYNC); ok = true; SYNC.at = Date.now(); saveSync(); syncState = { status: "ok", at: SYNC.at, error: "" }; }
  catch (e) { syncState = { status: "error", at: SYNC && SYNC.at || null, error: e.message }; }

function queueSync() { if (!SYNC) return; clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 1200); }
function syncText() {

function drawSyncStatus() { const el = document.getElementById("syncstat"); if (el) { el.textContent = syncText(); el.className = "syncstat " + syncState.status; } }
window.addEventListener("online", queueSync);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") queueSync(); });
function connectCode() { return "AIDUOSYNC1." + b64({ url: SYNC.url, token: SYNC.token }); }
function parseConnect(text) {

  if (!m) return null;
  try { const d = unb64(m[1]); return d && typeof d.url === "string" && typeof d.token === "string" ? d : null; } catch (_) { return null; }
}

    box.append(h("p", {}, "my-planner 서버에 연결돼 있어요. 앱을 열 때와 문제를 풀 때마다 진도를 보내고, 다른 기기의 진도와 합칩니다."), h("p", { class: "w-hint" }, "서버: " + SYNC.url), stat,
      h("div", { class: "btns" },
        h("button", { class: "btn pri", type: "button", onclick: syncNow }, "지금 맞추기"),
        h("button", { class: "btn", type: "button", onclick: async () => { try { await navigator.clipboard.writeText(connectCode()); msg.textContent = "연결 정보를 복사했어요. 다른 기기의 이 화면에 붙여 넣으세요. 토큰이 들어 있으니 다른 사람에게 보내지 마세요."; } catch (_) { msg.textContent = "복사하지 못했어요. 다른 기기에서 서버 주소와 토큰을 직접 넣어 주세요."; } } }, "연결 정보 복사"),
        h("button", { class: "btn", type: "button", onclick: () => { SYNC = null; saveSync(); syncState = { status: "off", at: null, error: "" }; route(); } }, "연결 끊기")), msg,

  }
