<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Seq2Seq 논문(2014)으로 선형대수·베이즈·엔트로피·중심극한정리·teacher forcing을 하루 30분씩 배우는 인터랙티브 교재">
<title>AI 듀오링고</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f131b" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI 듀오링고">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Jua&display=swap">
<style>
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: graph-paper lab notebook. Sticky top bar, left syllabus rail, centered reading column, right "이 문서에서" on wide screens. */
:root{
  --paper:#f5f7fb; --card:#ffffff; --ink:#18202e; --muted:#5a6578; --line:#d8dfea; --grid:rgba(35,70,200,.055);
  --accent:#2347d0; --accent-soft:#e6ecff; --mark:#ffe46b; --mark-ink:#18202e;
  --good:#16865a; --good-soft:#e3f5ec; --bad:#c23d27; --bad-soft:#fbe8e4; --warn:#a86a00;
  --code-bg:#0f1624; --code-fg:#dbe4f5; --code-kw:#8fb0ff; --code-str:#9fe0b0; --code-num:#ffc78a; --code-com:#7a879c;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --rail:264px; --col:720px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f131b; --card:#161c28; --ink:#e5eaf3; --muted:#9aa5b8; --line:#273145; --grid:rgba(130,160,255,.05);
  --accent:#86a0ff; --accent-soft:#1e2843; --mark:#e2c440; --mark-ink:#15130a;
  --good:#4cc38a; --good-soft:#15291f; --bad:#ff7d66; --bad-soft:#2f1915; --warn:#e5b04a;
  --code-bg:#0a0e16; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f131b; --card:#161c28; --ink:#e5eaf3; --muted:#9aa5b8; --line:#273145; --grid:rgba(130,160,255,.05);
  --accent:#86a0ff; --accent-soft:#1e2843; --mark:#e2c440; --mark-ink:#15130a;
  --good:#4cc38a; --good-soft:#15291f; --bad:#ff7d66; --bad-soft:#2f1915; --warn:#e5b04a;
  --code-bg:#0a0e16; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--card)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.skip{position:absolute;left:-999px}.skip:focus{left:16px;top:8px;z-index:99;background:var(--card);padding:4px 8px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;flex-direction:column;line-height:1.2;text-decoration:none;color:var(--ink);min-width:0}
.brand b{font-size:17px;letter-spacing:-.02em}
.brand span{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
.top .grow{flex:1}
.prog{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.prog .bar{width:120px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.iconbtn:hover{border-color:var(--accent)}
.menu-btn{display:none}

/* shell */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:calc(100vh - 60px)}
.rail{position:sticky;top:calc(61px + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - 61px);overflow:auto;
  border-right:1px solid var(--line);background:color-mix(in srgb,var(--card) 82%,transparent);padding:18px 14px 40px}
.rail h4{font-size:11px;letter-spacing:.12em;color:var(--muted);margin:18px 8px 6px;font-weight:600}
.rail a{display:flex;gap:10px;align-items:flex-start;padding:7px 8px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.4}
.rail a:hover{background:var(--accent-soft)}
.rail a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.rail .dn{font-family:var(--f-mono);font-size:11px;color:var(--muted);min-width:22px;padding-top:2px}
.rail .ck{margin-left:auto;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);flex:none;margin-top:2px}
.rail .ck.done{background:var(--good);border-color:var(--good);box-shadow:inset 0 0 0 3px var(--card)}
.rail a.soon{color:var(--muted)}

main{min-width:0;padding-block:32px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{display:grid;grid-template-columns:minmax(0,var(--col)) 200px;gap:48px;justify-content:center}
.toc{position:sticky;top:90px;align-self:start;font-size:13px;border-left:1px solid var(--line);padding-left:14px}
.toc b{display:block;font-size:11px;letter-spacing:.12em;color:var(--muted);margin-bottom:6px}
.toc a{display:block;color:var(--muted);text-decoration:none;padding:3px 0;line-height:1.4}
.toc a:hover{color:var(--accent)}

/* lesson typography */
.lesson{min-width:0}
.lesson h1{font-size:clamp(28px,4.4vw,40px);line-height:1.2;letter-spacing:-.03em;margin:4px 0 10px;text-wrap:balance}
.lesson h2{font-size:23px;letter-spacing:-.02em;margin:52px 0 12px;padding-top:14px;border-top:1px solid var(--line);text-wrap:balance}
.lesson h3{font-size:18px;margin:30px 0 8px}
.lesson p,.lesson li{max-width:68ch}
.lesson strong{font-weight:700}
.lesson hr{border:0;border-top:1px dashed var(--line);margin:36px 0}
.lesson blockquote{margin:18px 0;padding:12px 16px;border-radius:10px;background:var(--accent-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent)}
.lesson blockquote p{margin:4px 0}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
.meta{font-size:14px;color:var(--muted);border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;display:inline-block}
.tablewrap{overflow-x:auto;margin:14px 0}
table{border-collapse:collapse;font-size:14.5px;min-width:100%}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:600;background:color-mix(in srgb,var(--card) 60%,transparent)}
td{font-variant-numeric:tabular-nums}
code{font-family:var(--f-mono);font-size:.88em;background:var(--accent-soft);padding:1px 5px;border-radius:5px}
pre{position:relative;background:var(--code-bg);color:var(--code-fg);border-radius:12px;padding:16px 16px 14px;overflow-x:auto;font-size:13.5px;line-height:1.6;margin:14px 0}
pre code{background:none;padding:0;font-size:inherit;color:inherit}
pre .kw{color:var(--code-kw)}pre .st{color:var(--code-str)}pre .nu{color:var(--code-num)}pre .co{color:var(--code-com);font-style:italic}
pre .copy{position:absolute;top:8px;right:8px;font:12px var(--f-mono);background:rgba(255,255,255,.08);color:var(--code-fg);border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:3px 8px;cursor:pointer}
pre .lang{position:absolute;top:10px;right:72px;font:11px var(--f-mono);color:var(--code-com)}
math{font-size:1.06em}
math[display="block"]{display:block;overflow-x:auto;padding:10px 0;margin:6px 0}

details{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:4px 16px;margin:20px 0}
details summary{cursor:pointer;font-weight:600;padding:10px 0;color:var(--accent)}
details[open]{padding-bottom:12px}

/* hook + quick quiz + done */
.hook{display:grid;grid-template-columns:auto 1fr;gap:14px;margin:22px 0 6px;padding:16px 18px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.hook .tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--card);background:var(--ink);border-radius:6px;padding:3px 8px;height:fit-content}
.hook p{margin:0}
.quick{margin:28px 0;padding:18px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.quick h3{margin:0 0 4px;font-size:17px}
.quick .sub{font-size:13px;color:var(--muted);margin:0 0 12px}
.q{padding:12px 0;border-top:1px dashed var(--line)}
.q p{margin:0 0 8px;font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer;text-align:left}
.opt:hover{border-color:var(--accent)}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:600}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.why{font-size:14px;color:var(--muted);margin-top:8px}
.score{font-family:var(--f-mono);font-size:13px;margin-top:10px;color:var(--accent)}
.finish{margin:48px 0 0;display:flex;flex-direction:column;gap:16px}
.donebtn{font:inherit;font-weight:700;font-size:16px;padding:14px 18px;border-radius:12px;border:2px solid var(--accent);background:var(--accent);color:var(--card);cursor:pointer}
.donebtn.is-done{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pn a{display:block;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;text-decoration:none;color:var(--ink);min-width:0}
.pn a small{display:block;font-size:12px;color:var(--muted)}
.pn a.next{text-align:right}
.pn a:hover{border-color:var(--accent)}

/* glossary terms */
.term{font:inherit;color:inherit;background:none;border:0;padding:0;border-bottom:1.5px dashed var(--accent);cursor:help}
.pop{position:absolute;z-index:40;max-width:300px;background:var(--ink);color:var(--paper);font-size:13.5px;line-height:1.55;padding:10px 12px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.pop b{display:block;margin-bottom:2px}
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:25;
  font:600 14px var(--f-body);background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:10px 16px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.fab kbd{font-family:var(--f-mono);font-size:11px;opacity:.7;margin-left:6px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,14,22,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(60px,env(safe-area-inset-top,0px)) 16px 16px}
.sheet{background:var(--card);color:var(--ink);width:min(640px,100%);max-height:80vh;overflow:auto;border-radius:16px;padding:18px 20px;border:1px solid var(--line)}
.sheet input{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.gl{display:grid;gap:2px;margin-top:12px}
.gl div{padding:10px 0;border-bottom:1px solid var(--line)}
.gl b{display:block}.gl span{font-size:14px;color:var(--muted)}
.gl a{font-size:12px;font-family:var(--f-mono)}

/* widgets */
.widget{margin:30px 0;border:1px solid var(--line);background:var(--card);border-radius:16px;overflow:hidden}
.w-head{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--accent-soft) 55%,var(--card))}
.w-head .lab{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--accent);font-weight:600}
.w-head b{font-size:15px}
.w-body{padding:16px;display:grid;gap:14px}
.w-body p{margin:0}
.w-hint{font-size:13.5px;color:var(--muted)}
.svgwrap{overflow-x:auto}
.svgwrap svg{display:block;max-width:none}
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 18px}
.sl{display:grid;gap:2px;font-size:13.5px}
.sl .row{display:flex;justify-content:space-between;gap:8px}
.sl output{font-family:var(--f-mono);color:var(--accent);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--card);border-color:var(--accent)}
.btn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.ro{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper)}
.ro small{display:block;font-size:11.5px;color:var(--muted)}
.ro b{font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums}
.ro.big b{font-size:26px;color:var(--accent)}
.calc{font-family:var(--f-mono);font-size:13px;background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;overflow-x:auto;white-space:pre;line-height:1.7}
.badge{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px}
.badge.good{background:var(--good-soft);color:var(--good)}.badge.bad{background:var(--bad-soft);color:var(--bad)}
.numin{width:58px;font:13px var(--f-mono);padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);text-align:right}
.mat{display:inline-grid;gap:4px;padding:6px 8px;border-left:2px solid var(--ink);border-right:2px solid var(--ink);border-radius:6px;vertical-align:middle}
.matrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.hl{background:var(--mark)!important;color:var(--mark-ink)!important}
canvas{display:block;max-width:100%}
svg text{font-family:var(--f-body)}
.s-ink{fill:var(--ink)}.s-muted{fill:var(--muted)}.s-acc{fill:var(--accent)}.s-card{fill:var(--card)}.s-paper{fill:var(--paper)}.s-good{fill:var(--good)}.s-bad{fill:var(--bad)}.s-mark{fill:var(--mark)}
.k-line{stroke:var(--line)}.k-ink{stroke:var(--ink)}.k-acc{stroke:var(--accent)}.k-muted{stroke:var(--muted)}.k-bad{stroke:var(--bad)}.k-good{stroke:var(--good)}

/* home */
.hero{display:grid;gap:14px;margin-bottom:26px}
.hero h1{margin:0;font-size:clamp(32px,5.6vw,52px);line-height:1.1;letter-spacing:-.04em}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--mark) 62%);color:inherit}
.hero p{font-size:17px;color:var(--muted);max-width:60ch;margin:0}
.routine{display:flex;border-radius:10px;overflow:hidden;border:1px solid var(--line);font-size:12.5px;min-width:560px}
.routine div{padding:8px 8px;border-right:1px solid var(--line);background:var(--card);line-height:1.3}
.routine div:last-child{border-right:0}
.routine b{display:block;font-family:var(--f-mono);font-size:11px;color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:16px 0}
.card{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:4px}
.card:hover{border-color:var(--accent)}
.card small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.card b{font-size:15px}
.card span{font-size:13.5px;color:var(--muted);line-height:1.5}

@media (max-width:1180px){.page{grid-template-columns:minmax(0,var(--col))}.toc{display:none}}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;top:0;left:0;bottom:0;height:auto;width:min(300px,86vw);z-index:45;transform:translateX(-102%);transition:transform .25s;background:var(--card);padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .rail.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .menu-btn{display:inline-block}
  .prog .bar{width:60px}
  .pn{grid-template-columns:1fr}
}
@media (max-width:480px){.prog span{display:none}.brand span{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* chips + stats */
.chip{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--paper);white-space:nowrap}
#streak{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.stats{display:flex;flex-wrap:wrap;gap:10px}
.stats div{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;min-width:110px}
.stats small{display:block;font-size:12px;color:var(--muted)}
.stats b{font-family:var(--f-mono);font-size:20px}
.prcard{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:14px 0;padding:14px 16px;border-radius:14px;border:2px solid var(--accent);background:var(--accent-soft)}
.prcard div{display:grid;gap:2px;min-width:0;flex:1 1 260px}
.prcard b{font-size:16px}.prcard span{font-size:13px;color:var(--muted)}

/* practice */
.practice{max-width:680px;margin:0 auto;display:grid;gap:18px}
.pr-head{display:flex;align-items:center;gap:14px}
.pr-x{font-size:20px;color:var(--muted);text-decoration:none;padding:4px 8px;border-radius:8px}
.pr-x:hover{background:var(--accent-soft)}
.pr-bar{flex:1;height:16px;border-radius:8px;background:var(--line);overflow:hidden}
.pr-bar i{display:block;height:100%;width:0;background:var(--good);border-radius:8px;transition:width .45s cubic-bezier(.2,.9,.3,1.3)}
.hearts{font-size:20px;letter-spacing:2px;white-space:nowrap}
.hearts .hf{color:var(--bad)}.hearts .he{color:var(--line)}
.pr-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px;display:grid;gap:16px;min-height:300px;align-content:start}
.pr-card.pop-in{animation:popin .28s ease-out}
@keyframes popin{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
.pr-type{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--accent)}
.pr-q{font-size:21px;font-weight:700;line-height:1.5;margin:0;letter-spacing:-.01em}
.pr-opts{display:grid;gap:10px}
.pr-opt{display:flex;gap:12px;align-items:center;text-align:left;font:inherit;font-size:16px;padding:14px 16px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);color:var(--ink);cursor:pointer}
.pr-opt kbd{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--muted)}
.pr-opt:hover,.pr-oxb:hover,.pr-tok:hover{border-color:var(--accent)}
.pr-opt.sel,.pr-oxb.sel{border-color:var(--accent);background:var(--accent-soft)}
.pr-opt.right,.pr-oxb.right{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.pr-opt.wrong,.pr-oxb.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.pr-ox{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pr-oxb{font:700 40px var(--f-body);padding:22px 0;border-radius:16px;border:2px solid var(--line);border-bottom-width:5px;background:var(--card);color:var(--ink);cursor:pointer}
.pr-num{font:600 22px var(--f-mono);padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--paper);color:var(--ink);width:100%}
.pr-num:focus{border-color:var(--accent);outline:none}
.pr-num.right{border-color:var(--good);background:var(--good-soft)}.pr-num.wrong{border-color:var(--bad);background:var(--bad-soft)}
.pr-ans{min-height:64px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0;border-bottom:2px solid var(--line)}
.pr-ans.right{border-color:var(--good)}.pr-ans.wrong{border-color:var(--bad)}
.pr-bank{display:flex;flex-wrap:wrap;gap:8px}
.pr-tok{font:inherit;font-size:15px;padding:9px 14px;border-radius:12px;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);color:var(--ink);cursor:pointer}
.pr-tok.used{opacity:.25;cursor:default}
.pr-foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 18px;border-radius:16px;border:1px solid var(--line);background:var(--card)}
.pr-foot.good{background:var(--good-soft);border-color:var(--good)}
.pr-foot.bad{background:var(--bad-soft);border-color:var(--bad)}
.pr-msg{display:grid;gap:2px;flex:1 1 260px;min-width:0}
.pr-foot.good .pr-msg b{color:var(--good);font-size:18px}.pr-foot.bad .pr-msg b{color:var(--bad);font-size:17px}
.pr-msg span{font-size:14px;color:var(--ink)}
.pr-go{font:700 16px var(--f-body);padding:12px 26px;border-radius:14px;border:0;border-bottom:4px solid color-mix(in srgb,var(--accent) 60%,#000);background:var(--accent);color:var(--card);cursor:pointer}
.pr-foot.good .pr-go{background:var(--good);border-bottom-color:color-mix(in srgb,var(--good) 60%,#000)}
.pr-foot.bad .pr-go{background:var(--bad);border-bottom-color:color-mix(in srgb,var(--bad) 60%,#000)}
.pr-go:disabled{background:var(--line);color:var(--muted);border-bottom-color:var(--line);cursor:not-allowed}
.pr-foot.end{justify-content:flex-end}
.pr-end{display:grid;justify-items:center;text-align:center;gap:10px;padding:10px 0}
.pr-end h2{margin:0;font-size:22px}
.pr-end p{margin:0;max-width:44ch}
.pr-big{font:700 44px var(--f-body);color:var(--good);letter-spacing:-.03em}
.pr-big.bad{color:var(--bad)}
@media (max-width:480px){.pr-q{font-size:18px}.chip{font-size:11px;padding:2px 7px}}
.menu-btn{white-space:nowrap}
.brand b{white-space:nowrap}
@media (max-width:560px){.prog{display:none}.brand b{font-size:15px}.hook{grid-template-columns:1fr;gap:8px}.hook .tag{width:fit-content}}

/* levels */
#lvl{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line));font-weight:600}
.lvl{display:flex;gap:14px;align-items:center;width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;text-align:left}
.lvl-badge{flex:none;font:700 18px var(--f-mono);color:var(--card);background:var(--accent);border-radius:12px;padding:10px 12px}
.lvl-main{flex:1;min-width:0;display:grid;gap:5px}
.lvl-main b{font-size:16px}
.lvl-main span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.lvl-track{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.lvl-track i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .8s cubic-bezier(.2,.9,.3,1.2)}
.pr-big.lvup{color:var(--accent);animation:lvpop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes lvpop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.lvup-line{font-size:16px}
.lvup-line b{background:linear-gradient(transparent 60%,var(--mark) 60%);color:inherit}
@media (max-width:700px){#xp{display:none}}
@media (max-width:480px){#lvl{max-width:9.5em;overflow:hidden;text-overflow:ellipsis}}

/* subjects + chapter path */
.rail .st{display:block;font-size:11px;color:var(--warn);font-family:var(--f-mono);letter-spacing:.05em}
.rail a.locked{cursor:default;opacity:.6}
.rail a.locked:hover{background:none}
.rail a.locked .st{color:var(--muted)}
.unit{margin:34px 0 0;--u:var(--accent)}
.unit.u1{--u:var(--good)}.unit.u2{--u:var(--warn)}.unit.u3{--u:var(--bad)}.unit.u4{--u:var(--ink)}
.unit-head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end;padding:16px 18px;border-radius:16px;background:var(--u);color:var(--card)}
.unit-head small{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;opacity:.8}
.lesson .unit-head h2{margin:0;padding:0;border:0;font-size:24px;color:inherit}
.unit-head p{margin:2px 0 0;font-size:14px;opacity:.9}
.unit-prog{display:grid;gap:5px;min-width:120px;font-family:var(--f-mono);font-size:13px;text-align:right}
.unit-prog .lvl-track{background:color-mix(in srgb,var(--card) 30%,transparent)}
.unit-prog .lvl-track i{background:var(--card)}
.path{display:grid;gap:18px;padding:22px 6px 6px}
.step{display:flex;align-items:center;gap:16px;margin-left:var(--off)}
.node{position:relative;flex:none;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;text-decoration:none;
  background:var(--card);border:3px solid var(--u);border-bottom-width:7px;color:var(--u);transition:transform .12s}
a.node:hover{transform:translateY(-2px)}
a.node:active{transform:translateY(3px);border-bottom-width:4px}
.node .num{font:700 24px var(--f-mono)}
.node.done{background:var(--u);color:var(--card);border-color:color-mix(in srgb,var(--u) 70%,#000)}
.node.next{box-shadow:0 0 0 6px color-mix(in srgb,var(--u) 22%,transparent)}
.node.locked{border-color:var(--line);color:var(--muted);background:var(--paper);border-style:dashed}
.bubble{position:absolute;top:-30px;left:50%;transform:translateX(-50%);white-space:nowrap;font:700 12px var(--f-body);background:var(--ink);color:var(--paper);padding:3px 10px;border-radius:8px;animation:bob 1.6s ease-in-out infinite}
.bubble::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:var(--ink);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{50%{transform:translateX(-50%) translateY(-4px)}}
.step-txt{display:grid;gap:1px;min-width:0}
.step-txt b{font-size:16px}
.step-txt span{font-size:13px;color:var(--muted);font-family:var(--f-mono)}
.pr-stars{font-size:30px;letter-spacing:6px;color:var(--warn)}
@media (max-width:560px){.step{margin-left:calc(var(--off) / 3)}.node{width:58px;height:58px}}

/* ---------- references ---------- */
.refbox{margin-top:40px;padding-top:8px;border-top:1px solid var(--line)}
.refs{padding-left:20px;margin:10px 0}
.refs li{margin:0 0 12px}
.refs li>a{font-weight:600}
.refs li p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.ref-w{display:inline-block;margin-left:8px;padding:1px 7px;border:1px solid var(--line);border-radius:999px;font:500 11.5px var(--f-mono);color:var(--muted);white-space:nowrap}
.ref-all{font-size:14px}
.pr-ref{display:block;margin-top:4px;font-size:12.5px;opacity:.85}
.pr-ref a{color:inherit;text-decoration:underline}
.pr-hint{margin-top:10px;font-size:13px}
.pr-hintbox{margin:10px 0 0;padding:8px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:6px;font-size:14px}
.ref-w.ok{border-color:var(--good);color:var(--good)}
/* ---------- settings ---------- */
.setbox{margin:22px 0;padding:18px 20px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.setbox h2{margin:0 0 8px;font-size:19px}
.setbox h3{margin:16px 0 6px;font-size:15px}
.codebox{display:block;width:100%;margin:0 0 8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:12.5px/1.5 var(--f-mono);word-break:break-all;resize:vertical}
/* ---------- speak (interview) ---------- */
.prcard.spk{margin-top:12px}
.spk-q{font-size:clamp(22px,3.4vw,30px);line-height:1.4;text-wrap:balance}
.spk-steps{display:flex;gap:8px;list-style:none;padding:0;margin:14px 0 20px;flex-wrap:wrap}
.spk-steps li{padding:4px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--muted);background:var(--card)}
.spk-steps li.on{border-color:var(--accent);color:var(--accent);font-weight:600;background:var(--accent-soft)}
.spk-steps li.ok{border-color:var(--good);color:var(--good)}
.spk-script{margin:14px 0;padding:14px 18px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.spk-script p{margin:8px 0;display:flex;gap:10px;font-size:17px;line-height:1.7}
.spk-n{flex:none;width:22px;height:22px;margin-top:4px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:600 12px/22px var(--f-mono);text-align:center}
.spk-blur{filter:blur(7px);user-select:none;opacity:.7}
.spk-keys{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0}
.spk-keys small{color:var(--muted);margin-right:4px}
.spk-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:14px 0}
.spk-clock{font:600 20px var(--f-mono);font-variant-numeric:tabular-nums;min-width:56px}
.spk-rec.on{background:var(--bad);border-color:var(--bad);color:#fff}
.spk-live{margin:8px 0;padding:10px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:6px;font-size:15px;min-height:0}
.spk-live:empty{display:none}
.spk-audio{display:block;width:100%;margin:4px 0 8px}
.spk-check{display:grid;gap:6px;margin:12px 0}
.spk-check label{display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.spk-check input{width:18px;height:18px;accent-color:var(--accent)}
.spk-body .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.setbox h2{border:0;padding-top:0}
.syncstat{margin:8px 0;padding:8px 12px;border-radius:8px;background:var(--accent-soft);font-size:14px}
.syncstat.ok{background:var(--good-soft);color:var(--good)}
.syncstat.error{background:var(--bad-soft);color:var(--bad)}
input.codebox{font-size:14px}

/* 부호(±) 버튼: 폰 숫자 키패드에 마이너스 키가 없을 때 사용 */
.sign-btn{font:700 16px var(--f-mono);min-width:44px;min-height:36px;justify-content:center}
.pr-numrow{display:flex;gap:8px;align-items:stretch}
.pr-numrow .pr-num{flex:1;min-width:0}
.pr-numrow .sign-btn{min-width:64px;font-size:24px;border-radius:14px}

/* ---------- play: 듀오링고식 놀이 화면. style.css 뒤에 붙어 토큰과 부품을 덮어쓴다 ---------- */
:root{
  --paper:#f4f7fb; --card:#ffffff; --ink:#1d2433; --muted:#566076; --line:#dfe5ee; --grid:transparent;
  --accent:#0f6fde; --accent-d:#0a55ad; --accent-soft:#e3f0ff; --on-accent:#ffffff;
  --good:#0f8a5f; --good-d:#0a6646; --good-soft:#dcf7ea; --bad:#d6323f; --bad-d:#a82430; --bad-soft:#ffe6e6; --warn:#a85f00;
  --sun:#ffc530; --sun-d:#d99a00; --coral:#ff6b5e; --sky:#27b3f5; --mint:#22c58b; --flame:#f47b16;
  --mc:#3d9bff; --mc-d:#1f6fd0;
  --f-display:"Jua","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --tabs-h:64px; --col:640px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11141c; --card:#1a1f2b; --ink:#eef2f8; --muted:#a3adbf; --line:#2c3444;
  --accent:#58a6ff; --accent-d:#2f7fd8; --accent-soft:#16283f; --on-accent:#08182c;
  --good:#3ecf96; --good-d:#22a070; --good-soft:#12301f; --bad:#ff7a7a; --bad-d:#d85555; --bad-soft:#3a181b; --warn:#f0b35a;
  --mc:#58a6ff; --mc-d:#2f7fd8}}
:root[data-theme="dark"]{
  --paper:#11141c; --card:#1a1f2b; --ink:#eef2f8; --muted:#a3adbf; --line:#2c3444;
  --accent:#58a6ff; --accent-d:#2f7fd8; --accent-soft:#16283f; --on-accent:#08182c;
  --good:#3ecf96; --good-d:#22a070; --good-soft:#12301f; --bad:#ff7a7a; --bad-d:#d85555; --bad-soft:#3a181b; --warn:#f0b35a;
  --mc:#58a6ff; --mc-d:#2f7fd8}

body{background-image:none;line-height:1.7}
h1,h2,h3,.btn,.pr-go,.pr-q,.stat b,.tab span,.node,.bubble,.unit-head h2,.lvl-badge,.pr-big,.spk-q{font-family:var(--f-display);font-weight:400;letter-spacing:0}
.lesson h1{font-size:clamp(26px,5vw,36px);line-height:1.3}
.lesson h2{font-size:22px;border-top:0;padding-top:0;margin-top:40px}
.eyebrow{font-family:var(--f-body);font-weight:600;letter-spacing:.02em;text-transform:none;font-size:13px}
.ico{display:inline-grid;place-items:center;width:24px;height:24px;flex:none}
.ico svg{width:100%;height:100%;display:block}
.mascot{display:inline-block;line-height:0;flex:none}
.mascot svg{display:block}
@media (prefers-reduced-motion:no-preference){.mascot.m-cheer svg{animation:hop .9s ease-out 2}.mascot.m-happy svg{animation:sway 4s ease-in-out infinite}}
@keyframes hop{0%,100%{transform:none}40%{transform:translateY(-10px)}}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}

/* 통통한 버튼: 아래 테두리가 두껍고, 누르면 내려간다 */
.btn,.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;
  background:var(--card);color:var(--ink);font-size:16px;text-decoration:none;cursor:pointer;transition:transform .1s,border-color .15s,background .15s;-webkit-tap-highlight-color:transparent}
.btn:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.btn.pri{background:var(--accent);border-color:var(--accent-d);color:var(--on-accent)}
.btn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.big{min-height:52px;font-size:18px;padding:10px 22px;border-radius:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
@media (hover:hover){.btn:hover:not(:disabled){border-color:var(--accent)}.btn.pri:hover:not(:disabled){filter:brightness(1.06);border-color:var(--accent-d)}}
.donebtn{font-family:var(--f-display);font-weight:400;border-radius:16px;border-bottom-width:5px;border-color:var(--accent-d);color:var(--on-accent)}

/* 위쪽 바: 브랜드와 스탯 */
.top{gap:8px;padding-block:8px;border-bottom:2px solid var(--line)}
.brand{flex-direction:row;align-items:center;gap:8px}
.brand b{font-family:var(--f-display);font-weight:400;font-size:20px}
.brand span:not(.mascot):not(#brandmark){display:none}
#brandmark{display:inline-flex}
.stat{display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:2px 10px;border-radius:12px;font-size:17px;white-space:nowrap;color:var(--ink);border:0;background:none;font-family:var(--f-display)}
.stat .ico{width:22px;height:22px}
#streak{color:var(--flame);border:0}#streak.off{color:var(--muted)}
#xp{color:var(--sun-d);display:inline-flex}
#lvl{color:var(--accent);border:0;max-width:none}
:root[data-theme="dark"] #xp{color:var(--sun)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #xp{color:var(--sun)}}
.prog,.menu-btn,.chip#none{display:none!important}
.fab{display:none}

/* 아래 탭 (폰). 1024px부터는 왼쪽 목차가 그 일을 한다 */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:2px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
.tab{display:grid;justify-items:center;gap:2px;min-height:52px;padding:6px 4px;border:2px solid transparent;border-radius:14px;background:none;color:var(--muted);text-decoration:none;font-size:13px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tab .ico{width:26px;height:26px}
.tab.on{color:var(--accent);background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
main{padding-block:20px calc(var(--tabs-h) + 40px + env(safe-area-inset-bottom,0px))}
.page{grid-template-columns:minmax(0,var(--col));gap:0}
.toc{display:none}
@media (min-width:1024px){.tabs{display:none}main{padding-bottom:80px}}
@media (max-width:1023px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;top:0;left:0;bottom:0;height:100vh;height:100dvh;max-height:100dvh;box-sizing:border-box;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;width:min(320px,88vw);z-index:45;transform:translateX(-102%);transition:transform .22s;background:var(--card);padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(var(--tabs-h) + 30px)}
  .rail.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
}
.rail{border-right:2px solid var(--line);background:var(--card)}
.rail a{min-height:44px;align-items:center;border-radius:12px;font-size:15px}
.rail h4{font-size:13px;letter-spacing:0;font-family:var(--f-display);font-weight:400}
.rail .dn{font-size:13px}
body.focus-practice .tabs,body.focus-practice .top,body.focus-lesson .tabs,body.focus-lesson .top{display:none}
body.focus-practice .rail,body.focus-lesson .rail{display:none}
body.focus-practice .shell,body.focus-lesson .shell{grid-template-columns:minmax(0,1fr)}
body.focus-practice main{padding-block:16px 24px}

/* 홈: 인사, 오늘, 학습 길 */
.greet{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.say{position:relative;flex:1;min-width:0;display:grid;gap:12px;padding:16px;border:2px solid var(--line);border-radius:20px;background:var(--card)}
.say::before{content:"";position:absolute;left:-9px;top:34px;width:14px;height:14px;background:var(--card);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.say p{margin:0;font-size:17px;font-weight:600;max-width:none}
.say .btn{justify-self:start}
.today{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:8px}
.goal,.mini{display:flex;align-items:center;gap:10px;padding:12px 14px;border:2px solid var(--line);border-radius:18px;background:var(--card);min-width:0}
.goal small,.mini small{display:block;font-size:13px;color:var(--muted)}
.goal b,.mini b{font-family:var(--f-display);font-weight:400;font-size:19px}
.mini>div{min-width:0;flex:1;display:grid;gap:3px}
.mini span:not(.ico){font-size:13px;color:var(--muted)}
.mini .ico{width:34px;height:34px}
.c-flame{color:var(--flame)}.c-off{color:var(--muted)}.c-sun{color:var(--sun-d)}
.ring-bg{fill:none;stroke:var(--line);stroke-width:8}
.ring-fg{fill:none;stroke:var(--sun);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .6s ease-out}
.goal.hit .ring-fg{stroke:var(--mint)}
.unit{margin:26px 0 0;--u:var(--accent);--u-d:var(--accent-d);--u-on:#fff}
.unit.u-indigo{--u:#0f6fde;--u-d:#0a55ad}
.unit.u-mint{--u:#0f8a5f;--u-d:#0a6646}
.unit.u-sun{--u:#ffc530;--u-d:#d99a00;--u-on:#3b2a00}
.unit.u-coral{--u:#d6323f;--u-d:#a82430}
.unit.u-sky{--u:#0b7fb8;--u-d:#075d88}
.unit-head{border-radius:20px;background:var(--u);color:var(--u-on);border-bottom:5px solid var(--u-d);padding:14px 18px;align-items:center}
.unit-head small{font-family:var(--f-body);font-size:13px;letter-spacing:0;opacity:1;font-weight:600}
.lesson .unit-head h2{font-size:24px;margin:0}
.unit-head p{font-size:14px;opacity:1;margin:0}
.unit-prog{font-family:var(--f-display);font-size:15px}
.unit-prog .lvl-track{background:color-mix(in srgb,var(--u-on) 28%,transparent)}
.unit-prog .lvl-track i{background:var(--u-on)}
.path{list-style:none;margin:0;padding:34px 0 8px;display:grid;gap:22px;justify-items:center}
.pstep{display:grid;justify-items:center;gap:6px;transform:translateX(var(--x));margin:0;max-width:none}
.node{position:relative;width:76px;height:70px;border-radius:50%;display:grid;place-items:center;border:0;border-bottom:8px solid var(--u-d);background:var(--u);color:var(--u-on);cursor:pointer;
  transition:transform .1s,border-bottom-width .1s;-webkit-tap-highlight-color:transparent;padding:0}
.node .ico{width:34px;height:34px}
button.node:active{transform:translateY(5px);border-bottom-width:3px}
.node.open{background:var(--card);color:var(--u);box-shadow:inset 0 0 0 3px var(--u);border-bottom-color:var(--u)}
.node.done{background:var(--sun);border-bottom-color:var(--sun-d);color:#3b2a00;box-shadow:none}
.node.next{box-shadow:0 0 0 7px color-mix(in srgb,var(--u) 24%,transparent)}
.node.locked{background:var(--line);border-bottom-color:color-mix(in srgb,var(--line) 70%,#000);color:var(--muted);cursor:default;border-style:solid}
.plabel{font-size:14px;font-weight:600;text-align:center;max-width:150px;line-height:1.35}
.pstars{font-size:15px;letter-spacing:2px;color:var(--sun-d)}
.psoon{font-size:13px;color:var(--muted)}
.bubble{top:-38px;font-size:15px;padding:5px 12px;border-radius:12px;background:var(--card);color:var(--u);border:2px solid var(--line);font-weight:400}
.bubble::after{background:var(--card);border-right:2px solid var(--line);border-bottom:2px solid var(--line);bottom:-7px}
.unit.u-sun .bubble,.unit.u-sun .node.open{color:#8a6100}
.extras{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:36px}
.card{border-width:2px;border-bottom-width:4px;border-radius:18px;padding:14px 16px}
.card small{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--accent)}
.card b{font-size:16px}.card span{font-size:14px}
@media (max-width:420px){.greet .mascot svg{width:72px;height:72px}.pstep{transform:translateX(calc(var(--x) * .8))}}

/* 챕터를 누르면 뜨는 시트 */
.nsheet-wrap{position:fixed;inset:0;z-index:60;background:rgba(10,14,22,.5);display:flex;align-items:flex-end;justify-content:center}
.nsheet{position:relative;width:min(520px,100%);background:var(--card);color:var(--ink);border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:10px}
.nsheet small{font-size:13px;font-weight:600;color:var(--accent)}
.nsheet h3{margin:0;font-size:24px;padding-right:44px}
.nsheet p{margin:0 0 6px;color:var(--muted);font-size:15px}
.nsheet .btn{width:100%}
.nsheet-x{position:absolute;top:12px;right:12px;width:44px;height:44px;border:0;background:none;color:var(--muted);border-radius:12px;cursor:pointer;display:grid;place-items:center}
@media (min-width:700px){.nsheet-wrap{align-items:center}.nsheet{border-radius:24px}}
@media (prefers-reduced-motion:no-preference){.nsheet{animation:rise .22s ease-out}}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}

/* 레슨: 한 걸음씩 */
.lbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;display:flex;align-items:center;gap:10px;padding:10px 0;margin-bottom:8px;background:var(--paper)}
.lx{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;color:var(--muted);flex:none}
.lcount{font-family:var(--f-display);font-size:15px;color:var(--muted);white-space:nowrap}
.modebtn{min-height:36px;padding:4px 12px;font-size:14px;border-bottom-width:3px;border-radius:12px}
.lesson>.modebtn{float:right;margin:0 0 8px 8px}
.pr-bar{height:16px;border-radius:8px;background:var(--line)}
.pr-bar i{background:var(--mint);position:relative}
.pr-bar i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:2px;background:rgba(255,255,255,.35)}
.lstep>hr{display:none}
.lstep>h2:first-child{margin-top:8px}
.lstep:first-of-type .prcard{display:none}
@media (prefers-reduced-motion:no-preference){.lstep.slide{animation:slidein .22s ease-out}}
@keyframes slidein{from{transform:translateX(18px);opacity:0}to{transform:none;opacity:1}}
.lfoot{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:2px solid var(--line);padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.lfoot-in{max-width:var(--col);margin:0 auto;display:grid;grid-template-columns:auto 1fr;gap:10px}
body.focus-lesson main{padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
.lend-top{display:grid;justify-items:center;text-align:center;gap:6px;margin:10px 0 18px}
.lesson .lend-top h2{margin:0;font-size:30px}
.lend-top p{margin:0;color:var(--muted)}
.lend .finish{margin-top:8px}
.hook{border-width:2px;border-radius:18px}
.hook .tag{font-family:var(--f-display);font-size:13px;letter-spacing:0;background:var(--sun);color:#3b2a00;border-radius:10px;padding:4px 10px}
.lesson blockquote{border-width:2px;border-radius:16px}
.widget{border-width:2px;border-radius:20px}
.w-head .lab{font-family:var(--f-body);font-size:12px;letter-spacing:0}
.quick{border-width:2px;border-radius:20px}
.opt{min-height:44px;font-size:16px;border-width:2px;border-bottom-width:4px;border-radius:14px;padding:8px 14px}
details{border-width:2px;border-radius:16px}
.prcard{border-radius:18px;border-bottom-width:5px}
.prcard b{font-family:var(--f-display);font-weight:400;font-size:18px}
.prcard span{font-size:14px}
.pn a{border-width:2px;border-bottom-width:4px;border-radius:16px}

/* 연습 */
.practice{gap:14px;padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.pr-x{display:grid;place-items:center;width:44px;height:44px;font-size:22px}
.hearts{display:inline-flex;gap:3px}
.hearts .ico{width:26px;height:26px}
.hearts .hf{color:var(--coral)}.hearts .he{color:var(--line)}
.pr-card{border:0;background:none;padding:6px 0;min-height:0}
.pr-type{font-family:var(--f-body);font-size:14px;font-weight:600;letter-spacing:0}
.pr-q{font-size:23px;line-height:1.45}
.pr-opt{min-height:56px;font-size:17px;border-radius:16px}
.pr-opt kbd{font-size:13px;min-width:26px;text-align:center}
.pr-tok{min-height:44px;font-size:16px}
.pr-num{border-bottom-width:4px;border-radius:16px}
.pr-foot{position:fixed;left:0;right:0;bottom:0;z-index:30;border-radius:0;border:0;border-top:2px solid var(--line);padding:14px max(16px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));justify-content:center}
.pr-foot>*{max-width:680px}
.pr-foot .pr-msg{flex:1 1 300px}
.pr-go{min-height:52px;font-size:18px;font-weight:400;border-radius:16px;border:2px solid var(--accent-d);border-bottom-width:5px;color:var(--on-accent);flex:1 1 160px;max-width:340px}
.pr-go:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px}
.pr-foot.good .pr-go{border-color:var(--good-d);color:#fff}
.pr-foot.bad .pr-go{border-color:var(--bad-d);color:#fff}
:root[data-theme="dark"] .pr-foot.good .pr-go,:root[data-theme="dark"] .pr-foot.bad .pr-go{color:#10151d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pr-foot.good .pr-go,:root:not([data-theme="light"]) .pr-foot.bad .pr-go{color:#10151d}}
.pr-go:disabled{border-color:var(--line)}
.pr-foot.good .pr-msg b,.pr-foot.bad .pr-msg b{font-family:var(--f-display);font-weight:400;font-size:21px}
@media (prefers-reduced-motion:no-preference){.pr-foot.good,.pr-foot.bad{animation:rise .2s ease-out}.pr-opt.wrong,.pr-num.wrong,.pr-oxb.wrong{animation:shake .3s}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pr-big{font-weight:400;font-size:40px}
.pr-stars{color:var(--sun-d)}
.lvl{border-width:2px;border-radius:18px}
.lvl-badge{font-size:20px;border-radius:14px;color:var(--on-accent)}
.lvl-main span{font-family:var(--f-body);font-size:13px}
.lvl-track{height:12px;border-radius:6px}
.lvl-track i{border-radius:6px;background:var(--sun)}
.ro{border-width:2px;border-radius:14px}
.ro b{font-family:var(--f-display);font-weight:400}

/* 색종이 */
.confetti{position:fixed;inset:0;z-index:80;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-16px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{top:105%;transform:rotate(540deg)}}

/* 말하기, 설정 */
.spk-script{border-width:2px;border-radius:18px}
.spk-steps li{min-height:32px;display:inline-flex;align-items:center;border-width:2px;font-size:14px}
.chip{font-family:var(--f-body);font-size:14px;padding:4px 12px;border-width:2px}
.setbox{border-width:2px;border-radius:20px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.setrow+.setrow{border-top:2px solid var(--line)}
.switch{position:relative;width:56px;height:32px;border-radius:16px;border:2px solid var(--line);background:var(--line);cursor:pointer;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:var(--card);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--mint);border-color:var(--good)}
.switch[aria-checked="true"]::after{transform:translateX(24px)}
.pop{font-size:15px}
.w-hint{font-size:14px}
.ref-w{font-family:var(--f-body);font-size:12.5px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
@media (max-width:520px){.today{grid-template-columns:1fr 1fr}.today>:first-child{grid-column:1/-1}}
.setbox h2{margin-top:0}

/* ---------- 더 쉽고 재밌게: 길이 주인공인 홈, 말하는 벡이, 통통 튀는 채점 ---------- */
/* 홈 첫 화면은 인사 한 줄, 오늘 목표 한 줄, 그리고 바로 길 */
.greet{margin-bottom:12px}
.say{padding:14px 16px;gap:10px}
.say p{font-size:16px;line-height:1.5}
.quest{display:flex;align-items:center;gap:12px;padding:12px 16px;border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;background:var(--card);color:var(--ink);text-decoration:none;-webkit-tap-highlight-color:transparent}
.quest:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.quest .ico{width:30px;height:30px}
.quest-main{flex:1;min-width:0;display:grid;gap:6px}
.quest-main b{font-family:var(--f-display);font-weight:400;font-size:17px}
.quest-bar{position:relative;height:20px;border-radius:10px;background:var(--line);overflow:hidden}
.quest-bar i{position:absolute;inset:0 auto 0 0;border-radius:10px;background:var(--sun);transition:width .6s cubic-bezier(.2,.9,.3,1.2)}
.quest-bar i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:2px;background:rgba(255,255,255,.45)}
.quest-bar span{position:relative;display:block;text-align:center;font-family:var(--f-display);font-size:13px;line-height:20px;color:var(--ink)}
.quest.hit .quest-bar i{background:var(--mint)}
@media (hover:hover){.quest:hover{border-color:var(--sun-d)}}
/* 과목 띠는 위에 붙어서 지금 어느 과목인지 늘 보인다 */
.unit{margin-top:28px}
.unit-head{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:10;padding:12px 16px}
.lesson .unit-head h2{font-size:22px}
.unit-head p{font-size:13.5px}
/* 길: 더 크고 통통한 단추, 다음 차례는 숨 쉬듯 커졌다 작아진다 */
.path{gap:26px;padding-top:40px}
.pstep{position:relative}
.node{width:84px;height:78px}
.node .ico{width:38px;height:38px}
.node.next{box-shadow:0 0 0 8px color-mix(in srgb,var(--u) 22%,transparent)}
.node.trophy{width:96px;height:88px;cursor:default}
.node.trophy .ico{width:46px;height:46px}
.node.trophy.done{background:var(--sun);border-bottom-color:var(--sun-d);color:#5a3d00}
.pbuddy{position:absolute;top:0;left:50%;transform:translateX(calc(-50% + var(--bx)));pointer-events:none}
@media (prefers-reduced-motion:no-preference){
  .node.next{animation:breathe 2.2s ease-in-out infinite}
  .bubble{animation:bob 1.6s ease-in-out infinite}
  .pbuddy .mascot svg{animation:sway 3.6s ease-in-out infinite}
  .quest-bar i,.pr-bar i{transition-duration:.7s}
}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-4px)}}
@media (max-width:420px){.pbuddy{display:none}.node{width:78px;height:72px}}
/* 레슨 도입: 벡이가 오늘의 장면을 말해 준다 */
.hook{grid-template-columns:auto 1fr;align-items:start;border:0;background:none;padding:0;gap:10px}
.hook-say{position:relative;display:grid;gap:8px;padding:14px 16px;border:2px solid var(--line);border-radius:18px;background:var(--card)}
.hook-say::before{content:"";position:absolute;left:-9px;top:24px;width:14px;height:14px;background:var(--card);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.hook .tag{width:fit-content}
.hook p{font-size:16px;line-height:1.6}
@media (max-width:560px){.hook{grid-template-columns:auto 1fr}.hook .mascot svg{width:52px;height:52px}}
/* 연습: 벡이가 말풍선으로 묻는다 */
.pr-card{position:relative}
.pr-ask{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:end}
.pr-ask .pr-q{position:relative;margin:0;padding:14px 16px;border:2px solid var(--line);border-radius:18px;background:var(--card)}
.pr-ask .pr-q::before{content:"";position:absolute;left:-9px;bottom:18px;width:14px;height:14px;background:var(--card);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
@media (max-width:480px){.pr-ask .mascot svg{width:56px;height:56px}.pr-ask .pr-q{font-size:19px}}
.pr-opts{gap:12px}
.pr-opt.sel,.pr-oxb.sel{border-bottom-width:4px}
.pr-oxb{font-family:var(--f-display);font-weight:400;font-size:52px;min-height:120px}
.pr-oxb[data-v="O"]{color:var(--good)}.pr-oxb[data-v="X"]{color:var(--bad)}
.pr-oxb.sel[data-v="O"]{background:var(--good-soft);border-color:var(--good)}
.pr-oxb.sel[data-v="X"]{background:var(--bad-soft);border-color:var(--bad)}
.pr-bar{position:relative;overflow:visible}
.combo{position:absolute;right:6px;top:-24px;font-family:var(--f-display);font-size:15px;color:var(--flame);opacity:0;transform:scale(.6);transition:opacity .15s,transform .2s cubic-bezier(.2,1.6,.4,1);pointer-events:none}
.combo.on{opacity:1;transform:none}
.xp-pop{position:absolute;right:16px;top:8px;font-family:var(--f-display);font-size:24px;color:var(--sun-d);pointer-events:none;opacity:0}
@media (prefers-reduced-motion:no-preference){.xp-pop{animation:xpup 1s ease-out forwards}}
@keyframes xpup{0%{opacity:0;transform:translateY(10px) scale(.7)}25%{opacity:1;transform:translateY(-6px) scale(1.15)}100%{opacity:0;transform:translateY(-34px)}}
/* 채점 띠: 동그란 큰 아이콘 */
.pr-badge{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;flex:none;background:var(--card)}
.pr-badge .ico{width:30px;height:30px}
.pr-foot.good .pr-badge{color:var(--good)}.pr-foot.bad .pr-badge{color:var(--bad)}
@media (prefers-reduced-motion:no-preference){.pr-badge{animation:lvpop .4s cubic-bezier(.2,1.6,.4,1)}}
/* 결과: 색깔 있는 숫자 칸 */
.readout{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ro.big{display:grid;gap:4px;padding:10px 12px;border:2px solid var(--t,var(--line));border-bottom-width:4px;border-radius:16px;background:var(--card);text-align:center}
.ro.big small{font-family:var(--f-display);font-size:14px;color:var(--t-ink,var(--muted))}
.ro.big b{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:var(--f-display);font-weight:400;font-size:26px;color:var(--t-ink,var(--ink))}
.ro.big b .ico{width:24px;height:24px}
.t-sun{--t:var(--sun);--t-ink:var(--sun-d)}.t-good{--t:var(--mint);--t-ink:var(--good)}.t-flame{--t:var(--flame);--t-ink:var(--flame)}.t-sky{--t:var(--sky);--t-ink:#0b7fb8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .t-sun{--t-ink:var(--sun)}:root:not([data-theme="light"]) .t-sky{--t-ink:var(--sky)}}
:root[data-theme="dark"] .t-sun{--t-ink:var(--sun)}:root[data-theme="dark"] .t-sky{--t-ink:var(--sky)}
@media (min-width:560px){.readout{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pr-foot .pr-badge+.pr-msg{flex:1 1 200px}
@media (max-width:480px){.pr-badge{width:44px;height:44px}.pr-badge .ico{width:26px;height:26px}.pr-foot .pr-go{flex-basis:100%;max-width:none}}
.t-sun{--t-ink:#8a5f00}.pr-foot .btn{white-space:nowrap}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .t-sun{--t-ink:var(--sun)}}
:root[data-theme="dark"] .t-sun{--t-ink:var(--sun)}
body{word-break:keep-all;overflow-wrap:break-word}
/* 아직 레슨이 없는 단계: 접힌 카드 */
.unit-later .unit-head{opacity:.92}
.unit-later .unit-head > svg{width:28px;height:28px;flex:none;opacity:.8}
.later-list{list-style:none;margin:10px 0 28px;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.later-list li{font-size:14px;padding:6px 12px;border:2px solid var(--line);border-radius:999px;background:var(--card);color:var(--muted)}

/* ---------- 단어장 ---------- */
.tab{position:relative}
.tab-badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--coral);color:#fff;font-style:normal;font-family:var(--f-display);font-size:12px;line-height:20px;text-align:center;box-shadow:0 0 0 2px var(--card)}
.vquest{margin-top:10px}
.vq-sub{font-size:13.5px;color:var(--muted)}
.vbadge{display:grid;place-items:center;min-width:34px;height:34px;padding:0 8px;border-radius:17px;background:var(--coral);color:#fff;font-family:var(--f-display);font-size:17px;flex:none}
.vtoday{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 8px}
.vnote{font-size:14px;padding:10px 14px;border-radius:14px;background:var(--accent-soft);color:var(--ink);margin:8px 0}
.vempty .say .btn{margin-top:4px}
.vshelf-wrap{margin:6px 0 4px}
.vshelf{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:end;padding:14px 10px 0;border-bottom:8px solid color-mix(in srgb,var(--sun-d) 70%,var(--ink));border-radius:0 0 6px 6px;background:linear-gradient(transparent 70%,color-mix(in srgb,var(--sun) 14%,transparent))}
.vbox{--bx:var(--coral);--bx-d:color-mix(in srgb,var(--coral) 70%,#000);display:grid;justify-items:center;gap:2px;text-align:center;min-width:0;padding-bottom:6px}
.vbox.vb2{--bx:var(--flame)}.vbox.vb3{--bx:var(--sun)}.vbox.vb4{--bx:var(--sky)}.vbox.vb5{--bx:var(--accent)}.vbox.vb6{--bx:var(--mint)}

<script>
const PAGES = [{"id": "home", "short": "교재 소개", "md": "# 하루 30분, 논문 한 편으로 배우는 AI 수학\n\n> 교재 대상: 고등 수학을 거의 잊은 비전공자도 따라올 수 있게 썼습니다. 0단계 수학 준비편부터 시작하세요.\n> 진행 방식: 하루 30분, 주 5일. 레슨마다 필수 부분만 하면 30분, \"(선택)\" 표시는 시간이 남을 때만\n> 전체 길: 수학 준비편 → 기초 수학 → Seq2Seq 논문 → … → 대학원 선형대수와 최신 AI까지 12단계 (앱 첫 화면의 학습 길)\n> 선생님 역할: Claude\n\n---\n\n## 1. 왜 이 논문인가\n\n**선정 논문:** Ilya Sutskever, Oriol Vinyals, Quoc V. Le,\n*\"Sequence to Sequence Learning with Neural Networks\"*, NIPS 2014\n(arXiv: https://arxiv.org/abs/1409.3215, 본문 9쪽 정도)\n\n이 논문을 고른 이유는 세 가지입니다.\n\n1. **짧고 아이디어가 하나다.** \"문장을 벡터 하나로 압축(인코더)했다가, 그 벡터에서 다른 문장을 한 단어씩 만들어 낸다(디코더).\" 이게 전부입니다. 수식도 사실상 두 개뿐입니다.\n2. **배우고 싶은 주제가 모두 자연스럽게 등장한다.**\n   | 배우고 싶은 주제 | 논문에서 등장하는 곳 |\n   |---|---|\n   | 선형대수 (벡터, 행렬곱) | 단어 임베딩(1000차원), LSTM의 핵심 계산 `Wx + b` |\n   | 베이즈 정리·조건부확률 | 식 (1): 번역 확률을 단어별 조건부확률의 곱으로 분해 |\n   | 엔트로피·크로스엔트로피 | 학습 목표: 정답 번역의 로그 확률 평균을 최대화, 보고된 perplexity |\n   | Teacher forcing | 학습할 때 디코더에 \"정답 이전 단어\"를 넣어 주는 방식 |\n   | 중심극한정리 | 파라미터 초기화(균등분포 ±0.08), 미니배치(128개) 평균 그래디언트 |\n3. **현재 AI(GPT, Claude 같은 LLM)의 직계 조상이다.** \"앞 단어들이 주어졌을 때 다음 단어의 확률\"을 학습한다는 핵심이 지금도 그대로입니다. 이 논문을 이해하면 Transformer 논문으로 넘어가기가 훨씬 쉽습니다.\n\n> **용어 메모:** 요청하신 \"앤트로픽 관련 사항\"은 **엔트로피(entropy)** 와 **크로스엔트로피(cross-entropy)** 를 뜻하는 것으로 이해하고 교재를 구성했습니다. (Anthropic은 회사 이름이고, 이름의 어원은 \"인간의/인류의(anthropic)\"입니다. 정보이론의 entropy와는 다른 단어예요.)\n\n---\n\n## 2. 하루 30분 루틴\n\n매일 같은 순서로 진행합니다. 시간은 대략적인 기준이에요.\n\n| 단계 | 시간 | 하는 일 |\n|---|---|---|\n| ① 목표 확인 | 1분 | 오늘 끝나면 무엇을 할 수 있어야 하는지 읽기 |\n| ② 개념 + 직관 | 8분 | 설명을 읽으며 **손으로 그림 그리기** |\n| ③ 예제 따라하기 | 6분 | 계산 예제를 종이에 직접 다시 풀기 (답 보지 말고) |\n| ④ 능동 연습 | 10분 | 손계산 문제 + 짧은 numpy 코드 실행·수정 |\n| ⑤ 셀프 체크 | 4분 | 퀴즈 풀고 맨 아래 정답 확인 |\n| ⑥ 한 줄 정리 | 1분 | \"오늘 배운 것을 논문의 어느 부분에서 쓰는가\"를 학습노트에 한 줄 |\n\n**규칙 세 가지**\n- 정답은 항상 파일 맨 아래 `<details>` 안에 숨어 있습니다. **먼저 풀고 열어 보세요.**\n- 코드는 복사-붙여넣기보다 **직접 타이핑**하세요. 숫자를 바꿔 보는 것이 진짜 공부입니다.\n- 막히면 10분 넘게 붙잡지 말고 표시해 두고 넘어가세요. 다음 날 처음 5분에 다시 봅니다.\n\n**준비물:** 노트, 펜, Python 3 + numpy (`pip install numpy`). Google Colab을 써도 됩니다.\n\n---\n\n## 3. 전체 일정 (4주, 20회)\n\n### 1주차: 논문을 읽기 위한 언어 (선형대수 + 확률)\n| 일차 | 주제 | 논문 연결 |\n|---|---|---|\n| [Day 01](#day01) | 논문 지도 그리기 + 벡터와 내적 | 단어 임베딩 (2장) |\n| [Day 02](#day02) | 행렬곱 = 신경망의 층, shape 읽기 | LSTM 계산, 160,000×1000 임베딩 (3.4절) |\n| [Day 03](#day03) | 확률, 조건부확률, 연쇄법칙 | 식 (1) (2장) |\n| [Day 04](#day04) | 베이즈 정리 | 번역을 확률로 보는 관점, argmax 디코딩 (3.2절) |\n| [Day 05](#day05) | 소프트맥스와 로그 | 출력층: 80,000개 단어 위 확률분포 (2장) |\n\n### 2주차: 모델은 어떻게 배우는가 (정보이론 + 학습)\n| 일차 | 주제 | 논문 연결 |\n|---|---|---|\n| [Day 06](#day06) | 정보량과 엔트로피 | \"불확실성\"의 수치화 |\n| [Day 07](#day07) | 크로스엔트로피, KL 발산 | 학습 목표: 로그 확률 최대화 (3.2절) |\n| [Day 08](#day08) | Perplexity, 경사하강 | 역순 입력으로 perplexity 5.8→4.7 (3.3절) |\n| [Day 09](#day09) | 중심극한정리 | ±0.08 초기화, 배치 128 (3.4절) |\n| [Day 10](#day10) | RNN 한 스텝 손계산 + teacher forcing | 디코더 학습 방식 (2장, 3.4절) |\n\n### 3주차: 논문의 모델 해부\n| 일차 | 오늘 배울 수학 | 논문에서 쓰이는 곳 |\n|---|---|---|\n| [Day 11](#day11) | LSTM 게이트 (시그모이드 밸브, 기억 더하기) | 4층 LSTM (1장, 3.4절) |\n| [Day 12](#day12) | 입력 뒤집기, 빔 서치 | 3.2절, 3.3절, 표 1 |\n| [Day 13](#day13) | BLEU 점수 (n-gram 정밀도, 기하평균) | BLEU 34.81 대 33.30 (3.6절) |\n\n기울기 자르기와 미니 프로젝트는 3단계 \"신경망 학습의 기초\"에서 이어집니다.\n\n---|---|\n| Day 11 | Teacher forcing 심화: exposure bias, scheduled sampling |\n| Day 12 | 기울기 소실과 LSTM의 게이트 (시그모이드, 원소별 곱) |\n| Day 13 | 인코더-디코더와 고정 길이 벡터 v |\n| Day 14 | 입력 문장 뒤집기 트릭은 왜 통했나 |\n| Day 15 | 빔 서치 (beam search) 손으로 해보기 |\n\n### 4주차: 논문 정독과 미니 구현\n| 일차 | 주제 |\n|---|---|\n| Day 16 | Gradient clipping (노름 5) + 벡터 노름 복습 |\n| Day 17 | BLEU 점수 계산해 보기 |\n| Day 18 | 논문 1~3장 정독 (지금까지 배운 것으로 읽기) |\n| Day 19 | 미니 프로젝트: \"숫자열 뒤집기\" seq2seq 만들기 |\n| Day 20 | 논문 4~5장 + 회고, 다음 논문(Attention) 예고 |\n\n---\n\n## 4. 기호 읽는 법\n\n수식이 나오면 이 표로 돌아오세요. 기호는 긴 말을 줄여 쓴 약속일 뿐입니다.\n\n| 기호 | 읽는 법 | 뜻 | 처음 나오는 날 |\n|---|---|---|---|\n| $\\sum$ | 시그마 | 전부 더한다. $\\sum_i a_i$ 는 a₁ + a₂ + ... | 준비 5 |\n| $\\lVert a \\rVert$ | a의 노름 | 벡터 a의 길이. ‖ 두 줄은 Day 07의 KL 발산 $D_{KL}(p\\,\\|\\,q)$에서는 \"p와 q를 비교한다\"는 칸막이로 쓰여 뜻이 다릅니다 | Day 01 |\n| $\\prod$ | 파이 | 전부 곱한다. $\\prod_t p_t$ 는 p₁ × p₂ × ... | 준비 5 |\n| $P(A \\mid B)$ | B일 때 A의 확률 | 세로줄 뒤가 이미 알고 있는 조건 | Day 03 |\n| $\\propto$ | 비례한다 | 상수배만큼만 다르다 | Day 04 |\n| $\\arg\\max$ | 아그맥스 | 가장 큰 점수를 받은 후보 (점수 자체가 아님) | Day 04 |\n| $\\hat{T}$ | T 햇 | 모델이 고른(추정한) T | Day 04 |\n| $\\exp(x)$, $e^x$ | e의 x제곱 | 같은 것을 쓰는 두 가지 방법. e ≈ 2.718 | 준비 2 |\n| $\\log$, $\\ln$ | 로그 | 이 교재에서 log는 자연로그 ln. 비트를 셀 때만 log₂ | 준비 4 |\n| $\\partial$ | 라운드 | 한 변수만 살짝 움직였을 때의 기울기 | 1단계 기울기 레슨 |\n| $\\mathcal{N}(\\mu, \\sigma^2)$ | 정규분포 | 평균 μ, 표준편차 σ인 종 모양 분포. 괄호 둘째 칸은 σ가 아니라 **분산** σ² | Day 09 |\n\n## 4-1. 논문 핵심 사실 카드 (계속 참조하세요)\n\n- 과제: WMT'14 영어 → 프랑스어 번역\n- 모델: 4층 LSTM, 층마다 1000개 셀, 단어 임베딩 1000차원\n- 어휘: 입력 160,000단어, 출력 80,000단어 (나머지는 `UNK`)\n- 초기화: 모든 파라미터를 균등분포 U(−0.08, 0.08)에서 뽑음\n- 학습: 모멘텀 없는 SGD, 학습률 0.7, 배치 128, 그래디언트 노름이 5를 넘으면 잘라냄\n- 핵심 트릭: **입력 문장의 단어 순서를 뒤집어서** 넣으면 성능이 크게 오름\n- 결과: LSTM 5개 앙상블 + 빔 서치로 BLEU 34.8 (통계 기반 기계번역 기준선 33.3)\n\n(각 수치는 해당 날짜에 논문 원문과 함께 다시 확인합니다.)\n\n---\n\n## 5. 학습 노트 양식 (매일 복사해서 쓰세요)\n\n```\n[Day __] 날짜: ____\n오늘의 핵심 한 문장:\n논문의 어디에 쓰이나:\n헷갈렸던 것 / 내일 다시 볼 것:\n스스로 매긴 이해도 (1~5):\n```\n", "link": ""}, {"id": "cm01", "short": "혼동 행렬, 정밀도, 재현율: 정확도 99%의 함정", "md": "# 4단계. 혼동 행렬, 정밀도, 재현율: 정확도 99%의 함정\n\n30분 · 논문 연결: 거의 모든 분류 논문의 결과 표에 나오는 Precision, Recall, F1. 오늘이 지나면 그 표를 읽을 수 있습니다 (Goodfellow 외 2016, 11.1절)\n\n---\n\n## 오늘의 목표\n1. 예측 결과를 2×2 혼동 행렬(TP, FP, FN, TN)로 정리할 수 있다.\n2. 정확도, 정밀도, 재현율, F1을 손으로 계산하고, 정밀도와 재현율을 분모로 구별한다.\n3. \"정확도 99%인데 쓸모없는 모델\"이 왜 생기는지 설명할 수 있다.\n\n**복습 (1분):** 로지스틱 회귀가 어떤 메일에 \"스팸일 확률 0.8\"을 냈습니다. 기준 0.5로 판정하면? (답: 스팸. [로지스틱 회귀](#logi01))\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 정확도만 보면 속는다\n환자 100명 중 실제 암 환자는 5명입니다. 아무것도 배우지 않고 **무조건 \"정상\"이라고 말하는** 모델을 만들었습니다.\n\n- 맞힌 사람: 정상 95명 → 정확도 **95%**\n- 찾아낸 암 환자: **0명**\n\n점수는 높은데 병원에서는 쓸모가 없습니다. 한쪽이 훨씬 많은 **불균형 데이터**에서는 정확도가 거짓말을 합니다. 그래서 맞히고 틀린 것을 **종류별로** 나눠 셉니다.\n\n### 1-2. 화재경보기로 보는 네 칸\n오늘은 비유를 하나만 씁니다. **화재경보기**입니다. 찾고 싶은 것(불, 암, 스팸)을 **양성**, 아닌 것을 **음성**이라고 부릅니다.\n\n| | 경보기가 울림 (양성 예측) | 경보기가 조용 (음성 예측) |\n|---|---|---|\n| **진짜 불** (실제 양성) | **TP** 불을 잡음 | **FN** 불을 놓침 |\n| **불 아님** (실제 음성) | **FP** 괜히 울림 | **TN** 조용히 잘 있음 |\n\n이 2×2 표가 **혼동 행렬**입니다. 모델이 무엇을 무엇으로 \"혼동\"했는지 보여 줍니다. 약자 읽는 법: 뒤 글자는 **모델의 말**(P = 양성이라고 함, N = 음성이라고 함), 앞 글자는 **그 말이 맞았나**(T = 맞음, F = 틀림)입니다. FP는 \"양성이라고 했는데 틀림\" = 괜히 울림.\n\n### 1-3. 정밀도: \"울렸을 때 진짜 불이었나\"\n$$\\text{정밀도} = \\frac{TP}{TP + FP}$$\n\n분모는 **내가 양성이라고 외친 것 전부**입니다. 경보기가 울린 횟수 중 진짜 불이었던 비율. 정밀도가 낮으면 \"또 토스트 때문이겠지\" 하고 아무도 경보를 믿지 않습니다. ([BLEU](#day13)의 정밀도도 \"내가 쓴 것 중 맞은 비율\"로 같은 생각이었습니다.)\n\n### 1-4. 재현율: \"진짜 불을 몇 번 잡았나\"\n$$\\text{재현율} = \\frac{TP}{TP + FN}$$\n\n분모는 **진짜 양성 전부**입니다. 실제로 난 불 중에 경보기가 잡아낸 비율. 재현율이 낮으면 불이 나도 조용합니다. 1-1의 \"무조건 정상\" 모델은 재현율이 0입니다.\n\n> 외우는 법: 분자는 둘 다 TP. **분모만** 다릅니다. 정밀도는 \"**내가 외친 것** 중\", 재현율은 \"**진짜인 것** 중\".\n\n### 1-5. 둘은 시소를 탄다\n경보기를 **예민하게** 만들면(토스트 연기에도 울리게) 불은 거의 다 잡지만 괜히 울리는 일이 늘어납니다. 재현율↑, 정밀도↓. **둔하게** 만들면 반대입니다. 어느 쪽을 중시할지는 상황이 정합니다.\n\n- **암 검진:** 놓치면 큰일 → 재현율 중시 (괜한 재검사는 참을 만함)\n- **스팸 필터:** 중요한 메일을 스팸함에 넣으면 큰일 → 정밀도 중시\n\n### 1-6. F1: 약한 쪽 편을 드는 평균\n두 숫자를 하나로 합치고 싶을 때 F1을 씁니다. 그냥 평균이 아니라 **조화평균**입니다.\n\n$$F1 = \\frac{2 \\times \\text{정밀도} \\times \\text{재현율}}{\\text{정밀도} + \\text{재현율}}$$\n\n정밀도 1.0, 재현율 0.1인 경보기(울리면 확실히 불이지만 열 번에 한 번만 울림)를 봅시다.\n\n- 그냥 평균: (1.0 + 0.1) ÷ 2 = **0.55** (괜찮아 보임)\n- F1: 2 × 1.0 × 0.1 ÷ 1.1 ≈ **0.18** (형편없음)\n\nF1은 둘 중 **약한 쪽에 끌려갑니다.** 하나가 0이면 F1도 0입니다. 그래서 한쪽만 잘하는 꼼수 모델을 걸러 냅니다.\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n환자 20명(실제 환자 12명, 건강한 사람 8명)을 모델이 분류했습니다.\n\n| | 양성 예측 | 음성 예측 | 합 |\n|---|---|---|---|\n| 실제 환자 | TP = 8 | FN = 4 | 12 |\n| 실제 건강 | FP = 2 | TN = 6 | 8 |\n\n1. 정확도: (8 + 6) ÷ 20 = **0.7**\n2. 정밀도: 양성이라고 한 사람은 8 + 2 = 10명, 그중 진짜 환자 8명 → 8 ÷ 10 = **0.8**\n3. 재현율: 진짜 환자 12명 중 찾은 사람 8명 → 8 ÷ 12 ≈ **0.67**\n4. F1: 2 × 0.8 × 0.67 ÷ (0.8 + 0.67) ≈ **0.73**\n\n계산은 언제나 같은 순서입니다. **분모가 어느 줄(가로 = 실제)인지, 어느 칸(세로 = 예측)인지**부터 정하세요. 정밀도는 세로 칸 \"양성 예측\", 재현율은 가로 줄 \"실제 환자\"입니다.\n\n---\n\n## 직접 만져보기\n\n<div class=\"widget\" data-w=\"cm01\"><\/div>\n\n## 3. 능동 연습 (10분)\n\n아래 실습 위젯에서 환자 카드를 눌러 판정을 바꿔 보세요. 2×2 표와 네 지표가 바로 다시 계산됩니다. \"모두 음성\"을 누르면 정확도의 함정이 보이고, 아래쪽 상황 카드에서는 어느 지표를 중시할지 고를 수 있습니다.\n\n### 손계산\n1. 메일 1,000통 중 스팸 10통. 모든 메일을 \"정상\"이라고 하는 필터의 정확도와 재현율은?\n2. TP 9, FP 1, FN 3, TN 7. 정밀도는?\n3. 2번 표의 재현율은?\n4. 2번 표의 정확도는?\n5. 정밀도 0.5, 재현율 0.5일 때 F1은? 그냥 평균과 비교하면?\n6. 정밀도 0.9, 재현율 0.3일 때 F1은? (2 × 0.9 × 0.3 = 0.54)\n7. 경보기를 더 예민하게 바꿨더니 FN이 4에서 1로 줄고 FP가 2에서 6으로 늘었습니다(TP 8 → 11). 재현율과 정밀도는 각각 오르나요, 내리나요?\n\n### 미니 챌린지\n공장 불량품 검사, 유튜브 추천, 사기 거래 탐지. 각각 정밀도와 재현율 중 무엇을 더 중시해야 할까요? 정답은 하나가 아닙니다. \"무엇을 놓치면 / 무엇을 괜히 잡으면 손해인가\"로 이유를 말해 보세요.\n\n### 코드 (선택)\n```python\nfrom sklearn.metrics import confusion_matrix, precision_score, recall_score, f1_score\ny_true = [1]*12 + [0]*8                        # 실제: 환자 12, 건강 8\ny_pred = [1]*8 + [0]*4 + [1]*2 + [0]*6         # 예측\nprint(confusion_matrix(y_true, y_pred))        # [[6 2]\n                                               #  [4 8]]  ← 줄 순서가 음성(0) 먼저!\nprint(precision_score(y_true, y_pred),         # 0.8\n      recall_score(y_true, y_pred),            # 0.666...\n      f1_score(y_true, y_pred))                # 0.727...\n```\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n1. 정밀도와 재현율의 분모는 각각 무엇인가요?\n2. O/X: 정확도가 높으면 재현율도 높다.\n3. F1이 그냥 평균 대신 조화평균을 쓰는 이유는?\n4. 화재경보기를 예민하게 만들면 정밀도와 재현율은 어떻게 변하나요?\n\n---\n\n## 한 줄 정리\n혼동 행렬의 네 칸으로 정밀도(\"외친 것 중 진짜\", TP ÷ (TP + FP))와 재현율(\"진짜 중 잡은 것\", TP ÷ (TP + FN))을 구하고, 불균형 데이터에서는 정확도 대신 이 둘과 F1을 본다.\n\n---\n\n<details>\n<summary>정답 보기 (먼저 풀고 열기!)<\/summary>\n\n**손계산**\n1. 정확도 990 ÷ 1,000 = **99%**, 재현율 0 ÷ 10 = **0**\n2. 9 ÷ (9 + 1) = **0.9**\n3. 9 ÷ (9 + 3) = **0.75**\n4. (9 + 7) ÷ 20 = **0.8**\n5. 2 × 0.25 ÷ 1.0 = **0.5**. 둘이 같으면 그냥 평균과 같습니다\n6. 0.54 ÷ 1.2 = **0.45** (그냥 평균 0.6보다 낮음)\n7. 재현율 8/12 ≈ 0.67 → 11/12 ≈ 0.92로 **오름**. 정밀도 8/10 = 0.8 → 11/17 ≈ 0.65로 **내림**\n\n**미니 챌린지 (예시)**\n불량품 검사: 불량을 놓치면 고객 손에 들어가니 **재현율**. 유튜브 추천: 엉뚱한 영상을 띄우면 사용자가 떠나고, 좋은 영상 몇 개를 빠뜨려도 큰 손해는 없으니 **정밀도**. 사기 탐지: 놓치면 돈을 잃지만 정상 거래를 너무 막으면 고객이 화를 냅니다. 보통 **재현율**을 높이되 정밀도가 너무 떨어지지 않게 F1이나 비용으로 균형을 봅니다.\n\n**퀴즈**\n1. 정밀도는 양성이라고 예측한 것 전부(TP + FP), 재현율은 실제 양성 전부(TP + FN)\n2. X. \"무조건 음성\" 모델은 정확도 99%여도 재현율이 0입니다.\n3. 약한 쪽에 끌려가서, 한쪽만 높은 모델이 좋은 점수를 받지 못하게 하려고요.\n4. 재현율은 오르고 정밀도는 내립니다.\n<\/details>\n", "link": "논문 연결: 거의 모든 분류 논문의 결과 표에 나오는 Precision, Recall, F1. 오늘이 지나면 그 표를 읽을 수 있습니다 (", "lesson": true}, {"id": "logi01", "short": "로지스틱 회귀: 직선에서 확률로", "md": "# 4단계. 로지스틱 회귀: 직선에서 확률로\n\n30분 · 논문 연결: Cox (1958) \"The Regression Analysis of Binary Sequences\". 직선 점수를 시그모이드로 눌러 \"예일 확률\"을 만드는 가장 오래된 분류기\n\n---\n\n## 오늘의 목표\n1. 점수 z = wx + b를 시그모이드에 넣어 \"합격할 확률\"을 계산하고, 0.5를 기준으로 예/아니오를 가를 수 있다.\n2. 확률이 정확히 0.5가 되는 지점(결정 경계)을 w와 b로 구할 수 있다.\n3. 이진 크로스엔트로피로 \"얼마나 틀렸나\"를 손으로 계산할 수 있다.\n\n**복습 (1분):** 시그모이드 σ(0)은? σ(2)는? (답: 0.5, 약 0.88. [함수와 그래프](#prep06))\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 숫자 맞히기와 예/아니오 맞히기\n[PyTorch로 첫 모델](#pt01)에서는 x를 넣으면 **숫자**(y = 2x + 1)를 내는 모델을 만들었습니다. 이런 일을 **회귀**라고 부릅니다. 집값, 기온처럼 답이 숫자인 문제입니다.\n\n그런데 세상의 질문은 **예/아니오**가 많습니다. 이 메일은 스팸인가? 이 사진에 고양이가 있나? 이 학생은 합격할까? 답을 몇 개의 칸 중 하나로 고르는 일을 **분류**라고 합니다. 칸이 2개면 **이진 분류**입니다.\n\n예/아니오를 컴퓨터에 알려 줄 때는 **정답 y**를 1(예, 합격)과 0(아니오, 불합격)으로 적습니다.\n\n### 1-2. 직선 점수를 확률로 누르기\n오늘의 예: 공부 시간 x(시간)로 합격을 맞힙니다. 먼저 [층 하나](#day02)처럼 점수를 냅니다.\n\n$$z = wx + b$$\n\nz는 [소프트맥스에서 본 logit](#day05)처럼 아무 실수나 될 수 있습니다. −3일 수도, 10일 수도 있죠. 확률로 쓰려면 0과 1 사이로 눌러야 합니다. 이때 쓰는 것이 **시그모이드** σ입니다.\n\n$$p = \\sigma(wx + b)$$\n\n**p**는 \"합격(y = 1)일 확률\"입니다. 오늘 쓸 값입니다.\n\n| z | −2 | −1 | 0 | 1 | 2 |\n|---|---|---|---|---|---|\n| σ(z) | 0.12 | 0.27 | **0.5** | 0.73 | 0.88 |\n\n공부 시간이 늘수록 합격 확률이 **S자**로 올라갑니다. 처음엔 거의 0이다가, 어느 구간에서 쑥 오르고, 나중엔 1에 가까워져 더는 크게 오르지 않습니다.\n\n**판정:** p가 0.5 이상이면 \"합격\", 아니면 \"불합격\"이라고 답합니다. (0.5가 늘 정답은 아닙니다. 놓치면 큰일인 문제에서는 기준을 낮추기도 하는데, 이 이야기는 [혼동 행렬](#cm01)과 그다음 챕터에서 합니다.)\n\n> 이름에 \"회귀\"가 붙은 이유: 이 모델이 직접 배우는 것은 **확률이라는 숫자**입니다. 확률을 숫자로 맞히는 회귀를 하고, 마지막에 0.5로 잘라 분류에 씁니다. 1958년 Cox가 이 방법을 정리할 때부터 이 이름이었습니다.\n\n### 1-3. 결정 경계: 커트라인은 어디?\np = 0.5가 되는 곳은 σ(z) = 0.5, 즉 **z = 0**인 곳입니다. wx + b = 0을 풀면\n\n$$x = -\\frac{b}{w}$$\n\nw = 1, b = −4라면 x = 4시간. 4시간보다 많이 공부한 학생은 \"합격\", 적게 한 학생은 \"불합격\"으로 판정됩니다. 이 경계가 **결정 경계**입니다. 합격 커트라인과 같습니다.\n\n- **w**는 S자의 **가파른 정도**입니다. w가 크면 커트라인 근처에서 확률이 확 뛰고, 작으면 완만하게 오릅니다.\n- **b**는 S자를 **옆으로 미는** 역할입니다. w = 1일 때 b를 −4에서 −6으로 바꾸면 커트라인이 4시간에서 6시간으로 밀립니다.\n\n### 1-4. 이진 크로스엔트로피: 얼마나 틀렸나 (새 개념)\n모델이 p를 냈고 정답이 y입니다. 벌점(손실)을 이렇게 매깁니다.\n\n$$L = -\\big[\\,y \\ln p + (1-y)\\ln(1-p)\\,\\big]$$\n\n겁낼 필요 없습니다. y는 0 아니면 1이라서, 대괄호 속 두 항 중 **하나는 항상 0**이 됩니다.\n\n- 정답이 합격(y = 1)이면: $L = -\\ln p$. \"합격\"에 준 확률이 작을수록 벌점이 큽니다\n- 정답이 불합격(y = 0)이면: $L = -\\ln(1-p)$. \"불합격\"에 준 확률 1 − p가 작을수록 벌점이 큽니다\n\n즉 **정답 쪽에 준 확률 q를 찾아서 −ln q**를 하면 됩니다. 칸이 \"합격/불합격\" 2개뿐인 크로스엔트로피라서 **이진**(binary) 크로스엔트로피라고 부릅니다. 줄여서 BCE. [크로스엔트로피](#day07)에서 본 \"−ln(정답에 준 확률)\"과 같은 생각인데, 확률이 시그모이드 하나에서 p와 1 − p로 나온다는 점이 새롭습니다.\n\n| 정답 쪽 확률 q | 0.88 | 0.73 | 0.5 | 0.27 | 0.12 |\n|---|---|---|---|---|---|\n| 벌점 −ln q | 0.13 | 0.31 | 0.69 | 1.31 | 2.13 |\n\n**틀렸는데 자신만만했을수록** 벌점이 크게 뜁니다. 합격할 학생에게 0.12를 주면 2.13, 0.27을 주면 1.31입니다. 학습은 데이터 전체의 **평균 벌점**을 [경사하강](#day08)으로 줄여 w와 b를 찾습니다.\n\n> (선택) 놀랍게 간단한 기울기: 이 손실을 z로 미분하면 **p − y**가 나옵니다. 합격(y = 1)인데 p = 0.73이라면 −0.27, \"조금 더 올려라\"는 신호입니다. 소프트맥스와 크로스엔트로피를 함께 썼을 때의 기울기 \"q − 정답 원-핫\"([경사하강](#day08))과 같은 모양입니다.\n\n> (선택) 로그 오즈: 확률 p를 \"안 될 확률 대비 될 확률\" p/(1 − p)로 바꾼 것을 **오즈**라고 합니다. 로지스틱 회귀는 사실 $\\ln\\frac{p}{1-p} = wx + b$, 즉 **로그 오즈를 직선으로 맞히는 회귀**입니다. 예: p = 0.73이면 오즈는 0.73 ÷ 0.27 ≈ 2.7, ln 2.7 ≈ 1 = z.\n\n### 1-5. 신경망으로 보면\n로지스틱 회귀는 **뉴런 하나짜리 신경망**입니다. 입력에 가중치를 곱하고 편향을 더한 뒤 시그모이드를 씌운 것. 큰 신경망의 마지막 층이 예/아니오를 낼 때도 똑같이 \"시그모이드 + 이진 크로스엔트로피\"를 씁니다. 나중에 11단계 \"RLHF와 DPO\"에서 보상 모델이 \"A가 B보다 나은가\"를 배울 때 쓰는 식 −ln σ(r_A − r_B)도 오늘의 식과 같습니다.\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n모델: w = 1, b = −4. 학생 4명입니다.\n\n| 학생 | 공부 시간 x | 실제 결과 y |\n|---|---|---|\n| 가 | 2 | 불합격 (0) |\n| 나 | 3 | 합격 (1) |\n| 다 | 5 | 합격 (1) |\n| 라 | 6 | 합격 (1) |\n\n1. **점수 z = x − 4:** 가 −2, 나 −1, 다 1, 라 2\n2. **확률 p = σ(z):** 가 0.12, 나 0.27, 다 0.73, 라 0.88\n3. **판정 (0.5 기준):** 가 불합격 ✓, 나 불합격 (실제 합격), 다 합격 ✓, 라 합격 ✓ → **4명 중 3명** 맞힘\n4. **정답 쪽 확률 q:** 가는 불합격이 정답이라 1 − 0.12 = 0.88, 나 0.27, 다 0.73, 라 0.88\n5. **벌점 −ln q:** 0.13, 1.31, 0.31, 0.13\n6. **평균 손실:** (0.13 + 1.31 + 0.31 + 0.13) ÷ 4 = 1.88 ÷ 4 = **0.47**\n\n벌점의 대부분(1.31)이 틀린 학생 \"나\"에게서 나왔습니다. 경사하강은 이 벌점을 줄이려고 커트라인을 3시간 쪽으로 조금 당깁니다.\n\n---\n\n## 직접 만져보기\n\n<div class=\"widget\" data-w=\"logi01\"><\/div>\n\n## 3. 능동 연습 (10분)\n\n쓸 값: σ(−2) = 0.12, σ(−1) = 0.27, σ(0) = 0.5, σ(1) = 0.73, σ(2) = 0.88 / −ln 0.88 ≈ 0.13, −ln 0.73 ≈ 0.31, −ln 0.5 ≈ 0.69, −ln 0.27 ≈ 1.31, −ln 0.12 ≈ 2.13\n\n아래 실습 위젯에서 w와 b 슬라이더로 S자 곡선을 움직여, 학생 8명 중 7명을 맞혀 보세요. 맞힌 개수와 평균 손실이 함께 바뀝니다.\n\n### 손계산\n1. w = 2, b = −6입니다. 공부 시간 4시간인 학생의 점수 z와 합격 확률 p는?\n2. 1번 모델의 결정 경계(커트라인)는 몇 시간인가요?\n3. w = 1, b = −5라면 커트라인은? b = −4일 때와 비교해 어느 쪽으로 움직였나요?\n4. 실제로 합격한 학생에게 모델이 p = 0.88을 줬습니다. 벌점은?\n5. 실제로 **불합격**한 학생에게 모델이 p = 0.88을 줬습니다. 벌점은?\n6. 학생 두 명의 벌점이 0.31과 0.69입니다. 평균 손실은?\n7. 모델이 모든 학생에게 p = 0.5를 준다면, 정답과 상관없이 학생 한 명의 벌점은?\n\n### 미니 챌린지\nw를 아주 크게(예: 100) 키우면 S자 곡선은 어떤 모양이 될까요? 이런 모델이 커트라인 바로 옆에서 틀리면 벌점은 어떻게 될까요?\n\n### 코드 (선택)\n```python\nimport numpy as np\ndef sigmoid(z):\n    return 1 / (1 + np.exp(-z))\n\nx = np.array([2, 3, 5, 6])          # 공부 시간\ny = np.array([0, 1, 1, 1])          # 실제 결과\nw, b = 1.0, -4.0\np = sigmoid(w * x + b)\nprint(p.round(2))                   # [0.12 0.27 0.73 0.88]\nloss = -(y * np.log(p) + (1 - y) * np.log(1 - p))\nprint(loss.round(2), loss.mean().round(2))   # [0.13 1.31 0.31 0.13] 0.47\nprint((p >= 0.5).astype(int))       # [0 0 1 1]  판정\n```\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n1. 회귀와 분류의 차이는?\n2. 로지스틱 회귀에서 시그모이드는 무슨 일을 하나요?\n3. O/X: 로지스틱 회귀는 이름에 \"회귀\"가 있으니 집값 같은 숫자를 예측하는 모델이다.\n4. 정답 쪽에 준 확률이 0.12일 때와 0.88일 때, 어느 쪽 벌점이 더 큰가요? 왜 그렇게 설계했을까요?\n\n---\n\n## 한 줄 정리\n로지스틱 회귀는 직선 점수 wx + b를 시그모이드로 눌러 \"예일 확률\"을 만들고, 정답 쪽 확률의 −ln(이진 크로스엔트로피)을 줄이며 배운다. 확률 0.5가 되는 x = −b/w가 결정 경계다.\n\n---\n\n<details>\n<summary>정답 보기 (먼저 풀고 열기!)<\/summary>\n\n**손계산**\n1. z = 2 × 4 − 6 = **2**, p = σ(2) = **0.88**\n2. 2x − 6 = 0 → x = **3시간** (= −b/w = 6/2)\n3. x = 5/1 = **5시간**. 4시간에서 5시간으로, **오른쪽으로** 밀렸습니다 (합격이 더 어려워짐)\n4. 정답 쪽 확률 0.88 → −ln 0.88 ≈ **0.13**\n5. 정답 쪽(불합격) 확률은 1 − 0.88 = 0.12 → −ln 0.12 ≈ **2.13**. 자신 있게 틀려서 크게 혼납니다\n6. (0.31 + 0.69) ÷ 2 = **0.5**\n7. 정답 쪽 확률이 늘 0.5 → −ln 0.5 ≈ **0.69**. \"아무것도 모르는 모델\"의 기준 점수로 기억해 두면 좋습니다\n\n**미니 챌린지**\n곡선이 커트라인에서 0에서 1로 **수직으로 뚝 떨어지는 계단**처럼 됩니다. 확률이 거의 0 아니면 1이라, 커트라인 바로 옆에서 틀리면 정답 쪽 확률이 0에 가까워져 벌점이 **아주 커집니다**. 그래서 경사하강은 데이터가 섞여 있는 곳에서는 w를 무작정 키우지 않습니다.\n\n**퀴즈**\n1. 회귀는 숫자를 맞히고(집값, 기온), 분류는 정해진 칸 중 하나를 고릅니다(스팸/정상).\n2. 아무 실수나 되는 점수 z를 0과 1 사이의 확률로 눌러 줍니다.\n3. X. 확률을 회귀로 맞힌 뒤 0.5로 잘라 **분류**에 쓰는 모델입니다.\n4. 0.12일 때(2.13)가 0.88일 때(0.13)보다 훨씬 큽니다. 틀린 답에 자신만만한 모델을 가장 세게 고치려고요.\n<\/details>\n", "link": "논문 연결: Cox (1958) . 직선 점수를 시그모이드로 눌러 을 만드는 가장 오래된 분류기", "lesson": true}, {"id": "of01", "short": "과적합과 과소적합: 외운 모델, 덜 배운 모델", "md": "# 4단계. 과적합과 과소적합: 외운 모델, 덜 배운 모델\n\n30분 · 논문 연결: Goodfellow 외 (2016) 『Deep Learning』 5.2절 \"Capacity, Overfitting and Underfitting\"(용량, 과적합, 과소적합). 모든 모델 평가의 출발점이 되는 두 가지 실패\n\n---\n\n## 오늘의 목표\n1. 훈련 손실과 검증 손실 두 숫자로 \"덜 배웠다(과소적합) / 외웠다(과적합) / 딱 좋다\"를 진단할 수 있다.\n2. 모델이 복잡해질수록(용량이 클수록) 두 손실이 어떻게 변하는지 그림으로 설명할 수 있다.\n3. 편향-분산 트레이드오프를 과녁 그림으로 설명하고, 여기서 \"편향\"이 day02의 b와 다른 뜻임을 안다.\n\n**복습 (1분):** 하이퍼파라미터는 어느 데이터의 점수로 고르나요? (답: 검증 세트. [훈련·검증·테스트](#split01))\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 실패는 두 가지\n기출문제집으로 공부하는 두 학생을 떠올려 봅시다.\n\n- **덜 배운 학생:** 공부를 대충 해서 기출문제도 60점, 새 문제도 60점\n- **외운 학생:** 기출문제의 답을 **번호째 외웠습니다**. 기출문제는 100점, 그런데 숫자만 바꾼 새 문제는 40점\n\n첫째가 **과소적합**, 둘째가 **과적합**입니다. 모델도 똑같습니다. 과소적합은 데이터의 규칙을 다 담지 못한 상태, 과적합은 규칙뿐 아니라 **우연한 잡음까지 외운** 상태입니다. 우리가 원하는 것은 규칙만 배워 새 문제도 잘 푸는 **일반화**입니다.\n\n### 1-2. 모델의 용량: 얼마나 구불구불할 수 있나\n점 10개에 곡선을 맞춘다고 합시다. 쓸 수 있는 곡선의 종류가 모델의 **용량**(복잡도)입니다.\n\n- **1차식** (직선, a + bx): 아무리 해도 휘지 못함\n- **3차식** (x, x², x³까지 섞음): 한두 번 휠 수 있음\n- **9차식** (x⁹까지): 점 10개를 **모두 정확히 지나는** 곡선도 만들 수 있음\n\n차수를 올릴수록 용량이 커집니다. 신경망에서는 층과 뉴런이 많을수록 용량이 큽니다.\n\n아래 실습 위젯의 점 10개(훈련 세트)와 그 사이의 다른 점 10개(검증 세트)로 잰 평균제곱 손실([pt01의 MSE](#pt01))입니다.\n\n| 차수 | 훈련 손실 | 검증 손실 | 진단 |\n|---|---|---|---|\n| 1 | 0.17 | 0.17 | 둘 다 높음 → **과소적합** |\n| 3 | 0.02 | 0.03 | 둘 다 낮고 가까움 → **딱 좋음** |\n| 9 | 0.00 | 1.10 | 훈련만 완벽, 검증은 폭망 → **과적합** |\n\n9차식은 훈련 점을 모두 지나지만, 점과 점 **사이**에서 크게 출렁여 처음 보는 점을 엉뚱하게 예측합니다.\n\n### 1-3. 진단표: 두 숫자를 같이 본다\n| 훈련 손실 | 검증 손실 | 상태 | 처방 |\n|---|---|---|---|\n| 높음 | 높음 (비슷) | 과소적합 | 용량 늘리기 (차수, 층), 더 오래 학습 |\n| 낮음 | **훨씬 높음** | 과적합 | 데이터 늘리기, 용량 줄이기, 규제 |\n| 낮음 | 낮음 (비슷) | 적당 | 테스트 세트로 마지막 확인 |\n\n핵심은 **두 손실의 차이**(검증 − 훈련)입니다. 크게 벌어지면 외우고 있다는 신호입니다. 훈련 손실만 보면 9차식이 최고로 보이니 꼭 둘을 같이 보세요.\n\n### 1-4. 학습 곡선: 시간에 따라 그리기\n같은 모델이라도 **오래 학습할수록** 훈련 데이터에 더 딱 맞춰집니다. 데이터 전체를 한 바퀴 다 보는 것을 **에폭**이라고 합니다([Adam과 학습률](#opt01)에서 본 그 단어). 에폭마다 두 손실을 찍은 그래프가 **학습 곡선**입니다.\n\n- **훈련 손실:** 거의 계속 내려갑니다\n- **검증 손실:** 처음엔 같이 내려가다가, 어느 순간부터 **다시 올라갑니다**. U자 모양\n\n검증 손실이 바닥을 찍고 오르기 시작하는 곳부터가 과적합입니다. 그 바닥에서 멈추는 방법은 다음 챕터 [규제](#reg01)에서 \"조기 중단\"으로 배웁니다.\n\n### 1-5. 편향-분산 트레이드오프: 과녁 그림\n같은 모델을 **다른 훈련 데이터**로 여러 번 학습시켰다고 상상해 봅시다. 결과를 과녁에 화살로 찍습니다. 과녁 한가운데가 정답입니다.\n\n- **편향**: 화살들의 **평균 위치**가 한가운데서 얼마나 비켜났나. 모델이 너무 단순해 늘 같은 쪽으로 틀리는 정도\n- **분산**: 화살들이 **얼마나 흩어졌나**. 훈련 데이터가 조금만 바뀌어도 결과가 출렁이는 정도. [기댓값과 분산](#ev01)의 분산과 **같은 뜻**입니다\n\n| 모델 | 편향 | 분산 | 상태 |\n|---|---|---|---|\n| 1차식 (너무 단순) | 큼 | 작음 | 과소적합 |\n| 9차식 (너무 복잡) | 작음 | 큼 | 과적합 |\n\n용량을 키우면 편향은 줄고 분산은 늘어납니다. 둘을 한꺼번에 0으로 만들 수 없어서 **트레이드오프**(주고받기)라고 부릅니다. 실제 오차는 대략 **편향² + 분산**(+ 어떤 모델도 없앨 수 없는 잡음)이라, 둘의 합이 가장 작은 중간 용량이 좋습니다.\n\n> **같은 글자, 다른 뜻: \"편향\"**\n> - [day02](#day02)의 **편향 b**: Wx + b의 b. 모델이 배우는 숫자 하나 (bias 항)\n> - [day10](#day10)의 **노출 편향**: 학습 땐 정답만 보다가 추론 땐 자기 예측을 봐서 생기는 불일치\n> - 오늘의 **편향**: 모델이 평균적으로 정답에서 비켜난 정도 (편향-분산의 편향)\n>\n> 영어로는 모두 bias지만 셋은 서로 관계가 없습니다. 문맥으로 구별하세요.\n\n> (선택) **이중 하강:** 아주 큰 신경망에서는 훈련 데이터를 완벽히 외우는 지점을 **훨씬 넘겨** 용량을 더 키우면 검증 손실이 **다시 내려가는** 현상이 관찰됩니다. U자 뒤에 두 번째 내리막이 붙어서 이중 하강(double descent)이라고 부릅니다 (Belkin 외 2019). 거대한 언어 모델이 과적합으로 무너지지 않는 이유와 이어지는 연구 주제로, 나중에 11단계 \"스케일링 법칙\"에서 다시 떠올리면 됩니다. 지금은 \"U자 그림에도 예외가 있다\"만 알아 두세요.\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n**① 학습 곡선 읽기.** 에폭별 손실입니다.\n\n| 에폭 | 1 | 2 | 3 | 4 | 5 | 6 |\n|---|---|---|---|---|---|---|\n| 훈련 손실 | 2.0 | 1.2 | 0.8 | 0.5 | 0.3 | 0.2 |\n| 검증 손실 | 2.1 | 1.4 | 1.1 | 1.0 | 1.2 | 1.5 |\n\n1. 훈련 손실은 끝까지 내려갑니다\n2. 검증 손실은 에폭 **4**에서 가장 낮고(1.0), 5부터 올라갑니다 → 에폭 5부터 과적합\n3. 차이(검증 − 훈련): 에폭 4는 1.0 − 0.5 = **0.5**, 에폭 6은 1.5 − 0.2 = **1.3**. 점점 벌어집니다\n4. 고를 모델: 검증 손실이 가장 낮은 **에폭 4**의 모델\n\n**② 과녁 숫자로 편향과 분산.** 정답은 0입니다. 같은 모델을 훈련 데이터만 바꿔 4번 학습시킨 예측값입니다.\n\n- 모델 A: 3, 3, 3, 3 → 평균 **3** (편향 3), 모두 같은 곳이라 분산 **0**\n- 모델 B: −2, 2, −2, 2 → 평균 **0** (편향 0), 평균에서 모두 2씩 떨어져 분산 2² = **4**\n\n오차(정답에서 떨어진 거리의 제곱의 평균)는 A가 3² = 9, B가 2² = 4. 편향² + 분산으로도 A는 9 + 0 = **9**, B는 0 + 4 = **4**로 같습니다. A는 늘 같은 쪽으로 틀리는 단순한 모델, B는 맞을 듯 말 듯 흔들리는 복잡한 모델입니다.\n\n---\n\n## 직접 만져보기\n\n<div class=\"widget\" data-w=\"of01\"><\/div>\n\n## 3. 능동 연습 (10분)\n\n아래 실습 위젯에서 차수 다이얼(1~9)을 돌려 보세요. 곡선 모양과 훈련 손실·검증 손실 막대가 함께 바뀝니다. 검증 손실이 가장 낮은 차수를 찾으면 성공입니다.\n\n### 손계산\n1. 훈련 손실 0.9, 검증 손실 1.0인 모델은 어떤 상태일 가능성이 큰가요? (참고로 비슷한 문제에서 다른 모델들은 훈련 손실 0.2까지 내려갑니다)\n2. 훈련 손실 0.05, 검증 손실 0.80인 모델의 차이(검증 − 훈련)는? 어떤 상태인가요?\n3. 검증 손실이 에폭마다 1.5, 1.1, 0.9, 0.95, 1.2였습니다. 몇 번째 에폭에서 멈추는 게 좋을까요?\n4. 정답이 0일 때 예측값 1, 1, 1, 1의 편향과 분산은?\n5. 정답이 0일 때 예측값 −3, 3, −3, 3의 편향과 분산은? 편향² + 분산은?\n6. 과적합 상태인 모델에 도움이 되지 않는 것은? (가) 훈련 데이터 늘리기 (나) 차수를 9에서 3으로 줄이기 (다) 차수를 9에서 15로 늘리기\n\n### 미니 챌린지\n점이 10개뿐일 때는 9차식이 과적합했습니다. 같은 모양의 데이터를 1,000개 모은다면 9차식은 어떻게 될까요? 9차식이 점 1,000개를 모두 지날 수 있을지 생각해 보세요.\n\n### 코드 (선택)\n```python\nimport numpy as np\nx_tr = np.linspace(-1, 1, 10)\ny_tr = np.array([-0.16, -1.01, -0.9, -0.56, -0.46, 0.51, 0.56, 1.05, 0.71, 0.51])\nx_va = np.array([-0.9, -0.7, -0.5, -0.3, -0.1, 0.1, 0.3, 0.5, 0.7, 0.9])\ny_va = np.array([-0.66, -0.77, -1.19, -0.65, -0.08, 0.13, 0.85, 0.94, 1.12, 0.46])\n\nfor d in [1, 3, 9]:\n    c = np.polyfit(x_tr, y_tr, d)                       # 훈련 세트로 d차식 맞추기\n    tr = np.mean((np.polyval(c, x_tr) - y_tr) ** 2)     # 훈련 손실\n    va = np.mean((n
