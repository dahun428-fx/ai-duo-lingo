<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Seq2Seq 논문(2014)으로 선형대수·베이즈·엔트로피·중심극한정리·teacher forcing을 하루 30분씩 배우는 인터랙티브 교재">
<title>AI 듀오링고</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f131b" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI 듀오링고">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Jua&display=swap">
<style>
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: graph-paper lab notebook. Sticky top bar, left syllabus rail, centered reading column, right "이 문서에서" on wide screens. */
:root{
  --paper:#f5f7fb; --card:#ffffff; --ink:#18202e; --muted:#5a6578; --line:#d8dfea; --grid:rgba(35,70,200,.055);
  --accent:#2347d0; --accent-soft:#e6ecff; --mark:#ffe46b; --mark-ink:#18202e;
  --good:#16865a; --good-soft:#e3f5ec; --bad:#c23d27; --bad-soft:#fbe8e4; --warn:#a86a00;
  --code-bg:#0f1624; --code-fg:#dbe4f5; --code-kw:#8fb0ff; --code-str:#9fe0b0; --code-num:#ffc78a; --code-com:#7a879c;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --rail:264px; --col:720px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f131b; --card:#161c28; --ink:#e5eaf3; --muted:#9aa5b8; --line:#273145; --grid:rgba(130,160,255,.05);
  --accent:#86a0ff; --accent-soft:#1e2843; --mark:#e2c440; --mark-ink:#15130a;
  --good:#4cc38a; --good-soft:#15291f; --bad:#ff7d66; --bad-soft:#2f1915; --warn:#e5b04a;
  --code-bg:#0a0e16; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f131b; --card:#161c28; --ink:#e5eaf3; --muted:#9aa5b8; --line:#273145; --grid:rgba(130,160,255,.05);
  --accent:#86a0ff; --accent-soft:#1e2843; --mark:#e2c440; --mark-ink:#15130a;
  --good:#4cc38a; --good-soft:#15291f; --bad:#ff7d66; --bad-soft:#2f1915; --warn:#e5b04a;
  --code-bg:#0a0e16; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--card)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.skip{position:absolute;left:-999px}.skip:focus{left:16px;top:8px;z-index:99;background:var(--card);padding:4px 8px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;flex-direction:column;line-height:1.2;text-decoration:none;color:var(--ink);min-width:0}
.brand b{font-size:17px;letter-spacing:-.02em}
.brand span{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
.top .grow{flex:1}
.prog{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.prog .bar{width:120px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.iconbtn:hover{border-color:var(--accent)}
.menu-btn{display:none}

/* shell */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:calc(100vh - 60px)}
.rail{position:sticky;top:calc(61px + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - 61px);overflow:auto;
  border-right:1px solid var(--line);background:color-mix(in srgb,var(--card) 82%,transparent);padding:18px 14px 40px}
.rail h4{font-size:11px;letter-spacing:.12em;color:var(--muted);margin:18px 8px 6px;font-weight:600}
.rail a{display:flex;gap:10px;align-items:flex-start;padding:7px 8px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.4}
.rail a:hover{background:var(--accent-soft)}
.rail a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.rail .dn{font-family:var(--f-mono);font-size:11px;color:var(--muted);min-width:22px;padding-top:2px}
.rail .ck{margin-left:auto;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);flex:none;margin-top:2px}
.rail .ck.done{background:var(--good);border-color:var(--good);box-shadow:inset 0 0 0 3px var(--card)}
.rail a.soon{color:var(--muted)}

main{min-width:0;padding-block:32px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{display:grid;grid-template-columns:minmax(0,var(--col)) 200px;gap:48px;justify-content:center}
.toc{position:sticky;top:90px;align-self:start;font-size:13px;border-left:1px solid var(--line);padding-left:14px}
.toc b{display:block;font-size:11px;letter-spacing:.12em;color:var(--muted);margin-bottom:6px}
.toc a{display:block;color:var(--muted);text-decoration:none;padding:3px 0;line-height:1.4}
.toc a:hover{color:var(--accent)}

/* lesson typography */
.lesson{min-width:0}
.lesson h1{font-size:clamp(28px,4.4vw,40px);line-height:1.2;letter-spacing:-.03em;margin:4px 0 10px;text-wrap:balance}
.lesson h2{font-size:23px;letter-spacing:-.02em;margin:52px 0 12px;padding-top:14px;border-top:1px solid var(--line);text-wrap:balance}
.lesson h3{font-size:18px;margin:30px 0 8px}
.lesson p,.lesson li{max-width:68ch}
.lesson strong{font-weight:700}
.lesson hr{border:0;border-top:1px dashed var(--line);margin:36px 0}
.lesson blockquote{margin:18px 0;padding:12px 16px;border-radius:10px;background:var(--accent-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent)}
.lesson blockquote p{margin:4px 0}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
.meta{font-size:14px;color:var(--muted);border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;display:inline-block}
.tablewrap{overflow-x:auto;margin:14px 0}
table{border-collapse:collapse;font-size:14.5px;min-width:100%}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:600;background:color-mix(in srgb,var(--card) 60%,transparent)}
td{font-variant-numeric:tabular-nums}
code{font-family:var(--f-mono);font-size:.88em;background:var(--accent-soft);padding:1px 5px;border-radius:5px}
pre{position:relative;background:var(--code-bg);color:var(--code-fg);border-radius:12px;padding:16px 16px 14px;overflow-x:auto;font-size:13.5px;line-height:1.6;margin:14px 0}
pre code{background:none;padding:0;font-size:inherit;color:inherit}
pre .kw{color:var(--code-kw)}pre .st{color:var(--code-str)}pre .nu{color:var(--code-num)}pre .co{color:var(--code-com);font-style:italic}
pre .copy{position:absolute;top:8px;right:8px;font:12px var(--f-mono);background:rgba(255,255,255,.08);color:var(--code-fg);border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:3px 8px;cursor:pointer}
pre .lang{position:absolute;top:10px;right:72px;font:11px var(--f-mono);color:var(--code-com)}
math{font-size:1.06em}
math[display="block"]{display:block;overflow-x:auto;padding:10px 0;margin:6px 0}

details{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:4px 16px;margin:20px 0}
details summary{cursor:pointer;font-weight:600;padding:10px 0;color:var(--accent)}
details[open]{padding-bottom:12px}

/* hook + quick quiz + done */
.hook{display:grid;grid-template-columns:auto 1fr;gap:14px;margin:22px 0 6px;padding:16px 18px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.hook .tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--card);background:var(--ink);border-radius:6px;padding:3px 8px;height:fit-content}
.hook p{margin:0}
.quick{margin:28px 0;padding:18px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.quick h3{margin:0 0 4px;font-size:17px}
.quick .sub{font-size:13px;color:var(--muted);margin:0 0 12px}
.q{padding:12px 0;border-top:1px dashed var(--line)}
.q p{margin:0 0 8px;font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer;text-align:left}
.opt:hover{border-color:var(--accent)}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:600}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.why{font-size:14px;color:var(--muted);margin-top:8px}
.score{font-family:var(--f-mono);font-size:13px;margin-top:10px;color:var(--accent)}
.finish{margin:48px 0 0;display:flex;flex-direction:column;gap:16px}
.donebtn{font:inherit;font-weight:700;font-size:16px;padding:14px 18px;border-radius:12px;border:2px solid var(--accent);background:var(--accent);color:var(--card);cursor:pointer}
.donebtn.is-done{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pn a{display:block;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;text-decoration:none;color:var(--ink);min-width:0}
.pn a small{display:block;font-size:12px;color:var(--muted)}
.pn a.next{text-align:right}
.pn a:hover{border-color:var(--accent)}

/* glossary terms */
.term{font:inherit;color:inherit;background:none;border:0;padding:0;border-bottom:1.5px dashed var(--accent);cursor:help}
.pop{position:absolute;z-index:40;max-width:300px;background:var(--ink);color:var(--paper);font-size:13.5px;line-height:1.55;padding:10px 12px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.pop b{display:block;margin-bottom:2px}
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:25;
  font:600 14px var(--f-body);background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:10px 16px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.fab kbd{font-family:var(--f-mono);font-size:11px;opacity:.7;margin-left:6px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,14,22,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(60px,env(safe-area-inset-top,0px)) 16px 16px}
.sheet{background:var(--card);color:var(--ink);width:min(640px,100%);max-height:80vh;overflow:auto;border-radius:16px;padding:18px 20px;border:1px solid var(--line)}
.sheet input{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.gl{display:grid;gap:2px;margin-top:12px}
.gl div{padding:10px 0;border-bottom:1px solid var(--line)}
.gl b{display:block}.gl span{font-size:14px;color:var(--muted)}
.gl a{font-size:12px;font-family:var(--f-mono)}

/* widgets */
.widget{margin:30px 0;border:1px solid var(--line);background:var(--card);border-radius:16px;overflow:hidden}
.w-head{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--accent-soft) 55%,var(--card))}
.w-head .lab{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--accent);font-weight:600}
.w-head b{font-size:15px}
.w-body{padding:16px;display:grid;gap:14px}
.w-body p{margin:0}
.w-hint{font-size:13.5px;color:var(--muted)}
.svgwrap{overflow-x:auto}
.svgwrap svg{display:block;max-width:none}
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 18px}
.sl{display:grid;gap:2px;font-size:13.5px}
.sl .row{display:flex;justify-content:space-between;gap:8px}
.sl output{font-family:var(--f-mono);color:var(--accent);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--card);border-color:var(--accent)}
.btn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.ro{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper)}
.ro small{display:block;font-size:11.5px;color:var(--muted)}
.ro b{font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums}
.ro.big b{font-size:26px;color:var(--accent)}
.calc{font-family:var(--f-mono);font-size:13px;background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;overflow-x:auto;white-space:pre;line-height:1.7}
.badge{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px}
.badge.good{background:var(--good-soft);color:var(--good)}.badge.bad{background:var(--bad-soft);color:var(--bad)}
.numin{width:58px;font:13px var(--f-mono);padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);text-align:right}
.mat{display:inline-grid;gap:4px;padding:6px 8px;border-left:2px solid var(--ink);border-right:2px solid var(--ink);border-radius:6px;vertical-align:middle}
.matrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.hl{background:var(--mark)!important;color:var(--mark-ink)!important}
canvas{display:block;max-width:100%}
svg text{font-family:var(--f-body)}
.s-ink{fill:var(--ink)}.s-muted{fill:var(--muted)}.s-acc{fill:var(--accent)}.s-card{fill:var(--card)}.s-paper{fill:var(--paper)}.s-good{fill:var(--good)}.s-bad{fill:var(--bad)}.s-mark{fill:var(--mark)}
.k-line{stroke:var(--line)}.k-ink{stroke:var(--ink)}.k-acc{stroke:var(--accent)}.k-muted{stroke:var(--muted)}.k-bad{stroke:var(--bad)}.k-good{stroke:var(--good)}

/* home */
.hero{display:grid;gap:14px;margin-bottom:26px}
.hero h1{margin:0;font-size:clamp(32px,5.6vw,52px);line-height:1.1;letter-spacing:-.04em}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--mark) 62%);color:inherit}
.hero p{font-size:17px;color:var(--muted);max-width:60ch;margin:0}
.routine{display:flex;border-radius:10px;overflow:hidden;border:1px solid var(--line);font-size:12.5px;min-width:560px}
.routine div{padding:8px 8px;border-right:1px solid var(--line);background:var(--card);line-height:1.3}
.routine div:last-child{border-right:0}
.routine b{display:block;font-family:var(--f-mono);font-size:11px;color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:16px 0}
.card{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:4px}
.card:hover{border-color:var(--accent)}
.card small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.card b{font-size:15px}
.card span{font-size:13.5px;color:var(--muted);line-height:1.5}

@media (max-width:1180px){.page{grid-template-columns:minmax(0,var(--col))}.toc{display:none}}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;top:0;left:0;bottom:0;height:auto;width:min(300px,86vw);z-index:45;transform:translateX(-102%);transition:transform .25s;background:var(--card);padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .rail.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .menu-btn{display:inline-block}
  .prog .bar{width:60px}
  .pn{grid-template-columns:1fr}
}
@media (max-width:480px){.prog span{display:none}.brand span{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* chips + stats */
.chip{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--paper);white-space:nowrap}
#streak{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.stats{display:flex;flex-wrap:wrap;gap:10px}
.stats div{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;min-width:110px}
.stats small{display:block;font-size:12px;color:var(--muted)}
.stats b{font-family:var(--f-mono);font-size:20px}
.prcard{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:14px 0;padding:14px 16px;border-radius:14px;border:2px solid var(--accent);background:var(--accent-soft)}
.prcard div{display:grid;gap:2px;min-width:0;flex:1 1 260px}
.prcard b{font-size:16px}.prcard span{font-size:13px;color:var(--muted)}

/* practice */
.practice{max-width:680px;margin:0 auto;display:grid;gap:18px}
.pr-head{display:flex;align-items:center;gap:14px}
.pr-x{font-size:20px;color:var(--muted);text-decoration:none;padding:4px 8px;border-radius:8px}
.pr-x:hover{background:var(--accent-soft)}
.pr-bar{flex:1;height:16px;border-radius:8px;background:var(--line);overflow:hidden}
.pr-bar i{display:block;height:100%;width:0;background:var(--good);border-radius:8px;transition:width .45s cubic-bezier(.2,.9,.3,1.3)}
.hearts{font-size:20px;letter-spacing:2px;white-space:nowrap}
.hearts .hf{color:var(--bad)}.hearts .he{color:var(--line)}
.pr-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px;display:grid;gap:16px;min-height:300px;align-content:start}
.pr-card.pop-in{animation:popin .28s ease-out}
@keyframes popin{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
.pr-type{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--accent)}
.pr-q{font-size:21px;font-weight:700;line-height:1.5;margin:0;letter-spacing:-.01em}
.pr-opts{display:grid;gap:10px}
.pr-opt{display:flex;gap:12px;align-items:center;text-align:left;font:inherit;font-size:16px;padding:14px 16px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);color:var(--ink);cursor:pointer}
.pr-opt kbd{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--muted)}
.pr-opt:hover,.pr-oxb:hover,.pr-tok:hover{border-color:var(--accent)}
.pr-opt.sel,.pr-oxb.sel{border-color:var(--accent);background:var(--accent-soft)}
.pr-opt.right,.pr-oxb.right{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.pr-opt.wrong,.pr-oxb.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.pr-ox{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pr-oxb{font:700 40px var(--f-body);padding:22px 0;border-radius:16px;border:2px solid var(--line);border-bottom-width:5px;background:var(--card);color:var(--ink);cursor:pointer}
.pr-num{font:600 22px var(--f-mono);padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--paper);color:var(--ink);width:100%}
.pr-num:focus{border-color:var(--accent);outline:none}
.pr-num.right{border-color:var(--good);background:var(--good-soft)}.pr-num.wrong{border-color:var(--bad);background:var(--bad-soft)}
.pr-ans{min-height:64px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0;border-bottom:2px solid var(--line)}
.pr-ans.right{border-color:var(--good)}.pr-ans.wrong{border-color:var(--bad)}
.pr-bank{display:flex;flex-wrap:wrap;gap:8px}
.pr-tok{font:inherit;font-size:15px;padding:9px 14px;border-radius:12px;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);color:var(--ink);cursor:pointer}
.pr-tok.used{opacity:.25;cursor:default}
.pr-foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 18px;border-radius:16px;border:1px solid var(--line);background:var(--card)}
.pr-foot.good{background:var(--good-soft);border-color:var(--good)}
.pr-foot.bad{background:var(--bad-soft);border-color:var(--bad)}
.pr-msg{display:grid;gap:2px;flex:1 1 260px;min-width:0}
.pr-foot.good .pr-msg b{color:var(--good);font-size:18px}.pr-foot.bad .pr-msg b{color:var(--bad);font-size:17px}
.pr-msg span{font-size:14px;color:var(--ink)}
.pr-go{font:700 16px var(--f-body);padding:12px 26px;border-radius:14px;border:0;border-bottom:4px solid color-mix(in srgb,var(--accent) 60%,#000);background:var(--accent);color:var(--card);cursor:pointer}
.pr-foot.good .pr-go{background:var(--good);border-bottom-color:color-mix(in srgb,var(--good) 60%,#000)}
.pr-foot.bad .pr-go{background:var(--bad);border-bottom-color:color-mix(in srgb,var(--bad) 60%,#000)}
.pr-go:disabled{background:var(--line);color:var(--muted);border-bottom-color:var(--line);cursor:not-allowed}
.pr-foot.end{justify-content:flex-end}
.pr-end{display:grid;justify-items:center;text-align:center;gap:10px;padding:10px 0}
.pr-end h2{margin:0;font-size:22px}
.pr-end p{margin:0;max-width:44ch}
.pr-big{font:700 44px var(--f-body);color:var(--good);letter-spacing:-.03em}
.pr-big.bad{color:var(--bad)}
@media (max-width:480px){.pr-q{font-size:18px}.chip{font-size:11px;padding:2px 7px}}
.menu-btn{white-space:nowrap}
.brand b{white-space:nowrap}
@media (max-width:560px){.prog{display:none}.brand b{font-size:15px}.hook{grid-template-columns:1fr;gap:8px}.hook .tag{width:fit-content}}

/* levels */
#lvl{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line));font-weight:600}
.lvl{display:flex;gap:14px;align-items:center;width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;text-align:left}
.lvl-badge{flex:none;font:700 18px var(--f-mono);color:var(--card);background:var(--accent);border-radius:12px;padding:10px 12px}
.lvl-main{flex:1;min-width:0;display:grid;gap:5px}
.lvl-main b{font-size:16px}
.lvl-main span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.lvl-track{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.lvl-track i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .8s cubic-bezier(.2,.9,.3,1.2)}
.pr-big.lvup{color:var(--accent);animation:lvpop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes lvpop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.lvup-line{font-size:16px}
.lvup-line b{background:linear-gradient(transparent 60%,var(--mark) 60%);color:inherit}
@media (max-width:700px){#xp{display:none}}
@media (max-width:480px){#lvl{max-width:9.5em;overflow:hidden;text-overflow:ellipsis}}

/* subjects + chapter path */
.rail .st{display:block;font-size:11px;color:var(--warn);font-family:var(--f-mono);letter-spacing:.05em}
.rail a.locked{cursor:default;opacity:.6}
.rail a.locked:hover{background:none}
.rail a.locked .st{color:var(--muted)}
.unit{margin:34px 0 0;--u:var(--accent)}
.unit.u1{--u:var(--good)}.unit.u2{--u:var(--warn)}.unit.u3{--u:var(--bad)}.unit.u4{--u:var(--ink)}
.unit-head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end;padding:16px 18px;border-radius:16px;background:var(--u);color:var(--card)}
.unit-head small{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;opacity:.8}
.lesson .unit-head h2{margin:0;padding:0;border:0;font-size:24px;color:inherit}
.unit-head p{margin:2px 0 0;font-size:14px;opacity:.9}
.unit-prog{display:grid;gap:5px;min-width:120px;font-family:var(--f-mono);font-size:13px;text-align:right}
.unit-prog .lvl-track{background:color-mix(in srgb,var(--card) 30%,transparent)}
.unit-prog .lvl-track i{background:var(--card)}
.path{display:grid;gap:18px;padding:22px 6px 6px}
.step{display:flex;align-items:center;gap:16px;margin-left:var(--off)}
.node{position:relative;flex:none;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;text-decoration:none;
  background:var(--card);border:3px solid var(--u);border-bottom-width:7px;color:var(--u);transition:transform .12s}
a.node:hover{transform:translateY(-2px)}
a.node:active{transform:translateY(3px);border-bottom-width:4px}
.node .num{font:700 24px var(--f-mono)}
.node.done{background:var(--u);color:var(--card);border-color:color-mix(in srgb,var(--u) 70%,#000)}
.node.next{box-shadow:0 0 0 6px color-mix(in srgb,var(--u) 22%,transparent)}
.node.locked{border-color:var(--line);color:var(--muted);background:var(--paper);border-style:dashed}
.bubble{position:absolute;top:-30px;left:50%;transform:translateX(-50%);white-space:nowrap;font:700 12px var(--f-body);background:var(--ink);color:var(--paper);padding:3px 10px;border-radius:8px;animation:bob 1.6s ease-in-out infinite}
.bubble::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:var(--ink);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{50%{transform:translateX(-50%) translateY(-4px)}}
.step-txt{display:grid;gap:1px;min-width:0}
.step-txt b{font-size:16px}
.step-txt span{font-size:13px;color:var(--muted);font-family:var(--f-mono)}
.pr-stars{font-size:30px;letter-spacing:6px;color:var(--warn)}
@media (max-width:560px){.step{margin-left:calc(var(--off) / 3)}.node{width:58px;height:58px}}

/* ---------- references ---------- */
.refbox{margin-top:40px;padding-top:8px;border-top:1px solid var(--line)}
.refs{padding-left:20px;margin:10px 0}
.refs li{margin:0 0 12px}
.refs li>a{font-weight:600}
.refs li p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.ref-w{display:inline-block;margin-left:8px;padding:1px 7px;border:1px solid var(--line);border-radius:999px;font:500 11.5px var(--f-mono);color:var(--muted);white-space:nowrap}
.ref-all{font-size:14px}
.pr-ref{display:block;margin-top:4px;font-size:12.5px;opacity:.85}
.pr-ref a{color:inherit;text-decoration:underline}
.pr-hint{margin-top:10px;font-size:13px}
.pr-hintbox{margin:10px 0 0;padding:8px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:6px;font-size:14px}
.ref-w.ok{border-color:var(--good);color:var(--good)}
/* ---------- settings ---------- */
.setbox{margin:22px 0;padding:18px 20px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.setbox h2{margin:0 0 8px;font-size:19px}
.setbox h3{margin:16px 0 6px;font-size:15px}
.codebox{display:block;width:100%;margin:0 0 8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:12.5px/1.5 var(--f-mono);word-break:break-all;resize:vertical}
/* ---------- speak (interview) ---------- */
.prcard.spk{margin-top:12px}
.spk-q{font-size:clamp(22px,3.4vw,30px);line-height:1.4;text-wrap:balance}
.spk-steps{display:flex;gap:8px;list-style:none;padding:0;margin:14px 0 20px;flex-wrap:wrap}
.spk-steps li{padding:4px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--muted);background:var(--card)}
.spk-steps li.on{border-color:var(--accent);color:var(--accent);font-weight:600;background:var(--accent-soft)}
.spk-steps li.ok{border-color:var(--good);color:var(--good)}
.spk-script{margin:14px 0;padding:14px 18px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.spk-script p{margin:8px 0;display:flex;gap:10px;font-size:17px;line-height:1.7}
.spk-n{flex:none;width:22px;height:22px;margin-top:4px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:600 12px/22px var(--f-mono);text-align:center}
.spk-blur{filter:blur(7px);user-select:none;opacity:.7}
.spk-keys{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0}
.spk-keys small{color:var(--muted);margin-right:4px}
.spk-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:14px 0}
.spk-clock{font:600 20px var(--f-mono);font-variant-numeric:tabular-nums;min-width:56px}
.spk-rec.on{background:var(--bad);border-color:var(--bad);color:#fff}
.spk-live{margin:8px 0;padding:10px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:6px;font-size:15px;min-height:0}
.spk-live:empty{display:none}
.spk-audio{display:block;width:100%;margin:4px 0 8px}
.spk-check{display:grid;gap:6px;margin:12px 0}
.spk-check label{display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.spk-check input{width:18px;height:18px;accent-color:var(--accent)}
.spk-body .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.setbox h2{border:0;padding-top:0}
.syncstat{margin:8px 0;padding:8px 12px;border-radius:8px;background:var(--accent-soft);font-size:14px}
.syncstat.ok{background:var(--good-soft);color:var(--good)}
.syncstat.error{background:var(--bad-soft);color:var(--bad)}
input.codebox{font-size:14px}

/* ---------- play: 듀오링고식 놀이 화면. style.css 뒤에 붙어 토큰과 부품을 덮어쓴다 ---------- */
:root{
  --paper:#f4f7fb; --card:#ffffff; --ink:#1d2433; --muted:#566076; --line:#dfe5ee; --grid:transparent;
  --accent:#0f6fde; --accent-d:#0a55ad; --accent-soft:#e3f0ff; --on-accent:#ffffff;
  --good:#0f8a5f; --good-d:#0a6646; --good-soft:#dcf7ea; --bad:#d6323f; --bad-d:#a82430; --bad-soft:#ffe6e6; --warn:#a85f00;
  --sun:#ffc530; --sun-d:#d99a00; --coral:#ff6b5e; --sky:#27b3f5; --mint:#22c58b; --flame:#f47b16;
  --mc:#3d9bff; --mc-d:#1f6fd0;
  --f-display:"Jua","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --tabs-h:64px; --col:640px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11141c; --card:#1a1f2b; --ink:#eef2f8; --muted:#a3adbf; --line:#2c3444;
  --accent:#58a6ff; --accent-d:#2f7fd8; --accent-soft:#16283f; --on-accent:#08182c;
  --good:#3ecf96; --good-d:#22a070; --good-soft:#12301f; --bad:#ff7a7a; --bad-d:#d85555; --bad-soft:#3a181b; --warn:#f0b35a;
  --mc:#58a6ff; --mc-d:#2f7fd8}}
:root[data-theme="dark"]{
  --paper:#11141c; --card:#1a1f2b; --ink:#eef2f8; --muted:#a3adbf; --line:#2c3444;
  --accent:#58a6ff; --accent-d:#2f7fd8; --accent-soft:#16283f; --on-accent:#08182c;
  --good:#3ecf96; --good-d:#22a070; --good-soft:#12301f; --bad:#ff7a7a; --bad-d:#d85555; --bad-soft:#3a181b; --warn:#f0b35a;
  --mc:#58a6ff; --mc-d:#2f7fd8}

body{background-image:none;line-height:1.7}
h1,h2,h3,.btn,.pr-go,.pr-q,.stat b,.tab span,.node,.bubble,.unit-head h2,.lvl-badge,.pr-big,.spk-q{font-family:var(--f-display);font-weight:400;letter-spacing:0}
.lesson h1{font-size:clamp(26px,5vw,36px);line-height:1.3}
.lesson h2{font-size:22px;border-top:0;padding-top:0;margin-top:40px}
.eyebrow{font-family:var(--f-body);font-weight:600;letter-spacing:.02em;text-transform:none;font-size:13px}
.ico{display:inline-grid;place-items:center;width:24px;height:24px;flex:none}
.ico svg{width:100%;height:100%;display:block}
.mascot{display:inline-block;line-height:0;flex:none}
.mascot svg{display:block}
@media (prefers-reduced-motion:no-preference){.mascot.m-cheer svg{animation:hop .9s ease-out 2}.mascot.m-happy svg{animation:sway 4s ease-in-out infinite}}
@keyframes hop{0%,100%{transform:none}40%{transform:translateY(-10px)}}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}

/* 통통한 버튼: 아래 테두리가 두껍고, 누르면 내려간다 */
.btn,.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;
  background:var(--card);color:var(--ink);font-size:16px;text-decoration:none;cursor:pointer;transition:transform .1s,border-color .15s,background .15s;-webkit-tap-highlight-color:transparent}
.btn:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.btn.pri{background:var(--accent);border-color:var(--accent-d);color:var(--on-accent)}
.btn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.big{min-height:52px;font-size:18px;padding:10px 22px;border-radius:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
@media (hover:hover){.btn:hover:not(:disabled){border-color:var(--accent)}.btn.pri:hover:not(:disabled){filter:brightness(1.06);border-color:var(--accent-d)}}
.donebtn{font-family:var(--f-display);font-weight:400;border-radius:16px;border-bottom-width:5px;border-color:var(--accent-d);color:var(--on-accent)}

/* 위쪽 바: 브랜드와 스탯 */
.top{gap:8px;padding-block:8px;border-bottom:2px solid var(--line)}
.brand{flex-direction:row;align-items:center;gap:8px}
.brand b{font-family:var(--f-display);font-weight:400;font-size:20px}
.brand span:not(.mascot):not(#brandmark){display:none}
#brandmark{display:inline-flex}
.stat{display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:2px 10px;border-radius:12px;font-size:17px;white-space:nowrap;color:var(--ink);border:0;background:none;font-family:var(--f-display)}
.stat .ico{width:22px;height:22px}
#streak{color:var(--flame);border:0}#streak.off{color:var(--muted)}
#xp{color:var(--sun-d);display:inline-flex}
#lvl{color:var(--accent);border:0;max-width:none}
:root[data-theme="dark"] #xp{color:var(--sun)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #xp{color:var(--sun)}}
.prog,.menu-btn,.chip#none{display:none!important}
.fab{display:none}

/* 아래 탭 (폰). 1024px부터는 왼쪽 목차가 그 일을 한다 */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:2px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
.tab{display:grid;justify-items:center;gap:2px;min-height:52px;padding:6px 4px;border:2px solid transparent;border-radius:14px;background:none;color:var(--muted);text-decoration:none;font-size:13px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tab .ico{width:26px;height:26px}
.tab.on{color:var(--accent);background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
main{padding-block:20px calc(var(--tabs-h) + 40px + env(safe-area-inset-bottom,0px))}
.page{grid-template-columns:minmax(0,var(--col));gap:0}
.toc{display:none}
@media (min-width:1024px){.tabs{display:none}main{padding-bottom:80px}}
@media (max-width:1023px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;top:0;left:0;bottom:0;height:100vh;height:100dvh;max-height:100dvh;box-sizing:border-box;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;width:min(320px,88vw);z-index:45;transform:translateX(-102%);transition:transform .22s;background:var(--card);padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(var(--tabs-h) + 30px)}
  .rail.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
}
.rail{border-right:2px solid var(--line);background:var(--card)}
.rail a{min-height:44px;align-items:center;border-radius:12px;font-size:15px}
.rail h4{font-size:13px;letter-spacing:0;font-family:var(--f-display);font-weight:400}
.rail .dn{font-size:13px}
body.focus-practice .tabs,body.focus-practice .top,body.focus-lesson .tabs,body.focus-lesson .top{display:none}
body.focus-practice .rail,body.focus-lesson .rail{display:none}
body.focus-practice .shell,body.focus-lesson .shell{grid-template-columns:minmax(0,1fr)}
body.focus-practice main{padding-block:16px 24px}

/* 홈: 인사, 오늘, 학습 길 */
.greet{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.say{position:relative;flex:1;min-width:0;display:grid;gap:12px;padding:16px;border:2px solid var(--line);border-radius:20px;background:var(--card)}
.say::before{content:"";position:absolute;left:-9px;top:34px;width:14px;height:14px;background:var(--card);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.say p{margin:0;font-size:17px;font-weight:600;max-width:none}
.say .btn{justify-self:start}
.today{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:8px}
.goal,.mini{display:flex;align-items:center;gap:10px;padding:12px 14px;border:2px solid var(--line);border-radius:18px;background:var(--card);min-width:0}
.goal small,.mini small{display:block;font-size:13px;color:var(--muted)}
.goal b,.mini b{font-family:var(--f-display);font-weight:400;font-size:19px}
.mini>div{min-width:0;flex:1;display:grid;gap:3px}
.mini span:not(.ico){font-size:13px;color:var(--muted)}
.mini .ico{width:34px;height:34px}
.c-flame{color:var(--flame)}.c-off{color:var(--muted)}.c-sun{color:var(--sun-d)}
.ring-bg{fill:none;stroke:var(--line);stroke-width:8}
.ring-fg{fill:none;stroke:var(--sun);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .6s ease-out}
.goal.hit .ring-fg{stroke:var(--mint)}
.unit{margin:26px 0 0;--u:var(--accent);--u-d:var(--accent-d);--u-on:#fff}
.unit.u-indigo{--u:#0f6fde;--u-d:#0a55ad}
.unit.u-mint{--u:#0f8a5f;--u-d:#0a6646}
.unit.u-sun{--u:#ffc530;--u-d:#d99a00;--u-on:#3b2a00}
.unit.u-coral{--u:#d6323f;--u-d:#a82430}
.unit.u-sky{--u:#0b7fb8;--u-d:#075d88}
.unit-head{border-radius:20px;background:var(--u);color:var(--u-on);border-bottom:5px solid var(--u-d);padding:14px 18px;align-items:center}
.unit-head small{font-family:var(--f-body);font-size:13px;letter-spacing:0;opacity:1;font-weight:600}
.lesson .unit-head h2{font-size:24px;margin:0}
.unit-head p{font-size:14px;opacity:1;margin:0}
.unit-prog{font-family:var(--f-display);font-size:15px}

details{border-width:2px;border-radius:16px}

/* ---------- 더 쉽고 재밌게: 길이 주인공인 홈, 말하는 벡이, 통통 튀는 채점 ---------- */
/* 홈 첫 화면은 인사 한 줄, 오늘 목표 한 줄, 그리고 바로 길 */
.greet{margin-bottom:12px}
.say{padding:14px 16px;gap:10px}
.say p{font-size:16px;line-height:1.5}
.quest{display:flex;align-items:center;gap:12px;padding:12px 16px;border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;background:var(--card);color:var(--ink);text-decoration:none;-webkit-tap-highlight-color:transparent}

.quest-main{flex:1;min-width:0;display:grid;gap:6px}

@media (hover:hover){.quest:hover{border-color:var(--sun-d)}}
/* 과목 띠는 위에 붙어서 지금 어느 과목인지 늘 보인다 */
.unit{margin-top:28px}

/* 길: 더 크고 통통한 단추, 다음 차례는 숨 쉬듯 커졌다 작아진다 */
.path{gap:26px;padding-top:40px}
.pstep{position:relative}
.node{width:84px;height:78px}

}

/* 레슨 도입: 벡이가 오늘의 장면을 말해 준다 */

:root[data-theme="dark"] .t-sun{--t-ink:var(--sun)}

.vstack i{position:absolute;left:calc(8% + var(--k) * 3%);right:calc(8% + var(--k) * 3%);bottom:calc(var(--k) * 4px);height:30px;border-radius:5px;background:var(--card);border:2px solid var(--line);transform:rotate(calc((var(--k) - 2.5) * 3deg))}
.vbox-front{width:100%;height:44px;margin-top:-14px;position:relative;border-radius:8px 8px 10px 10px;background:var(--bx);border-bottom:5px solid var(--bx-d);display:grid;place-items:center}
.vbox-front b{font-family:var(--f-display);font-weight:400;font-size:22px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.vbox.vb3 .vbox-front b{color:#3b2a00;text-shadow:none}
.vbox.empty .vbox-front{background:var(--line);border-bottom-color:color-mix(in srgb,var(--line) 70%,#000)}
.vbox.empty .vbox-front b{color:var(--muted);text-shadow:none}
.vbox small{font-family:var(--f-display);font-size:14px;color:var(--ink);margin-top:4px;white-space:nowrap}

@media (max-width:480px){.vshelf{gap:5px;padding-inline:4px}.vbox small{font-size:12.5px}.vbox span{font-size:10.5px}.vbox-front b{font-size:19px}}
.vsearch{width:100%;min-height:48px;padding:10px 14px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;margin:8px 0 6px}
.vsearch:focus{border-color:var(--accent);outline:none}
.vlist{display:grid;gap:8px}
.vrow{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:2px solid var(--line);border-radius:16px;background:var(--card)}
.vrow.leech{border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.vrow-main{display:grid;gap:2px;min-width:0;flex:1}
.vrow-main b{font-size:16px}.vrow-main span{font-size:14px;color:var(--ink);line-height:1.5}
.vrow-main small{font-size:12.5px;color:var(--muted)}
.vchip{flex:none;font-family:var(--f-display);font-size:13px;padding:2px 10px;border-radius:999px;background:var(--line);color:var(--ink);white-space:nowrap;margin-top:2px}
.vchip.vb1{background:var(--coral);color:#fff}.vchip.vb2{background:var(--flame);color:#fff}.vchip.vb3{background:var(--sun);color:#3b2a00}
.vchip.vb4{background:#0b7fb8;color:#fff}.vchip.vb5{background:var(--accent);color:var(--on-accent)}.vchip.vb6{background:var(--good);color:#fff}
.vleech{display:inline-block;margin-left:8px;font-family:var(--f-body);font-weight:600;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--bad-soft);color:var(--bad);vertical-align:2px}
.vhow{margin-top:28px;padding:12px 16px}

.vback{display:grid;gap:1px;padding:8px 12px;margin:4px 0;border-radius:12px;background:var(--card);color:var(--ink)}

.vtools{display:flex;flex-wrap:wrap;gap:10px}

.vm-col{display:grid;gap:10px;align-content:start}
.vm-item{min-height:56px;padding:10px 12px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);color:var(--ink);font:inherit;font-size:15px;line-height:1.4;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.vm-item.L{font-family:var(--f-display);font-size:17px;text-align:center}

@media (hover:hover){.vm-item:not(:disabled):hover{border-color:var(--accent)}}

<script>
const PAGES = [{"id": "home", "short": "교재 소개", "md": "# 하루 30분, 논문 한 편으로 배우는 AI 수학\n\n> 교재 대상: 고등 수학을 거의 잊은 비전공자도 따라올 수 있게 썼습니다. 0단계 수학 준비편부터 시작하세요.\n> 진행 방식: 하루 30분, 주 5일. 레슨마다 필수 부분만 하면 30분, \"(선택)\" 표시는 시간이 남을 때만\n> 전체 길: 수학 준비편 → 기초 수학 → Seq2Seq 논문 → … → 대학원 선형대수와 최신 AI까지 12단계 (앱 첫 화면의 학습 길)\n> 선생님 역할: Claude\n\n---\n\n## 1. 왜 이 논문인가\n\n**선정 논문:** Ilya Sutskever, Oriol Vinyals, Quoc V. Le,\n*\"Sequence to Sequence Learning with Neural Networks\"*, NIPS 2014\n(arXiv: https://arxiv.org/abs/1409.3215, 본문 9쪽 정도)\n\n이 논문을 고른 이유는 세 가지입니다.\n\n1. **짧고 아이디어가 하나다.** \"문장을 벡터 하나로 압축(인코더)했다가, 그 벡터에서 다른 문장을 한 단어씩 만들어 낸다(디코더).\" 이게 전부입니다. 수식도 사실상 두 개뿐입니다.\n2. **배우고 싶은 주제가 모두 자연스럽게 등장한다.**\n   | 배우고 싶은 주제 | 논문에서 등장하는 곳 |\n   |---|---|\n   | 선형대수 (벡터, 행렬곱) | 단어 임베딩(1000차원), LSTM의 핵심 계산 `Wx + b` |\n   | 베이즈 정리·조건부확률 | 식 (1): 번역 확률을 단어별 조건부확률의 곱으로 분해 |\n   | 엔트로피·크로스엔트로피 | 학습 목표: 정답 번역의 로그 확률 평균을 최대화, 보고된 perplexity |\n   | Teacher forcing | 학습할 때 디코더에 \"정답 이전 단어\"를 넣어 주는 방식 |\n   | 중심극한정리 | 파라미터 초기화(균등분포 ±0.08), 미니배치(128개) 평균 그래디언트 |\n3. **현재 AI(GPT, Claude 같은 LLM)의 직계 조상이다.** \"앞 단어들이 주어졌을 때 다음 단어의 확률\"을 학습한다는 핵심이 지금도 그대로입니다. 이 논문을 이해하면 Transformer 논문으로 넘어가기가 훨씬 쉽습니다.\n\n> **용어 메모:** 요청하신 \"앤트로픽 관련 사항\"은 **엔트로피(entropy)** 와 **크로스엔트로피(cross-entropy)** 를 뜻하는 것으로 이해하고 교재를 구성했습니다. (Anthropic은 회사 이름이고, 이름의 어원은 \"인간의/인류의(anthropic)\"입니다. 정보이론의 entropy와는 다른 단어예요.)\n\n---\n\n## 2. 하루 30분 루틴\n\n매일 같은 순서로 진행합니다. 시간은 대략적인 기준이에요.\n\n| 단계 | 시간 | 하는 일 |\n|---|---|---|\n| ① 목표 확인 | 1분 | 오늘 끝나면 무엇을 할 수 있어야 하는지 읽기 |\n| ② 개념 + 직관 | 8분 | 설명을 읽으며 **손으로 그림 그리기** |\n| ③ 예제 따라하기 | 6분 | 계산 예제를 종이에 직접 다시 풀기 (답 보지 말고) |\n| ④ 능동 연습 | 10분 | 손계산 문제 + 짧은 numpy 코드 실행·수정 |\n| ⑤ 셀프 체크 | 4분 | 퀴즈 풀고 맨 아래 정답 확인 |\n| ⑥ 한 줄 정리 | 1분 | \"오늘 배운 것을 논문의 어느 부분에서 쓰는가\"를 학습노트에 한 줄 |\n\n**규칙 세 가지**\n- 정답은 항상 파일 맨 아래 `<details>` 안에 숨어 있습니다. **먼저 풀고 열어 보세요.**\n- 코드는 복사-붙여넣기보다 **직접 타이핑**하세요. 숫자를 바꿔 보는 것이 진짜 공부입니다.\n- 막히면 10분 넘게 붙잡지 말고 표시해 두고 넘어가세요. 다음 날 처음 5분에 다시 봅니다.\n\n**준비물:** 노트, 펜, Python 3 + numpy (`pip install numpy`). Google Colab을 써도 됩니다.\n\n---\n\n## 3. 전체 일정 (4주, 20회)\n\n### 1주차: 논문을 읽기 위한 언어 (선형대수 + 확률)\n| 일차 | 주제 | 논문 연결 |\n|---|---|---|\n| [Day 01](#day01) | 논문 지도 그리기 + 벡터와 내적 | 단어 임베딩 (2장) |\n| [Day 02](#day02) | 행렬곱 = 신경망의 층, shape 읽기 | LSTM 계산, 160,000×1000 임베딩 (3.4절) |\n| [Day 03](#day03) | 확률, 조건부확률, 연쇄법칙 | 식 (1) (2장) |\n| [Day 04](#day04) | 베이즈 정리 | 번역을 확률로 보는 관점, argmax 디코딩 (3.2절) |\n| [Day 05](#day05) | 소프트맥스와 로그 | 출력층: 80,000개 단어 위 확률분포 (2장) |\n\n### 2주차: 모델은 어떻게 배우는가 (정보이론 + 학습)\n| 일차 | 주제 | 논문 연결 |\n|---|---|---|\n| [Day 06](#day06) | 정보량과 엔트로피 | \"불확실성\"의 수치화 |\n| [Day 07](#day07) | 크로스엔트로피, KL 발산 | 학습 목표: 로그 확률 최대화 (3.2절) |\n| [Day 08](#day08) | Perplexity, 경사하강 | 역순 입력으로 perplexity 5.8→4.7 (3.3절) |\n| [Day 09](#day09) | 중심극한정리 | ±0.08 초기화, 배치 128 (3.4절) |\n| [Day 10](#day10) | RNN 한 스텝 손계산 + teacher forcing | 디코더 학습 방식 (2장, 3.4절) |\n\n### 3주차: 논문의 모델 해부\n| 일차 | 오늘 배울 수학 | 논문에서 쓰이는 곳 |\n|---|---|---|\n| [Day 11](#day11) | LSTM 게이트 (시그모이드 밸브, 기억 더하기) | 4층 LSTM (1장, 3.4절) |\n| [Day 12](#day12) | 입력 뒤집기, 빔 서치 | 3.2절, 3.3절, 표 1 |\n| [Day 13](#day13) | BLEU 점수 (n-gram 정밀도, 기하평균) | BLEU 34.81 대 33.30 (3.6절) |\n\n기울기 자르기와 미니 프로젝트는 3단계 \"신경망 학습의 기초\"에서 이어집니다.\n\n---|---|\n| Day 11 | Teacher forcing 심화: exposure bias, scheduled sampling |\n| Day 12 | 기울기 소실과 LSTM의 게이트 (시그모이드, 원소별 곱) |\n| Day 13 | 인코더-디코더와 고정 길이 벡터 v |\n| Day 14 | 입력 문장 뒤집기 트릭은 왜 통했나 |\n| Day 15 | 빔 서치 (beam search) 손으로 해보기 |\n\n### 4주차: 논문 정독과 미니 구현\n| 일차 | 주제 |\n|---|---|\n| Day 16 | Gradient clipping (노름 5) + 벡터 노름 복습 |\n| Day 17 | BLEU 점수 계산해 보기 |\n| Day 18 | 논문 1~3장 정독 (지금까지 배운 것으로 읽기) |\n| Day 19 | 미니 프로젝트: \"숫자열 뒤집기\" seq2seq 만들기 |\n| Day 20 | 논문 4~5장 + 회고, 다음 논문(Attention) 예고 |\n\n---\n\n## 4. 기호 읽는 법\n\n수식이 나오면 이 표로 돌아오세요. 기호는 긴 말을 줄여 쓴 약속일 뿐입니다.\n\n| 기호 | 읽는 법 | 뜻 | 처음 나오는 날 |\n|---|---|---|---|\n| $\\sum$ | 시그마 | 전부 더한다. $\\sum_i a_i$ 는 a₁ + a₂ + ... | 준비 5 |\n| $\\lVert a \\rVert$ | a의 노름 | 벡터 a의 길이. ‖ 두 줄은 Day 07의 KL 발산 $D_{KL}(p\\,\\|\\,q)$에서는 \"p와 q를 비교한다\"는 칸막이로 쓰여 뜻이 다릅니다 | Day 01 |\n| $\\prod$ | 파이 | 전부 곱한다. $\\prod_t p_t$ 는 p₁ × p₂ × ... | 준비 5 |\n| $P(A \\mid B)$ | B일 때 A의 확률 | 세로줄 뒤가 이미 알고 있는 조건 | Day 03 |\n| $\\propto$ | 비례한다 | 상수배만큼만 다르다 | Day 04 |\n| $\\arg\\max$ | 아그맥스 | 가장 큰 점수를 받은 후보 (점수 자체가 아님) | Day 04 |\n| $\\hat{T}$ | T 햇 | 모델이 고른(추정한) T | Day 04 |\n| $\\exp(x)$, $e^x$ | e의 x제곱 | 같은 것을 쓰는 두 가지 방법. e ≈ 2.718 | 준비 2 |\n| $\\log$, $\\ln$ | 로그 | 이 교재에서 log는 자연로그 ln. 비트를 셀 때만 log₂ | 준비 4 |\n| $\\partial$ | 라운드 | 한 변수만 살짝 움직였을 때의 기울기 | 1단계 기울기 레슨 |\n| $\\mathcal{N}(\\mu, \\sigma^2)$ | 정규분포 | 평균 μ, 표준편차 σ인 종 모양 분포. 괄호 둘째 칸은 σ가 아니라 **분산** σ² | Day 09 |\n\n## 4-1. 논문 핵심 사실 카드 (계속 참조하세요)\n\n- 과제: WMT'14 영어 → 프랑스어 번역\n- 모델: 4층 LSTM, 층마다 1000개 셀, 단어 임베딩 1000차원\n- 어휘: 입력 160,000단어, 출력 80,000단어 (나머지는 `UNK`)\n- 초기화: 모든 파라미터를 균등분포 U(−0.08, 0.08)에서 뽑음\n- 학습: 모멘텀 없는 SGD, 학습률 0.7, 배치 128, 그래디언트 노름이 5를 넘으면 잘라냄\n- 핵심 트릭: **입력 문장의 단어 순서를 뒤집어서** 넣으면 성능이 크게 오름\n- 결과: LSTM 5개 앙상블 + 빔 서치로 BLEU 34.8 (통계 기반 기계번역 기준선 33.3)\n\n(각 수치는 해당 날짜에 논문 원문과 함께 다시 확인합니다.)\n\n---\n\n## 5. 학습 노트 양식 (매일 복사해서 쓰세요)\n\n```\n[Day __] 날짜: ____\n오늘의 핵심 한 문장:\n논문의 어디에 쓰이나:\n헷갈렸던 것 / 내일 다시 볼 것:\n스스로 매긴 이해도 (1~5):\n```\n", "link": ""}, {"id": "prep01", "short": "분수, 소수, 비율", "md": "# 준비 1. 분수, 소수, 비율\n\n30분 · 논문 연결: 확률은 전부 0과 1 사이의 비율입니다 (2장 식 (1))\n\n---\n\n## 오늘의 목표\n1. 분수, 소수, 퍼센트가 같은 수를 쓰는 세 가지 방법이라는 걸 안다.\n2. 분수끼리 곱하고 나누는 계산을 손으로 할 수 있다.\n3. \"전체 중 일부\"를 비율로 바꿔서 확률처럼 읽을 수 있다.\n\n**준비물:** 연필, 종이. 계산기는 마지막 확인용으로만 씁니다.\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 같은 수, 세 가지 옷\n피자 한 판을 4조각으로 나눠 1조각을 먹었습니다.\n\n| 분수 | 소수 | 퍼센트 |\n|---|---|---|\n| 1/4 | 0.25 | 25% |\n| 1/2 | 0.5 | 50% |\n| 3/4 | 0.75 | 75% |\n| 1/10 | 0.1 | 10% |\n\n- **분수 → 소수**: 위를 아래로 나눕니다. 1 ÷ 4 = 0.25\n- **소수 → 퍼센트**: 100을 곱합니다. 0.25 × 100 = 25%\n\nAI 논문에서 확률은 거의 항상 **소수**로 씁니다. \"확률 0.75\"는 \"75%\"와 같은 말입니다.\n\n### 1-2. 비율 = 전체 중 일부\n반 학생 40명 중 10명이 안경을 씁니다. 안경 쓴 학생의 비율은\n\n10 / 40 = 1/4 = 0.25\n\n**분모(아래 숫자)는 \"어디 안에서 세는가\"**, 분자(위 숫자)는 \"그중 몇 개인가\"입니다. 이 감각이 1단계에서 배울 조건부확률의 전부입니다.\n\n### 1-3. 곱하기: 위는 위끼리, 아래는 아래끼리\n$$\\frac{1}{2} \\times \\frac{3}{4} = \\frac{1 \\times 3}{2 \\times 4} = \\frac{3}{8}$$\n\n말로 하면 \"절반의 3/4\". 소수로 하면 0.5 × 0.75 = 0.375 = 3/8. 같은 답입니다.\n\n**0과 1 사이의 수끼리 곱하면 더 작아집니다.** 0.5 × 0.5 = 0.25. 확률을 계속 곱하면 점점 0에 가까워지는 이유입니다.\n\n### 1-4. 나누기: 뒤집어서 곱한다\n$$\\frac{3}{10} \\div \\frac{4}{10} = \\frac{3}{10} \\times \\frac{10}{4} = \\frac{30}{40} = \\frac{3}{4}$$\n\n같은 분모(10)끼리 나누면 분모가 사라지고 **분자끼리의 나눗셈**만 남습니다. 이 한 줄을 기억해 두세요. 조건부확률 공식에서 그대로 다시 나옵니다.\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n**문제.** 100명 중 40명이 코딩을 좋아하고, 그중 30명이 안경을 씁니다. 코딩 좋아하는 사람 *중에서* 안경 쓴 비율은?\n\n1. \"어디 안에서 세는가?\" → 코딩 좋아하는 40명. 이게 분모입니다.\n2. \"그중 몇 명?\" → 30명. 이게 분자입니다.\n3. 30 / 40 = 3/4 = **0.75**\n\n**같은 문제를 전체 비율로 풀어도 답이 같습니다.**\n- 전체 중 \"코딩 + 안경\" 비율: 30/100 = 0.3\n- 전체 중 \"코딩\" 비율: 40/100 = 0.4\n- 0.3 ÷ 0.4 = 0.75\n\n**미니 챌린지: 뉴스 헤드라인 함정.** \"AI에 관심 있는 사람의 60%가 수학을 좋아한다\"와 \"수학을 좋아하는 사람의 60%가 AI에 관심 있다\"는 같은 말일까요? 분모가 다릅니다. 앞 문장은 AI 관심자 안에서, 뒤 문장은 수학 좋아하는 사람 안에서 셉니다. 이 둘을 바꿔 끼우는 실수를 바로잡는 도구가 1단계의 베이즈 정리예요.\n\n이것이 1단계에서 배울 식 $P(B\\mid A) = P(A,B) / P(A)$의 정체입니다. 무서운 기호지만 계산은 방금 한 나눗셈입니다.\n\n---\n\n## 3. 능동 연습 (10분)\n\n### 손계산\n1. 3/5를 소수와 퍼센트로 바꾸세요.\n2. 0.2 × 0.5 = ?\n3. 2/3 × 3/4 = ? (약분까지)\n4. (6/10) ÷ (8/10) = ?\n5. 확률 0.5를 다섯 번 곱하면? 소수로 쓰세요.\n6. 80명 중 20명이 수학을 좋아합니다. 수학 좋아하는 사람 중 12명이 AI에 관심이 있습니다. 수학 좋아하는 사람 *중에서* AI 관심 있는 비율은?\n\n### 코드 (선택)\n```python\nprint(3 / 5)          # 분수 → 소수\nprint(0.2 * 0.5)\nprint((6/10) / (8/10))\nprint(0.5 ** 5)       # ** 는 거듭제곱 (내일 배워요)\n```\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n1. 0.4는 몇 퍼센트인가요?\n2. O/X: 0보다 크고 1보다 작은 두 수를 곱하면 결과는 두 수보다 작아진다.\n3. \"코딩 좋아하는 사람 중 안경 쓴 비율\"에서 분모는 무엇인가요?\n4. 분수로 나눌 때는 어떻게 바꿔서 계산하나요?\n\n---\n\n## 한 줄 정리\n비율은 \"어디 안에서 셀지(분모)\"를 먼저 정하는 것이고, 확률은 그 비율을 소수로 쓴 것이다.\n\n---\n\n<details>\n<summary>정답 보기 (먼저 풀고 열기!)<\/summary>\n\n**손계산**\n1. 3 ÷ 5 = **0.6**, **60%**\n2. **0.1**\n3. 6/12 = **1/2**\n4. 6 ÷ 8 = **0.75** (같은 분모끼리라 분자끼리 나누면 됩니다)\n5. 0.5 × 0.5 × 0.5 × 0.5 × 0.5 = **0.03125**. 다섯 번 곱하니 3%로 작아졌어요.\n6. 12 / 20 = **0.6**. 분모는 80이 아니라 수학 좋아하는 20명입니다.\n\n**퀴즈**\n1. 40%\n2. O. 예: 0.5 × 0.4 = 0.2는 0.5보다도, 0.4보다도 작습니다.\n3. 코딩 좋아하는 사람 수 (40명)\n4. 나누는 분수를 뒤집어서 곱합니다.\n<\/details>\n", "link": "논문 연결: 확률은 전부 0과 1 사이의 비율입니다 (2장 식 (1))", "lesson": true}, {"id": "prep02", "short": "거듭제곱과 지수법칙", "md": "# 준비 2. 거듭제곱과 지수법칙\n\n30분 · 논문 연결: 출력층의 소프트맥스는 $e^x$로 점수를 확률로 바꿉니다 (2장)\n\n---\n\n## 오늘의 목표\n1. $2^3$, $2^0$, $2^{-1}$이 각각 무엇인지 말할 수 있다.\n2. 지수법칙 세 가지를 숫자로 확인할 수 있다.\n3. 특별한 수 $e \\approx 2.718$을 만나고, $e^x$ 값표를 읽을 수 있다.\n\n**복습 (1분):** 0.5 × 0.5 = ? (답: 0.25)\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 거듭제곱 = 같은 수를 여러 번 곱하기\n$$2^3 = 2 \\times 2 \\times 2 = 8$$\n\n- 아래 큰 숫자 2: **밑**. 무엇을 곱하나\n- 위 작은 숫자 3: **지수**. 몇 번 곱하나\n- 읽기: \"2의 3제곱\"\n\n| 식 | 뜻 | 값 |\n|---|---|---|\n| $2^1$ | 2 | 2 |\n| $2^2$ | 2×2 | 4 |\n| $2^3$ | 2×2×2 | 8 |\n| $10^3$ | 10×10×10 | 1000 |\n\n### 1-2. 0제곱과 음수 제곱: 표를 거꾸로 내려가기\n지수가 1 줄어들 때마다 값은 **밑으로 한 번 나눠집니다.**\n\n| 식 | 값 | 어떻게 |\n|---|---|---|\n| $2^3$ | 8 | |\n| $2^2$ | 4 | 8 ÷ 2 |\n| $2^1$ | 2 | 4 ÷ 2 |\n| $2^0$ | **1** | 2 ÷ 2 |\n| $2^{-1}$ | **1/2 = 0.5** | 1 ÷ 2 |\n| $2^{-2}$ | **1/4 = 0.25** | 0.5 ÷ 2 |\n\n외울 것은 두 줄입니다.\n- **0이 아닌 수는 0제곱하면 1**\n- **음수 제곱은 \"1 나누기\"**: $2^{-3} = 1/2^3 = 1/8$\n\n### 1-3. 지수법칙 세 가지 (숫자로 확인)\n| 법칙 | 숫자로 확인 |\n|---|---|\n| $a^m \\times a^n = a^{m+n}$ | $2^2 \\times 2^3 = 4 \\times 8 = 32 = 2^5$ |\n| $a^m \\div a^n = a^{m-n}$ | $2^5 \\div 2^2 = 32 \\div 4 = 8 = 2^3$ |\n| $(a^m)^n = a^{m \\times n}$ | $(2^2)^3 = 4^3 = 64 = 2^6$ |\n\n말로 하면 \"곱하면 지수끼리 더하고, 나누면 지수끼리 뺀다\". 2단계에서 배울 소프트맥스(점수를 확률로 바꾸는 계산)에서 **\"모든 점수(지수)에서 같은 수를 빼도 답이 같다\"**는 성질이 바로 둘째 줄에서 나옵니다. $e^{x-c} = e^x \\div e^c$라서, 똑같이 생긴 $e^c$가 분자와 분모에서 약분되기 때문이에요.\n\n### 1-4. 특별한 밑 e\nAI 논문에서 가장 많이 쓰는 밑은 2도 10도 아닌 **e ≈ 2.718**입니다. 자연에서 \"계속 불어나는 양\"을 다룰 때 저절로 나오는 수라서 '자연'상수라고 부릅니다. 지금은 **\"2와 3 사이의 정해진 수\"**로만 알아도 충분합니다.\n\n$e^x$는 `exp(x)`라고도 씁니다. 같은 뜻입니다.\n\n| x | −2 | −1 | 0 | 1 | 2 | 3 |\n|---|---|---|---|---|---|---|\n| $e^x$ | 0.135 | 0.368 | **1** | 2.718 | 7.389 | 20.09 |\n\n이 표에서 볼 두 가지:\n- $e^x$는 **항상 양수**입니다. x가 음수여도 0보다 큽니다.\n- x가 1 커질 때마다 약 **2.7배**씩 커집니다.\n\n\"점수가 음수여도 양수로 바꿔 준다\"는 성질 때문에 신경망은 $e^x$로 점수를 확률로 바꿉니다.\n\n**미니 챌린지: 종이접기로 달까지.** $2^{10} = 1024$, 대략 1000입니다. 종이(0.1 mm)를 42번 접으면 두께는 $0.1 \\times 2^{42}$ mm. $2^{42} = 2^{40} \\times 2^2 \\approx 1000^4 \\times 4$ = 4조. 0.1 mm × 4조 = 4억 mm = **약 40만 km**. 달까지 거리(약 38만 km)를 넘습니다. 지수법칙 하나로 계산기 없이 풀었어요.\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n**문제.** $e^2 \\div e^1$을 계산기 없이 구하세요.\n\n1. 나누기니까 지수끼리 뺍니다: $e^{2-1} = e^1$\n2. 값표에서 $e^1 = 2.718$\n3. 확인: 7.389 ÷ 2.718 ≈ 2.718 ✓\n\n**문제.** $e^{0}$, $e^{-1}$은?\n- $e^0 = 1$ (0이 아닌 수의 0제곱은 1)\n- $e^{-1} = 1/e = 1/2.718 \\approx 0.368$\n\n---\n\n## 3. 능동 연습 (10분)\n\n### 손계산\n1. $3^2$, $3^0$, $3^{-1}$을 구하세요.\n2. $10^{-2}$를 소수로 쓰세요.\n3. $2^4 \\times 2^3$을 $2^{\\square}$ 꼴로 쓰고 값을 구하세요.\n4. $5^6 \\div 5^4$ = ?\n5. 값표를 보고 $e^3 \\div e^2$를 구하세요.\n6. $e^{-2}$는 1보다 큰가요, 작은가요? 값은?\n\n### 코드 (선택)\n```python\nimport math\nprint(2 ** 3, 2 ** 0, 2 ** -1)\nprint(math.e)           # 2.718...\nprint(math.exp(-1), math.exp(2))\n```\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n1. $7^0$ = ?\n2. O/X: $e^x$는 x가 음수이면 음수가 된다.\n3. $a^m \\times a^n$에서 지수는 어떻게 되나요?\n4. $2^{-2}$를 분수로 쓰면?\n\n---\n\n## 한 줄 정리\n지수가 1 줄면 밑으로 한 번 나누고, 곱하면 지수를 더한다. $e^x$는 언제나 양수다.\n\n---\n\n<details>\n<summary>정답 보기 (먼저 풀고 열기!)<\/summary>\n\n**손계산**\n1. 9, 1, 1/3 (≈ 0.333)\n2. 1/100 = **0.01**\n3. $2^{4+3} = 2^7$ = **128**\n4. $5^{6-4} = 5^2$ = **25**\n5. $e^{3-2} = e^1$ ≈ **2.718**\n6. 작습니다. $e^{-2} = 1/e^2 = 1/7.389$ ≈ **0.135**\n\n**퀴즈**\n1. 1\n2. X. 항상 양수입니다. $e^{-5}$도 0.0067로 0보다 큽니다.\n3. 더해집니다: $a^{m+n}$\n4. 1/4\n<\/details>\n", "link": "논문 연결: 출력층의 소프트맥스는 로 점수를 확률로 바꿉니다 (2장)", "lesson": true}, {"id": "prep03", "short": "제곱근과 아주 큰 수, 작은 수", "md": "# 준비 3. 제곱근과 아주 큰 수, 작은 수\n\n30분 · 논문 연결: 단어 160,000개, 파라미터 3억 8천4백만 개 (3.4절)\n\n---\n\n## 오늘의 목표\n1. 제곱근 √가 \"제곱의 반대\"라는 걸 알고, 피타고라스 정리로 화살표 길이를 구할 수 있다.\n2. 아주 큰 수와 작은 수를 $a \\times 10^n$ 꼴(과학적 표기)로 읽고 쓸 수 있다.\n3. 컴퓨터가 쓰는 `1e-16` 같은 표기를 읽을 수 있다.\n\n**복습 (1분):** $10^{-2}$ = ? (답: 0.01)\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 제곱근: 제곱을 되돌리기\n$3^2 = 9$이므로 **9의 제곱근은 3**입니다. 기호로 $\\sqrt{9} = 3$.\n\n| 수 | 1 | 4 | 9 | 16 | 25 | 100 | 2 |\n|---|---|---|---|---|---|---|---|\n| 제곱근 | 1 | 2 | 3 | 4 | 5 | 10 | 약 1.414 |\n\n딱 떨어지지 않는 수도 있습니다. $\\sqrt{2} \\approx 1.414$ (1.414 × 1.414 ≈ 2).\n\n### 1-2. 피타고라스 정리 = 화살표의 길이\n오른쪽으로 3, 위로 4 간 화살표 [3, 4]의 길이는?\n\n$$\\sqrt{3^2 + 4^2} = \\sqrt{9 + 16} = \\sqrt{25} = 5$$\n\n**칸마다 제곱해서 더하고, 제곱근을 씌운다.** 1단계 첫 레슨에서 이것을 \"벡터의 노름(길이)\"이라고 부르며 다시 씁니다. 칸이 1000개여도 방법은 같습니다.\n\n### 1-3. 과학적 표기: 0을 세지 않는 법\n160,000을 \"1.6 × 10만\"으로 생각해 보세요.\n\n$$160{,}000 = 1.6 \\times 10^5$$\n\n규칙: **앞자리는 1 이상 10 미만**, 뒤의 $10^n$은 소수점을 몇 칸 옮겼는지.\n\n| 보통 표기 | 과학적 표기 | 컴퓨터 표기 |\n|---|---|---|\n| 160,000 | $1.6 \\times 10^5$ | `1.6e5` |\n| 384,000,000 | $3.84 \\times 10^8$ | `3.84e8` |\n| 0.001 | $1 \\times 10^{-3}$ | `1e-3` |\n| 0.00000089 | $8.9 \\times 10^{-7}$ | `8.9e-7` |\n\n**지수가 음수면 아주 작은 수**입니다. $10^{-3}$은 0.001, 즉 1000분의 1입니다.\n\n### 1-4. 너무 작아서 0이 되는 수\n확률 0.5를 50번 곱하면 약 $8.9 \\times 10^{-16}$입니다. 소수점 아래 0이 15개 붙는 수예요. 2000번 곱하면 컴퓨터가 표현할 수 있는 가장 작은 수보다 작아져 그냥 **0.0**이 됩니다. 한국 로또 1등 확률이 약 $1.2 \\times 10^{-7}$이니, 로또에 두 번 연속 당첨될 확률($1.4 \\times 10^{-14}$)보다도 희박합니다. 이 문제를 해결하는 도구가 다음 레슨의 **로그**입니다.\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n**문제 1.** [6, 8]의 길이는?\n1. 제곱: 36, 64\n2. 더하기: 100\n3. 제곱근: **10**\n\n**문제 2.** 0.00042를 과학적 표기로.\n1. 앞자리가 1 이상 10 미만이 되게 소수점을 옮깁니다: 4.2\n2. 오른쪽으로 4칸 옮겼으니 $10^{-4}$\n3. 답: $4.2 \\times 10^{-4}$ (컴퓨터: `4.2e-4`)\n\n**문제 3.** `2.5e3`은?\n- $2.5 \\times 10^3 = 2500$\n\n---\n\n## 3. 능동 연습 (10분)\n\n### 손계산\n1. $\\sqrt{49}$, $\\sqrt{64}$ = ?\n2. 화살표 [5, 12]의 길이는?\n3. 80,000을 과학적 표기로 쓰세요.\n4. $3 \\times 10^{-2}$를 보통 소수로 쓰세요.\n5. `1e-4`와 `1e-6` 중 더 작은 수는? 몇 배 차이인가요?\n6. 논문의 단어 수 160,000과 80,000을 과학적 표기로 쓰고, 어느 쪽이 몇 배 큰지 말하세요.\n\n### 코드 (선택)\n```python\nimport math\nprint(math.sqrt(25), math.sqrt(3**2 + 4**2))\nprint(160000 == 1.6e5)\nprint(0.5 ** 50, 0.5 ** 2000)   # 두 번째는 0.0\n```\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n1. $\\sqrt{16}$ = ?\n2. O/X: $10^{-5}$는 음수다.\n3. 화살표 길이를 구하는 순서를 말하세요.\n4. `3e2`는 얼마인가요?\n\n---\n\n## 한 줄 정리\n길이는 \"제곱해서 더하고 √\", 큰 수와 작은 수는 $a \\times 10^n$으로, 지수가 음수면 아주 작은 양수다.\n\n---\n\n<details>\n<summary>정답 보기 (먼저 풀고 열기!)<\/summary>\n\n**손계산**\n1. 7, 8\n2. $\\sqrt{25 + 144} = \\sqrt{169}$ = **13**\n3. $8 \\times 10^4$\n4. **0.03**\n5. `1e-6`이 더 작습니다. $10^{-4} \\div 10^{-6} = 10^{2}$, **100배** 차이\n6. $1.6 \\times 10^5$과 $8 \\times 10^4$. 160,000이 **2배** 큽니다.\n\n**퀴즈**\n1. 4\n2. X. $10^{-5} = 0.00001$, 아주 작은 **양수**입니다.\n3. 칸마다 제곱 → 모두 더하기 → 제곱근\n4. 300\n<\/details>\n", "link": "논문 연결: 단어 160,000개, 파라미터 3억 8천4백만 개 (3.4절)", "lesson": true}, {"id": "prep04", "short": "로그 처음부터", "md": "# 준비 4. 로그 처음부터\n\n30분 · 논문 연결: 학습 목표는 \"정답 문장의 로그 확률을 최대화\"하는 것 (3.2절)\n\n---\n\n## 오늘의 목표\n1. 로그가 \"몇 제곱?\"을 묻는 질문이라는 걸 말로 설명할 수 있다.\n2. 1보다 작은 수의 로그는 음수라는 것을 이해한다.\n3. 로그의 성질 세 가지를 숫자로 확인하고, 왜 AI가 로그를 쓰는지 말할 수 있다.\n\n**복습 (1분):** $2^{-1}$ = ? (답: 0.5)\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 로그 = \"몇 제곱?\"\n$2^3 = 8$입니다. 거꾸로 묻습니다. **\"2를 몇 제곱하면 8이 되나?\"** 답은 3. 이 질문을 기호로 쓴 것이 로그입니다.\n\n$$\\log_2 8 = 3 \\quad\\Leftrightarrow\\quad 2^3 = 8$$\n\n| 질문 | 로그로 쓰면 | 답 |\n|---|---|---|\n| 2를 몇 제곱하면 8? | $\\log_2 8$ | 3 |\n| 10을 몇 제곱하면 1000? | $\\log_{10} 1000$ | 3 |\n| 2를 몇 제곱하면 1? | $\\log_2 1$ | **0** |\n| 2를 몇 제곱하면 1/2? | $\\log_2 (1/2)$ | **−1** |\n| 2를 몇 제곱하면 1/4? | $\\log_2 (1/4)$ | **−2** |\n\n아래 세 줄은 준비 2에서 배운 표($2^0 = 1$, $2^{-1} = 1/2$)를 거꾸로 읽은 것입니다.\n\n**로그 = 자릿수 세기.** $\\log_{10}$은 대략 \"자릿수 − 1\"입니다. $\\log_{10} 1000 = 3$이고 1000은 네 자리. 논문의 파라미터 384,000,000은 $\\log_{10} \\approx 8.6$이라 아홉 자리입니다.\n\n### 1-2. 확률의 로그는 음수\n확률은 0과 1 사이입니다. **0보다 크고 1보다 작은 수의 로그는 항상 음수**, 1의 로그는 0입니다. (확률이 딱 0이면 로그를 정의할 수 없어서 −∞로 봅니다.) 그래서 논문에 나오는 \"로그 확률\"은 늘 0 이하의 숫자입니다. 0에 가까울수록 확률이 높다는 뜻이에요.\n\n### 1-3. 자연로그 ln: 밑이 e인 로그\nAI에서는 밑으로 **e ≈ 2.718**을 씁니다. $\\ln x$ 또는 그냥 $\\log x$라고 씁니다. 뜻은 \"e를 몇 제곱하면 x?\"\n\n| x | 0.1 | 0.5 | 0.9 | 1 | 2 | 2.718 | 10 |\n|---|---|---|---|---|---|---|---|\n| $\\ln x$ | −2.303 | −0.693 | −0.105 | **0** | 0.693 | **1** | 2.303 |\n\n$\\ln 0.5 = -0.693$은 **\"e를 −0.693제곱하면 0.5\"**라는 뜻입니다. 지수가 소수여도 괜찮아요. 1보다 작은 수로 내려가려면 음수 제곱이 필요하다는 것만 보면 됩니다.\n\n### 1-4. 로그의 성질 세 가지 (숫자로 확인)\n| 성질 | 말로 | 값표로 확인 |\n|---|---|---|\n| $\\ln(ab) = \\ln a + \\ln b$ | 곱은 합이 된다 | $\\ln(2 \\times 5) = \\ln 10$: 0.693 + 1.609 = 2.302 ≈ 2.303 ✓ |\n| $\\ln(a/b) = \\ln a - \\ln b$ | 나누기는 빼기가 된다 | $\\ln(1/2) = \\ln 1 - \\ln 2$ = 0 − 0.693 = −0.693 ✓ |\n| $\\ln(a^n) = n \\ln a$ | 제곱은 곱하기가 된다 | $\\ln(2^3) = \\ln 8$ = 3 × 0.693 = 2.079 ✓ |\n\n($\\ln 5 \\approx 1.609$, $\\ln 8 \\approx 2.079$)\n\n### 1-5. AI가 로그를 쓰는 이유\n문장의 확률은 단어 확률을 **곱한** 값입니다. 0.5를 50번 곱하면 $8.9 \\times 10^{-16}$, 더 길면 컴퓨터에서 0이 됩니다(지난 레슨). 로그를 씌우면 곱이 **합**이 됩니다.\n\n$$\\ln(0.5^{50}) = 50 \\times \\ln 0.5 = 50 \\times (-0.693) \\approx -34.65$$\n\n−34.66은 컴퓨터가 아주 편하게 다루는 크기입니다. 그래서 논문은 확률 대신 **로그 확률**을 최대화합니다.\n\n> **미리 보기: 놀람 = −로그 확률.** 로그 확률은 음수라 다루기 불편해서, 앞에 마이너스를 붙여 양수로 바꿔 씁니다. $-\\ln 0.1 = 2.303$, $-\\ln 0.9 = 0.105$. 드문 일(0.1)일수록 값이 커서 \"놀람\"이라고 부릅니다. 2단계 엔트로피에서 이 값을 그대로 씁니다.\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n**문제.** 세 단어 확률이 0.5, 0.5, 0.1일 때 문장 확률의 자연로그는?\n\n1. 곱의 로그는 로그의 합: $\\ln 0.5 + \\ln 0.5 + \\ln 0.1$\n2. 값표: −0.693 + (−0.693) + (−2.303)\n3. 합: **−3.689**\n4. 확인: 0.5 × 0.5 × 0.1 = 0.025, $\\ln 0.025 \\approx -3.689$ ✓\n\n---\n\n## 3. 능동 연습 (10분)\n\n### 손계산\n1. $\\log_2 16$ = ?\n2. $\\log_{10} 0.01$ = ?\n3. $\\log_2 (1/8)$ = ?\n4. 값표를 써서 $\\ln 4$를 구하세요. (힌트: 4 = 2 × 2)\n5. $\\ln(0.5^{10})$ = ?\n6. 확률 0.9와 0.1 중 로그 확률이 0에 더 가까운 쪽은? 값은?\n\n### 코드 (선택)\n```python\nimport math\nprint(math.log2(8), math.log10(1000))\nprint(math.log(0.5))         # 자연로그\nprint(math.log(2) + math.log(5), math.log(10))\nprint(50 * math.log(0.5))\n```\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n1. $\\log_3 9$ = ?\n2. O/X: 확률의 로그는 항상 0 이하다.\n3. $\\ln(ab)$를 두 로그로 나누어 쓰면?\n4. 확률을 곱하는 대신 로그를 더하는 이유는?\n\n---\n\n## 한 줄 정리\n로그는 \"몇 제곱?\"이고, 곱을 합으로 바꿔 아주 작은 확률도 컴퓨터가 다룰 수 있게 한다.\n\n---\n\n<details>\n<summary>정답 보기 (먼저 풀고 열기!)<\/summary>\n\n**손계산**\n1. **4** ($2^4 = 16$)\n2. **−2** ($10^{-2} = 0.01$)\n3. **−3** ($2^{-3} = 1/8$)\n4. $\\ln 2 + \\ln 2$ = 0.693 + 0.693 = **1.386**\n5. 10 × (−0.693) = **−6.93**\n6. 0.9. $\\ln 0.9 \\approx -0.105$, $\\ln 0.1 \\approx -2.303$. 확률이 높을수록 로그 확률이 0에 가깝습니다.\n\n**퀴즈**\n1. 2\n2. O. 0보다 크고 1 이하인 수의 로그는 0 이하입니다. (확률 0의 로그는 정의되지 않고 −∞로 봅니다.)\n3. $\\ln a + \\ln b$\n4. 확률을 많이 곱하면 너무 작아져 컴퓨터에서 0이 되지만, 로그의 합은 적당한 크기로 남기 때문입니다.\n<\/details>\n", "link": "논문 연결: 학습 목표는 하는 것 (3.2절)", "lesson": true}, {"id": "prep05", "short": "Σ와 ∏ 읽기", "md": "# 준비 5. Σ와 ∏ 읽기\n\n30분 · 논문 연결: 식 (1)의 $\\prod$와 학습 목표의 $\\frac{1}{|S|}\\sum$ (2장, 3.2절)\n\n---\n\n## 오늘의 목표\n1. $\\sum$(시그마)를 보면 \"전부 더하기\"로 풀어 쓸 수 있다.\n2. $\\prod$(파이)를 보면 \"전부 곱하기\"로 풀어 쓸 수 있다.\n3. 아래첨자 $a_i$와 평균 $\\frac{1}{N}\\sum$을 읽을 수 있다.\n\n**복습 (1분):** $\\ln(ab)$ = ? (답: $\\ln a + \\ln b$)\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 아래첨자: 번호표\n숫자 목록 [4, 7, 1]이 있을 때, 칸마다 번호를 붙여 부릅니다.\n\n- $a_1 = 4$ (첫째 칸), $a_2 = 7$ (둘째 칸), $a_3 = 1$ (셋째 칸)\n- $a_i$: \"i번째 칸\". i는 1, 2, 3 중 아무거나 들어갈 수 있는 자리\n\n### 1-2. Σ = 전부 더하기\n$$\\sum_{i=1}^{3} a_i = a_1 + a_2 + a_3$$\n\n읽는 법: \"i를 1부터 3까지 바꿔 가며 $a_i$를 모두 더하라.\"\n- 아래 $i=1$: 어디서 시작\n- 위 3: 어디서 끝\n- 오른쪽 $a_i$: 무엇을 더할지\n\n[4, 7, 1]이면 4 + 7 + 1 = **12**.\n\n**펼쳐 쓰기가 핵심입니다.** 처음 보는 Σ가 나오면 i에 1, 2, 3을 넣어 실제로 써 보세요. 무섭던 식이 덧셈 세 개가 됩니다.\n\n### 1-3. Σ 안에 식이 있을 때\n$$\\sum_{i=1}^{3} 2 a_i = 2a_1 + 2a_2 + 2a_3 = 8 + 14 + 2 = 24$$\n\n$$\\sum_{i=1}^{3} a_i b_i = a_1 b_1 + a_2 b_2 + a_3 b_3$$\n\n두 번째 식이 1단계 첫날 배울 **내적**입니다. 같은 번호끼리 곱해서 모두 더하기. 마트 영수증이 바로 이것이에요: 가격 [1500, 3000, 800] × 개수 [2, 1, 3]을 같은 줄끼리 곱해 더하면 총액 8,400원.\n\n### 1-4. ∏ = 전부 곱하기\n$$\\prod_{t=1}^{3} p_t = p_1 \\times p_2 \\times p_3$$\n\nΣ와 읽는 법이 같고 **더하기 대신 곱하기**입니다. [0.5, 0.4, 0.9]면 0.5 × 0.4 × 0.9 = **0.18**.\n\n논문의 식 (1)은 \"단어 확률을 첫 단어부터 끝 단어까지 전부 곱하라\"를 ∏로 쓴 것입니다.\n\n### 1-5. 평균 = Σ를 개수로 나누기\n$$\\frac{1}{N} \\sum_{i=1}^{N} a_i$$\n\n\"N개를 다 더해서 N으로 나눈다\". [4, 7, 1]의 평균은 12 ÷ 3 = **4**. 논문의 학습 목표 $\\frac{1}{|S|}\\sum$는 \"모든 문장의 로그 확률의 평균\"입니다. ($|S|$는 \"문장 모음 S에 들어 있는 문장 개수\"라는 뜻입니다.)\n\n### 1-6. 로그가 ∏를 Σ로 바꾼다\n지난 레슨의 $\\ln(ab) = \\ln a + \\ln b$를 여러 개로 늘리면\n\n$$\\ln \\prod_{t} p_t = \\sum_{t} \\ln p_t$$\n\n**곱의 로그 = 로그의 합**. Σ와 ∏의 위아래 범위가 생략되면 \"가능한 것 전부\"라는 뜻입니다. $\\sum_x x \\cdot p(x)$처럼 번호 대신 **값 x 하나하나**를 돌며 더하는 Σ도 있어요. 1단계 기댓값에서 바로 씁니다. 2단계에서 논문의 식이 ∏에서 Σ로 바뀌는 장면이 바로 이 한 줄입니다.\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n**문제.** $a = [2, 3, 5]$, $b = [1, 0, 2]$일 때 $\\sum_{i=1}^{3} a_i b_i$는?\n\n1. 펼치기: $a_1 b_1 + a_2 b_2 + a_3 b_3$\n2. 넣기: 2×1 + 3×0 + 5×2\n3. 계산: 2 + 0 + 10 = **12**\n\n**문제.** $\\prod_{t=1}^{2} p_t$에서 $p = [0.5, 0.5]$이면? 로그를 씌우면?\n- 곱: 0.25\n- 로그: $\\ln 0.5 + \\ln 0.5 = -0.693 \\times 2 = -1.386$ (= $\\ln 0.25$ ✓)\n\n---\n\n## 3. 능동 연습 (10분)\n\n### 손계산\n1. $a = [3, 1, 4, 1]$일 때 $\\sum_{i=1}^{4} a_i$ = ?\n2. 같은 a로 $\\sum_{i=1}^{4} a_i^2$ = ? (먼저 펼쳐 쓰세요)\n3. $a = [1, 2]$, $b = [3, 4]$일 때 $\\sum_{i=1}^{2} a_i b_i$ = ?\n4. $\\prod_{t=1}^{3} p_t$, $p = [0.5, 0.2, 0.5]$ = ?\n5. [2, 4, 6, 8]의 평균을 $\\frac{1}{N}\\sum$으로 계산하세요.\n6. $\\sum_{i=2}^{3} a_i$ (a = [3, 1, 4, 1])는? 시작이 2라는 데 주의.\n\n### 코드 (선택)\n```python\nimport math\na = [3, 1, 4, 1]\nprint(sum(a))                       # Σ\nprint(sum(x * x for x in a))        # Σ a_i^2\nprint(math.prod([0.5, 0.2, 0.5]))   # ∏\nprint(sum(a) / len(a))              # 평균\n```\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n1. $\\sum$와 $\\prod$는 각각 무엇을 하라는 기호인가요?\n2. $\\sum_{i=1}^{3} a_i$를 펼쳐 쓰세요.\n3. O/X: $\\ln \\prod_t p_t = \\prod_t \\ln p_t$\n4. $\\frac{1}{N}\\sum_{i=1}^{N} a_i$의 이름은?\n\n---\n\n## 한 줄 정리\nΣ는 전부 더하기, ∏는 전부 곱하기. 처음 보면 i에 숫자를 넣어 펼쳐 쓴다.\n\n---\n\n<details>\n<summary>정답 보기 (먼저 풀고 열기!)<\/summary>\n\n**손계산**\n1. 3 + 1 + 4 + 1 = **9**\n2. 9 + 1 + 16 + 1 = **27**\n3. 1×3 + 2×4 = **11**\n4. 0.5 × 0.2 × 0.5 = **0.05**\n5. (2 + 4 + 6 + 8) ÷ 4 = **5**\n6. $a_2 + a_3$ = 1 + 4 = **5**\n\n**퀴즈**\n1. Σ는 전부 더하기, ∏는 전부 곱하기\n2. $a_1 + a_2 + a_3$\n3. X. 곱의 로그는 로그의 **합**입니다: $\\sum_t \\ln p_t$\n4. 평균\n<\/details>\n", "link": "논문 연결: 식 (1)의 와 학습 목표의 (2장, 3.2절)", "lesson": true}, {"id": "prep06", "short": "함수와 그래프", "md": "# 준비 6. 함수와 그래프\n\n30분 · 논문 연결: LSTM 안의 시그모이드와 tanh (2장)\n\n---\n\n## 오늘의 목표\n1. 함수를 \"숫자를 넣으면 숫자가 나오는 기계\"로 이해하고 값표를 만들 수 있다.\n2. 직선 함수와 휘어진(비선형) 함수를 그래프로 구별할 수 있다.\n3. 신경망에서 자주 쓰는 ReLU, 시그모이드, tanh의 모양과 값의 범위를 안다.\n\n**복습 (1분):** $e^0$ = ? (답: 1)\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 함수 = 숫자 기계\n$f(x) = 2x + 1$은 \"x를 넣으면 2배 하고 1을 더해서 내보낸다\"는 기계입니다.\n\n| 넣는 수 x | −1 | 0 | 1 | 2 | 3 |\n|---|---|---|---|---|---|\n| 나오는 수 f(x) | −1 | 1 | 3 | 5 | 7 |\n\n- $f(3)$: \"f에 3을 넣은 결과\" = 7\n- **그래프**: 값표의 (x, f(x)) 점을 찍어 이은 그림\n\n### 1-2. 직선과 기울기\n$f(x) = 2x + 1$의 점을 이으면 **직선**입니다. x가 1 늘 때마다 f(x)가 항상 2씩 늡니다. 이 \"x가 1 늘 때 얼마나 느나\"를 **기울기**라고 합니다.\n\n$$\\text{기울기} = \\frac{\\text{세로로 변한 양}}{\\text{가로로 변한 양}} = \\frac{5 - 3}{2 - 1} = 2$$\n\n- 기울기가 양수: 오른쪽으로 갈수록 올라감\n- 기울기가 음수: 내려감\n- 0: 평평함\n\n이 기울기 개념이 1단계 \"기울기를 숫자로 느끼기\"와 2단계 경사하강의 씨앗입니다.\n\n### 1-3. 휘어진 함수 = 비선형\n$f(x) = x^2$은 어떨까요?\n\n| x | −2 | −1 | 0 | 1 | 2 |\n|---|---|---|---|---|---|\n| $x^2$ | 4 | 1 | 0 | 1 | 4 |\n\n점을 이으면 U자로 휘어집니다. **곳에 따라 기울기가 다릅니다.** 이렇게 직선이 아닌 함수를 **비선형 함수**라고 부릅니다.\n\n신경망이 비선형 함수를 꼭 쓰는 이유: 직선 함수를 여러 번 겹쳐(차례로) 적용해도 결국 직선 하나와 같아서, 복잡한 패턴을 못 배우기 때문입니다.\n\n### 1-4. 신경망의 단골 함수 세 가지\n| 이름 | 하는 일 | 나오는 값의 범위 |\n|---|---|---|\n| ReLU | 음수는 0으로, 양수는 그대로 | 0 이상 |\n| 시그모이드 σ | 어떤 수든 0과 1 사이로 눌러 줌 | 0 ~ 1 |\n| tanh | 어떤 수든 −1과 1 사이로 눌러 줌 | −1 ~ 1 |\n\n값표로 보면 이렇습니다 (소수 셋째 자리까지).\n\n| x | −2 | −1 | 0 | 1 | 2 |\n|---|---|---|---|---|---|\n| ReLU(x) | 0 | 0 | 0 | 1 | 2 |\n| σ(x) | 0.119 | 0.269 | **0.5** | 0.731 | 0.881 |\n| tanh(x) | −0.964 | −0.762 | **0** | 0.762 | 0.964 |\n\n- 시그모이드는 \"0~1 사이의 문 열림 정도\"로 쓰기 좋습니다. 2단계에서 만날 LSTM(문장을 읽으며 기억을 이어 가는 신경망)은 이 값으로 \"기억을 얼마나 남길지\" 정하는 문, 즉 **게이트**를 만듭니다.\n- tanh는 0을 중심으로 양쪽이 대칭이라 LSTM이 담아 두는 **기억 값**에 씁니다.\n- 주의: 시그모이드의 기호 σ는 1단계 기댓값 레슨에서 **표준편차**라는 전혀 다른 뜻으로도 나옵니다. 같은 글자, 다른 뜻이에요.\n\n공식은 지금 외우지 않아도 됩니다. 시그모이드는 $\\sigma(x) = \\frac{1}{1 + e^{-x}}$, 지난 레슨들의 $e^x$로 만든 함수라는 것만 알아 두세요.\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n**문제.** $f(x) = 3x - 2$에서 $f(0)$, $f(2)$, 기울기는?\n1. $f(0) = 3 \\times 0 - 2 = -2$\n2. $f(2) = 3 \\times 2 - 2 = 4$\n3. 기울기 = (4 − (−2)) ÷ (2 − 0) = 6 ÷ 2 = **3** (식의 x 앞 숫자와 같습니다)\n\n**문제.** 입력 [−3, 0.5, 2]에 ReLU를 적용하면?\n- 음수는 0, 양수는 그대로: **[0, 0.5, 2]**\n\n---\n\n## 3. 능동 연습 (10분)\n\n### 손계산\n1. $f(x) = x + 4$의 값표를 x = −1, 0, 1로 만드세요.\n2. 1번 함수의 기울기는?\n3. $f(x) = -2x$는 오른쪽으로 갈수록 올라가나요, 내려가나요?\n4. $g(x) = x^2$에서 x가 1→2로 갈 때와 2→3으로 갈 때 늘어난 양은 각각? 직선인가요?\n5. ReLU([−1, 3, −0.5, 0]) = ?\n6. 값표를 보고: σ(0)과 tanh(0)은 각각?\n\n### 코드 (선택)\n```python\nimport math\nf = lambda x: 2 * x + 1\nprint([f(x) for x in [-1, 0, 1, 2, 3]])\nrelu = lambda x: max(0, x)\nsigmoid = lambda x: 1 / (1 + math.exp(-x))\nprint([relu(x) for x in [-2, -1, 0, 1, 2]])\nprint([round(sigmoid(x), 3) for x in [-2, -1, 0, 1, 2]])\nprint([round(math.tanh(x), 3) for x in [-2, -1, 0, 1, 2]])\n```\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n1. $f(x) = 5x$일 때 $f(2)$ = ?\n2. O/X: 기울기가 음수인 직선은 오른쪽으로 갈수록 내려간다.\n3. 시그모이드의 출력은 어느 범위인가요?\n4. 신경망이 비선형 함수를 쓰는 이유를 한 문장으로.\n\n---\n\n## 한 줄 정리\n함수는 숫자 기계, 기울기는 가파른 정도. 신경망은 휘어진 함수(ReLU, 시그모이드, tanh)로 복잡한 패턴을 만든다.\n\n---\n\n<details>\n<summary>정답 보기 (먼저 풀고 열기!)<\/summary>\n\n**손계산**\n1. 3, 4, 5\n2. **1**\n3. 내려갑니다 (기울기 −2)\n4. 3과 5. 늘어나는 양이 달라서 직선이 **아닙니다** (휘어진 함수).\n5. **[0, 3, 0, 0]**\n6. σ(0) = **0.5**, tanh(0) = **0**\n\n**퀴즈**\n1. 10\n2. O\n3. 0과 1 사이\n4. 직선 함수를 여러 번 겹쳐 적용해도 결국 직선 하나와 같아서 복잡한 패턴을 표현할 수 없기 때문입니다.\n<\/details>\n", "link": "논문 연결: LSTM 안의 시그모이드와 tanh (2장)", "lesson": true}, {"id": "prep07", "short": "파이썬과 numpy 첫걸음", "md": "# 준비 7. 파이썬과 numpy 첫걸음\n\n30분 · 논문 연결: 레슨마다 나오는 \"코드\" 칸을 읽고 실행하기 위한 준비\n\n---\n\n## 오늘의 목표\n1. 파이썬 코드 몇 줄을 읽고 무슨 계산인지 말할 수 있다.\n2. numpy 배열의 shape(모양)을 읽고, 칸 하나를 꺼낼 수 있다.\n3. 지금까지 손으로 한 계산(합, 곱, 제곱근, exp, log)을 코드 한 줄로 확인할 수 있다.\n\n**알아 둘 것:** 이 교재의 코드는 전부 **선택**입니다. 손계산만 해도 진도는 나갑니다. 다만 코드는 \"내 손계산이 맞았는지 확인하는 계산기\"로 아주 좋습니다.\n\n**실행하는 곳:** 설치 없이 브라우저에서 됩니다. 구글에 \"Colab\"을 검색해 새 노트를 열고, 코드를 붙여 넣고 ▶를 누르세요.\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 변수와 출력\n```python\nx = 3            # x라는 이름표에 3을 담는다\ny = x * 2 + 1    # 7\nprint(y)         # 화면에 보여 준다\n```\n- `=`는 \"같다\"가 아니라 **\"오른쪽 값을 왼쪽 이름에 담아라\"**\n- `#` 뒤는 사람이 읽는 메모. 컴퓨터는 무시합니다\n- `**`는 거듭제곱: `2 ** 3`은 8\n\n### 1-2. 리스트: 숫자 목록\n```python\na = [4, 7, 1]\nprint(a[0])      # 4  ← 번호가 0부터 시작!\nprint(len(a))    # 3  (칸 수)\nprint(sum(a))    # 12 (Σ)\n```\n수학에서는 $a_1$이 첫 칸이지만 파이썬은 **`a[0]`이 첫 칸**입니다. 가장 흔한 함정이에요.\n\n### 1-3. numpy: 숫자 목록을 한꺼번에 계산\n```python\nimport numpy as np        # numpy를 np라는 별명으로 불러온다\na = np.array([1, 2, 3])\nb = np.array([4, 5, 6])\nprint(a + b)              # [5 7 9]   칸끼리 더하기\nprint(a * 2)              # [2 4 6]   모든 칸에 2 곱하기\nprint(a * b)              # [ 4 10 18] 칸끼리 곱하기\nprint(a @ b)              # 32        내적 (1×4 + 2×5 + 3×6)\n```\n`@`는 내적 기호입니다. **내적**은 같은 자리끼리 곱해서 모두 더하는 계산이에요. 1단계 첫 레슨에서 제대로 배우니 지금은 이름만 봐 두세요.\n\n### 1-4. shape: 배열의 모양\n```python\nM = np.array([[1, 2, 3],\n              [4, 5, 6]])\nprint(M.shape)     # (2, 3)  → 2행 3열\nprint(M[0, 2])     # 3       → 0번 행, 2번 열\nprint(a.shape)     # (3,)    → 칸 3개짜리 벡터\n```\n행은 가로줄, 열은 세로줄입니다. 영화관 좌석 \"2줄 3번\"처럼 읽으세요. `(3,)`의 쉼표는 \"칸 3개짜리 한 줄\"이라는 파이썬식 표기입니다. 논문의 \"1000차원 벡터\"는 shape `(1000,)`입니다.\n\n### 1-5. (선택) axis: 어느 방향으로 더할까\n```python\nprint(M.sum())          # 21        전부\nprint(M.sum(axis=0))    # [5 7 9]   세로로(행들을 눌러서) 더하기\nprint(M.sum(axis=1))    # [ 6 15]   가로로(열들을 눌러서) 더하기\n```\n표의 맨 아래 \"합계\" 줄이 `axis=0`, 맨 오른쪽 \"합계\" 칸이 `axis=1`입니다. 지금 헷갈려도 괜찮아요. 필요할 때 다시 오면 됩니다.\n\n### 1-6. 준비편의 계산을 코드로\n```python\nprint(np.sqrt(25))               # 5.0\nprint(np.exp(1), np.exp(-1))     # 2.718... 0.367...\nprint(np.log(0.5))               # -0.693...  (자연로그)\nprint(np.log(np.array([0.5, 0.5, 0.1])).sum())   # -3.689 (준비 4의 예제)\n```\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n**문제.** 화살표 [3, 4]의 길이를 코드로 구하세요.\n```python\nv = np.array([3, 4])\nprint(np.sqrt((v ** 2).sum()))   # 5.0\n```\n읽는 순서: 안쪽부터. ① `v ** 2` → [9, 16] ② `.sum()` → 25 ③ `np.sqrt` → 5.0. 준비 3의 \"제곱 → 더하기 → √\" 그대로입니다.\n\n**문제.** 주사위 눈의 평균은? (1단계에서 \"기댓값\"이라고 부릅니다)\n```python\nx = np.array([1, 2, 3, 4, 5, 6])\np = np.ones(6) / 6               # np.ones(6)은 1이 6개인 배열. 6으로 나누면 [1/6, 1/6, ...]\nprint((x * p).sum())             # 3.5\n```\n\n---\n\n## 3. 능동 연습 (10분)\n\n### 눈으로 실행하기 (코드를 돌리기 전에 결과를 먼저 적어 보세요)\n1. `a = [10, 20, 30]`일 때 `a[1]`은?\n2. `np.array([1, 2]) * np.array([3, 4])`의 결과는?\n3. `np.array([1, 2]) @ np.array([3, 4])`의 결과는?\n4. `np.zeros((4, 1000))`의 shape은? (`np.zeros`는 0으로 채운 배열을 만듭니다)\n5. (선택) `M = np.array([[1, 2], [3, 4]])`일 때 `M.sum(axis=0)`은?\n6. `2 ** -1`은?\n\n### 직접 돌려 보기\n위 6개를 Colab에 넣어 답을 확인하세요. 틀린 게 있다면 **어디서 예상과 달랐는지**가 오늘 배운 것입니다.\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n1. 파이썬 리스트의 첫 칸 번호는?\n2. `*`와 `@`의 차이는?\n3. shape `(2, 3)`은 몇 행 몇 열인가요?\n4. O/X: 이 교재는 코드를 실행하지 않으면 다음 레슨으로 갈 수 없다.\n\n---\n\n## 한 줄 정리\nnumpy는 숫자 목록을 한꺼번에 계산하는 계산기. 번호는 0부터, `*`는 칸끼리 곱, `@`는 내적.\n\n---\n\n<details>\n<summary>정답 보기 (먼저 풀고 열기!)<\/summary>\n\n**눈으로 실행하기**\n1. **20** (번호가 0부터라 `a[1]`은 둘째 칸)\n2. **[3 8]** (칸끼리 곱)\n3. **11** (1×3 + 2×4)\n4. **(4, 1000)**\n5. **[4 6]** (세로로 더하기: 1+3, 2+4)\n6. **0.5**\n\n**퀴즈**\n1. 0\n2. `*`는 같은 자리끼리 곱한 배열, `@`는 그걸 다 더한 내적(또는 행렬곱)\n3. 2행 3열\n4. X. 코드는 선택입니다. 손계산 확인용 계산기로 쓰세요.\n<\/details>\n", "link": "논문 연결: 레슨마다 나오는 칸을 읽고 실행하기 위한 준비", "lesson": true}, {"id": "dx01", "short": "기울기를 숫자로 느끼기", "md": "# 1단계. 기울기를 숫자로 느끼기\n\n30분 · 논문 연결: 학습률 0.7의 SGD(확률적 경사하강, 오늘 배우는 경사하강을 데이터 묶음마다 하는 방법)로 파라미터를 고친다 (3.4절)\n\n---\n\n## 오늘의 목표\n1. \"조금 움직여 보고 변화량을 나누는\" 방법으로 휘어진 함수의 기울기를 구할 수 있다.\n2. 기울기의 부호가 \"어느 쪽으로 가야 값이 줄어드는지\"를 알려 준다는 걸 안다.\n3. 기호 $\\frac{dL}{dw}$, $\\frac{\\partial L}{\\partial w}$를 \"기울기\"라고 읽을 수 있다.\n\n**복습 (1분):** $f(x) = 2x + 1$의 기울기는? (답: 2)\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 휘어진 함수의 기울기는 곳마다 다르다\n준비편에서 직선의 기울기는 어디서나 같았습니다. 그런데 신경망의 **손실**(틀린 정도) $L(w) = (w - 3)^2$ 같은 U자 함수는 곳마다 가파른 정도가 다릅니다. 그럼 \"한 점에서의 기울기\"는 어떻게 잴까요?\n\n### 1-2. 아주 조금 움직여 보기\nw를 **0.01만큼** 움직이고, L이 얼마나 변했는지 봅니다. 그 변화량을 0.01로 나누면 그 점의 기울기에 아주 가깝습니다.\n\n$$\\text{기울기} \\approx \\frac{L(w + 0.01) - L(w)}{0.01}$$\n\n$L(w) = (w - 3)^2$로 직접 해 봅니다.\n\n| w | L(w) | L(w + 0.01) | 변화량 | ÷ 0.01 |\n|---|---|---|---|---|\n| 1 | 4 | 3.9601 | −0.0399 | **약 −4** |\n| 2 | 1 | 0.9801 | −0.0199 | **약 −2** |\n| 3 | 0 | 0.0001 | 0.0001 | **약 0** |\n| 4 | 1 | 1.0201 | 0.0201 | **약 2** |\n| 5 | 4 | 4.0401 | 0.0401 | **약 4** |\n\n### 1-3. 표에서 보이는 것\n- 오른쪽 열이 **2 × (w − 3)**과 거의 같습니다. w = 1이면 2 × (−2) = −4. 이런 정확한 식을 구하는 계산을 **미분**이라고 부릅니다. 지금은 표로 충분합니다.\n- **기울기가 음수**(w = 1, 2): w를 늘리면 L이 줄어듭니다 → 오른쪽으로 가야 함\n- **기울기가 양수**(w = 4, 5): w를 늘리면 L이 커집니다 → 왼쪽으로 가야 함\n- **기울기가 0**(w = 3): 바닥. 손실이 가장 작은 곳\n\n### 1-4. 기호 읽기\n- $\\frac{dL}{dw}$: \"w를 조금 바꿀 때 L이 바뀌는 비율\", 즉 기울기\n- $\\frac{\\partial L}{\\partial w}$ (∂는 \"라운드\"): 변수가 여러 개일 때 **w 하나만** 조금 움직여서 잰 기울기\n\n신경망에는 w가 수억 개 있어서 논문은 ∂를 씁니다. 뜻은 오늘 표와 똑같습니다.\n\n### 1-5. 경사하강: 기울기 반대로 한 걸음\n$$w \\leftarrow w - \\eta \\cdot \\text{기울기}$$\n\n- ← : \"오른쪽 값으로 바꿔 넣어라\"\n- η (에타): **학습률**, 한 걸음의 크기. 오늘의 장면에서 눈을 가리고 내려가는 사람의 **보폭**입니다. 논문은 0.7을 썼습니다\n\n기울기가 음수면 빼기의 빼기라 w가 늘고, 양수면 w가 줄어듭니다. **언제나 바닥 쪽 방향으로** 움직입니다. (걸음이 너무 크면 바닥을 지나칠 수 있어요. 연습 5번에서 확인합니다.)\n\n---\n\n## 2. 예제 따라하기 (6분)\n\nw = 1에서 시작, η = 0.1로 두 걸음 걸어 봅니다. (기울기 = 2(w − 3))\n\n| 걸음 | w | 기울기 | 새 w = w − 0.1 × 기울기 | 새 L |\n|---|---|---|---|---|\n| 1 | 1 | −4 | 1 + 0.4 = **1.4** | 2.56 |\n| 2 | 1.4 | −3.2 | 1.4 + 0.32 = **1.72** | 1.64 |\n\nL이 4 → 2.56 → 1.64로 줄었습니다. 계속 걸으면 w는 3에 다가갑니다. 이것이 신경망이 \"배우는\" 방법의 전부입니다.\n\n---\n\n## 3. 능동 연습 (10분)\n\n### 손계산\n1. $L(w) = (w - 3)^2$에서 w = 0일 때 L(0)과 L(0.01)을 구하고, 변화량 ÷ 0.01로 기울기를 어림하세요.\n2. 1번 결과를 2(w − 3)과 비교하세요.\n3. w = 6에서 기울기의 부호는? w를 늘려야 하나요, 줄여야 하나요?\n4. w = 5, η = 0.1에서 경사하강 한 걸음 후의 w는?\n5. 학습률을 1.0으로 키우면 w = 5에서 한 걸음 후 어디로 가나요? 좋은 걸음인가요?\n6. (선택, 코드로 확인해도 좋아요) $f(x) = x^2$에서 x = 2일 때 기울기를 0.01 방법으로 어림하세요.\n\n### (선택) 연쇄법칙 맛보기\n1시간 걸으면 4 km를 가고, 1 km마다 50 kcal를 씁니다. 1시간에 몇 kcal? **4 × 50 = 200**. \"시간 → 거리 → 칼로리\"처럼 이어진 변화율은 **곱하면** 됩니다. 신경망의 층이 여러 개일 때 기울기를 구하는 방법(역전파)이 바로 이 곱셈입니다. 3단계에서 자세히 합니다.\n\n### 코드 (선택)\n```python\nL = lambda w: (w - 3) ** 2\nfor w in [1, 2, 3, 4, 5]:\n    print(w, round((L(w + 0.01) - L(w)) / 0.01, 2))\nw, lr = 1.0, 0.1\nfor step in range(20):\n    w = w - lr * 2 * (w - 3)\nprint(w)    # 3에 가까워짐\n```\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n1. 휘어진 함수의 한 점에서 기울기를 어림하는 방법은?\n2. O/X: 기울기가 양수이면 w를 늘려야 손실이 준다.\n3. $\\frac{\\partial L}{\\partial w}$를 말로 읽어 보세요.\n4. 학습률이 너무 크면 어떤 일이 생길 수 있나요?\n\n---\n\n## 한 줄 정리\n기울기는 \"조금 움직였을 때 변화량 ÷ 움직인 양\". 그 반대 방향으로 조금씩 걸으면 손실의 바닥에 닿는다.\n\n---\n\n<details>\n<summary>정답 보기 (먼저 풀고 열기!)<\/summary>\n\n**손계산**\n1. L(0) = 9, L(0.01) = (−2.99)² = 8.9401. 변화량 −0.0599 ÷ 0.01 = **약 −6**\n2. 2 × (0 − 3) = −6. 거의 같습니다.\n3. 2 × (6 − 3) = 6, **양수**. w를 **줄여야** 합니다.\n4. 기울기 2 × (5 − 3) = 4 → 5 − 0.1 × 4 = **4.6**\n5. 5 − 1.0 × 4 = **1**. 바닥(3)을 지나쳐 반대편으로 갔습니다. L(5) = 4, L(1) = 4로 손실이 그대로라 좋은 걸음이 아닙니다. 걸음이 너무 크면 바닥을 넘나들거나 오히려 멀어집니다.\n6. (4.0401 − 4) ÷ 0.01 = **약 4** (정확히는 2x = 4)\n\n**퀴즈**\n1. 아주 조금(예: 0.01) 움직여서 변한 양을 움직인 양으로 나눕니다.\n2. X. 양수면 늘릴수록 손실이 커지니 **줄여야** 합니다.\n3. \"다른 변수는 그대로 두고 w만 조금 바꿀 때 L이 바뀌는 비율\"\n4. 바닥을 지나쳐 왔다 갔다 하거나, 손실이 오히려 커질 수 있습니다.\n<\/details>\n", "link": "논문 연결: 학습률 0.7의 SGD(확률적 경사하강, 오늘 배우는 경사하강을 데이터 묶음마다 하는 방법)로 파라미터를 고친다 (3.4절)", "lesson": true}, {"id": "ev01", "short": "기댓값과 분산", "md": "# 1단계. 기댓값과 분산\n\n30분 · 논문 연결: 엔트로피는 \"놀람의 기댓값\", 초기화는 \"분산이 작은 무작위 수\" (3.4절)\n\n---\n\n## 오늘의 목표\n1. 기댓값을 \"확률로 가중한 평균\"으로 설명하고, 표로 계산할 수 있다.\n2. 분산과 표준편차가 \"얼마나 퍼져 있나\"를 재는 값이라는 걸 안다.\n3. 주사위 하나의 기댓값과 분산을 손으로 구할 수 있다.\n\n**복습 (1분):** [4, 7, 1]의 평균은? (답: 4)\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 기댓값 = 오래 반복하면 평균적으로 나오는 값\n동전을 던져 앞면이면 1000원, 뒷면이면 0원을 받는 게임. 한 번 할 때 평균 얼마를 받을까요?\n\n| 결과 | 받는 돈 x | 확률 p | x × p |\n|---|---|---|---|\n| 앞면 | 1000 | 0.5 | 500 |\n| 뒷면 | 0 | 0.5 | 0 |\n| | | **합** | **500** |\n\n기댓값은 **500원**. 한 번에 500원을 받는 일은 없지만, 100번 하면 대략 5만 원을 받습니다. 그래서 이 게임의 **공정한 참가비는 500원**입니다. 카지노는 이 값보다 비싸게 받아 돈을 법니다. \"1000원 내고 주사위 6이 나오면 5000원\" 게임의 기댓값은 5000 × 1/6 ≈ 833원이라, 한 판마다 손님이 평균 167원을 잃어요.\n\n$$E[X] = \\sum_x x \\cdot p(x)$$\n\n읽는 법: \"가능한 값마다 (값 × 그 확률)을 모두 더하라\". 준비편에서 배운 Σ 그대로입니다. 대문자 **X**는 \"아직 정해지지 않은 결과\"(확률변수, 예: 던지기 전의 동전), 소문자 **x**는 그 결과가 가질 수 있는 구체적인 값(1000, 0)입니다.\n\n### 1-2. 왜 \"가중\" 평균인가\n확률이 다르면 자주 나오는 값에 더 큰 무게를 줍니다. 앞면 확률이 0.9인 동전이면 1000 × 0.9 + 0 × 0.1 = 900원. 모든 확률이 같으면 보통 평균과 같아집니다.\n\n### 1-3. 분산 = 평균에서 얼마나 멀리 퍼지나\n두 반의 시험 점수 평균이 둘 다 70점이어도\n- A반: 69, 70, 71 (모여 있음)\n- B반: 40, 70, 100 (퍼져 있음)\n\n퍼진 정도를 재는 방법:\n1. 각 값이 평균에서 얼마나 떨어졌는지 구한다 (편차)\n2. 편차를 **제곱**한다 (음수와 양수가 서로 지워지지 않게)\n3. 그 제곱들의 **기댓값**을 구한다 → **분산** $\\text{Var}(X)$\n\n**표준편차** σ = 분산의 제곱근. 단위를 원래 값과 같게 되돌린 것입니다.\n\n---\n\n## 2. 예제 따라하기 (6분): 주사위 하나\n\n눈 1~6이 각각 확률 1/6입니다.\n\n**기댓값**\n$$E[X] = (1 + 2 + 3 + 4 + 5 + 6) \\times \\frac{1}{6} = \\frac{21}{6} = 3.5$$\n\n**분산** (평균 3.5에서 떨어진 정도를 제곱)\n\n| 눈 x | x − 3.5 | (x − 3.5)² |\n|---|---|---|\n| 1 | −2.5 | 6.25 |\n| 2 | −1.5 | 2.25 |\n| 3 | −0.5 | 0.25 |\n| 4 | 0.5 | 0.25 |\n| 5 | 1.5 | 2.25 |\n| 6 | 2.5 | 6.25 |\n| | **합** | **17.5** |\n\n각 눈의 확률이 1/6이니 17.5 × 1/6 = **2.917** (= 35/12). 표준편차는 √2.917 ≈ **1.71**.\n\n주사위 눈은 평균 3.5에서 대략 ±1.7 정도 퍼져 있다는 뜻입니다.\n\n---\n\n## 3. 능동 연습 (10분)\n\n### 손계산\n1. 이길 확률 0.2로 5000원, 질 확률 0.8로 0원인 게임의 기댓값은?\n2. 값 [2, 4, 6]이 각각 확률 1/3일 때 기댓값은?\n3. 2번의 분산을 표로 구하세요.\n4. A반 69, 70, 71과 B반 40, 70, 100 (각 학생 확률 1/3) 중 분산이 큰 반은? 직접 계산해 보세요.\n5. 분산이 9이면 표준편차는?\n6. 날씨 앱: 내일 비 올 확률 0.3, 비가 오면 우산 판매 100개, 안 오면 20개. 판매량의 기댓값은?\n\n> **(선택) 평균을 내면 퍼짐이 줄어든다.** 주사위 하나의 표준편차는 약 1.71이지만, 주사위 100개를 던져 평균을 내면 표준편차가 $1.71 / \\sqrt{100} = 0.171$로 10분의 1이 됩니다. 일반적으로 n개 평균의 표준편차는 $\\sigma / \\sqrt{n}$. 2단계 중심극한정리에서 이 식을 다시 만납니다.\n\n### 앞으로 이렇게 씁니다\n- **엔트로피 (2단계)**: \"놀람\"의 기댓값. 놀람 값 × 그 확률을 모두 더한 것\n- **초기화 (2단계)**: 신경망의 시작 숫자를 \"평균 0, 분산이 아주 작은\" 무작위 수로 뽑습니다. 분산이 크면 계산이 폭발합니다\n\n### 코드 (선택)\n```python\nxs = [1, 2, 3, 4, 5, 6]\np = 1 / 6\nE = sum(x * p for x in xs)\nVar = sum((x - E) ** 2 * p for x in xs)\nprint(E, Var, Var ** 0.5)     # 3.5 2.916... 1.707...\n```\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n1. 기댓값을 한 문장으로 설명하세요.\n2. O/X: 평균이 같으면 분산도 같다.\n3. 분산을 구할 때 편차를 제곱하는 이유는?\n4. 표준편차와 분산은 어떤 관계인가요?\n\n---\n\n## 한
