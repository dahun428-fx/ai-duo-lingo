 떨어졌나)\n3. 배치 크기를 128에서 512로 늘리면 기울기 추정의 표준편차는 몇 배가 되나요?\n4. 입력이 1000개가 아니라 4000개인 층에서 z의 분산을 1000개일 때와 같게 하려면 균등분포 범위 a를 몇 배로 해야 하나요?\n\n### 코드: CLT를 눈으로 보기\n```python\nimport numpy as np\nrng = np.random.default_rng(0)\n\ndef text_hist(x, bins=15, width=40):\n    counts, edges = np.histogram(x, bins=bins)\n    for c, e in zip(counts, edges):\n        print(f\"{e:7.2f} | \" + \"#\" * int(width * c / counts.max()))\n\n# 1) 주사위 1개 vs 주사위 30개의 평균\none = rng.integers(1, 7, size=100_000)\nmean30 = rng.integers(1, 7, size=(100_000, 30)).mean(axis=1)\nprint(\"주사위 1개\"); text_hist(one, bins=6)\nprint(\"\\n주사위 30개 평균\"); text_hist(mean30)\nprint(\"예측 σ:\", 1.708 / np.sqrt(30), \" 실제 σ:\", mean30.std())\n\n# 2) 논문 초기화: z = Σ w_i x_i\nW = rng.uniform(-0.08, 0.08, size=(5000, 1000))   # 뉴런 5000개\nx = rng.standard_normal(1000)\nz = W @ x\nprint(\"\\n초기화 후 z 분포 (σ 예측 ≈ 1.46):\", z.std().round(3)); text_hist(z)\n```\n\n**도전 과제 (선택: 시간이 남을 때만)**\n- (a) 주사위 대신 **아주 비대칭인 분포**(예: `rng.exponential(1, size=(100_000, n))`)로 n = 1, 5, 50의 평균 히스토그램을 그려 보세요. n이 커질수록 어떻게 변하나요?\n- (b) 초기화 범위를 0.08 → 0.5로 바꾸고 `np.tanh(z)`의 히스토그램을 그려 보세요. 값이 ±1에 몰리는 \"포화\"가 보이나요? 이게 왜 학습에 나쁠까요? (힌트: tanh 그래프 끝부분의 기울기)\n- (c) 미니배치 실험: 평균 2, 표준편차 5인 \"기울기 샘플\"을 만들고, 배치 크기 1, 16, 128로 평균을 1000번씩 구해 표준편차를 비교하세요.\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n\n1. CLT를 한 문장으로 말하면?\n2. n개 평균의 표준편차는 원래 표준편차의 몇 배?\n3. O/X: CLT는 원래 분포가 정규분포일 때만 성립한다.\n4. 논문의 초기화에서 CLT가 적용되는 \"많은 무작위 값의 합\"은 무엇인가요?\n5. 미니배치 크기를 키우면 얻는 것과 잃는 것은?\n\n---\n\n## 한 줄 정리\n> \"무작위를 많이 더하면 종 모양이 되고 흔들림은 √n분의 1로 준다 — 초기화 범위와 배치 128은 이 원리 위에 서 있다.\"\n\n---\n\n<details>\n<summary>정답 보기<\/summary>\n\n**손계산**\n1. E = 0.5, Var = E[X²] − E[X]² = 0.5 − 0.25 = **0.25**\n2. 기댓값 50, 분산 100×0.25 = 25 → σ = **5**. 60개는 평균보다 2σ 위 → 정규분포에서 약 2.3% 정도로 **드문 편**.\n3. √(128/512) = **1/2배**\n4. 분산 = n × a²/3를 같게 → a² 을 1/4로 → a를 **1/2배** (0.04). (이것이 Xavier/He 초기화의 아이디어: 범위를 1/√n에 비례하게)\n\n**코드 도전**\n- (a) n=1은 한쪽으로 긴 꼬리, n=5는 조금 덜 비대칭, n=50은 거의 대칭 종 모양.\n- (b) 대부분 ±1 근처로 몰림. 그 영역에선 tanh 기울기가 거의 0 → 기울기가 전달되지 않아 학습이 멈춤 ([Day 11](#day11) \"기울기 소실\"과 연결).\n- (c)\n  ```python\n  for B in [1, 16, 128]:\n      means = rng.normal(2, 5, size=(1000, B)).mean(axis=1)\n      print(B, means.std().round(3))   # ≈ 5, 1.25, 0.44\n  ```\n\n**퀴즈**\n1. 독립·동일분포이고 분산이 유한한 무작위 값을 많이 더하면(평균 내면) 원래 분포와 무관하게 정규분포에 가까워진다.\n2. 1/√n\n3. X\n4. 뉴런 입력 z = Σ wᵢxᵢ (1000개 항의 합)\n5. 얻는 것: 기울기 추정이 덜 흔들림. 잃는 것: 스텝당 계산·메모리 증가 (같은 계산량으로 걸음 수가 줄어듦)\n<\/details>\n", "link": "논문 연결: 3.4절 , 배치 128문장, 기울기 g를 128로 나눠 평균을 쓴다는 대목", "lesson": true}, {"id": "day10", "short": "RNN 한 스텝 손계산 + Teacher Forcing", "md": "# Day 10. RNN 한 스텝 손계산 + Teacher Forcing\n\n30분 · 논문 연결: **2장** 디코더가 $y_1, \\dots, y_{t-1}$을 보고 $y_t$를 예측하는 구조, **3.2절** 학습 목표 $\\log p(T\\mid S)$ (정답 문장 T를 그대로 조건으로 씀)\n\n---\n\n## 오늘의 목표\n1. 순환신경망(RNN)의 한 스텝 $h_t = \\tanh(W_h h_{t-1} + W_x x_t + b)$를 손으로 계산할 수 있다.\n2. **Teacher forcing**이 무엇인지, 왜 학습할 때 쓰는지 설명할 수 있다.\n3. Teacher forcing의 약점(**exposure bias**, 학습-추론 불일치)을 코드로 직접 본다.\n\n**복습 (1분):** 논문 식 (1)에서 $y_t$를 예측할 때 조건으로 쓰는 두 가지는? (답: v, 그리고 앞 단어 $y_1..y_{t-1}$)\n\n---\n\n## 1. 개념 A: RNN 한 스텝 (4분)\n\n문장은 길이가 제각각이라, **같은 계산을 단어마다 반복**하면서 \"기억(은닉 상태) h\"를 갱신합니다.\n$$h_t = \\tanh(W_h\\,h_{t-1} + W_x\\,x_t + b)$$\n- $x_t$: t번째 단어 벡터 (Day 01)\n- $h_{t-1}$: 지금까지 읽은 내용의 요약 (기억)\n- $W_h, W_x, b$: **모든 스텝이 공유**하는 파라미터 (Day 02의 `Wx+b`가 두 개 더해진 것)\n- tanh: 값을 −1 ~ 1로 눌러 주는 비선형 함수\n\n인코더는 이걸 입력 문장 끝까지 반복하고, 마지막 h가 **v**가 됩니다. 디코더는 v에서 시작해 같은 방식으로 h를 갱신하며, 각 h에서 소프트맥스로 다음 단어를 예측합니다.\n\n> 논문은 단순 RNN 대신 **LSTM**을 씁니다. 긴 문장에서 기억이 사라지는 문제를 막기 위해 \"게이트\"를 더한 RNN이에요 ([Day 11](#day11)). 오늘의 손계산 원리는 똑같습니다.\n\n## 2. 개념 B: Teacher Forcing (5분)\n\n디코더는 \"앞 단어를 보고 다음 단어\"를 예측합니다. 그럼 **학습할 때 앞 단어로 무엇을 넣을까요?**\n\n| 방식 | 디코더 입력으로 넣는 앞 단어 | 언제 |\n|---|---|---|\n| **Teacher forcing** | **정답** 문장의 앞 단어 $y_{t-1}$ | 학습 |\n| Free running (자기회귀) | **모델이 방금 만든** 단어 $\\hat y_{t-1}$ | 추론(실제 번역) |\n\n비유: 받아쓰기 연습에서 학생이 한 글자 틀려도 **선생님이 정답 글자를 알려주고** 다음 글자를 쓰게 하는 것. 그래서 \"teacher forcing\".\n\n**장점**\n1. 앞에서 틀린 게 뒤로 번지지 않아 학습이 안정적이고 빠르다.\n2. 모든 위치의 입력을 미리 알기 때문에 위치별 손실을 한 번에 계산할 수 있다.\n3. 수학적으로 정확하다: 식 (1)의 $p(y_t\\mid v, y_{<t})$는 *정답* 앞 단어를 조건으로 하므로, $\\log p(T\\mid S)$를 계산하는 것 자체가 teacher forcing이다.\n\n> 논문 본문에 \"teacher forcing\"이라는 단어가 직접 나오지는 않습니다. 하지만 3.2절의 학습 목표(정답 번역 T의 로그 확률 최대화)를 계산하는 표준 방법이 바로 teacher forcing입니다. (용어는 Williams & Zipser, 1989에서 유래)\n\n> `<BOS>`(문장 시작 표시)에 대해: 논문은 `<BOS>`를 따로 두지 않고 `<EOS>` 하나를 문장의 끝이자 디코더의 시작 신호로 씁니다. 이 교재는 읽기 쉽도록 시작 표시 `<BOS>`를 따로 둡니다.\n\n**약점: Exposure bias (노출 편향)**\n학습 때는 항상 정답 앞 단어만 봤는데, 실제 번역할 때는 자기가 만든 (틀릴 수도 있는) 단어를 봅니다. 한 번 틀리면 **처음 보는 상황**에 빠져 오류가 연쇄적으로 번질 수 있어요. 이 문제를 학습 방식에서 직접 줄이려는 시도가 scheduled sampling(Bengio 외, 2015)입니다. 논문이 추론 때 쓰는 **빔 서치**(3.2절, [Day 12](#day12))는 노출 편향을 고치는 방법은 아니고, 후보를 여러 개 들고 가서 한 번의 나쁜 선택에 덜 휘둘리게 하는 탐색 방법입니다.\n\n---\n\n## 3. 예제 따라하기 (6분): RNN 두 스텝\n\n은닉 2차원, 입력은 숫자 하나(1차원). b = 0.\n```\nW_x = [[ 1],      W_h = [[0.5, 0  ],      h_0 = [0, 0]\n       [-1]]             [0,   0.5]]\n```\n입력 x₁ = 1, x₂ = 2\n\n**스텝 1:** W_h h₀ = [0, 0], W_x x₁ = [1, −1]\nh₁ = tanh([1, −1]) ≈ **[0.762, −0.762]** (tanh 값표: tanh(0.5) ≈ 0.462, tanh(1) ≈ 0.762, tanh(2) ≈ 0.964, 음수는 부호만 반대. [준비 6](#prep06))\n\n**스텝 2:** W_h h₁ = [0.381, −0.381], W_x x₂ = [2, −2]\n합 = [2.381, −2.381] → h₂ = tanh(...) ≈ **[0.983, −0.983]**\n\nh₂에는 x₁과 x₂의 정보가 함께 섞여 있습니다. 이게 \"기억\"입니다.\n\n---\n\n## 직접 만져보기\n\n<div class=\"widget\" data-w=\"rnn\"><\/div>\n\n<div class=\"widget\" data-w=\"tf\"><\/div>\n\n## 4. 능동 연습 (10분)\n\n### 손계산\n1. 위 예제에서 x₃ = −1일 때 h₃를 구하세요. (tanh(−0.508) ≈ −0.469)\n2. 정답 번역이 \"나는 밥을 먹었다 <EOS>\"입니다. Teacher forcing으로 학습할 때 디코더의 각 스텝 **입력**과 **예측 목표**를 표로 쓰세요. (첫 입력은 시작 기호 `<BOS>`)\n3. 위 2번에서 모델이 첫 스텝에 \"나는\" 대신 \"너는\"을 예측했다고 합시다. Teacher forcing이면 두 번째 스텝 입력은? Free running이면?\n\n### 코드 ① RNN 스텝\n```python\nimport numpy as np\n\nW_x = np.array([[1.0], [-1.0]])\nW_h = np.array([[0.5, 0.0], [0.0, 0.5]])\nh = np.zeros(2)\nfor t, x in enumerate([1.0, 2.0, -1.0], start=1):\n    h = np.tanh(W_h @ h + W_x @ np.array([x]))\n    print(f\"h_{t} =\", h.round(3))\n```\n\n### 코드 ② Teacher forcing vs Free running\n간단한 \"디코더\"를 표 하나로 흉내 냅니다: 앞 단어 → 다음 단어 확률. 이 모델은 **\"나는\" 다음을 살짝 틀리게** 배웠습니다.\n```python\nimport numpy as np\n\nV = [\"<BOS>\", \"나는\", \"밥을\", \"빵을\", \"먹었다\", \"<EOS>\"]\n#        <BOS>  나는  밥을  빵을  먹었다 <EOS>\nP = {\"<BOS>\":  [0.00, 0.90, 0.04, 0.03, 0.02, 0.01],\n     \"나는\":   [0.00, 0.00, 0.45, 0.50, 0.04, 0.01],   # 실수: 빵을 > 밥을\n     \"밥을\":   [0.00, 0.02, 0.03, 0.03, 0.90, 0.02],\n     \"빵을\":   [0.00, 0.02, 0.03, 0.55, 0.38, 0.02],   # 빵을 다음에 또 빵을...\n     \"먹었다\": [0.00, 0.03, 0.02, 0.02, 0.03, 0.90]}\n\ntarget = [\"나는\", \"밥을\", \"먹었다\", \"<EOS>\"]\n\n# (1) Teacher forcing: 입력은 항상 정답 앞 단어\nprev, loss = \"<BOS>\", 0.0\nfor y in target:\n    q = P[prev][V.index(y)]\n    loss += -np.log(q)\n    print(f\"입력 {prev:6s} → 정답 {y:6s}  q={q:.2f}  -log q={-np.log(q):.3f}\")\n    prev = y                                   # ← 정답을 다음 입력으로!\nprint(\"teacher forcing 문장 손실:\", round(loss, 3))\n\n# (2) Free running: 입력은 모델이 직접 고른 단어 (greedy = 매번 argmax)\nprev, out = \"<BOS>\", []\nfor _ in range(8):\n    nxt = V[int(np.argmax(P[prev]))]\n    out.append(nxt)\n    if nxt == \"<EOS>\":\n        break\n    prev = nxt                                 # ← 내 예측을 다음 입력으로!\nprint(\"free running 결과:\", \" \".join(out))\n```\n\n**관찰 질문**\n- Teacher forcing 손실 계산에서는 \"나는\" 다음 실수가 손실을 조금 키울 뿐, 뒤 단어들은 정상적으로 평가됩니다. \n- Free running에서는 무슨 일이 생겼나요? 한 번의 실수가 어떻게 번졌는지 설명해 보세요. 이것이 **exposure bias**입니다.\n\n**도전 과제 (선택: 시간이 남을 때만)**\n- (a) `P[\"나는\"]`의 0.45와 0.50을 바꿔(밥을 0.50, 빵을 0.45) 다시 실행하세요. free running 결과는?\n- (b) 학습이 teacher forcing 손실을 줄인다면 `P[\"나는\"]`의 \"밥을\" 확률은 올라갈까요 내려갈까요? Day 08의 기울기 q − y로 설명해 보세요.\n- (c) **Greedy 대신 상위 2개 후보를 계속 들고 가면** 어떨까요? 노트에 \"나는 밥을…\"과 \"나는 빵을…\" 두 갈래를 그리고 각 경로의 확률 곱을 비교해 보세요. (→ Day 12 빔 서치 예습)\n\n---\n\n## 5. 셀프 체크 퀴즈 (4분)\n\n1. RNN에서 모든 스텝이 같은 $W_h, W_x$를 쓰는 것의 장점은?\n2. Teacher forcing에서 디코더 입력으로 넣는 것은?\n3. Teacher forcing이 학습을 안정적으로 만드는 이유는?\n4. Exposure bias를 한 문장으로 설명하면?\n5. 논문은 추론할 때 어떤 방법으로 더 좋은 번역을 찾나요? (3.2절)\n\n---\n\n## 2주차 마무리\n이제 논문 **2장 전체와 3.2~3.4절**을 읽을 수 있는 재료가 다 모였습니다. 시간이 남으면 3.2절(Decoding and Rescoring)을 소리 내어 읽고, 수식마다 \"이건 Day 몇에서 배운 거다\"를 옆에 적어 보세요.\n\n3주차는 논문의 모델을 직접 해부합니다: [LSTM 게이트](#day11), [입력 뒤집기와 빔 서치](#day12), [BLEU 점수](#day13).\n\n---\n\n## 한 줄 정리\n> \"학습 땐 정답을 앞 단어로 넣어 주고(teacher forcing), 번역 땐 내 예측을 넣는다 — 이 차이가 exposure bias를 만든다.\"\n\n---\n\n<details>\n<summary>정답 보기<\/summary>\n\n**손계산**\n1. W_h h₂ = [0.4915, −0.4915], W_x x₃ = [−1, 1] → 합 [−0.508, 0.508] → h₃ ≈ **[−0.469, 0.469]**\n2. | 스텝 | 입력 | 예측 목표 |\n   |---|---|---|\n   | 1 | `<BOS>` | 나는 |\n   | 2 | 나는 | 밥을 |\n   | 3 | 밥을 | 먹었다 |\n   | 4 | 먹었다 | `<EOS>` |\n3. Teacher forcing: **\"나는\"** (정답). Free running: **\"너는\"** (모델 예측).\n\n**코드**\n- 코드 ① 출력: h_1 ≈ [0.762, −0.762], h_2 ≈ [0.983, −0.983], h_3 ≈ [−0.469, 0.469]\n- 코드 ② teacher forcing 손실 ≈ 0.105 + 0.799 + 0.105 + 0.105 ≈ **1.115**\n- Free running: `나는 빵을 빵을 빵을 ...` 처럼 \"빵을\"이 반복되다가 길이 제한에 걸림. 한 번 \"빵을\"로 빠지자 학습 때 거의 못 본 상황이 되어 오류가 계속 이어짐 = exposure bias.\n- (a) `나는 밥을 먹었다 <EOS>` (정답)\n- (b) 올라감. 정답 \"밥을\" 칸의 기울기는 q − 1 < 0이라 경사하강으로 빼면 점수가 증가.\n- (c) 나는(0.9)→밥을(0.45)→먹었다(0.9)→<EOS>(0.9) = 0.328 / 나는→빵을(0.5)→빵을(0.55)… 경로는 점점 작아짐. 후보를 여러 개 들고 가면 \"밥을\" 경로가 결국 이김.\n\n**퀴즈**\n1. 길이에 상관없이 같은 파라미터로 처리할 수 있고, 파라미터 수가 문장 길이에 따라 늘지 않음.\n2. 정답 문장의 이전 단어\n3. 앞의 예측 실수가 뒤로 번지지 않고, 모든 위치를 정확한 조건에서 학습할 수 있어서\n4. 학습 때는 정답 앞 단어만 보다가, 추론 때는 자기 예측(오류 포함)을 보게 되어 생기는 불일치와 오류 누적\n5. 빔 서치 (left-to-right beam search decoder). 빔 크기 1~2로도 효과가 크다고 보고.\n<\/details>\n", "link": "논문 연결: 2장 디코더가 을 보고 를 예측하는 구조, 3.2절 학습 목표 (정답 문장 T를 그대로 조건으로 씀)", "lesson": true}, {"id": "day11", "short": "LSTM 게이트: 기억을 지키는 밸브", "md": "# Day 11. LSTM 게이트: 기억을 지키는 밸브\n\n30분 · 논문 연결: **1장** LSTM은 멀리 떨어진 단어 사이의 관계를 배울 수 있다, **3.4절** 4층 LSTM, 층마다 셀 1000개\n\n---\n\n## 오늘의 목표\n1. 단순 RNN이 긴 문장을 잊어버리는 이유를 \"같은 수를 계속 곱하기\"로 설명할 수 있다.\n2. LSTM의 세 게이트(망각, 입력, 출력)가 각각 무엇을 여닫는지 말할 수 있다.\n3. 숫자 하나짜리 LSTM 한 스텝을 손으로 계산할 수 있다.\n\n**복습 (1분):** 시그모이드 σ(x)의 출력 범위는? (답: 0과 1 사이. [준비 6](#prep06))\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 단순 RNN은 왜 잊어버릴까\n[Day 10](#day10)의 RNN은 단어를 하나 읽을 때마다 기억 h에 **곱셈**을 한 번씩 합니다. 문장 맨 앞 단어의 흔적은 뒤로 갈수록 그 곱셈을 계속 맞습니다.\n\n귓속말 전달 게임을 떠올리세요. 한 사람 건널 때마다 소리가 10%씩 작아지면 50번째 사람에게는 거의 안 들립니다. 매 스텝 0.9가 곱해진다고 해 봅시다.\n\n| 스텝 수 | 0.9를 곱한 결과 | 1.1을 곱한 결과 |\n|---|---|---|\n| 10 | 0.35 | 2.6 |\n| 30 | 0.04 | 17 |\n| 50 | **0.005** | **117** |\n\n- 1보다 조금 작은 수: 50단어 뒤에는 0.5%만 남습니다. 학습할 때는 \"틀렸다\"는 신호(기울기)가 문장 끝에서 앞으로 거꾸로 전달되는데, 이 신호도 같은 곱셈을 스텝마다 맞아서 앞 단어에 닿을 즈음엔 거의 사라집니다 → **기울기 소실**. 그래서 앞 단어에 대해서는 못 배웁니다.\n- 1보다 조금 큰 수: 117배로 부풉니다 → **기울기 폭발**.\n\n[준비 4](#prep04)에서 작은 확률을 계속 곱하면 0이 되던 것과 같은 구조입니다.\n\n### 1-2. LSTM의 생각: 곱하지 말고 더하자\nLSTM(Long Short-Term Memory, 장단기 기억)은 기억 통로를 하나 더 둡니다.\n\n- **셀 상태 c**: 장기 기억. 컨베이어 벨트처럼 문장 끝까지 흘러갑니다.\n- **은닉 상태 h**: 지금 바깥에 내보이는 작업 기억.\n\n그리고 c를 고칠 때 **\"조금 지우고, 조금 더한다\"**만 합니다. 지울지 말지를 정하는 값이 1에 가까우면 기억은 거의 그대로 다음 스텝으로 넘어갑니다. 0.9를 강제로 곱하던 RNN과 달리, **얼마나 남길지를 모델이 스스로 배웁니다.**\n\n### 1-3. 게이트 = 0과 1 사이의 밸브\n게이트는 시그모이드로 만든 0~1 사이 숫자입니다. 어떤 값에 곱해서 **얼마나 통과시킬지** 정합니다.\n\n- 게이트 1 → 전부 통과 (값 × 1)\n- 게이트 0 → 완전히 막음 (값 × 0)\n- 게이트 0.5 → 절반만\n\n| 게이트 | 기호 | 여닫는 것 | 비유 |\n|---|---|---|---|\n| 망각 (forget) | f | 옛 기억 c를 얼마나 **남길지** | 메모장 지우개 |\n| 입력 (input) | i | 새 정보를 얼마나 **적을지** | 연필 |\n| 출력 (output) | o | 기억을 얼마나 **내보일지** | 메모장을 보여 주는 손 |\n\n> 이름 주의: 망각 게이트 f가 **1이면 기억을 지킨다**는 뜻입니다. \"잊는 정도\"가 아니라 \"남기는 비율\"이에요.\n\n### 1-4. 한 스텝의 식\n새로 적을 후보 값을 g라고 부릅니다 (tanh로 만들어 −1 ~ 1 사이).\n\n$$c_t = f \\cdot c_{t-1} + i \\cdot g$$\n$$h_t = o \\cdot \\tanh(c_t)$$\n\n읽는 법\n1. 옛 기억 $c_{t-1}$에 f를 곱해 **남길 만큼 남기고**\n2. 새 후보 g에 i를 곱해 **적을 만큼 더합니다** → 새 기억 $c_t$\n3. $c_t$를 tanh로 −1 ~ 1 사이로 누른 뒤 o를 곱해 **내보입니다** → $h_t$\n\n게이트 값은 모델이 지금 단어와 직전 기억을 보고 스스로 계산합니다. 오늘은 그 값이 이미 주어졌다고 치고 계산만 연습합니다.\n\n> 논문의 실제 크기: 한 층에 셀 1000개, 4층이니 문장 하나를 **8000개 숫자**(c와 h 각각 4000개)로 기억합니다. 칸마다 게이트가 따로 있어요.\n\n> (선택) 더 알고 싶다면: 게이트는 [Day 02](#day02)의 `Wx + b`에 시그모이드를 씌워 만듭니다. 입력으로 지금 단어 $x_t$와 직전 $h_{t-1}$을 함께 넣습니다. 논문에서 칸끼리 곱하기는 기호 ⊙로 씁니다.\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n**문제.** 직전 기억 $c_{t-1} = 0.8$. 게이트와 후보가 다음과 같을 때 새 c와 h는?\n\n| f (망각) | i (입력) | g (후보) | o (출력) |\n|---|---|---|---|\n| 0.9 | 0.5 | 0.6 | 0.7 |\n\n**1) 남기기:** 0.9 × 0.8 = 0.72\n**2) 더하기:** 0.5 × 0.6 = 0.30 → $c_t$ = 0.72 + 0.30 = **1.02**\n**3) 내보이기:** tanh(1.02) ≈ 0.77 → $h_t$ = 0.7 × 0.77 ≈ **0.54**\n\n옛 기억의 90%가 살아남았고, 새 정보가 절반 세기로 더해졌습니다.\n\n**게이트는 어떻게 나올까?** 시그모이드에 넣는 값이 크면 열리고 작으면 닫힙니다.\n\n| 넣는 값 z | −2 | 0 | 2 |\n|---|---|---|---|\n| σ(z) | 0.12 | 0.5 | 0.88 |\n\n---\n\n## 3. 능동 연습 (10분)\n\n### 손계산\n1. $c_{t-1} = 1.0$, f = 0.5, i = 1.0, g = −0.4일 때 $c_t$는?\n2. 1번에서 o = 0.5이면 $h_t$는? (tanh(0.1) ≈ 0.1)\n3. f = 1, i = 0이면 $c_t$는 $c_{t-1}$과 어떤 관계인가요?\n4. f = 0, i = 1이면 $c_t$는?\n5. 0.9를 10번 곱하면 약 0.35입니다. 0.99를 10번 곱하면 대략 얼마일까요? (0.90, 0.50, 0.10 중 고르기)\n6. 망각 게이트가 **항상** 1이고 입력 게이트도 항상 열려 있으면 긴 글에서 어떤 문제가 생길까요?\n\n### 미니 챌린지\n문장 \"나는 프랑스에서 자랐고 … (30단어) … 그래서 ___를 잘한다.\" 빈칸을 맞히려면 \"프랑스\"를 30단어 동안 기억해야 합니다. 그동안 f는 어떤 값이어야 할까요? 문장이 끝나고 새 문장이 시작되면?\n\n### 코드 (선택)\n```python\nimport numpy as np\nprint(0.9 ** 50, 1.1 ** 50)            # 0.005...  117.39...\n\nc_prev = 0.8\nf, i, g, o = 0.9, 0.5, 0.6, 0.7\nc = f * c_prev + i * g\nh = o * np.tanh(c)\nprint(c, h)                            # 1.02  0.539...\n\nc = 1.0                                # f = 1, i = 0이면 50스텝 뒤에도 그대로\nfor t in range(50):\n    c = 1.0 * c + 0.0 * 0.3\nprint(c)                               # 1.0\n```\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n1. 단순 RNN이 긴 문장 앞부분을 잊는 이유를 한 문장으로 말해 보세요.\n2. 망각 게이트가 1에 가까우면 옛 기억은 어떻게 되나요?\n3. O/X: 게이트 값은 −1과 1 사이다.\n4. LSTM의 두 기억 통로 c와 h의 역할 차이는?\n\n---\n\n## 한 줄 정리\nLSTM은 기억 c를 \"f만큼 남기고 i만큼 새로 더하는\" 방식으로 고쳐서, 긴 문장에서도 앞 단어를 잊지 않는다.\n\n---\n\n<details>\n<summary>정답 보기 (먼저 풀고 열기!)<\/summary>\n\n**손계산**\n1. 0.5 × 1.0 + 1.0 × (−0.4) = 0.5 − 0.4 = **0.1**\n2. 0.5 × tanh(0.1) ≈ 0.5 × 0.1 = **0.05**\n3. **똑같습니다.** 1 × $c_{t-1}$ + 0 × g = $c_{t-1}$. 기억을 그대로 들고 갑니다.\n4. $c_t$ = **g**. 옛 기억을 다 지우고 새 정보만 적습니다.\n5. 약 **0.90**. 1에 가까울수록 훨씬 천천히 줄어듭니다.\n6. 지우지 않고 계속 쌓기만 해서 c가 아주 커질 수 있고, 이미 끝난 문장의 내용이 새 문장에 섞입니다. 그래서 \"잊는 능력\"도 필요합니다.\n\n**미니 챌린지**\n30단어 동안은 \"프랑스\"를 담은 칸의 f가 **1 가까이**, 문장이 끝나면 **0 가까이**로 내려가 메모장을 비우는 것이 좋습니다. 이런 여닫기를 사람이 정해 주지 않고 학습으로 얻습니다.\n\n**퀴즈**\n1. 스텝마다 1보다 작은 수가 계속 곱해져 앞 단어의 신호(기울기)가 0에 가까워지기 때문입니다.\n2. 거의 그대로 다음 스텝으로 넘어갑니다.\n3. X. 게이트는 시그모이드라 **0과 1 사이**입니다. −1 ~ 1은 tanh(후보 g)입니다.\n4. c는 오래 들고 가는 장기 기억, h는 그중 지금 내보이는 부분(다음 층과 예측에 쓰는 값)입니다.\n<\/details>\n", "link": "논문 연결: 1장 LSTM은 멀리 떨어진 단어 사이의 관계를 배울 수 있다, 3.4절 4층 LSTM, 층마다 셀 1000개", "lesson": true}, {"id": "day12", "short": "입력 뒤집기와 빔 서치", "md": "# Day 12. 입력 뒤집기와 빔 서치\n\n30분 · 논문 연결: **3.3절** 입력 문장을 거꾸로 넣기, **3.2절** 빔 서치로 번역 고르기, **표 1** 빔 크기별 점수\n\n---\n\n## 오늘의 목표\n1. 입력 문장을 뒤집으면 왜 학습이 쉬워지는지 \"단어 사이 거리\"로 설명할 수 있다.\n2. 한 번에 최선만 고르는 방법(greedy)이 왜 가장 좋은 문장을 놓칠 수 있는지 안다.\n3. 빔 크기 2인 빔 서치를 손으로 따라갈 수 있다.\n\n**복습 (1분):** 문장 전체의 확률은 단어별 확률을 어떻게 해서 구하나요? (답: 모두 곱합니다. [Day 03](#day03)의 연쇄법칙)\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 이상한 실험: 입력을 거꾸로\n논문은 영어 문장을 **뒤집어서** 넣었습니다. \"a b c\"를 \"c b a\"로요. 프랑스어 출력은 그대로 둡니다. 그랬더니\n\n| | 그대로 | 뒤집기 |\n|---|---|---|\n| perplexity (낮을수록 좋음) | 5.8 | **4.7** |\n| BLEU (높을수록 좋음) | 25.9 | **30.6** |\n\nBLEU는 번역 점수입니다. 다음 레슨에서 배우니 오늘은 \"높을수록 좋다\"만 알면 됩니다. 모델은 한 글자도 안 바꿨는데 성적이 올랐습니다. 왜일까요?\n\n### 1-2. 단어 사이의 거리를 세어 보자\n영어 \"a b c\"가 프랑스어 \"α β γ\"로 번역된다고 합시다 (a↔α, b↔β, c↔γ). 모델은 입력을 다 읽고 나서 출력을 씁니다.\n\n**그대로 넣을 때:** a b c → α β γ\n\n| 짝 | 사이 스텝 수 |\n|---|---|\n| a → α | 3 |\n| b → β | 3 |\n| c → γ | 3 |\n\n**뒤집어 넣을 때:** c b a → α β γ\n\n| 짝 | 사이 스텝 수 |\n|---|---|\n| a → α | **1** |\n| b → β | 3 |\n| c → γ | 5 |\n\n평균은 둘 다 3으로 같습니다. 하지만 뒤집으면 **첫 단어 짝이 바로 붙습니다.** [Day 11](#day11)에서 본 것처럼 가까운 관계는 배우기 쉽습니다. 문장 앞부분을 먼저 제대로 번역하게 되면, 그걸 발판으로 뒷부분도 배웁니다. 논문은 이를 \"최소 시간 지연(minimal time lag)이 줄었다\"고 표현합니다.\n\n### 1-3. 번역을 고르는 문제\n학습이 끝난 모델은 단어마다 확률을 내놓습니다. 우리가 원하는 것은 **문장 전체 확률이 가장 큰 번역**입니다. 그런데 단어가 80,000개, 길이가 10이면 가능한 문장은 $80000^{10}$개. 전부 계산해 볼 수 없습니다.\n\n**Greedy(탐욕) 방법:** 매번 확률이 제일 큰 단어 하나만 고릅니다. 빠르지만, 처음에 좋아 보인 선택이 나중에 막다른 길일 수 있습니다.\n\n### 1-4. 빔 서치: 후보를 B개 들고 간다\n**빔 크기 B** = 계속 들고 갈 후보 문장의 수.\n\n1. 지금 들고 있는 후보 B개 각각에 다음 단어를 붙여 본다\n2. 새로 생긴 문장들의 확률(지금까지의 곱)을 계산한다\n3. 그중 **상위 B개만** 남기고 나머지는 버린다\n4. 후보가 `<EOS>`(문장 끝)로 끝나면 완성 문장으로 따로 둔다\n\nB = 1이면 greedy와 같습니다. 길 찾기 앱이 경로 하나만 보는 것과, 유력한 경로 2~3개를 같이 따라가 보는 것의 차이입니다.\n\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n모델이 내놓은 확률이 다음과 같습니다.\n\n**첫 단어:** 나는 0.6 · 저는 0.4\n\n**둘째 단어:**\n\n| 앞 단어 | 밥 | 빵 | 물 |\n|---|---|---|---|\n| 나는 | 0.4 | 0.35 | 0.25 |\n| 저는 | 0.9 | 0.1 | 0 |\n\n**Greedy (B = 1)**\n- 첫 단어: 0.6 > 0.4 → \"나는\"\n- 둘째 단어: \"밥\" 0.4 → \"나는 밥\" = 0.6 × 0.4 = **0.24**\n\n**빔 서치 (B = 2)**\n- 첫 단어: \"나는\"(0.6)과 \"저는\"(0.4) **둘 다** 남긴다\n- 둘째 단어를 모두 붙여 본다\n\n| 후보 | 확률 |\n|---|---|\n| 저는 밥 | 0.4 × 0.9 = **0.36** |\n| 나는 밥 | 0.6 × 0.4 = **0.24** |\n| 나는 빵 | 0.6 × 0.35 = 0.21 |\n| 나는 물 | 0.6 × 0.25 = 0.15 |\n| 저는 빵 | 0.4 × 0.1 = 0.04 |\n\n- 상위 2개: \"저는 밥\"(0.36), \"나는 밥\"(0.24)\n\nGreedy는 첫 걸음에서 \"저는\"을 버려서 0.36짜리 문장을 영영 못 찾았습니다. 빔 서치는 2등 후보를 살려 둔 덕에 찾았습니다.\n\n> 실제 구현은 확률을 곱하는 대신 **로그 확률을 더합니다** ([준비 4](#prep04)). ln 0.4 + ln 0.9 ≈ −1.02, ln 0.6 + ln 0.4 ≈ −1.43. −1.02가 더 크니 순위는 같습니다.\n\n### 논문의 결과 (표 1)\n| 모델 (LSTM 5개 앙상블) | BLEU |\n|---|---|\n| 빔 크기 1 | 33.00 |\n| 빔 크기 2 | 34.50 |\n| 빔 크기 12 | 34.81 |\n\n1 → 2에서 1.5점이 오르고, 2 → 12에서는 0.31점만 오릅니다. **빔 크기 2면 이득의 대부분을 얻습니다.** (앙상블은 따로 학습한 모델 여러 개의 예측을 평균 내는 방법입니다.)\n\n---\n\n## 3. 능동 연습 (10분)\n\n### 손계산\n1. 길이 4인 문장 \"a b c d\" → \"α β γ δ\"를 **그대로** 넣을 때, 짝마다 사이 스텝 수는?\n2. 같은 문장을 **뒤집어** \"d c b a\"로 넣을 때 네 짝의 스텝 수는? 평균은?\n3. 첫 단어 A 0.7, B 0.3. A 다음은 X 0.6 / Y 0.4, B 다음은 X 1.0. Greedy가 고르는 문장과 그 확률은?\n4. 3번에서 빔 크기 2라면 둘째 단어까지 본 뒤 남는 상위 2개 후보와 확률은?\n5. 3~4번에서 greedy는 가장 확률 높은 문장을 찾았나요?\n6. 단어 5개, 길이 3이면 가능한 문장은 모두 몇 개인가요?\n\n### 미니 챌린지\n빔 크기를 아주 크게 하면 언제나 더 좋은 번역이 나올까요? 논문 표 1의 숫자(2 → 12에서 0.31점)와 계산 시간을 근거로 생각해 보세요.\n\n### 코드 (선택)\n처음 보는 문법이 있어도 괜찮습니다. 그대로 붙여 넣어 실행하고, 출력이 손계산과 같은지만 확인하세요.\n```python\nfirst = {\"나는\": 0.6, \"저는\": 0.4}\nsecond = {\"나는\": {\"밥\": 0.4, \"빵\": 0.35, \"물\": 0.25},\n          \"저는\": {\"밥\": 0.9, \"빵\": 0.1}}\n\nB = 2\nbeam = sorted(first.items(), key=lambda kv: -kv[1])[:B]     # 상위 B개\ncands = []\nfor w1, p1 in beam:\n    for w2, p2 in second[w1].items():\n        cands.append((w1 + \" \" + w2, p1 * p2))\nfor sent, p in sorted(cands, key=lambda kv: -kv[1])[:B]:\n    print(sent, round(p, 2))        # 저는 밥 0.36 / 나는 밥 0.24\n```\n`B = 1`로 바꾸면 greedy 결과(\"나는 밥 0.24\")가 나옵니다.\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n1. 입력을 뒤집어도 단어 짝 사이의 평균 거리는 같습니다. 그런데 왜 도움이 되나요?\n2. 빔 크기 1인 빔 서치의 다른 이름은?\n3. O/X: 빔 서치는 가능한 모든 문장의 확률을 계산한다.\n4. 논문에서 빔 크기를 1에서 2로 키웠을 때와 2에서 12로 키웠을 때, 어느 쪽 이득이 컸나요?\n\n---\n\n## 한 줄 정리\n입력을 뒤집으면 문장 앞 단어끼리 가까워져 배우기 쉽고, 빔 서치는 후보 B개를 들고 가며 greedy가 놓치는 더 좋은 문장을 찾는다.\n\n---\n\n<details>\n<summary>정답 보기 (먼저 풀고 열기!)<\/summary>\n\n**손계산**\n1. 모두 **4** (a→α 4, b→β 4, c→γ 4, d→δ 4)\n2. a→α **1**, b→β **3**, c→γ **5**, d→δ **7**. 평균 (1 + 3 + 5 + 7) ÷ 4 = **4**로 같습니다.\n3. \"A\"(0.7) 다음 X(0.6) → **\"A X\", 0.7 × 0.6 = 0.42**\n4. \"A X\" 0.42, \"B X\" 0.3 × 1.0 = 0.30, \"A Y\" 0.7 × 0.4 = 0.28 → 상위 2개는 **\"A X\" 0.42, \"B X\" 0.30**\n5. **네.** 이번에는 greedy의 0.42가 최고였습니다. Greedy가 항상 틀리는 것은 아니고, **놓칠 수 있다**는 것이 문제입니다.\n6. 5 × 5 × 5 = $5^3$ = **125개**\n\n**미니 챌린지**\n아닙니다. 후보를 늘릴수록 계산은 그만큼 느려지는데 이득은 빠르게 줄어듭니다(2 → 12에서 0.31점). 게다가 모델의 확률이 완벽하지 않아서, 확률이 더 높은 문장이 사람이 보기에 더 좋은 번역이라는 보장도 없습니다.\n\n**퀴즈**\n1. 문장 앞쪽 단어 짝이 아주 가까워져(거리 1) 그 관계를 먼저 쉽게 배우고, 그것이 나머지를 배우는 발판이 되기 때문입니다.\n2. Greedy(탐욕) 디코딩\n3. X. 상위 B개만 남기고 나머지는 버립니다. 전부 계산하는 것은 불가능합니다.\n4. 1 → 2 (33.00 → 34.50, +1.5점). 2 → 12는 +0.31점입니다.\n<\/details>\n", "link": "논문 연결: 3.3절 입력 문장을 거꾸로 넣기, 3.2절 빔 서치로 번역 고르기, 표 1 빔 크기별 점수", "lesson": true}, {"id": "day13", "short": "BLEU로 번역 채점하기", "md": "# Day 13. BLEU로 번역 채점하기\n\n30분 · 논문 연결: **3.6절, 표 1** 이 논문의 대표 성적 \"BLEU 34.81, 기존 번역기 33.30\"\n\n---\n\n## 오늘의 목표\n1. BLEU가 \"기계 번역이 사람 번역과 얼마나 겹치는지\"를 세는 점수라는 걸 설명할 수 있다.\n2. 1-gram, 2-gram 정밀도를 손으로 셀 수 있다.\n3. 짧은 번역 벌점까지 넣어 작은 예제의 BLEU를 계산할 수 있다.\n\n**복습 (1분):** √(0.5 × 0.5)는? (답: 0.5. [준비 3](#prep03))\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 번역을 어떻게 채점할까\n번역 수만 문장을 사람이 일일이 채점할 수는 없습니다. 그래서 **사람이 미리 해 둔 번역(참조 번역)**과 기계 번역이 얼마나 겹치는지 자동으로 셉니다. 이 점수가 **BLEU**(블루, 2002년)입니다.\n\n### 1-2. n-gram: 연속한 단어 n개\n- **1-gram**: 단어 하나. \"the cat sat\" → the / cat / sat\n- **2-gram**: 연속한 단어 둘. \"the cat sat\" → the cat / cat sat\n\n단어 N개짜리 문장에는 1-gram이 N개, 2-gram이 N − 1개 있습니다. 1-gram은 **단어를 맞게 골랐는지**, 2-gram 이상은 **순서까지 자연스러운지**를 봅니다.\n\n### 1-3. 정밀도: 내가 쓴 것 중 몇 개가 맞았나\n$$\\text{n-gram 정밀도} = \\frac{\\text{참조에도 있는 내 n-gram 수}}{\\text{내 n-gram 전체 수}}$$\n\n분모가 **기계 번역 쪽**이라는 점을 기억하세요.\n\n### 1-4. 꼼수 막기 ①: 같은 단어 도배\n참조가 \"the cat is on the mat\"인데 기계가 \"the the the the\"라고 하면? the는 참조에 있으니 4개 전부 맞은 걸로 치면 정밀도 100%가 됩니다.\n\n그래서 **참조에 나온 횟수까지만** 인정합니다. the는 참조에 2번 → 2개만 인정 → 2/4 = 0.5. 이것을 **클리핑**(잘라 내기)이라고 합니다.\n\n### 1-5. 꼼수 막기 ②: 너무 짧은 번역\n기계가 \"the cat\"만 내놓으면 쓴 단어는 다 맞으니 정밀도 100%입니다. 하지만 번역의 절반 이상이 빠졌죠.\n\n그래서 기계 번역 길이 c가 참조 길이 r보다 짧으면 **짧은 번역 벌점(BP)**을 곱합니다.\n\n$$BP = \\begin{cases} 1 & (c \\ge r) \\\\ e^{\\,1 - r/c} & (c < r) \\end{cases}$$\n\n읽는 법: 기계 번역이 참조만큼 길면 벌점 없음(× 1), 짧으면 짧을수록 많이 깎임.\n\n| 기계 번역 길이 | 참조의 80% | 50% | 33% |\n|---|---|---|---|\n| 곱하는 값 BP | 0.78 | 0.37 | 0.14 |\n\nc = 2, r = 6이면 $e^{1-3} = e^{-2} \\approx 0.14$. 점수가 14%로 깎입니다.\n\n### 1-6. 합치기\n$$\\text{BLEU} = BP \\times (\\text{정밀도들의 기하평균})$$\n\n**기하평균**은 n개를 곱해서 n제곱근을 구하는 평균입니다. 둘이면 $\\sqrt{p_1 \\times p_2}$. 하나라도 0이면 전체가 0이 되어, **모든 항목을 고루 잘해야** 점수가 나옵니다.\n\n표준 BLEU는 1~4-gram 네 개를 씁니다(BLEU-4). 오늘은 손계산을 위해 1~2-gram만 쓰는 **BLEU-2**로 연습합니다. 값은 0~1이고, 논문은 100을 곱해 0~100으로 적습니다.\n\n> 로그로 쓰면: 기하평균 = $\\exp\\left(\\frac{1}{n}\\sum \\ln p_k\\right)$. 로그를 평균 내고 exp로 되돌린 것입니다. Day 08의 perplexity와 같은 모양이에요.\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n- 참조: **the cat sat on the mat** (6단어)\n- 기계: **the cat is on the mat** (6단어)\n\n**1-gram 정밀도**\n\n| 기계의 단어 | the | cat | is | on | the | mat |\n|---|---|---|---|---|---|---|\n| 참조에 있나 | ✓ | ✓ | | ✓ | ✓ | ✓ |\n\nthe는 참조에도 2번 나오니 둘 다 인정. → **5/6**\n\n**2-gram 정밀도**\n\n| 기계의 2-gram | the cat | cat is | is on | on the | the mat |\n|---|---|---|---|---|---|\n| 참조에 있나 | ✓ | | | ✓ | ✓ |\n\n→ **3/5**\n\n**기하평균:** $\\frac{5}{6} \\times \\frac{3}{5} = \\frac{15}{30} = 0.5$, $\\sqrt{0.5} \\approx 0.707$\n\n**벌점:** 길이가 6으로 같으니 BP = 1\n\n**BLEU-2 ≈ 0.707** (100점 척도로 70.7)\n\n단어 하나(is)만 틀렸는데 2-gram은 두 개가 깨졌습니다. BLEU는 순서와 이웃 단어까지 봅니다.\n\n---\n\n## 3. 능동 연습 (10분)\n\n참조: **a dog runs very fast** (5단어) · 기계: **a dog runs fast** (4단어)\n\n### 손계산\n1. 기계 번역의 1-gram 정밀도는?\n2. 기계 번역의 2-gram을 모두 적고, 2-gram 정밀도를 구하세요.\n3. 두 정밀도의 기하평균은? (√0.667 ≈ 0.816)\n4. 짧은 번역 벌점 BP는? ($e^{-0.25} \\approx 0.78$)\n5. BLEU-2는?\n6. 참조가 \"I like cats\"이고 기계가 \"cats cats cats\"일 때, 클리핑을 적용한 1-gram 정밀도는?\n\n### 미니 챌린지\n참조 \"나는 매우 기쁘다\", 기계 \"저는 정말 행복합니다\". 뜻은 같은데 BLEU는 몇 점일까요? 이것이 BLEU의 어떤 약점을 보여 주나요?\n\n### 논문의 성적표 읽기\n| 시스템 | BLEU |\n|---|---|\n| 기존 통계 번역기 (기준선) | 33.30 |\n| LSTM 5개 앙상블, 빔 12 | **34.81** |\n| 기존 번역기의 후보 1000개를 LSTM으로 다시 채점 | 36.5 |\n| 당시 WMT'14 최고 기록 | 37.0 |\n\n신경망 하나의 구조만으로 수십 년 다듬은 통계 번역기를 처음 넘었다는 것이 이 논문의 뉴스였습니다.\n\n### 코드 (선택)\n```python\nimport math\nfrom collections import Counter\n\ndef precision(cand, ref, n):\n    c = Counter(tuple(cand[i:i+n]) for i in range(len(cand) - n + 1))\n    r = Counter(tuple(ref[i:i+n]) for i in range(len(ref) - n + 1))\n    hit = sum(min(cnt, r[g]) for g, cnt in c.items())    # 클리핑\n    return hit / sum(c.values())\n\ndef bleu2(cand, ref):\n    p1, p2 = precision(cand, ref, 1), precision(cand, ref, 2)\n    bp = 1 if len(cand) >= len(ref) else math.exp(1 - len(ref) / len(cand))\n    return bp * math.sqrt(p1 * p2)\n\nprint(bleu2(\"the cat is on the mat\".split(), \"the cat sat on the mat\".split()))  # 0.707...\nprint(bleu2(\"a dog runs fast\".split(), \"a dog runs very fast\".split()))          # 0.635...\n```\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n1. BLEU는 무엇과 무엇이 겹치는 정도를 세나요?\n2. 클리핑은 어떤 꼼수를 막나요?\n3. O/X: 기계 번역이 참조보다 길면 짧은 번역 벌점을 받는다.\n4. 정밀도들을 그냥 평균 내지 않고 기하평균을 쓰면 어떤 점이 달라지나요?\n\n---\n\n## 한 줄 정리\nBLEU = (참조와 겹치는 n-gram 정밀도의 기하평균) × (짧은 번역 벌점). 높을수록 사람 번역에 가깝다.\n\n---\n\n<details>\n<summary>정답 보기 (먼저 풀고 열기!)<\/summary>\n\n**손계산**\n1. a, dog, runs, fast 모두 참조에 있음 → 4/4 = **1**\n2. a dog ✓ / dog runs ✓ / runs fast (참조는 runs very, very fast) → **2/3**\n3. √(1 × 2/3) = √0.667 ≈ **0.816**\n4. c = 4, r = 5 → $e^{1 - 5/4} = e^{-0.25}$ ≈ **0.78**\n5. 0.78 × 0.816 ≈ **0.64** (100점 척도로 약 64)\n6. cats는 참조에 1번 → 1개만 인정 → **1/3**\n\n**미니 챌린지**\n겹치는 단어가 하나도 없어 **0점**입니다. BLEU는 뜻이 아니라 **단어가 겹치는지**만 보기 때문에, 같은 뜻의 다른 표현을 알아보지 못합니다. 그래서 실제 평가는 참조 번역을 여러 개 쓰거나, 문장 하나가 아니라 시험용 문장 수천 개를 통째로 모아 점수를 냅니다.\n\n**퀴즈**\n1. 기계 번역과 사람이 한 참조 번역의 n-gram\n2. 같은 단어를 여러 번 써서 정밀도를 부풀리는 것\n3. X. 벌점은 **짧을 때만** 받습니다. 길게 쓴 번역은 정밀도의 분모가 커져서 자연히 손해를 봅니다.\n4. 하나라도 0에 가까우면 전체가 크게 깎입니다. 단어만 맞고 순서가 엉망인 번역이 높은 점수를 받지 못합니다.\n<\/details>\n", "link": "논문 연결: 3.6절, 표 1 이 논문의 대표 성적", "lesson": true}, {"id": "roadmap", "short": "3주차 안내", "md": "# Seq2Seq 코스 3주차 안내\n\n3주차는 논문의 모델을 직접 해부하는 세 챕터입니다.\n\n| 챕터 | 주제 | 논문 연결 |\n|---|---|---|\n| [Day 11](#day11) | LSTM 게이트: 기억을 지키는 밸브 | 1장, 3.4절 |\n| [Day 12](#day12) | 입력 뒤집기와 빔 서치 | 3.2절, 3.3절, 표 1 |\n| [Day 13](#day13) | BLEU로 번역 채점하기 | 3.6절, 표 1 |\n\n처음 계획했던 나머지 주제는 12단계 로드맵에서 더 알맞은 자리로 옮겼습니다.\n\n- 기울기 자르기(gradient clipping): 3단계 \"기울기 소실과 폭발\"\n- 미니 프로젝트(숫자열 뒤집기 seq2seq): 3단계 \"PyTorch로 첫 모델\"\n- 다음 논문(어텐션): 7단계 \"어텐션과 Transformer\"\n", "link": ""}];

  gan01: "위조지폐범과 감별사가 서로를 이기려고 실력을 키웁니다. 2014년, 이 대결을 신경망 두 개에게 시켰더니 사람도 속는 가짜 사진이 나왔습니다.",
  dif01: "물에 떨어진 잉크는 퍼지기만 하고 다시 모이지 않습니다. 그런데 그 영상을 거꾸로 돌리는 법을 배운 AI가 있습니다. 글 한 줄로 그림을 그려 주는 서비스들의 원리입니다.",
  pf01: "\"백 번 해 봤는데 다 맞았어\"와 \"언제나 맞아\" 사이에는 큰 강이 있습니다. 그 강을 건너는 다리가 증명입니다. 오늘은 대학원 교재가 쓰는 글의 형식을 읽는 법을 배웁니다.",
  sp01: "산에서 길을 잃었을 때 지금 선 곳이 골짜기 바닥인지, 고개 마루인지 어떻게 알까요? 숫자 몇 개의 부호만 보면 됩니다. AI가 학습하다 멈춘 곳을 진단하는 도구입니다.",
  nm01: "벡터의 길이는 자로 재면 됩니다. 그러면 행렬의 '크기'는 어떻게 잴까요? 그리고 어떤 모델은 왜 유독 학습이 느릴까요? 두 질문의 답이 같은 숫자에서 나옵니다.",
  lr01: "수십억 개의 숫자로 된 모델을 내 일에 맞게 고치고 싶은데, 그 숫자를 다 건드릴 형편은 안 됩니다. 2021년의 답은 선형대수 한 줄이었습니다. 얇은 행렬 두 개만 배우면 됩니다.",
  sl01: "AI 회사들은 왜 그렇게 큰돈을 들여 모델을 키울까요? '키우면 이만큼 좋아진다'를 미리 알려 주는 직선 하나가 있었기 때문입니다. 오늘은 그 직선을 직접 그어 봅니다.",
  rl01: "글을 그럴듯하게 잇기만 하던 모델이 어떻게 시킨 일을 하는 비서가 됐을까요? 비결은 사람에게 '둘 중 어느 답이 나아요?'라고 묻는 것이었습니다.",
  rag01: "외워서 보는 시험과 오픈북 시험, 어느 쪽이 덜 틀릴까요? 그리고 암산과 연습장에 적어 가며 풀기는요? AI에게도 똑같은 요령이 통합니다.",
  moe01: "종합병원에는 의사가 수백 명이지만 환자는 한두 명만 만납니다. 병원이 커져도 진료 시간은 그대로죠. 요즘 큰 AI 모델도 같은 방법으로 덩치를 키웁니다.",
  mm01: "글만 읽던 AI가 어떻게 사진을 보게 됐을까요? 답은 뜻밖에 단순했습니다. 사진을 퍼즐 조각처럼 잘라 낱말인 척 넣어 주는 것입니다.",
  day01: "2014년, 구글의 세 연구자가 영어 문장을 프랑스어로 바꾸는 신경망을 만들었습니다. 그런데 신경망은 숫자밖에 모릅니다. 'cat'이라는 글자를 어떻게 계산에 넣었을까요? 오늘은 단어가 화살표(벡터)가 되는 순간을 봅니다.",
  day02: "논문의 모델에는 파라미터가 3억 8천4백만 개 있습니다. 숫자가 많아 보이지만, 그 계산의 대부분은 한 가지 동작의 반복입니다. 행렬 × 벡터. 오늘 이 동작 하나를 손에 익히면 LSTM 수식이 '모양 맞추기'로 보이기 시작합니다.",
  day03: "번역기가 \"배 고파\"를 내놓기 전에, 사실은 '배'일 확률, '배' 다음에 '고파'일 확률, 그다음 문장이 끝날 확률을 하나씩 계산합니다. 오늘은 논문에서 가장 중요한 식 (1)을 직접 손으로 쪼개 봅니다.",
  day04: "건강검진 결과지에 '양성'이 찍혔습니다. 검사 정확도는 90%. 그럼 내가 병에 걸렸을 확률도 90%일까요? 많은 의사도 틀리는 이 문제를 풀고 나면, 옛날 번역기와 이 논문이 확률을 다루는 방식의 차이가 보입니다.",
  day05: "디코더는 매 단어마다 80,000개 단어 각각에 점수를 매깁니다. -3점, 7점, 0.5점... 이 점수들을 '합이 1인 확률'로 바꾸는 장치가 소프트맥스입니다. 챗봇 설정에서 보던 'temperature'의 정체도 오늘 밝혀집니다.",
  day06: "\"내일 해가 뜬다\"와 \"내일 서울에 눈이 1미터 온다\". 둘 중 어느 쪽이 더 많은 정보를 담고 있을까요? 놀라움을 숫자로 바꾸면 '엔트로피'가 됩니다. 언어 모델이 공부한다는 건 결국 이 숫자를 줄이는 일입니다.",
  day07: "모델이 \"the cat sat on the ___\"에 'dog'이라고 90% 확신했는데 정답은 'mat'이었습니다. 이 모델은 얼마나 벌을 받아야 할까요? 오늘 배우는 크로스엔트로피가 바로 그 벌점표이고, 논문의 학습 목표 그 자체입니다.",
  day08: "논문 3.3절에는 이상한 문장이 있습니다. 입력 문장을 '거꾸로' 넣었더니 perplexity가 5.8에서 4.7로 떨어졌다는 것. 이 숫자가 무슨 뜻인지, 그리고 모델이 그 숫자를 줄이려고 산을 내려가듯 학습하는 방법을 오늘 배웁니다.",
  day09: "주사위 하나는 1부터 6까지 공평하게 나옵니다. 그런데 주사위 30개를 던져 평균을 내면 이상하게도 3.5 근처에 종 모양으로 몰립니다. 이 마법 같은 법칙이 논문의 '±0.08 초기화'와 '배치 128'을 떠받치고 있습니다.",
  day10: "받아쓰기 연습에서 학생이 한 글자 틀리면, 선생님은 정답 글자를 알려주고 다음 글자를 쓰게 합니다. 신경망도 똑같이 배웁니다. 이 방법이 teacher forcing입니다. 그런데 시험(실제 번역) 때는 선생님이 없다면 어떻게 될까요?",
  day11: "긴 소설의 첫 장에 나온 범인의 단서를 마지막 장까지 기억해야 한다면? 단순한 신경망은 50단어만 지나도 앞 내용의 99%를 잊습니다. LSTM은 메모장과 지우개, 연필로 이 문제를 풉니다.",
  day12: "영어 문장을 거꾸로 넣었더니 번역 점수가 25.9에서 30.6으로 뛰었습니다. 모델은 한 글자도 바꾸지 않았는데요. 오늘은 이 이상한 트릭과, 좋은 문장을 놓치지 않는 탐색법 빔 서치를 손으로 풉니다.",
  day13: "번역이 잘 됐는지 누가 채점할까요? 수만 문장을 사람이 볼 수는 없습니다. 2002년에 나온 BLEU는 겹치는 단어 조각을 세는 것만으로 이 일을 해냅니다. 논문의 대표 성적 34.81이 바로 이 점수입니다."
  , ac01: "칭찬 한 번 받았다고 창법을 확 바꾼 가수는 다음 무대에서 무너지기 쉽습니다. 강화학습도 그렇습니다. 그래서 '한 번에 너무 많이 바꾸지 마'라는 규칙을 식에 넣은 방법이 나왔고, ChatGPT의 바탕이 된 InstructGPT도 이 방법으로 다듬었습니다. 그 이름이 PPO입니다." // @frag:ac01
  , agt01: "\"내일 서울에 우산이 필요해?\" 언어 모델은 내일 날씨를 모릅니다. 그런데 어떻게 요즘 AI는 검색하고, 계산하고, 메일까지 쓸까요? 비밀은 모델이 '말만 하고' 손발은 프로그램이 맡는 데 있습니다." // @frag:agt01
  , bel01: "바둑 해설자는 판을 보자마자 '지금은 흑이 유리합니다'라고 말합니다. 끝까지 둬 보지도 않았는데 어떻게 알까요? 1957년 수학자 벨만은 '끝에서부터 거꾸로 생각하라'는 한 줄짜리 답을 내놓았고, 그 한 줄이 지금 강화학습의 거의 모든 방법에 들어 있습니다." // @frag:bel01
  , cm01: "정확도 95%짜리 암 진단 AI가 있습니다. 그런데 이 AI는 환자 100명 모두에게 '정상'이라고만 말합니다. 점수는 높은데 암 환자는 한 명도 못 찾는 이 모델을, 어떤 숫자가 잡아낼 수 있을까요?" // @frag:cm01
  , cnn01: "사진 한 장을 보통 신경망 층에 넣으면 가중치가 1억 개를 훌쩍 넘습니다. 그런데 고양이를 알아보는 신경망은 3×3짜리 작은 돋보기 하나를 그림 전체에 굴려 이 문제를 풀었습니다. 오늘은 그 돋보기를 직접 굴려 봅니다." // @frag:cnn01
  , cnn02: "2012년 이미지넷 대회에서 한 팀이 2등과 10%p 넘게 차이 나는 점수로 우승했습니다. 그 팀의 한 사람은 2단계에서 읽은 Seq2Seq 논문의 첫 저자였죠. 수표를 읽던 1998년의 작은 신경망이 14년 만에 어떻게 세상을 놀라게 했는지, 네 장면으로 따라갑니다." // @frag:cnn02
  , ens01: "정확도 60%짜리 예측가 한 명은 동전 던지기보다 조금 나을 뿐입니다. 그런데 이런 사람 101명이 각자 따로 생각해 다수결을 하면 정확도가 98%까지 오릅니다. 단, 서로 베끼지 않는다면요." // @frag:ens01
  , kd01: "70억 개 파라미터 모델은 그대로면 14GB, 노트북에도 빠듯합니다. 그런데 같은 모델이 휴대폰에서 돌아가기도 합니다. 숫자를 덜 정밀하게 적거나, 큰 모델이 작은 모델을 과외하면 됩니다." // @frag:kd01
  , knn01: "처음 이사 간 동네에서 어느 식당이 맛있는지 모를 때, 우리는 가까이 사는 이웃에게 묻습니다. AI도 똑같이 합니다. 정답표가 있든 없든, '가까운 것끼리 닮았다'는 생각 하나로 분류도 하고 무리도 찾아냅니다." // @frag:knn01
  , logi01: "공부를 1시간 더 하면 합격 확률은 몇 % 오를까요? 0시간과 1시간 사이, 4시간과 5시간 사이는 같은 1시간이지만 효과가 전혀 다릅니다. 직선 하나를 S자로 휘게 만들면 이 차이가 보이고, 그게 AI의 첫 분류기입니다." // @frag:logi01
  , mab01: "단골 식당만 가면 실패는 없지만, 길 건너 더 맛있는 집은 영영 모릅니다. 새 집만 다니면 맛없는 날이 잦고요. 정답을 모르는 채 골라야 하는 AI도 매일 이 고민을 합니다. 강화학습의 첫 질문, 탐색이냐 활용이냐입니다." // @frag:mab01
  , mdp01: "강아지에게 '앉아'를 가르칠 때 정답을 설명하지는 않습니다. 앉으면 간식을 줄 뿐이죠. 게임을 배우는 AI도, 말을 다듬는 챗봇도 같은 방식으로 배웁니다. 오늘은 이 모든 걸 한 문장으로 받아 적는 말, MDP를 배웁니다." // @frag:mdp01
  , of01: "기출문제집의 답을 번호째 외운 학생은 기출문제에서 100점을 받습니다. 그런데 숫자만 바꾼 새 문제를 내면 40점이 나오죠. 모델도 똑같이 '외울' 수 있습니다. 숫자 두 개로 외운 모델을 들키게 하는 법을 배웁니다." // @frag:of01
  , pg01: "Q러닝은 행동마다 점수표를 만들었습니다. 그런데 행동이 '다음에 올 단어 5만 개 중 하나'라면요? 점수표를 건너뛰고 '좋았던 행동을 더 자주 하게' 확률을 바로 고치는 방법이 있습니다. 오늘날 언어 모델을 다듬는 강화학습의 뿌리입니다." // @frag:pg01
  , ql01: "처음 하는 게임에는 설명서가 없습니다. 그런데 2015년, 한 신경망이 화면과 점수만 보고 Atari 게임 49개를 같은 방법으로 배웠습니다. 비결은 '예상보다 얼마나 좋았나'로 표 한 칸씩 고치는 아주 단순한 식이었습니다." // @frag:ql01
  , reg01: "축구팀 감독이 매일 무작위로 선수 몇 명을 빼고 연습을 시킵니다. 이상해 보이지만, 이렇게 키운 팀은 에이스 한 명이 빠져도 무너지지 않습니다. 신경망도 똑같이 훈련시키면 덜 외우고 더 잘 일반화합니다." // @frag:reg01
  , roc01: "화재경보기에 민감도 다이얼이 달려 있습니다. 끝까지 올리면 토스트만 구워도 울리고, 끝까지 내리면 진짜 불이 나도 조용합니다. 어느 칸에 맞추든 상관없이 '이 경보기 자체가 좋은가'를 숫자 하나로 말할 수 있을까요?" // @frag:roc01
  , smp01: "챗봇에게 똑같은 질문을 두 번 하면 답이 조금씩 다릅니다. 고장일까요? 아닙니다. 모델은 다음 토큰의 확률을 낸 뒤 제비를 뽑고, 그 제비뽑기를 조절하는 다이얼이 따로 있습니다. 오늘은 그 다이얼 세 개를 돌려 봅니다." // @frag:smp01
  , split01: "어떤 팀이 집값 예측 오차가 거의 0이라고 자랑했는데, 실제 서비스에서는 엉망이었습니다. 입력 중에 '거래 후에 매긴 세금'이 섞여 있었거든요. 정답을 몰래 본 모델을 가려내는 방법, 시험 문제를 미리 보지 않는 법을 배웁니다." // @frag:split01
  , svm01: "운동장에 줄을 그어 두 반을 나눈다면, 한쪽 아이들에게 바짝 붙여 긋겠습니까, 양쪽 아이들에게서 가장 먼 곳에 긋겠습니까? 이 당연한 직감 하나가 딥러닝 이전 시대를 대표하는 분류기가 되었습니다." // @frag:svm01
  , tok01: "2014년의 번역 신경망은 사전에 없는 단어를 만나면 전부 UNK라는 빈칸 하나로 바꿨습니다. 지금의 챗봇은 처음 보는 신조어도 그럭저럭 읽어 냅니다. 비결은 글을 단어가 아니라 레고 조각처럼 잘라 읽는 데 있습니다." // @frag:tok01
  , tree01: "의사가 '열이 있나요? 기침은요? 언제부터요?' 하고 물을 때마다 병의 후보가 줄어듭니다. 스무고개와 같죠. 오늘은 컴퓨터가 데이터만 보고 '가장 좋은 다음 질문'을 스스로 고르는 방법을 배웁니다." // @frag:tree01
};

  , ac01: [{"t": "num", "q": "V(s) = 3, 보상 r = 1, γ = 0.9, V(s′) = 5. 어드밴티지 A는?", "a": 2.5, "tol": 0.001, "h": "A = r + γV(s′) − V(s)", "w": "1 + 4.5 − 3. 양수이므로 크리틱의 기대보다 좋았던 행동입니다."}, {"t": "num", "q": "PPO, ε = 0.2. A = +1, ρ = 1.5일 때 목적값 min(ρA, clip(ρ)A)은?", "a": 1.2, "tol": 0.001, "h": "clip(1.5)는 1.2로 잘립니다", "w": "좋았던 행동을 이미 1.2배 넘게 늘렸으므로, 더 늘려도 목적값이 1.2에서 멈춥니다."}, {"t": "num", "q": "PPO, ε = 0.2. A = −1, ρ = 0.6일 때 목적값은?", "a": -0.8, "tol": 0.001, "h": "그대로 −0.6, 잘라서 0.8 × (−1). 둘 중 작은 쪽", "w": "나빴던 행동을 이미 0.8배 아래로 줄였으므로, 더 줄여도 −0.8에서 나아지지 않습니다."}, {"t": "mc", "q": "액터-크리틱에서 액터와 크리틱이 맡는 일은?", "o": ["액터는 행동을 고르는 정책, 크리틱은 상태의 가치를 매김", "액터는 보상을 주고, 크리틱은 행동을 고름", "둘 다 Q표를 채움"], "a": 0, "w": "가수(액터)는 심사위원(크리틱)의 기대치와 비교한 '기대보다 나았나'를 듣고 고칩니다."}, {"t": "mc", "q": "PPO의 클리핑이 막으려는 것은?", "o": ["한 번의 갱신에서 정책이 너무 많이 바뀌는 것", "탐험이 너무 적은 것", "보상이 음수가 되는 것"], "a": 0, "w": "크게 바뀐 정책으로 모은 경험으로 또 배우면 회복이 어려워서, 좋은 쪽으로 너무 미는 이득을 없앱니다."}, {"t": "ox", "q": "A > 0일 때 PPO 목적함수는 ρ > 1 + ε뿐 아니라 ρ < 1 − ε에서도 평평하다.", "a": false, "w": "A > 0이면 위쪽만 잘리고, 좋은 행동을 잘못 줄인 아래쪽은 직선 그대로 남아 다시 올리라는 힘을 줍니다."}, {"t": "order", "q": "PPO 학습 한 바퀴를 순서대로 탭하세요.", "tokens": ["지금 정책으로 경험을 모은다", "크리틱으로 어드밴티지를 계산한다", "클리핑한 목적값을 높이도록 정책을 몇 번 고친다", "고친 정책이 다음 바퀴의 '옛 정책'이 된다"], "extra": ["Q표에서 최댓값을 골라 TD 목표를 만든다"], "w": "비율 ρ는 경험을 모은 옛 정책과 비교한 값이라, 한 바퀴가 끝나면 기준이 새 정책으로 바뀝니다."}] // @frag:ac01
  , agt01: [{"t": "order", "q": "ReAct 에이전트가 우산 질문을 푸는 순서대로 탭하세요.", "tokens": ["생각: 내일 서울 날씨를 알아야 한다", "행동: 날씨검색(서울, 내일)", "관찰: 강수확률 80%", "답: 우산을 챙기세요"], "extra": ["관찰: 모델이 직접 날씨 서버에 접속했다"], "w": "관찰은 프로그램이 도구를 실행해 붙여 주는 줄이라, 모델이 직접 서버에 접속하는 단계는 없습니다."}, {"t": "num", "q": "한 걸음(생각+행동+관찰)이 300토큰이고 에이전트가 10걸음을 갔습니다. 입력에 쌓인 토큰은 몇 개?", "a": 3000, "h": "걸음마다 쓴 글이 모두 입력에 남습니다", "w": "관찰과 생각이 지워지지 않고 계속 쌓이므로 걸음 수만큼 곱합니다."}, {"t": "num", "q": "AI 앱 4개와 도구 5개를 MCP 같은 표준 하나로 맞추면, 연결을 몇 개 만들면 될까요? (따로 연결하면 4 × 5 = 20개)", "a": 9, "h": "앱은 표준을 한 번, 도구도 표준을 한 번만 따르면 됩니다", "w": "표준이 가운데 서면 곱이 아니라 합만큼만 만들면 되기 때문입니다."}, {"t": "mc", "q": "모델이 '행동: 계산기(\"37 × 24\")'라고 썼습니다. 이 계산을 실제로 실행하는 것은?", "o": ["모델 바깥의 프로그램", "모델 자신", "MCP가 모델을 다시 학습시켜서"], "a": 0, "w": "모델은 글만 쓸 수 있어서, 그 요청 글을 알아보고 도구를 돌리는 일은 프로그램이 맡습니다."}, {"t": "mc", "q": "챗봇과 비교한 에이전트의 가장 큰 특징은?", "o": ["다음 할 일을 스스로 고르며 도구를 써서 여러 걸음 일한다", "파라미터가 항상 더 많다", "질문에 한 번만 답하고 끝난다"], "a": 0, "w": "크기가 아니라 '생각 → 도구 → 결과 확인'을 되풀이하는 일하는 방식이 다릅니다."}, {"t": "ox", "q": "MCP는 언어 모델을 학습시키는 새로운 방법이다.", "a": false, "w": "MCP는 앱과 도구를 잇는 연결 약속이라 모델의 가중치는 하나도 바뀌지 않습니다."}, {"t": "ox", "q": "에이전트가 읽은 웹페이지에 '이전 지시를 무시하라'고 적혀 있으면 그 지시를 따르는 것이 맞다.", "a": false, "w": "관찰은 자료일 뿐 명령이 아니며, 이런 숨은 지시가 바로 프롬프트 인젝션 공격입니다."}] // @frag:agt01
  , bel01: [{"t": "num", "q": "복도: 출발 칸 4개 + 도착 칸 G. G로 들어가는 걸음에 +10, 다른 걸음 0, V(G) = 0, γ = 0.9. 칸 1(G에서 가장 먼 칸)의 V는?", "a": 7.29, "tol": 0.01, "h": "끝에서부터: 칸 4 = 10, 칸 3 = 0.9 × 10, 칸 2 = 0.9 × 9, 칸 1 = 0.9 × 8.1", "w": "옆 칸의 값을 빌려 와 0.9를 한 번씩 곱하면 되고, 결과는 리턴 0.9³ × 10과 같습니다."}, {"t": "num", "q": "어떤 칸에서 0.7 확률로 +10을 받고 끝나고, 0.3 확률로 −10을 받고 끝납니다. 이 칸의 V는?", "a": 4, "tol": 0.001, "h": "값 × 확률을 모두 더하기: 0.7 × 10 + 0.3 × (−10)", "w": "결과가 하나로 정해지지 않으면 벨만 방정식의 r + γV(s′)를 확률로 가중 평균합니다. 기댓값 𝔼가 그 뜻입니다."}, {"t": "num", "q": "이번 걸음 보상 −1, 다음 칸의 V가 10, γ = 0.9입니다. 이 행동의 Q는?", "a": 8, "tol": 0.001, "h": "Q = 보상 + γ × 다음 칸의 V", "w": "−1 + 9. 행동 하나를 먼저 하고 그 뒤의 가치를 할인해 더한 값이 Q입니다."}, {"t": "ox", "q": "복도에서 도착 칸 G의 가치 V(G)는 10이다.", "a": false, "w": "보상 10은 G로 들어가는 걸음에서 이미 받았고, 도착하면 끝나서 그 뒤로 받을 보상이 없습니다."}, {"t": "mc", "q": "어떤 칸의 Q가 위 3, 아래 7, 왼쪽 5, 오른쪽 1입니다. 최선을 고르는 에이전트에게 이 칸의 V는?", "o": ["7", "4", "16", "1"], "a": 0, "w": "고를 수 있다면 가장 좋은 행동을 고르므로 V는 Q들의 평균이나 합이 아니라 최댓값입니다."}, {"t": "mc", "q": "강화학습의 Q(s, a)에 대한 설명으로 맞는 것은?", "o": ["상태 s에서 행동 a를 했을 때 기대되는 리턴(숫자)", "셀프 어텐션의 Query 벡터", "다음 상태로 갈 확률"], "a": 0, "w": "글자만 어텐션의 Q와 같을 뿐, 강화학습의 Q는 '이 자리에서 이 행동이 얼마나 좋은가'를 재는 숫자입니다."}, {"t": "order", "q": "벨만 방정식을 완성하세요.", "tokens": ["V(s)", "=", "r +", "γ × V(s′)"], "extra": ["γ × r", "Q(s′) −"], "w": "이번 걸음의 보상에 할인된 다음 상태의 가치를 더한다는 뜻이고, 그래서 끝에서부터 거꾸로 채울 수 있습니다."}] // @frag:bel01
  , cm01: [{"t": "num", "q": "환자 100명 중 암 환자 5명. 모두에게 '정상'이라고 하는 모델의 정확도는 몇 %?", "a": 95, "h": "맞힌 사람 수 ÷ 100", "w": "건강한 95명을 다 맞혔기 때문인데, 이 모델의 재현율은 0이라 쓸모가 없습니다."}, {"t": "num", "q": "TP 8, FP 2, FN 4, TN 6. 정밀도는?", "a": 0.8, "tol": 0.01, "h": "양성이라고 예측한 것(TP + FP)이 분모", "w": "양성이라고 외친 10명 중 8명이 진짜 환자였습니다."}, {"t": "num", "q": "같은 표(TP 8, FP 2, FN 4, TN 6)의 재현율은? (소수 둘째 자리)", "a": 0.67, "tol": 0.01, "h": "진짜 양성(TP + FN)이 분모", "w": "진짜 환자 12명 중 8명만 찾았으니, 정밀도보다 낮습니다."}, {"t": "mc", "q": "정밀도의 분모는?", "o": ["실제 양성 전부 (TP + FN)", "양성이라고 예측한 것 전부 (TP + FP)", "전체 데이터"], "a": 1, "w": "정밀도는 '내가 외친 것 중', 재현율은 '진짜인 것 중'으로 분모만 다릅니다."}, {"t": "mc", "q": "암 검진 AI에서 가장 피해야 할 실수는 환자를 놓치는 것입니다. 더 중시할 지표는?", "o": ["정밀도", "재현율", "정확도"], "a": 1, "w": "놓친 환자(FN)가 재현율의 분모에 들어가 점수를 깎기 때문입니다."}, {"t": "ox", "q": "정밀도 1.0, 재현율 0.1인 모델의 F1은 두 값의 평균인 0.55다.", "a": false, "w": "F1은 조화평균이라 약한 쪽에 끌려가서 약 0.18밖에 되지 않습니다."}, {"t": "order", "q": "F1 식을 완성하세요.", "tokens": ["F1", "=", "2 × 정밀도 × 재현율", "÷", "(정밀도 + 재현율)"], "extra": ["(정밀도 × 재현율)", "÷ 2"], "w": "곱을 합으로 나누는 조화평균이라, 둘 중 하나가 0이면 F1도 0이 됩니다."}] // @frag:cm01
  , cnn01: [{"t": "num", "q": "그림 조각 [[0, 1, 1], [0, 1, 1], [0, 1, 1]]에 세로선 필터 [[−1, 0, 1], [−1, 0, 1], [−1, 0, 1]]을 쓰면?", "a": 3, "h": "줄마다 (−1)×0 + 0×1 + 1×1을 구해 세 줄을 더합니다", "w": "줄마다 1이 나오고 세 줄이라 3입니다. 왼쪽이 어둡고 오른쪽이 밝은 경계라 양수가 나옵니다."}, {"t": "num", "q": "8 × 8 그림에 3 × 3 필터(패딩 0, 스트라이드 1)를 쓰면 출력의 한 변은?", "a": 6, "h": "(입력 − 필터) + 1", "w": "필터를 오른쪽으로 5번 옮길 수 있으니 자리는 5 + 1 = 6개입니다."}, {"t": "num", "q": "9 × 9 그림에 3 × 3 필터, 스트라이드 2, 패딩 0이면 출력의 한 변은?", "a": 4, "h": "(9 − 3) ÷ 2 + 1", "w": "옮길 거리 6을 2칸씩 가면 3번 옮기고, 처음 자리를 더해 4입니다."}, {"t": "mc", "q": "컬러 그림(채널 3)에 3 × 3 필터 8개를 쓰는 합성곱층의 배울 숫자는? (필터마다 편향 1개)", "o": ["80개", "224개", "72개"], "a": 1, "w": "필터 하나가 3 × 3 × 3 = 27칸에 편향 1을 더해 28개이고, 8개면 28 × 8 = 224입니다."}, {"t": "ox", "q": "합성곱층은 그림의 자리마다 다른 필터를 따로 배운다.", "a": false, "w": "한 필터를 모든 자리에서 같이 쓰기(가중치 공유) 때문에 배울 숫자가 적고, 같은 무늬를 어디서나 같은 방식으로 찾습니다."}, {"t": "mc", "q": "특징 지도 [[1, 4], [3, 2]]에 2 × 2 최대 풀링을 하면?", "o": ["2.5", "4", "10"], "a": 1, "w": "최대 풀링은 평균이나 합이 아니라 구역 안의 가장 큰 값 하나만 남깁니다."}, {"t": "order", "q": "흑백 그림 28 × 28이 지나가며 바뀌는 크기를 순서대로 탭하세요. (3 × 3 합성곱, 패딩 0 → 2 × 2 최대 풀링)", "tokens": ["28 × 28", "→ 3 × 3 합성곱 →", "26 × 26", "→ 2 × 2 최대 풀링 →", "13 × 13"], "extra": ["25 × 25", "14 × 14"], "w": "합성곱은 필터 크기에서 1을 뺀 만큼(2) 줄이고, 2 × 2 풀링은 가로세로를 절반으로 만듭니다."}] // @frag:cnn01
  , cnn02: [{"t": "num", "q": "3 × 3 합성곱(스트라이드 1)을 5층 쌓으면 마지막 층 한 칸의 수용 영역(한 변)은?", "a": 11, "h": "층마다 한 변이 2씩 넓어집니다: 2n + 1", "w": "1층 3에서 시작해 층마다 양옆으로 한 칸씩 넓어지니 2 × 5 + 1 = 11입니다."}, {"t": "num", "q": "채널 1, 편향을 빼고 셀 때, 3 × 3 필터를 세 번 쌓은 것의 배울 숫자는?", "a": 27, "h": "9 × 3", "w": "같은 7 × 7 범위를 7 × 7 필터 한 번(49개)보다 훨씬 적은 숫자로 봅니다. VGG가 3 × 3만 쓴 이유입니다."}, {"t": "num", "q": "LeNet-5에서 32 × 32 입력이 5 × 5 합성곱(패딩 0)과 2 × 2 풀링을 지나면 한 변은?", "a": 14, "h": "32 − 5 + 1을 구한 뒤 절반", "w": "합성곱이 28로 줄이고, 풀링이 절반으로 줄여 14가 됩니다."}, {"t": "mc", "q": "AlexNet(2012)이 바꾼 것이 아닌 것은?", "o": ["ReLU 사용", "드롭아웃", "잔차 연결로 152층"], "a": 2, "w": "잔차 연결로 아주 깊은 망을 학습한 것은 3년 뒤의 ResNet(2015)입니다."}, {"t": "mc", "q": "56층 신경망이 20층보다 학습 데이터 오류가 더 높았습니다. 이 현상에 대한 설명으로 맞는 것은?", "o": ["과적합이라서 드롭아웃을 더 쓰면 된다", "깊은 망이 잘 배우지 못하는 문제로, ResNet이 잔차 연결로 풀었다", "데이터가 너무 많아서 생긴다"], "a": 1, "w": "과적합이라면 학습 오류는 낮아야 하는데, 여기서는 학습 오류부터 높아서 배우는 일 자체가 막힌 것입니다."}, {"t": "ox", "q": "VGG는 5 × 5, 7 × 7 같은 큰 필터를 써서 적은 층으로 넓은 범위를 봤다.", "a": false, "w": "VGG는 3 × 3만 깊게 쌓아, 같은 범위를 더 적은 숫자로 보고 ReLU도 더 여러 번 넣었습니다."}, {"t": "order", "q": "네 모델을 나온 순서대로 탭하세요.", "tokens": ["LeNet-5 (손글씨 숫자)", "AlexNet (ReLU·드롭아웃·GPU)", "VGG (3 × 3만 깊게)", "ResNet (잔차 연결)"], "extra": ["Transformer (어텐션)"], "w": "1998 → 2012 → 2014 → 2015 순서이고, Transformer는 2017년에 나온 다른 갈래입니다."}] // @frag:cnn02
  , ens01: [{"t": "num", "q": "정확도 60%인 투표자 3명이 서로 상관없이 답합니다. 다수결 정확도는? (소수 셋째 자리까지)", "a": 0.648, "tol": 0.002, "h": "3명 다 맞을 확률 0.6³ + 딱 2명 맞을 확률 3 × 0.6² × 0.4", "w": "0.216 + 0.432 = 0.648. 누가 틀리는지 경우가 3가지라 3을 곱합니다."}, {"t": "num", "q": "정확도 70%인 투표자 3명이 서로 상관없이 답합니다. 다수결 정확도는? (소수 셋째 자리까지)", "a": 0.784, "tol": 0.002, "h": "0.7³ + 3 × 0.7² × 0.3", "w": "0.343 + 0.441 = 0.784. 혼자보다 8%p 넘게 오릅니다."}, {"t": "num", "q": "집값이 [3, 5, 10]입니다. 부스팅의 1번 주자가 평균으로 예측하면, 세 번째 집의 잔차는?", "a": 4, "h": "평균은 6. 잔차 = 실제 − 예측", "w": "10 − 6 = 4. 다음 주자는 이 4를 이어받아 맞히도록 학습합니다."}, {"t": "mc", "q": "정확도 60%인 3명이 언제나 한 사람의 답을 그대로 베낍니다. 다수결 정확도는?", "o": ["0.6 그대로", "0.648", "1에 가까워진다"], "a": 0, "w": "셋이 늘 같은 실수를 하므로 한 사람과 같습니다. 앙상블은 서로 다른 실수를 해야 효과가 있습니다."}, {"t": "mc", "q": "앞 나무가 남긴 잔차를 다음 나무가 이어받아 차례로 학습하는 방법은?", "o": ["부스팅", "배깅", "랜덤 포레스트"], "a": 0, "w": "배깅과 랜덤 포레스트는 나무를 나란히 따로 키우고, 부스팅만 한 줄로 이어 달립니다."}, {"t": "ox", "q": "정확도 40%인 투표자도 많이 모으면 다수결 정확도가 올라간다.", "a": false, "w": "동전보다 못한 투표자는 모을수록 다수가 틀린 쪽으로 쏠려서, 3명만 모아도 0.352로 떨어집니다."}, {"t": "order", "q": "그래디언트 부스팅의 한 바퀴를 순서대로 탭하세요.", "tokens": ["지금까지의 예측으로 잔차(실제 − 예측)를 구한다", "새 나무가 그 잔차를 맞히도록 학습한다", "새 나무의 예측에 학습률을 곱한다", "지금까지의 예측에 더한다"], "extra": ["모든 나무의 다수결을 낸다"], "w": "부스팅은 투표가 아니라 더하기로 합칩니다. 학습률을 곱해 조금씩 더하면 한 나무가 너무 많이 맞추려 드는 것을 막습니다."}] // @frag:ens01
  , kd01: [{"t": "num", "q": "70억(7B) 파라미터 모델을 16비트(2바이트)로 저장하면 가중치만 몇 GB? (1GB = 10⁹바이트)", "a": 14, "tol": 0.01, "h": "70억 × 2바이트", "w": "140억 바이트를 10⁹로 나눈 값이며, GiB(2³⁰) 기준이면 약 13이 됩니다."}, {"t": "num", "q": "같은 70억 파라미터 모델을 4비트로 줄이면 몇 GB? (가중치만)", "a": 3.5, "tol": 0.01, "h": "4비트 = 0.5바이트", "w": "숫자 하나의 바이트가 4분의 1로 줄어서 메모리도 4분의 1이 됩니다."}, {"t": "num", "q": "가중치 [0.30, −2.54, 0.06]을 8비트(−127~127)로 양자화합니다. 0.30은 어떤 정수가 될까요?", "a": 15, "h": "눈금 = 2.54 ÷ 127 = 0.02", "w": "가장 큰 절댓값으로 눈금을 정한 뒤 그 눈금으로 나누고 반올림하기 때문입니다."}, {"t": "order", "q": "8비트 양자화 순서대로 탭하세요.", "tokens": ["가장 큰 절댓값 찾기", "눈금 = 최댓값 ÷ 127", "값 ÷ 눈금을 반올림해 정수로 저장", "쓸 때 정수 × 눈금으로 되돌리기"], "extra": ["파라미터 개수를 절반으로 줄이기"], "w": "눈금을 먼저 정해야 모든 값을 같은 자로 잴 수 있고, 개수는 처음부터 끝까지 그대로입니다."}, {"t": "mc", "q": "지식 증류에서 학생이 원-핫 정답 대신 선생의 확률 [고양이 0.87, 개 0.12, 자동차 0.02]로 배우면 좋은 점은?", "o": ["틀린 보기들이 정답과 얼마나 닮았는지도 배운다", "학습이 필요 없어진다", "모델의 비트 수가 줄어든다"], "a": 0, "w": "정답에는 1과 0뿐이지만 선생의 확률에는 '개와는 조금 닮았다' 같은 숨은 지식이 있습니다."}, {"t": "mc", "q": "증류할 때 선생 확률의 온도 T를 올리는 이유는?", "o": ["작은 확률들이 커져서 숨은 지식이 잘 보인다", "1등 보기가 바뀌어야 해서", "모델이 더 빨라져서"], "a": 0, "w": "로짓을 T로 나누면 차이가 줄어 확률이 고르게 퍼지지만 순서는 그대로입니다."}, {"t": "ox", "q": "양자화를 하면 모델의 파라미터 개수가 줄어든다.", "a": false, "w": "양자화는 숫자 하나에 쓰는 비트만 줄이고, 개수를 줄이려면 증류처럼 작은 모델을 새로 만들어야 합니다."}] // @frag:kd01
  , knn01: [{"t": "num", "q": "(1, 2)와 (4, 6) 사이의 거리는?", "a": 5, "h": "가로 차이 3, 세로 차이 4. √(3² + 4²)", "w": "√(9 + 16) = √25. 두 점을 잇는 화살표의 길이를 피타고라스로 잽니다."}, {"t": "num", "q": "깃발 하나에 점 (1, 2), (3, 6), (5, 1)이 배정됐습니다. 이동한 깃발의 y 좌표는?", "a": 3, "h": "y 좌표 2, 6, 1의 평균", "w": "(2 + 6 + 1) ÷ 3 = 3. 이동은 좌표마다 평균을 내는 것입니다."}, {"t": "mc", "q": "정답 이름표가 붙은 데이터가 꼭 필요한 방법은?", "o": ["k-NN", "k-평균", "둘 다 필요 없다"], "a": 0, "w": "k-NN은 이웃들의 이름표로 투표하므로 지도 학습이고, k-평균은 이름표 없이 무리를 찾는 비지도 학습입니다."}, {"t": "mc", "q": "k-NN에서 k = 1로 두면 생기기 쉬운 문제는?", "o": ["바로 옆 점 하나의 잡음까지 따라가 과적합된다", "멀리 있는 점까지 투표해 경계가 흐려진다", "계산이 불가능해진다"], "a": 0, "w": "이웃 한 명이 별난 점이면 그대로 따라 틀립니다. k를 키우면 잡음이 투표에서 묻힙니다."}, {"t": "ox", "q": "k-NN은 학습 단계에서 계산을 많이 하고, 예측은 빠르다.", "a": false, "w": "학습은 데이터를 외워 두기만 하고, 예측할 때마다 모든 점까지 거리를 재므로 예측 쪽이 무겁습니다."}, {"t": "ox", "q": "키(cm)와 시력을 그대로 섞어 거리를 재도 두 특징이 공평하게 반영된다.", "a": false, "w": "숫자 범위가 큰 키의 차이가 제곱되어 거리를 거의 다 정하므로, 먼저 정규화로 눈금을 맞춰야 합니다."}, {"t": "order", "q": "k-평균의 순서대로 탭하세요.", "tokens": ["깃발 k개를 아무 데나 꽂는다", "점마다 가장 가까운 깃발로 배정한다", "깃발을 무리의 평균 위치로 옮긴다", "아무도 깃발을 바꾸지 않을 때까지 반복한다"], "extra": ["가장 가까운 이웃 k명이 다수결로 투표한다"], "w": "배정과 이동을 번갈아 하면 거리 제곱의 합이 늘지 않고 줄어들다가 멈춥니다. 투표는 k-NN의 단계입니다."}] // @frag:knn01
  , logi01: [{"t": "num", "q": "w = 1, b = −4인 로지스틱 회귀에서 공부 시간 5시간인 학생의 합격 확률은? (σ(1) = 0.73)", "a": 0.73, "tol": 0.005, "h": "먼저 z = wx + b를 구하고 σ에 넣습니다", "w": "z = 5 − 4 = 1이고, 시그모이드가 이 점수를 0.73이라는 확률로 눌러 줍니다."}, {"t": "num", "q": "w = 2, b = −10입니다. 확률이 정확히 0.5가 되는 공부 시간(결정 경계)은?", "a": 5, "tol": 0.001, "h": "σ(z) = 0.5가 되는 건 z = 0일 때입니다", "w": "2x − 10 = 0을 풀면 x = −b/w = 10 ÷ 2입니다."}, {"t": "num", "q": "실제로 불합격(y = 0)한 학생에게 모델이 합격 확률 p = 0.27을 줬습니다. 이진 크로스엔트로피 벌점은? (−ln 0.73 ≈ 0.31)", "a": 0.31, "tol": 0.01, "h": "정답이 불합격이니 정답 쪽 확률은 1 − p입니다", "w": "정답 쪽 확률 1 − 0.27 = 0.73에 −ln을 하면 됩니다. 꽤 잘 맞혀서 벌점이 작습니다."}, {"t": "mc", "q": "로지스틱 회귀에서 시그모이드가 하는 일은?", "o": ["아무 실수인 점수를 0과 1 사이 확률로 누른다", "입력을 정규화한다", "점수 중 가장 큰 것을 고른다"], "a": 0, "w": "wx + b는 −∞부터 ∞까지 아무 값이나 될 수 있어서, 확률로 쓰려면 0~1로 눌러야 합니다."}, {"t": "mc", "q": "w = 1일 때 b를 −4에서 −6으로 바꾸면 커트라인(결정 경계)은?", "o": ["4시간 → 6시간 (오른쪽으로)", "4시간 → 2시간 (왼쪽으로)", "그대로, 곡선만 가팔라진다"], "a": 0, "w": "경계는 x = −b/w라서 b만 바꾸면 곡선 모양은 그대로이고 옆으로 밀립니다."}, {"t": "ox", "q": "로지스틱 회귀는 이름에 '회귀'가 있으므로 집값 같은 숫자를 예측하는 모델이다.", "a": false, "w": "확률을 숫자로 맞히는 회귀를 한 뒤 0.5로 잘라 예/아니오를 고르는 분류 모델입니다."}, {"t": "order", "q": "로지스틱 회귀가 학생 한 명을 판정하는 순서대로 탭하세요.", "tokens": ["점수 z = wx + b 계산", "시그모이드로 확률 p = σ(z)", "p ≥ 0.5이면 합격으로 판정"], "extra": ["소프트맥스로 확률 4개 만들기", "p ≥ 0이면 합격"], "w": "직선 점수 → S자로 눌러 확률 → 기준 0.5로 자르기. 예/아니오 두 칸이라 소프트맥스 대신 시그모이드 하나면 됩니다."}] // @frag:logi01
  , mab01: [{"t": "num", "q": "기계를 4번 당겨 평균이 0.5입니다. 다섯 번째에 1점을 받으면 새 평균은?", "a": 0.6, "tol": 0.001, "h": "새 평균 = 옛 평균 + (새 결과 − 옛 평균) ÷ 횟수(5)", "w": "0.5 + (1 − 0.5) ÷ 5 = 0.5 + 0.1. 예상보다 좋았던 만큼, 횟수로 나눈 만큼만 올라갑니다."}, {"t": "num", "q": "ε = 0.2, 기계 4대. 지금 평균이 가장 높은 기계가 뽑힐 확률은?", "a": 0.85, "tol": 0.001, "h": "0.8 + 0.2 × (1/4). 탐색할 때도 최고 기계가 뽑힐 수 있습니다.", "w": "활용 0.8에, 탐색 0.2 중 4분의 1인 0.05가 더해집니다."}, {"t": "num", "q": "진짜 당첨 확률이 0.2, 0.5, 0.8이고 로봇은 0.8짜리를 최고로 알고 있습니다. ε = 0.1로 한 번 당길 때 점수의 기댓값은? (셋의 평균은 0.5)", "a": 0.77, "tol": 0.005, "h": "0.9 × 0.8 + 0.1 × 0.5", "w": "0.72 + 0.05. 늘 최고만 당길 때(0.8)보다 조금 낮은 만큼이 탐색의 비용입니다."}, {"t": "ox", "q": "ε = 0.1이고 기계가 3대면, 최고 기계를 고를 확률은 정확히 0.9다.", "a": false, "w": "탐색할 때 고르는 '아무거나'에 최고 기계도 들어 있어서 0.9 + 0.1/3 ≈ 0.93이 됩니다."}, {"t": "mc", "q": "ε = 0(탐색 없음)으로만 고르면 생길 수 있는 문제는?", "o": ["처음에 운 나쁘게 낮게 나온 좋은 기계를 다시는 안 당긴다", "모든 기계를 똑같이 자주 당긴다", "평균을 계산할 수 없다"], "a": 0, "w": "평균이 한 번 낮게 나온 기계는 활용만 해서는 다시 뽑힐 기회가 없어 진짜 실력이 드러나지 않습니다."}, {"t": "mc", "q": "점심 식당 고르기에서 '탐색'에 해당하는 것은?", "o": ["안 가 본 식당에 가 본다", "가장 맛있었던 단골집에 간다", "어제 간 집에 또 간다"], "a": 0, "w": "탐색은 당장 손해를 볼 수 있어도 더 좋은 선택지를 찾기 위해 정보를 모으는 행동입니다."}, {"t": "order", "q": "ε-탐욕 로봇이 한 번 당기는 순서대로 탭하세요.", "tokens": ["0과 1 사이 무작위 수를 뽑는다", "ε보다 작으면 아무 기계, 아니면 평균 최고 기계를 고른다", "손잡이를 당겨 점수를 받는다", "고치기 공식으로 그 기계의 평균을 고친다"], "extra": ["모든 기계의 평균을 0으로 지운다"], "w": "고르기(탐색 또는 활용) → 해 보기 → 결과로 짐작 고치기가 한 바퀴이고, 이 바퀴를 계속 돕니다."}] // @frag:mab01
  , mdp01: [{"t": "num", "q": "보상이 차례로 0, 0, 10이고 γ = 0.9입니다. 리턴은? (0.9² = 0.81)", "a": 8.1, "tol": 0.01, "h": "0 + 0.9 × 0 + 0.81 × 10", "w": "10점이 두 걸음 미뤄져서 γ를 두 번 곱한 만큼 작아졌습니다."}, {"t": "num", "q": "보상 2, 0, 4이고 γ = 0.5입니다. 리턴은?", "a": 3, "tol": 0.001, "h": "2 + 0.5 × 0 + 0.25 × 4", "w": "2 + 0 + 1. 세 번째 걸음의 4점은 무게 0.25를 받아 1점어치로 줄어듭니다."}, {"t": "num", "q": "매 걸음 1점씩 영원히 받습니다. γ = 0.9면 리턴은?", "a": 10, "tol": 0.01, "h": "1 / (1 − γ)", "w": "1 + 0.9 + 0.81 + …은 끝없이 커지지 않고 1/(1 − 0.9)에 멈춥니다. 할인율이 무한한 합을 막아 줍니다."}, {"t": "ox", "q": "γ가 클수록 에이전트는 눈앞의 보상을 더 중시한다.", "a": false, "w": "γ가 클수록 먼 미래 보상의 무게가 덜 줄어들어 멀리 내다보고, γ = 0이 눈앞만 보는 쪽입니다."}, {"t": "mc", "q": "아타리 게임을 배우는 DQN에서 '행동'에 해당하는 것은?", "o": ["조이스틱 방향과 버튼", "최근 화면 4장", "점수가 오른 만큼"], "a": 0, "w": "에이전트가 직접 고르는 것이 행동이고, 화면은 상태, 점수 변화는 환경이 주는 보상입니다."}, {"t": "mc", "q": "마르코프 성질의 뜻으로 알맞은 것은?", "o": ["다음 일은 지금 상태만으로 정해지고, 지나온 과정은 더 알려 주는 게 없다", "보상은 항상 0 또는 1이다", "행동은 늘 무작위로 고른다"], "a": 0, "w": "바둑에서 자리를 바꿔 앉아도 지금 판만 보면 다음 수를 고를 수 있는 것과 같습니다."}, {"t": "order", "q": "에이전트와 환경이 주고받는 한 바퀴를 순서대로 탭하세요.", "tokens": ["에이전트가 상태를 본다", "정책에 따라 행동을 고른다", "환경이 보상을 준다", "환경이 다음 상태를 보여 준다"], "extra": ["정답 라벨과 비교해 손실을 구한다"], "w": "강화학습에는 정답 라벨이 없고, 행동한 뒤 환경이 돌려주는 보상과 다음 상태로만 배웁니다."}] // @frag:mdp01
  , of01: [{"t": "num", "q": "훈련 손실 0.05, 검증 손실 0.80입니다. 두 손실의 차이(검증 − 훈련)는?", "a": 0.75, "tol": 0.001, "h": "검증 손실에서 훈련 손실을 뺍니다", "w": "0.80 − 0.05 = 0.75. 차이가 이렇게 크게 벌어지면 훈련 데이터를 외우고 있다는 신호입니다."}, {"t": "num", "q": "검증 손실이 에폭마다 2.0, 1.4, 1.1, 1.0, 1.2, 1.5였습니다. 몇 번째 에폭의 모델을 고르면 좋을까요?", "a": 4, "tol": 0, "h": "검증 손실이 가장 낮은 곳", "w": "검증 손실이 바닥(1.0)을 찍은 뒤 다시 오르기 시작하므로, 그 바닥의 모델이 새 데이터에 가장 강합니다."}, {"t": "num", "q": "정답이 0인데, 훈련 데이터만 바꿔 4번 학습한 모델의 예측이 −2, 2, −2, 2입니다. 분산은?", "a": 4, "tol": 0.001, "h": "평균은 0. 평균에서 떨어진 거리의 제곱을 평균 냅니다", "w": "모두 평균에서 2씩 떨어져 있어 2² = 4입니다. 평균은 정답이라 편향은 0이지만 많이 흔들립니다."}, {"t": "mc", "q": "훈련 손실도 검증 손실도 높고 서로 비슷합니다. 가장 알맞은 처방은?", "o": ["용량을 늘린다 (차수나 층을 늘림)", "데이터를 줄인다", "학습을 더 일찍 멈춘다"], "a": 0, "w": "둘 다 높으면 덜 배운 과소적합이라, 더 복잡한 규칙을 담을 수 있게 모델을 키워야 합니다."}, {"t": "mc", "q": "편향-분산 트레이드오프에서 모델 용량을 키우면?", "o": ["편향은 줄고 분산은 는다", "편향도 분산도 준다", "편향은 늘고 분산은 준다"], "a": 0, "w": "복잡한 모델은 정답 근처를 평균적으로 잘 맞히지만, 훈련 데이터가 조금만 바뀌어도 결과가 크게 출렁입니다."}, {"t": "ox", "q": "훈련 손실이 0인 모델이 가장 좋은 모델이다.", "a": false, "w": "9차식이 점 10개를 모두 지나 훈련 손실 0이 됐지만 검증 손실은 폭발했듯, 외운 것일 수 있습니다."}, {"t": "order", "q": "차수를 1 → 3 → 9로 올릴 때 일어나는 일을 순서대로 탭하세요.", "tokens": ["두 손실이 모두 높다 (과소적합)", "두 손실이 모두 낮고 가깝다 (적당)", "훈련 손실 0, 검증 손실 폭발 (과적합)"], "extra": ["두 손실이 모두 0이 된다"], "w": "용량이 커지면 훈련 손실은 계속 줄지만, 검증 손실은 내려갔다가 다시 오르는 U자를 그립니다."}] // @frag:of01
  , pg01: [{"t": "num", "q": "행동 2개, logit [0, 0], 학습률 0.1. 행동 1을 해서 리턴 G = 20. 갱신 뒤 행동 1의 확률은? (σ(2) = 0.88)", "a": 0.88, "tol": 0.005, "h": "고른 행동 logit은 0.1 × 20 × (1 − 0.5), 다른 행동은 그만큼 내려갑니다", "w": "logit이 +1과 −1로 벌어져 차이 2가 되고, 행동이 2개면 확률은 σ(logit 차이)입니다."}, {"t": "num", "q": "logit [0, 0], 학습률 0.1, 베이스라인 b = 8. 행동 1을 해서 G = 10. 행동 1의 logit은 얼마나 변하나요?", "a": 0.1, "tol": 0.001, "h": "0.1 × (G − b) × (1 − 0.5)", "w": "평균보다 2점 잘한 만큼만 반영되어, 베이스라인이 없을 때(+0.5)보다 훨씬 조금 움직입니다."}, {"t": "mc", "q": "Q러닝과 비교한 정책 경사의 핵심 차이는?", "o": ["행동 확률(정책)을 직접 학습한다", "보상 대신 손실을 쓴다", "탐험을 전혀 하지 않는다"], "a": 0, "w": "Q러닝은 점수표를 배운 뒤 max로 행동을 꺼내지만, 정책 경사는 확률을 내는 모델 자체를 고칩니다."}, {"t": "mc", "q": "REINFORCE의 대표적인 약점과 해결책은?", "o": ["분산이 크다 → 베이스라인을 뺀다", "표가 너무 크다 → 신경망을 쓴다", "과녁이 움직인다 → 타깃 네트워크를 쓴다"], "a": 0, "w": "한 판의 리턴에는 우연이 많이 섞여 들쭉날쭉하므로, 평균을 빼서 '평소보다 나았나'만 보게 합니다."}, {"t": "ox", "q": "리턴이 늘 양수인 게임에서 베이스라인 없이 REINFORCE를 쓰면, 고른 행동의 확률은 매 판 올라간다.", "a": true, "w": "G가 양수면 고른 행동의 logit 변화 η × G × (1 − p)가 항상 양수라, 아쉬운 판에서도 올라갑니다."}, {"t": "ox", "q": "베이스라인을 빼면 학습이 평균적으로 가는 방향이 바뀐다.", "a": false, "w": "평균적인 방향은 그대로 두고 판마다의 흔들림만 줄이는 것이 베이스라인의 장점입니다."}, {"t": "order", "q": "REINFORCE(베이스라인 포함)의 순서대로 탭하세요.", "tokens": ["지금 정책으로 한 판을 끝까지 한다", "리턴 G를 계산한다", "G − 베이스라인을 구한다", "그 판의 행동 로그 확률을 그만큼 올린다"], "extra": ["Q표에서 가장 큰 칸을 고른다"], "w": "리턴은 판이 끝나야 알 수 있으므로, 먼저 끝까지 해 본 뒤 한꺼번에 고칩니다."}] // @frag:pg01
  , ql01: [{"t": "num", "q": "Q = 3, 보상 r = 2, γ = 0.9, 다음 상태의 최대 Q = 10, α = 0.5. 새 Q는?", "a": 7, "tol": 0.001, "h": "TD 목표 = 2 + 0.9 × 10, TD 오차 = 목표 − 3", "w": "목표 11, 오차 8, 그 절반(α = 0.5)인 4만큼 올라 3 + 4 = 7입니다."}, {"t": "num", "q": "Q = 5, r = 0, γ = 0.5, 다음 상태의 최대 Q = 4. TD 오차는?", "a": -3, "tol": 0.001, "h": "TD 목표 = 0 + 0.5 × 4", "w": "목표 2에서 지금 Q 5를 빼면 음수, 곧 예상보다 나빴으니 Q를 내리라는 신호입니다."}, {"t": "num", "q": "Q = 4, r = 1, γ = 0.9, 다음 상태의 최대 Q = 5, α = 0.1. 새 Q는?", "a": 4.15, "tol": 0.005, "h": "TD 목표 = 1 + 4.5 = 5.5", "w": "오차 1.5에 α = 0.1을 곱한 0.15만 고칩니다. α가 작으면 한 번의 경험에 덜 흔들립니다."}, {"t": "mc", "q": "DQN이 학습을 안정시키려고 더한 두 장치는?", "o": ["경험 재생과 타깃 네트워크", "드롭아웃과 배치 정규화", "베이스라인과 클리핑"], "a": 0, "w": "연달아 비슷한 장면만 배우는 쏠림과, 과녁(TD 목표)이 매번 움직이는 문제를 각각 막습니다."}, {"t": "mc", "q": "ε = 0.1, 행동 4개인 ε-탐욕. 무작위로 고를 때도 최고 행동이 뽑힐 수 있다면, 최고 행동을 고를 확률은?", "o": ["0.9", "0.925", "0.1"], "a": 1, "w": "90%는 최고 행동을 고르고, 나머지 10%의 무작위 선택 중 4분의 1도 최고 행동이라 0.9 + 0.025입니다."}, {"t": "ox", "q": "Q러닝을 하려면 환경의 전이 확률(어디로 가면 무슨 일이 생기는지)을 미리 알아야 한다.", "a": false, "w": "직접 겪은 (s, a, r, s′) 한 번 한 번으로 고치므로 지도 없이 배우는 '모델 없는' 방법입니다."}, {"t": "order", "q": "Q러닝의 한 걸음을 순서대로 탭하세요.", "tokens": ["ε-탐욕으로 행동을 고른다", "보상과 다음 상태를 본다", "TD 목표 r + γ × 최대 Q′를 계산한다", "Q(s, a)를 α × TD 오차만큼 고친다"], "extra": ["판이 끝날 때까지 기다린다"], "w": "한 걸음 뒤의 추측으로 바로 고치는 것이 TD라서, 판이 끝나기를 기다리지 않습니다."}] // @frag:ql01
  , reg01: [{"t": "num", "q": "원래 손실 0.2, 가중치 [1, 2], λ = 0.1일 때 L2 벌점을 더한 전체 손실은?", "a": 0.7, "tol": 0.001, "h": "가중치 제곱의 합 1 + 4에 λ를 곱해 더합니다", "w": "벌점은 0.1 × 5 = 0.5라서, 가중치가 클수록 전체 손실이 무거워집니다."}, {"t": "num", "q": "드롭아웃 p = 0.5, PyTorch 방식. 학습 중 살아남은 뉴런의 원래 출력이 3이면 다음 층으로 넘어가는 값은?", "a": 6, "h": "살아남은 값은 (1 − p)로 나눕니다", "w": "평균적으로 절반만 켜지니, 살아남은 값을 2배로 키워 평균 크기를 추론 때와 맞춥니다."}, {"t": "num", "q": "검증 손실이 에폭 1~5에 0.90, 0.70, 0.65, 0.66, 0.70이었습니다. 인내심 2로 조기 중단하면 몇 번째 에폭의 가중치를 쓰나요?", "a": 3, "h": "검증 손실이 가장 낮았던 에폭을 찾으세요", "w": "에폭 4, 5에서 두 번 연속 나아지지 않아 멈추고, 최저였던 에폭의 가중치로 되돌아갑니다."}, {"t": "mc", "q": "L2 규제의 세기 λ를 키우면 가중치는?", "o": ["더 커지려 한다", "0 쪽으로 더 강하게 눌린다", "변하지 않는다"], "a": 1, "w": "벌금이 무거워질수록 가중치를 작게 두는 것이 손실을 줄이는 길이 되기 때문입니다."}, {"t": "mc", "q": "조기 중단에서 '언제 멈출지' 판단할 때 보는 것은?", "o": ["훈련 손실", "검증 손실", "테스트 손실"], "a": 1, "w": "훈련 손실은 외울수록 계속 내려가고, 테스트 세트는 마지막에 한 번만 써야 하므로 검증 세트로 판단합니다."}, {"t": "ox", "q": "드롭아웃을 쓴 모델은 추론할 때도 뉴런을 무작위로 끈다.", "a": false, "w": "끄는 것은 학습 때 팀워크를 기르기 위한 연습일 뿐이고, 실전(추론)에서는 모든 뉴런을 켜고 크기만 맞춥니다."}, {"t": "order", "q": "조기 중단의 순서대로 탭하세요.", "tokens": ["에폭이 끝날 때마다 검증 손실을 잰다", "최저 기록이면 가중치를 저장한다", "인내심만큼 나아지지 않으면 멈춘다", "저장해 둔 가중치로 되돌린다"], "extra": ["훈련 손실이 오르면 멈춘다"], "w": "멈춘 순간의 가중치는 이미 조금 과적합된 상태라, 최저 지점의 가중치를 따로 저장해 둡니다."}] // @frag:reg01
  , roc01: [{"t": "num", "q": "진짜 불 점수 [0.9, 0.8, 0.6, 0.4], 불 아님 [0.7, 0.5, 0.3, 0.2]. 임계값 0.65에서 불을 잡은 비율은?", "a": 0.5, "tol": 0.001, "h": "0.65보다 큰 진짜 불의 수 ÷ 4", "w": "0.9와 0.8만 울려서 진짜 불 4개 중 2개를 잡았습니다."}, {"t": "num", "q": "같은 점수에서 임계값 0.45일 때 괜히 울린 비율은?", "a": 0.5, "tol": 0.001, "h": "0.45보다 큰 '불 아님'의 수 ÷ 4", "w": "0.7과 0.5가 울려서, 불이 아닌 상황 4개 중 2개에서 괜히 울렸습니다."}, {"t": "num", "q": "진짜 불 점수 [0.9, 0.6], 불 아님 [0.7, 0.2]. 짝 비교로 구한 AUC는?", "a": 0.75, "tol": 0.001, "h": "짝 4개 중 불 쪽 점수가 더 높은 짝의 비율", "w": "0.6 대 0.7 한 짝만 불이 지고 나머지 세 짝은 이겼습니다."}, {"t": "mc", "q": "AUC = 0.5인 모델의 뜻은?", "o": ["절반을 맞히니 쓸 만하다", "점수가 동전 던지기처럼 아무 정보도 없다", "임계값 0.5에서 완벽하다"], "a": 1, "w": "불과 불 아닌 것을 뽑아 비교하면 이길 확률이 반반이라, 줄 세우기 실력이 전혀 없다는 뜻입니다."}, {"t": "mc", "q": "임계값을 낮추면(더 예민하게) ROC 그래프 위의 점은 어느 쪽으로 움직이나요?", "o": ["오른쪽 위", "왼쪽 아래", "제자리"], "a": 0, "w": "더 자주 울리니 불을 잡은 비율과 괜히 울린 비율이 함께 커집니다."}, {"t": "ox", "q": "AUC는 임계값을 0.5로 정했을 때의 정확도다.", "a": false, "w": "AUC는 임계값을 하나로 정하기 전에, 모든 임계값에 걸친 줄 세우기 실력을 요약한 값입니다."}, {"t": "order", "q": "ROC 곡선을 그리는 순서대로 탭하세요.", "tokens": ["임계값 하나를 정한다", "혼동 행렬의 네 칸을 센다", "괜히 울린 비율과 불을 잡은 비율을 구한다", "점을 찍고, 임계값을 바꿔 반복해 잇는다"], "extra": ["정확도를 구해 세로축에 놓는다"], "w": "임계값마다 점 하나가 나오고, 다이얼 전 구간의 점을 이으면 곡선이 됩니다."}] // @frag:roc01
  , smp01: [{"t": "num", "q": "점수 [2, 0], 온도 T = 2일 때 1등의 확률은? (e ≈ 2.718, 소수 둘째 자리까지)", "a": 0.73, "tol": 0.01, "h": "z/T = [1, 0] → e ÷ (e + 1)", "w": "온도 2로 나누면 점수 차이가 2에서 1로 줄어, T = 1일 때(약 0.88)보다 1등의 확률이 낮아집니다."}, {"t": "num", "q": "확률 [0.5, 0.3, 0.15, 0.05]에 top-p (p = 0.9)를 쓰면 1등의 최종 확률은? (소수 둘째 자리까지)", "a": 0.53, "tol": 0.01, "h": "누적 0.5, 0.8, 0.95에서 멈추고, 남은 셋의 합 0.95로 나눕니다", "w": "0.95가 처음으로 0.9에 닿은 자리라 3개가 남고, 0.5 ÷ 0.95 ≈ 0.53입니다."}, {"t": "num", "q": "확률 [0.4, 0.3, 0.2, 0.1]에 top-k (k = 2)를 쓰면 2등의 최종 확률은? (소수 둘째 자리까지)", "a": 0.43, "tol": 0.01, "h": "위 2개만 남기고 합 0.7로 나눕니다", "w": "0.3 ÷ 0.7 ≈ 0.43입니다. 잘린 후보의 몫이 남은 후보들에게 비율대로 나뉩니다."}, {"t": "mc", "q": "온도를 1에서 2로 올리면 확률 막대는?", "o": ["1등에 더 몰려 뾰족해진다", "평평해져 낮은 후보도 자주 뽑힌다", "변하지 않는다"], "a": 1, "w": "점수를 더 큰 수로 나누면 점수 차이가 줄어들고, 소프트맥스는 차이가 작을수록 고른 확률을 냅니다."}, {"t": "mc", "q": "확률이 [0.92, 0.05, 0.02, 0.01]처럼 모델이 확신할 때 top-p (p = 0.9)가 남기는 후보 수는?", "o": ["1개", "3개", "4개"], "a": 0, "w": "첫 막대만으로 누적 확률이 0.9를 넘기 때문입니다. top-p는 확신할수록 적게, 헷갈릴수록 많이 남깁니다."}, {"t": "ox", "q": "온도를 0에 가깝게 낮추면 모델의 답이 사실이라고 믿어도 된다.", "a": false, "w": "온도는 확률 1등을 고르게 할 뿐이고, 모델이 틀린 답에 높은 확률을 주면 그 틀린 답을 매번 똑같이 냅니다."}, {"t": "order", "q": "다음 토큰 하나를 만드는 보통의 순서대로 탭하세요.", "tokens": ["점수(logit)를 온도 T로 나눈다", "소프트맥스로 확률을 만든다", "top-k나 top-p로 꼬리를 자르고 다시 나눈다", "남은 후보에서 하나를 뽑는다"], "extra": ["모든 후보의 출력을 섞는다"], "w": "모양을 먼저 바꾸고, 자르고, 마지막에 하나를 뽑습니다. 출력을 섞는 것은 MoE의 top-k가 하는 일입니다."}] // @frag:smp01

  , agt01: {"q": "LLM 에이전트와 일반 챗봇의 차이를 설명하고, ReAct가 무엇인지 예를 들어 말해 주세요. MCP는 무엇을 표준화하나요?", "s": ["에이전트는 목표를 이루려고 다음 할 일을 스스로 고르며 도구를 써서 여러 걸음 일하는 언어 모델 프로그램이고, 챗봇은 한 번 읽고 한 번 답합니다.", "ReAct는 생각, 행동, 관찰을 번갈아 되풀이하는 방식인데, 모델은 도구 호출을 정해진 형식의 글로 요청만 하고 실행은 바깥 프로그램이 해서 결과를 관찰로 붙여 줍니다.", "예를 들어 내일 우산이 필요하냐고 물으면, 날씨를 알아야 한다고 생각하고, 날씨 검색을 요청하고, 강수확률 80퍼센트라는 관찰을 읽은 뒤 우산을 챙기라고 답합니다.", "MCP는 Anthropic이 2024년에 공개한 규격으로, AI 앱과 도구나 데이터를 잇는 연결 방식을 USB-C처럼 하나로 맞춰서 도구를 한 번만 만들면 여러 앱에서 쓰게 합니다.", "ReAct 논문은 예시 한두 개만 넣은 프롬프트로 ALFWorld와 WebShop에서 기존 학습 방법보다 성공률을 34퍼센트포인트, 10퍼센트포인트 높였고, 관찰 속에 숨은 지시인 프롬프트 인젝션은 막아야 할 위험입니다."], "k": ["여러 걸음", "생각 행동 관찰", "도구 호출", "프로그램이 실행", "MCP 표준"]} // @frag:agt01
  , bel01: {"q": "벨만 방정식이 무엇이고 왜 강화학습의 중심인가요? V와 Q의 차이도 설명해 주세요.", "s": ["벨만 방정식은 이 상태의 가치가 이번 걸음의 보상과 할인된 다음 상태의 가치의 합이라는 관계식입니다.", "가치를 자기 자신으로 정의하지만, 끝 상태의 가치를 0으로 두고 거꾸로 채우거나 모든 상태를 되풀이해 고치면 풀리고, 확률이 섞이면 그 기댓값을 씁니다.", "V는 상태 자체의 가치이고, Q는 그 상태에서 특정 행동을 먼저 했을 때의 가치이며, 최선을 고르면 V는 Q의 최댓값이 됩니다.", "예를 들어 도착하면 10점인 복도에서 감마가 0.9면 도착 직전 칸은 10, 그 앞 칸은 9, 그 앞은 8.1로 한 칸씩 0.9를 곱해 갑니다.", "이 식은 벨만의 1957년 동적 계획법에서 나왔고, Q러닝과 액터-크리틱 같은 방법이 모두 이 식을 경험으로 근사합니다."], "k": ["벨만 방정식", "할인", "V와 Q", "최댓값", "동적 계획법"]} // @frag:bel01
  , cm01: {"q": "정밀도와 재현율의 차이를 설명하고, 재현율이 더 중요한 상황의 예를 들어 주세요.", "s": ["정밀도와 재현율은 둘 다 혼동 행렬에서 구하는 분류 지표이고, 분모만 다릅니다.", "정밀도는 모델이 양성이라고 예측한 것 중 실제 양성의 비율이고, 재현율은 실제 양성 중 모델이 찾아낸 비율입니다.", "화재경보기로 치면 정밀도는 울렸을 때 진짜 불이었나, 재현율은 진짜 불을 몇 번 잡았나입니다.", "경보기를 예민하게 하면 재현율은 오르고 정밀도는 내려가는 트레이드오프가 있어서, 둘의 조화평균인 F1을 함께 봅니다.", "암 검진처럼 놓치면 큰일인 경우는 재현율을, 스팸 필터처럼 잘못 거르면 곤란한 경우는 정밀도를 우선하고, Goodfellow의 Deep Learning 11.1절도 드문 사건을 찾을 때는 정확도 대신 이 지표들을 보라고 권합니다."], "k": ["혼동 행렬", "양성이라고 예측한 것 중", "실제 양성 중", "트레이드오프", "놓치면"]} // @frag:cm01
  , cnn01: {"q": "CNN이 이미지에서 완전연결층보다 유리한 이유는 무엇인가요?", "s": ["CNN은 작은 필터를 그림 위로 미끄러뜨리며 같은 자리끼리 곱해 더하는 합성곱으로 그림을 처리하는 신경망입니다.", "필터 하나를 그림의 모든 자리에서 같이 쓰기 때문에, 3 × 3 필터라면 배울 숫자가 편향까지 10개뿐입니다.", "28 × 28 그림을 26 × 26으로 보내는 완전연결층은 가중치가 50만 개가 넘으니, 파라미터가 비교할 수 없이 적습니다.", "또 같은 필터가 어디서나 같은 무늬를 찾으니 고양이가 왼쪽에 있든 오른쪽에 있든 똑같이 알아보고, 최대 풀링이 작은 위치 이동까지 흡수합니다.", "Goodfellow의 『Deep Learning』 9장은 이 두 성질을 지역 연결과 파라미터 공유로 설명하고, 이것이 LeNet부터 ResNet까지 모든 CNN의 바탕입니다."], "k": ["필터", "가중치 공유", "파라미터", "위치", "최대 풀링"]} // @frag:cnn01
  , cnn02: {"q": "AlexNet은 왜 딥러닝의 전환점이라 불리나요? ResNet은 무엇을 해결했나요?", "s": ["AlexNet은 2012년 이미지넷 대회에서 top-5 오류 15.3%로, 26.2%였던 2등을 10%p 넘게 앞선 합성곱 신경망입니다.", "ReLU로 기울기 소실을 줄이고, 드롭아웃으로 과적합을 막고, GPU 두 장으로 6천만 개 파라미터를 학습한 것이 핵심이었습니다.", "이 결과로 사람이 특징을 손으로 설계하던 방식에서 데이터로 특징을 배우는 딥러닝으로 흐름이 바뀌었습니다.", "그 뒤 VGG가 3 × 3 필터를 깊게 쌓았지만, 층을 더 늘리면 학습 오류까지 커지는 문제가 남았습니다.", "He 외 2015년 ResNet 논문은 입력을 그대로 더하는 잔차 연결로 이 문제를 풀어 152층을 학습했고, top-5 오류를 3.57%까지 낮췄습니다."], "k": ["이미지넷", "ReLU", "드롭아웃", "GPU", "잔차 연결"]} // @frag:cnn02
  , ens01: {"q": "랜덤 포레스트와 그래디언트 부스팅의 차이는 무엇인가요?", "s": ["둘 다 결정 트리 여러 개를 합치는 앙상블이지만, 랜덤 포레스트는 나무를 나란히 키우고 부스팅은 한 줄로 차례차례 키웁니다.", "랜덤 포레스트는 부트스트랩으로 뽑은 서로 다른 데이터와 무작위로 고른 특징 후보로 깊은 나무들을 따로 학습한 뒤, 다수결이나 평균으로 합쳐 흔들림을 줄입니다.", "그래디언트 부스팅은 앞 나무가 남긴 잔차를 다음 얕은 나무가 맞히게 하고, 그 예측에 학습률을 곱해 계속 더해 가며 남은 오차를 줄입니다.", "그래서 랜덤 포레스트는 나무를 늘려도 과적합이 잘 안 되지만, 부스팅은 나무 수와 학습률을 검증 세트로 조절해야 합니다.", "랜덤 포레스트는 Breiman이, 그래디언트 부스팅은 Friedman이 2001년에 발표했고, 이를 다듬은 XGBoost는 표 데이터 대회에서 가장 많이 쓰이는 도구 중 하나가 되었습니다."], "k": ["나란히", "차례", "부트스트랩", "잔차", "과적합"]} // @frag:ens01
  , kd01: {"q": "양자화와 지식 증류의 차이는 무엇인가요? 둘 다 모델을 작게 만드는데 언제 무엇을 쓰겠습니까?", "s": ["양자화는 가중치 숫자 하나를 더 적은 비트로 저장하는 방법이고, 지식 증류는 큰 선생 모델의 출력을 작은 학생 모델이 따라 하도록 새로 학습시키는 방법입니다.", "양자화는 가장 큰 절댓값으로 눈금을 정해 값을 정수로 반올림하므로 파라미터 개수는 그대로이고, 대개 다시 학습하지 않아도 됩니다.", "예를 들어 70억 파라미터 모델은 16비트로 가중치만 14기가바이트지만 4비트로 줄이면 3.5기가바이트라서 노트북이나 휴대폰에도 들어갑니다.", "증류에서는 선생의 확률을 온도로 부드럽게 만들어, 정답에 없는 '틀린 보기와 얼마나 닮았나'라는 정보까지 KL 발산 손실로 학생에게 가르칩니다.", "그래서 빨리 배포해야 하면 양자화를, 학습 비용을 들여서라도 구조가 작은 모델이 필요하면 증류를 쓰고, DistilBERT는 증류로 크기를 40퍼센트 줄이고 성능의 97퍼센트를 지켰습니다."], "k": ["비트 수", "눈금과 반올림", "부드러운 확률", "온도", "DistilBERT"]} // @frag:kd01
  , knn01: {"q": "k-NN과 k-평균은 이름이 비슷한데 어떻게 다른가요?", "s": ["둘 다 가까운 점끼리 닮았다는 생각으로 거리를 재지만, k-NN은 분류를 하는 지도 학습이고 k-평균은 무리를 찾는 비지도 학습입니다.", "k-NN은 새 점에서 가장 가까운, 이름표가 붙은 점 k개를 찾아 다수결로 답하며, 따로 학습하지 않고 데이터를 외워 둡니다.", "k-평균은 이름표 없이 깃발 k개를 놓고, 점을 가장 가까운 깃발에 배정한 뒤 깃발을 무리의 평균으로 옮기는 일을 바뀌는 점이 없을 때까지 반복합니다.", "그래서 k-NN의 k는 투표하는 이웃 수라 검증 세트로 고르고, k-평균의 k는 찾을 무리 수이며 시작 위치에 따라 결과가 달라 여러 번 돌려 봅니다.", "1967년 Cover와 Hart는 데이터가 아주 많으면 가장 가까운 이웃 하나만 봐도 오차가 이론상 최선의 두 배를 넘지 않는다는 것을 보였고, 오늘날 RAG가 질문과 가까운 문서를 찾는 것도 같은 생각입니다."], "k": ["지도 학습", "비지도 학습", "다수결", "평균으로 옮기", "가장 가까운"]} // @frag:knn01
  , logi01: {"q": "로지스틱 회귀는 이름에 '회귀'가 있는데 왜 분류 모델인가요?", "s": ["로지스틱 회귀는 입력이 '예'일 확률을 내는 이진 분류 모델입니다.", "먼저 선형 점수 wx + b를 계산하고, 시그모이드 함수로 눌러 0과 1 사이의 확률로 바꿉니다.", "모델이 직접 맞히는 건 확률, 정확히는 로그 오즈라는 연속된 숫자라서 회귀라는 이름이 붙었고, 이 확률을 0.5 같은 임계값으로 잘라 분류에 씁니다.", "학습은 정답 쪽 확률의 마이너스 로그, 즉 이진 크로스엔트로피를 경사하강으로 줄이는 방식이고, 예를 들어 공부 시간으로 합격 여부를 맞힐 때 확률 0.5가 되는 x = −b/w가 결정 경계가 됩니다.", "1958년 Cox가 정리한 방법이고, 지금도 신경망 마지막 층의 시그모이드와 이진 크로스엔트로피, RLHF 보상 모델의 비교 손실이 같은 식을 씁니다."], "k": ["시그모이드", "확률", "로그 오즈", "임계값", "이진 크로스엔트로피"]} // @frag:logi01
  , mab01: {"q": "탐색과 활용의 트레이드오프를 예를 들어 설명해 주세요. 추천 시스템에서는 어떻게 나타나나요?", "s": ["탐색과 활용은 아는 최고를 고를지, 덜 알려진 것을 시도해 정보를 얻을지 사이의 균형 문제입니다.", "활용만 하면 처음에 운 좋았던 선택에 갇히고, 탐색만 하면 좋은 선택을 알면서도 쓰지 못합니다.", "가장 간단한 해법은 ε-탐욕으로, 대부분은 평균이 가장 높은 행동을 고르고 확률 ε로만 아무 행동이나 고릅니다.", "추천 시스템도 확실히 좋아할 콘텐츠만 보여 주면 새 취향을 모르게 되어, 가끔 새 콘텐츠를 섞어 반응을 봅니다.", "Sutton과 Barto의 교재 2장이 이 멀티암드 밴딧 문제를 다루고, Li 외 2010년 논문은 야후 뉴스 추천을 밴딧 문제로 풀었습니다."], "k": ["탐색", "활용", "ε-탐욕", "멀티암드 밴딧", "추천 시스템"]} // @frag:mab01
  , mdp01: {"q": "MDP를 구성하는 요소를 말하고, 할인율이 왜 필요한지 설명해 주세요.", "s": ["MDP는 마르코프 결정 과정으로, 강화학습 문제를 상태, 행동, 보상, 다음 상태로 갈 확률, 할인율 다섯 가지로 적는 틀입니다.", "에이전트가 상태를 보고 행동하면 환경이 보상과 다음 상태를 돌려주고, 다음 일은 지금 상태만으로 정해진다는 마르코프 성질을 가정합니다.", "목표는 미래 보상을 할인율 감마로 줄여 더한 리턴의 기댓값이 가장 큰 정책을 찾는 것입니다.", "할인율이 있어야 끝없는 보상의 합이 무한대가 되지 않고, 불확실한 먼 미래보다 가까운 보상을 더 쳐 주게 되며, 감마가 0.9면 대략 10걸음 앞까지 봅니다.", "DQN 논문은 아타리 게임에서 최근 화면 4장을 상태로, 점수 변화를 보상으로 두고 감마 0.99를 썼습니다."], "k": ["상태", "행동", "보상", "할인율", "마르코프 성질"]} // @frag:mdp01
  , of01: {"q": "과적합이 무엇이고, 학습 곡선에서 어떻게 알아보나요?", "s": ["과적합은 모델이 훈련 데이터의 규칙뿐 아니라 우연한 잡음까지 외워서, 훈련 데이터에서는 잘하지만 처음 보는 데이터에서는 못하는 상태입니다.", "학습 곡선에 에폭마다 훈련 손실과 검증 손실을 함께 그리면, 훈련 손실은 계속 내려가는데 검증 손실은 바닥을 찍고 다시 올라가며 두 곡선 사이가 벌어집니다.", "반대로 두 손실이 모두 높고 비슷하면 모델이 너무 단순한 과소적합이고, 이는 편향-분산 트레이드오프로 설명됩니다.", "예를 들어 점 10개에 9차 다항식을 맞추면 훈련 손실은 0이 되지만 검증 손실은 3차식보다 수십 배 커집니다.", "Goodfellow의 Deep Learning 5.2절은 이를 모델 용량으로 설명하고, 처방으로는 데이터 늘리기, 용량 줄이기, 규제와 조기 중단을 씁니다."], "k": ["잡음까지 외워", "검증 손실", "다시 올라가", "편향-분산", "용량"]} // @frag:of01
  , pg01: {"q": "가치 기반 방법과 정책 경사 방법의 차이는 무엇이고, REINFORCE의 약점과 해결책은 무엇인가요?", "s": ["정책 경사는 Q러닝처럼 점수표를 거치지 않고, 상태마다 행동 확률을 내는 정책을 직접 학습하는 방법입니다.", "REINFORCE는 정책대로 한 판을 끝까지 해 보고, 그 판의 리턴만큼 무게를 주어 한 행동들의 로그 확률을 올립니다.", "예를 들어 확률 0.5짜리 행동으로 리턴 10을 받고 학습률이 0.1이면, 소프트맥스 logit이 0.5씩 벌어져 확률이 약 0.73이 됩니다.", "약점은 한 판의 리턴에 우연이 많이 섞여 분산이 크다는 것이고, 리턴에서 평균 같은 베이스라인을 빼서 평소보다 잘했을 때만 올리면 흔들림이 줄어듭니다.", "이 방법은 Williams가 1992년에 제안했고, 베이스라인을 신경망으로 배우는 액터-크리틱과 PPO로 이어집니다."], "k": ["행동 확률", "리턴", "로그 확률", "분산", "베이스라인"]} // @frag:pg01
  , ql01: {"q": "Q러닝의 갱신식을 설명하고, DQN이 학습을 안정시키려고 추가한 두 가지를 말해 주세요.", "s": ["Q러닝은 환경의 규칙을 몰라도 경험만으로 행동 가치 Q를 배우는 모델 없는 강화학습입니다.", "한 걸음 움직인 뒤 보상에 할인율 곱하기 다음 상태의 최대 Q를 더해 TD 목표를 만들고, 지금 Q와의 차이인 TD 오차에 학습률을 곱해 Q를 고칩니다.", "움직일 때는 ε-탐욕으로 가끔 탐험하지만 목표에는 늘 최댓값을 써서 최적의 Q를 배웁니다.", "DQN은 이 표를 신경망으로 바꿨고, 경험을 모아 무작위로 섞어 쓰는 경험 재생과, 목표를 계산하는 신경망을 잠시 얼려 두는 타깃 네트워크로 학습을 안정시켰습니다.", "Mnih 외 2015년 Nature 논문에서 DQN은 같은 구조와 설정으로 Atari 게임 49개를 화면 픽셀만 보고 학습했습니다."], "k": ["TD 오차", "학습률", "ε-탐욕", "경험 재생", "타깃 네트워크"]} // @frag:ql01
  , reg01: {"q": "드롭아웃은 어떻게 과적합을 줄이나요? 추론할 때는 어떻게 하나요?", "s": ["드롭아웃은 학습할 때 뉴런을 정해진 확률로 무작위로 꺼 버리는 규제 방법입니다.", "걸음마다 꺼지는 뉴런이 바뀌기 때문에, 몇몇 뉴런이 훈련 데이터의 잡음을 외우는 데 기대기 어렵고 여러 뉴런이 일을 나눠 맡게 됩니다.", "추론할 때는 아무것도 끄지 않고 모든 뉴런을 켭니다.", "대신 학습 때와 평균 크기가 같도록, 원 논문은 추론 때 출력에 1 빼기 p를 곱하고, PyTorch는 학습 때 살아남은 값을 1 빼기 p로 나눠 둡니다.", "2014년 Srivastava와 Hinton 등의 논문이 이 방법을 정리했고, 가중치 감쇠, 조기 중단과 함께 가장 많이 쓰는 규제입니다."], "k": ["무작위로 끈다", "기대지 않게", "추론 때는 모두 켠다", "1 − p", "Srivastava"]} // @frag:reg01
  , roc01: {"q": "ROC 곡선과 AUC를 설명하고, AUC가 0.5와 1.0일 때의 뜻을 말해 주세요.", "s": ["ROC 곡선은 분류 모델의 임계값을 바꿔 가며, 가로축에 거짓 양성 비율, 세로축에 재현율을 찍어 이은 곡선입니다.", "화재경보기로 치면 민감도 다이얼을 돌리면서 괜히 울린 비율과 불을 잡은 비율을 기록한 성적표입니다.", "AUC는 그 곡선 아래 넓이이고, 양성 하나와 음성 하나를 무작위로 뽑았을 때 양성의 점수가 더 높을 확률과 같습니다.", "그래서 AUC가 1이면 완벽하게 줄을 세운 것이고, 0.5면 동전 던지기와 같아 아무 정보가 없다는 뜻입니다.", "정확도와 달리 임계값을 정하기 전의 실력을 보여 주기 때문에 모델 비교에 쓰고, Fawcett의 2006년 입문 논문이 이 방법을 잘 정리했습니다."], "k": ["임계값", "거짓 양성 비율", "재현율", "곡선 아래 넓이", "동전 던지기"]} // @frag:roc01
  , smp01: {"q": "temperature와 top-p를 설명하고, 사실 정확도가 중요한 서비스와 창작 서비스에서 각각 어떻게 설정하겠습니까?", "s": ["언어 모델은 매 걸음 다음 토큰의 확률을 내고, 샘플링은 그 확률대로 제비를 뽑아 하나를 고르는 방법입니다.", "temperature는 소프트맥스 전에 점수를 나누는 값으로, 낮추면 확률이 1등에 몰리고 높이면 평평해져 다양한 토큰이 나옵니다.", "top-p는 확률이 큰 후보부터 더해 누적 확률이 p에 닿을 때까지만 남기는 방법이라, 모델이 확신하면 후보가 적고 헷갈리면 많아집니다.", "그래서 사실 질문이나 코드처럼 답이 거의 하나인 서비스는 온도를 0에서 0.3 정도로 낮추고, 이야기나 아이디어 서비스는 온도 1 근처에 top-p 0.9 정도로 다양함을 살리면서 엉뚱한 꼬리를 자릅니다.", "top-p는 Holtzman 외 2020년 논문이 제안했는데, 확률이 가장 큰 글만 찾는 greedy나 빔 서치가 오히려 반복되고 밋밋한 글을 낸다는 관찰에서 나왔습니다."], "k": ["샘플링", "temperature", "top-p", "낮추고", "Holtzman"]} // @frag:smp01
  , split01: {"q": "검증 세트와 테스트 세트는 왜 따로 둬야 하나요? 데이터 누수의 예도 하나 들어 주세요.", "s": ["검증 세트는 하이퍼파라미터와 모델을 고르는 데 쓰고, 테스트 세트는 모든 선택이 끝난 뒤 성능을 한 번만 재는 데 씁니다.", "검증 점수를 보고 여러 후보 중 최고를 고르면, 운 좋게 그 검증 세트에 잘 맞은 후보가 뽑히기 쉬워서 점수가 실제보다 낙관적으로 나옵니다.", "그래서 고르는 데 한 번도 쓰지 않은 테스트 세트가 있어야 일반화 성능을 정직하게 말할 수 있고, 데이터가 적으면 k겹 교차 검증으로 검증 점수를 평균 내 흔들림을 줄입니다.", "데이터 누수의 예로는, 집값을 예측하면서 거래 후에 매긴 취득세를 입력에 넣거나, 정규화 통계를 테스트 세트까지 포함해 계산하는 경우가 있습니다.", "Kaufman 등의 2012년 논문은 이런 누수를 정리하며, 예측 시점에 알 수 없는 정보가 섞이면 점수는 좋아도 실전에서는 무너진다고 경고합니다."], "k": ["하이퍼파라미터", "한 번만", "낙관적", "교차 검증", "예측 시점"]} // @frag:split01
  , svm01: {"q": "SVM의 마진과 서포트 벡터란 무엇이고, 커널 트릭은 왜 쓰나요?", "s": ["SVM은 두 클래스를 가르는 경계선 중에서 가장 가까운 데이터까지의 거리, 즉 마진이 가장 큰 선을 고르는 분류기입니다.", "마진의 가장자리에 닿아 경계의 위치를 정하는 점들을 서포트 벡터라고 하며, 나머지 점은 움직여도 경계가 바뀌지 않습니다.", "실제 데이터는 완벽히 갈리지 않아서 몇 점이 마진 안에 들어오는 것을 벌점을 주고 허용하는 소프트 마진을 쓰는데, 벌점 세기 C가 크면 과적합 쪽, 작으면 규제가 센 쪽입니다.", "직선으로 갈리지 않는 데이터도 높은 차원으로 올리면 갈리는데, SVM은 점끼리의 내적만 필요하므로 커널 함수로 올린 공간의 내적을 바로 계산하는 커널 트릭을 씁니다.", "이 방법은 1995년 Cortes와 Vapnik의 논문으로 정리되었고, 손글씨 숫자 인식 같은 분류 문제에서 딥러닝 이전의 대표 방법이었습니다."], "k": ["마진", "서포트 벡터", "소프트 마진", "내적", "커널 트릭"]} // @frag:svm01
  , tok01: {"q": "토큰이 무엇이고, 왜 단어나 글자가 아니라 서브워드를 쓰나요?", "s": ["토큰은 언어 모델이 글을 읽고 쓰는 조각 하나이고, 모델은 토큰마다 번호를 붙여 임베딩 벡터로 바꿔 씁니다.", "단어 단위로 자르면 사전에 없는 단어가 모두 UNK가 되고, 글자 단위로 자르면 문장이 너무 길어져 컨텍스트 윈도우를 금방 채웁니다.", "그래서 자주 쓰는 단어는 통째로, 드문 단어는 조각 몇 개로 나누는 서브워드를 씁니다.", "대표 방법인 BPE는 글자에서 시작해 가장 자주 붙어 나오는 쌍을 합치기를 반복하는데, 예를 들어 low와 est를 만들어 두면 처음 보는 lowest도 두 토큰으로 읽습니다.", "Sennrich 외 2016년 논문이 이 방법을 번역에 처음 써서 드문 단어 문제를 줄였고, 지금의 GPT 계열 모델도 BPE 계열 토크나이저를 씁니다."], "k": ["토큰", "UNK", "서브워드", "BPE", "컨텍스트 윈도우"]} // @frag:tok01
  , tree01: {"q": "결정 트리는 어떤 기준으로 분할을 고르나요? 왜 과적합되기 쉬운가요?", "s": ["결정 트리는 예/아니오 질문을 이어 붙여 데이터를 나누고, 끝에 도착한 잎에서 다수결로 답하는 모델입니다.", "분할을 고를 때는 질문 후보마다 나눈 뒤 바구니들의 불순도를 데이터 수로 가중 평균해서, 나누기 전보다 가장 많이 줄어드는, 즉 정보 이득이 가장 큰 질문을 고릅니다.", "불순도로는 두 개를 뽑았을 때 종류가 다를 확률인 지니 불순도나 엔트로피를 씁니다.", "제한 없이 키우면 잎마다 데이터가 하나씩 남을 때까지 잡음까지 외우기 때문에 과적합되기 쉬워서, 깊이 제한이나 가지치기를 합니다.", "지니를 쓰는 CART는 1984년 Breiman 등이, 엔트로피를 쓰는 ID3는 1986년 Quinlan이 정리했고, 해석하기 쉬워 지금도 랜덤 포레스트와 부스팅의 부품으로 쓰입니다."], "k": ["예/아니오 질문", "불순도", "가중 평균", "정보 이득", "가지치기"]} // @frag:tree01

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let speakCleanup = null;
function stopSpeak() { if (speakCleanup) { try { speakCleanup(); } catch (_) { } speakCleanup = null; } try { window.speechSynthesis?.cancel(); } catch (_) { } }
function spokeCount(id) { return (STATS.spoke || {})[id] || 0; }
function norm(t) { return String(t).toLowerCase().replace(/[\s.,!?'"·]/g, ""); }
function speakCard(id) {

function renderMD(md) {
  const codes = [], maths = [];
  md = md.replace(/```[\s\S]*?```/g, m => { codes.push(m); return `KXCODE${codes.length - 1}KX`; });
  md = md.replace(/`[^`\n]+`/g, m => { codes.push(m); return `KXCODE${codes.length - 1}KX`; });
  md = md.replace(/\$\$([\s\S]+?)\$\$/g, (m, t) => { maths.push([t, true]); return `KXMATH${maths.length - 1}KX`; });
  md = md.replace(/\$([^$\n]+?)\$/g, (m, t) => { maths.push([t, false]); return `KXMATH${maths.length - 1}KX`; });
  md = md.replace(/KXCODE(\d+)KX/g, (m, i) => codes[+i]);
  let html = window.marked ? marked.parse(md) : "<pre>" + md.replace(/</g, "&lt;") + "</pre>";
  html = html.replace(/KXMATH(\d+)KX/g, (m, i) => {
    const [t, disp] = maths[+i];
    if (!window.katex) return disp ? `<div class="calc">${t}</div>` : `<code>${t}</code>`;
    try { return katex.renderToString(t, { displayMode: disp, output: "mathml", throwOnError: false, strict: false }); } catch (e) { return `<code>${t}</code>`; }
  });
  return html;
}
function hlPy(code) {
  const esc = t => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const re = /(#[^\n]*)|([fr]?"(?:[^"\\\n]|\\.)*"|[fr]?'(?:[^'\\\n]|\\.)*')|\b(\d+(?:_\d+)*(?:\.\d+)?(?:e-?\d+)?)\b|\b(import|from|as|def|return|for|in|if|elif|else|while|lambda|True|False|None|and|or|not|with|class|try|except|print|range|len|sum|zip|enumerate)\b/g;
  let out = "", last = 0, m;
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index));
    const cls = m[1] ? "co" : m[2] ? "st" : m[3] ? "nu" : "kw";
    out += `<span class="${cls}">${esc(m[0])}</span>`;
    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}
