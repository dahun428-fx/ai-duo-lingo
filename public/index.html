올 확률입니다.\n2. 같은 것입니다. −로그 가능도를 최소화하는 것이 크로스엔트로피를 최소화하는 것입니다.\n3. O. 사전 믿음(가짜 관측)의 영향이 데이터에 묻힙니다.\n4. 데이터가 적을 때. MLE는 적은 데이터를 과신해 0이나 1 같은 극단적인 답을 냅니다.\n<\/details>\n", "link": "논문 연결: 지금까지 본 모든 모델의 학습 목표 가 바로 최대가능도입니다 (Seq2Seq 3.2절, GPT, BERT 모두)", "lesson": true}, {"id": "vae01", "short": "VAE: 압축했다 되살리며 배우기", "md": "# 8단계. VAE: 압축했다 되살리며 배우기\n\n30분 · 논문 연결: Kingma, Welling (2013) \"Auto-Encoding Variational Bayes\". 새 데이터를 만들어 내는 생성 모델의 첫 갈래\n\n---\n\n## 오늘의 목표\n1. 오토인코더가 \"압축 → 복원\"으로 데이터의 핵심을 배운다는 걸 설명할 수 있다.\n2. VAE가 압축 결과를 점 하나가 아니라 \"평균과 표준편차\"로 내놓는 이유를 안다.\n3. VAE 손실의 두 조각(복원 오차, KL 벌점)을 작은 숫자로 계산할 수 있다.\n\n**복습 (1분):** 평균 0, 표준편차 1인 정규분포를 기호로 쓰면? (답: $\\mathcal{N}(0, 1)$. [정규분포](#nd01))\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 생성 모델: 분류가 아니라 만들기\n지금까지의 모델은 주로 **맞히는** 일을 했습니다. **생성 모델**은 데이터와 비슷한 **새 것을 만듭니다.** 세상에 없던 얼굴 사진, 새 문장.\n\n### 1-2. 오토인코더: 좁은 문을 지나게 하기\n- **인코더**: 입력 x를 작은 벡터 z로 **압축**\n- **디코더**: z에서 x를 **복원** → $\\hat x$\n- 손실: 원본과 복원의 차이 $(x - \\hat x)^2$\n\n784칸(28 × 28 점)짜리 손글씨 그림을 2칸짜리 z로 줄였다 되살려야 한다면, 모델은 \"어떤 숫자인지, 얼마나 기울었는지\" 같은 **핵심만** z에 담을 수밖에 없습니다. z가 사는 공간을 **잠재 공간**이라고 합니다. 잠재는 \"겉으로 안 보이게 숨어 있다\"는 뜻입니다. 그림 속에 숨은 핵심 특징이라 그렇게 부릅니다. 여행 가방에 꼭 필요한 것만 싸는 것과 같아요. [PCA](#svd01)가 직선 방향으로 줄였다면 오토인코더는 신경망으로 휘어지게 줄입니다.\n\n### 1-3. 문제: 잠재 공간에 구멍이 숭숭\n새 그림을 만들려면 아무 z나 골라 디코더에 넣으면 될 것 같습니다. 그런데 보통 오토인코더는 학습 데이터가 놓인 **점들만** 복원할 줄 압니다. 점과 점 사이의 빈 곳을 고르면 엉망인 그림이 나옵니다.\n\n### 1-4. VAE의 생각: 점 대신 구름\nVAE의 인코더는 z를 점 하나로 내놓지 않고 **\"평균 μ, 표준편차 σ인 정규분포\"**로 내놓습니다. 그리고 거기서 z를 **뽑습니다.**\n\n$$z = \\mu + \\sigma \\cdot \\varepsilon, \\quad \\varepsilon \\sim \\mathcal{N}(0, 1)$$\n\nε(엡실론)은 표준 정규분포에서 뽑은 무작위 수입니다. ~는 \"이 분포에서 무작위로 하나 뽑았다\"는 뜻이에요. 키 분포에서 사람 한 명을 아무나 고르는 것과 같습니다. 0 근처 값이 자주, ±2 밖은 드물게 나옵니다. (Adam에 나온 ε과는 다른, 여기서만 쓰는 이름입니다.) 같은 그림도 매번 조금씩 다른 z로 바뀌니, 디코더는 **그 주변 전체**를 복원하는 법을 배웁니다. 점이 구름이 되어 빈 곳이 메워집니다.\n\n> 이렇게 \"무작위는 ε에 몰아 두고, μ와 σ는 보통 계산으로\" 쓰는 것을 재매개변수화 요령이라고 합니다. 덕분에 [역전파](#bp01)가 μ와 σ까지 흘러갑니다.\n\n### 1-5. 손실 = 복원 오차 + KL 벌점\n구름들이 제멋대로 흩어지면 또 구멍이 생깁니다. 그래서 모든 구름이 **표준 정규분포 $\\mathcal{N}(0, 1)$ 근처에 모이도록** 벌점을 줍니다. 두 분포의 차이를 재는 [KL 발산](#day07)을 씁니다.\n\n$$\\text{손실} = \\underbrace{(x - \\hat x)^2}_{\\text{복원 오차}} + \\underbrace{\\text{KL}\\big(\\mathcal{N}(\\mu, \\sigma^2)\\,\\|\\,\\mathcal{N}(0, 1)\\big)}_{\\text{벌점}}$$\n\nz가 숫자 하나일 때 KL 벌점은 다음 식입니다.\n\n$$\\text{KL} = \\frac{1}{2}\\left(\\mu^2 + \\sigma^2 - 1 - \\ln \\sigma^2\\right)$$\n\nμ = 0, σ = 1이면 정확히 0. 거기서 멀어질수록 커집니다. [Day 07](#day07)의 KL을 건너뛰었어도 괜찮습니다. \"표준 정규분포에서 벗어난 만큼 내는 벌금\"이라고만 읽으세요. 식은 외우지 말고 숫자만 넣어 봅니다. μ²은 가운데서 벗어난 벌금, 나머지는 폭이 1에서 벗어난 벌금입니다.\n\n두 조각은 **줄다리기**를 합니다. 복원 오차는 \"그림마다 구름을 멀리 떨어뜨려 구별하자\", KL은 \"모두 가운데로 모여라\". 그 균형에서 **빈틈없이 정돈된** 잠재 공간이 만들어집니다.\n\n**만들 때:** $\\mathcal{N}(0, 1)$에서 z를 뽑아 디코더에 넣으면 새 데이터가 나옵니다.\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n**z 뽑기.** 인코더가 μ = 2, σ = 0.5를 내놓았고, 뽑힌 ε = −1이면\n\nz = 2 + 0.5 × (−1) = **1.5**\n\n**복원 오차.** x = [1, 0], 복원 $\\hat x$ = [0.8, 0.1]\n\n(1 − 0.8)² + (0 − 0.1)² = 0.04 + 0.01 = **0.05**\n\n**KL 벌점.**\n\n| μ | σ | 계산 | KL |\n|---|---|---|---|\n| 0 | 1 | ½(0 + 1 − 1 − ln 1) | **0** |\n| 1 | 1 | ½(1 + 1 − 1 − 0) | **0.5** |\n| 2 | 1 | ½(4 + 1 − 1 − 0) | **2** |\n\n(ln 1 = 0) 평균이 0에서 멀어질수록 벌점이 빠르게 커집니다.\n\n**전체 손실.** 복원 오차 0.05, KL 0.5면 0.05 + 0.5 = **0.55**\n\n---\n\n## 3. 능동 연습 (10분)\n\n### 손계산\n1. μ = 1, σ = 2, ε = 0.5일 때 z는?\n2. μ = 0, σ = 1, ε = −0.3일 때 z는?\n3. x = [2, 1], $\\hat x$ = [1.5, 1]의 복원 오차는?\n4. μ = 3, σ = 1일 때 KL 벌점은?\n5. μ = 0, σ = 1일 때 KL 벌점은? 이것이 뜻하는 바는?\n6. 복원 오차가 0.2, KL이 0.3이면 전체 손실은?\n7. μ = 0, σ = 2일 때 KL 벌점은? (ln 4 ≈ 1.386)\n\n### 미니 챌린지\nKL 벌점을 없애면(보통 오토인코더처럼) 복원은 더 잘 됩니다. 그런데 왜 새 그림 만들기는 더 못할까요? 반대로 KL 벌점만 아주 세게 주면 어떤 일이 생길까요?\n\n### 코드 (선택)\n```python\nimport numpy as np\ndef kl(mu, sigma):\n    return 0.5 * (mu**2 + sigma**2 - 1 - np.log(sigma**2))\n\nprint(kl(0, 1), kl(1, 1), kl(2, 1))      # 0.0 0.5 2.0\n\nrng = np.random.default_rng(0)\nmu, sigma = 2.0, 0.5\nz = mu + sigma * rng.normal(size=5)       # 같은 입력에서 z를 5번 뽑기\nprint(z.round(2))                         # 2 근처에서 조금씩 다른 값 5개\n\nx, x_hat = np.array([1, 0]), np.array([0.8, 0.1])\nprint(((x - x_hat) ** 2).sum().round(2))  # 0.05\n```\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n1. 오토인코더의 인코더와 디코더는 각각 무엇을 하나요?\n2. VAE의 인코더가 내놓는 두 가지는?\n3. O/X: KL 벌점은 잠재 벡터의 분포가 표준 정규분포에서 멀어질수록 작아진다.\n4. 학습이 끝난 VAE로 새 데이터를 만드는 방법은?\n\n---\n\n## 한 줄 정리\nVAE는 입력을 \"평균과 표준편차\"로 압축해 거기서 z를 뽑아 복원하고, KL 벌점으로 잠재 공간을 정돈해 아무 z에서나 새 데이터를 만들 수 있게 한다.\n\n---\n\n<details>\n<summary>정답 보기 (먼저 풀고 열기!)<\/summary>\n\n**손계산**\n1. 1 + 2 × 0.5 = **2**\n2. 0 + 1 × (−0.3) = **−0.3**\n3. (0.5)² + 0² = **0.25**\n4. ½(9 + 1 − 1 − 0) = **4.5**\n5. **0**. 이미 표준 정규분포와 똑같아서 벌점이 없습니다.\n6. **0.5**\n7. ½(0 + 4 − 1 − 1.386) ≈ **0.81**. 평균이 0이어도 폭이 1에서 벗어나면 벌점이 붙습니다.\n\n**미니 챌린지**\n벌점이 없으면 구름들이 제멋대로 흩어지고 좁아져, 잠재 공간에 디코더가 본 적 없는 빈 곳이 많아집니다. 거기서 뽑은 z는 엉망인 그림이 됩니다. 반대로 KL만 세게 주면 모든 입력이 똑같은 $\\mathcal{N}(0, 1)$로 뭉쳐 z가 입력의 정보를 담지 못하고, 복원이 다 비슷한 흐릿한 그림이 됩니다.\n\n**퀴즈**\n1. 인코더는 입력을 작은 잠재 벡터로 압축하고, 디코더는 그 벡터에서 입력을 복원합니다.\n2. 잠재 분포의 평균 μ와 표준편차 σ\n3. X. 멀어질수록 **커집니다**.\n4. 표준 정규분포에서 z를 뽑아 디코더에 넣습니다.\n<\/details>\n", "link": "논문 연결: Kingma, Welling (2013) . 새 데이터를 만들어 내는 생성 모델의 첫 갈래", "lesson": true}, {"id": "lr01", "short": "저랭크 근사와 LoRA", "md": "# 10단계. 저랭크 근사와 LoRA\n\n30분 · 논문 연결: Hu 외 (2021) \"LoRA: Low-Rank Adaptation of Large Language Models\". 선형대수 한 줄로 거대한 모델을 값싸게 고치는 방법\n\n---\n\n## 오늘의 목표\n1. 큰 모델을 통째로 미세조정하는 것이 왜 부담스러운지 설명할 수 있다.\n2. LoRA의 식 $W' = W + BA$를 작은 행렬로 손계산할 수 있다.\n3. 랭크 r을 정했을 때 학습할 숫자가 몇 개로 줄어드는지 계산할 수 있다.\n\n**복습 (1분):** m × n 행렬의 랭크 k 근사는 숫자 몇 개를 저장하나요? (답: k × (m + n + 1). [SVD와 PCA](#svd01))\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 문제: 모델이 너무 크다\n[미세조정](#bg01)은 사전학습한 모델의 가중치를 내 데이터로 조금 더 학습시키는 것입니다. 그런데 GPT-3의 가중치는 1750억 개. 일(번역, 요약, 상담…)마다 1750억 개짜리 사본을 하나씩 만들어 저장하고 학습시키는 것은 너무 비쌉니다.\n\n### 1-2. 관찰: 바뀌는 양은 단순하다\n미세조정 전의 가중치 행렬을 W, 후를 W'이라 하면\n\n$$W' = W + \\Delta W$$\n\nΔW(델타 W)는 **바뀐 양**입니다. LoRA 논문의 가설: 새 일에 맞추는 데 필요한 변화 ΔW는 **랭크가 아주 낮다.** 즉 [SVD](#svd01)에서 본 \"큰 조각 몇 개\"로 충분하다.\n\n수천 쪽짜리 백과사전을 새로 찍는 대신 **얇은 정오표 한 장**을 끼워 넣는 것과 같습니다.\n\n### 1-3. LoRA: 두 개의 얇은 행렬\nΔW를 직접 배우지 않고, 얇은 행렬 두 개의 곱으로 둡니다.\n\n$$\\Delta W = B A$$\n\n\"d × k\"는 세로 d줄, 가로 k칸이라는 뜻입니다. k는 이 층에 들어오는 숫자 수, d는 나가는 숫자 수입니다. 예를 들어 d = 1000, k = 1000, r = 8이면 A는 8 × 1000, B는 1000 × 8입니다. 가운데가 8칸으로 좁아지는 모래시계 모양입니다.\n\n- W: d × k (원래 가중치, **얼려 둠**. 학습하지 않음)\n- A: r × k (가로로 긴 얇은 행렬)\n- B: d × r (세로로 긴 얇은 행렬)\n- r: 랭크. 보통 1~64의 작은 수\n\nBA는 d × k 크기지만 [랭크](#rk01)는 r을 넘지 못합니다. BA의 모든 가로줄이 A의 가로줄 r개를 섞어 만든 것이기 때문입니다. 학습하는 것은 **A와 B뿐**입니다.\n\n### 1-4. 숫자 세기\n| | 학습할 숫자 수 |\n|---|---|\n| 통째로 미세조정 | d × k |\n| LoRA | r × (d + k) |\n\n복습의 k × (m + n + 1)과 닮았습니다. 다만 글자가 바뀌었으니 주의하세요. 여기서 k는 랭크가 아니라 가로 칸 수이고, 랭크는 r입니다. SVD는 조각마다 특이값 1개를 따로 저장해서 +1이 붙습니다. LoRA는 그 크기를 A와 B 안에 넣어 두어서 +1이 없습니다.\n\nd = k = 1000, r = 8이면 100만 개 대신 8 × 2000 = **16,000개**. 1.6%입니다. 논문은 GPT-3에서 학습할 파라미터 수를 **1만 분의 1**로, 학습에 필요한 GPU 메모리를 **3분의 1**로 줄였다고 보고합니다.\n\n### 1-5. 세 가지 요령\n1. **시작은 0에서.** B를 0으로, A를 작은 무작위 수로 시작합니다. 그러면 처음에 BA = 0이라 원래 모델과 **똑같이** 출발합니다\n2. **계산은 따로, 결과는 더해서.** $W'x = Wx + B(Ax)$. 큰 행렬 W'를 만들지 않고 x를 A로 줄였다가(r칸) B로 다시 늘립니다\n3. **다 배우면 합친다.** 학습이 끝나면 W + BA를 미리 계산해 하나로 합칠 수 있습니다. 쓸 때의 속도는 원래 모델과 같습니다\n\n일마다 작은 (A, B) 한 쌍만 저장하면 되니, 큰 모델 하나에 \"번역용\", \"요약용\" 정오표를 **갈아 끼워** 쓸 수 있습니다.\n\n---\n\n## 2. 예제 따라하기 (6분)\n\nW = [[1, 0], [0, 1]] (2 × 2), r = 1.\n\nB = [[1], [2]] (2 × 1), A = [[3, 4]] (1 × 2)\n\n**ΔW = BA** (B의 각 칸 × A의 가로줄)\n\n| | × 3 | × 4 |\n|---|---|---|\n| 1 | 3 | 4 |\n| 2 | 6 | 8 |\n\nΔW = [[3, 4], [6, 8]]. 둘째 줄이 첫째 줄의 2배라 랭크 1입니다.\n\n**W' = W + ΔW** = [[1 + 3, 0 + 4], [0 + 6, 1 + 8]] = **[[4, 4], [6, 9]]**\n\n**입력 x = [1, 1]을 넣으면**\n- 합친 뒤: W'x = [4 + 4, 6 + 9] = **[8, 15]**\n- 따로 계산: Wx = [1, 1]. Ax = 3 + 4 = 7. B × 7 = [7, 14]. 더하면 [1 + 7, 1 + 14] = **[8, 15]** ✓\n\n**숫자 세기.** 이 작은 예에서는 W가 4개, LoRA가 2 + 2 = 4개로 같습니다. 행렬이 커져야 이득이 납니다. 768 × 768에 r = 4면 589,824개 대신 4 × 1536 = **6,144개**(약 1%).\n\n---\n\n## 3. 능동 연습 (10분)\n\n### 손계산\n1. B = [[2], [1]], A = [[1, 3]]일 때 BA는?\n2. 1번의 BA의 랭크는?\n3. W = [[1, 1], [0, 1]]에 1번의 BA를 더한 W'는?\n4. d = 1000, k = 1000, r = 4일 때 LoRA가 학습하는 숫자는 몇 개? 통째로 할 때의 몇 %인가요?\n5. d = 4096, k = 4096, r = 16이면? (4096 × 4096 = 16,777,216)\n6. 학습을 시작할 때 B가 모두 0이면 BA는? 이때 모델의 출력은 원래 모델과 어떤 관계인가요?\n\n### 미니 챌린지\nr을 키우면 표현할 수 있는 변화가 늘어나지만 학습할 숫자도 늘어납니다. r = d = k로 키우면 LoRA는 무엇과 같아지나요? 반대로 r이 너무 작으면 어떤 일이 생길까요?\n\n### 코드 (선택)\n```python\nimport numpy as np\nW = np.eye(2)                          # [[1, 0], [0, 1]]\nB = np.array([[1.0], [2.0]])           # 2 × 1\nA = np.array([[3.0, 4.0]])             # 1 × 2\nx = np.array([1.0, 1.0])\n\ndW = B @ A\nprint(dW, np.linalg.matrix_rank(dW))   # [[3. 4.] [6. 8.]] 1\nprint((W + dW) @ x)                    # [ 8. 15.]\nprint(W @ x + B @ (A @ x))             # [ 8. 15.]  따로 계산해도 같음\n\nd, k, r = 1000, 1000, 8\nprint(r * (d + k), d * k, r * (d + k) / (d * k))   # 16000 1000000 0.016\n```\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n1. LoRA에서 학습하는 것과 얼려 두는 것은 각각 무엇인가요?\n2. ΔW = BA의 랭크는 최대 얼마인가요?\n3. O/X: LoRA를 쓰면 학습이 끝난 뒤에도 모델이 항상 느려진다.\n4. B를 0으로 시작하는 이유는?\n\n---\n\n## 한 줄 정리\nLoRA는 큰 가중치 W는 얼려 두고, 바뀌는 양을 얇은 두 행렬의 곱 BA(랭크 r)로만 배워서 학습할 숫자를 r × (d + k)개로 줄인다.\n\n---\n\n<details>\n<summary>정답 보기 (먼저 풀고 열기!)<\/summary>\n\n**손계산**\n1. **[[2, 6], [1, 3]]**\n2. **1** (첫째 줄이 둘째 줄의 2배)\n3. [[1 + 2, 1 + 6], [0 + 1, 1 + 3]] = **[[3, 7], [1, 4]]**\n4. 4 × 2000 = **8,000개**. 100만 개의 **0.8%**\n5. 16 × 8192 = **131,072개**. 약 **0.78%**\n6. 모든 칸이 **0**. 출력이 원래 모델과 **똑같습니다.**\n\n**미니 챌린지**\nr이 행렬 크기만큼 커지면 BA가 어떤 ΔW든 표현할 수 있어 **통째로 미세조정**하는 것과 같아지고, 절약도 사라집니다. r이 너무 작으면 새 일에 필요한 변화를 다 담지 못해 성능이 모자랄 수 있습니다. 논문은 아주 작은 r로도 충분한 경우가 많다고 보고합니다.\n\n**퀴즈**\n1. 학습하는 것은 얇은 행렬 A와 B, 얼려 두는 것은 원래 가중치 W\n2. r\n3. X. 학습이 끝나면 W + BA로 합칠 수 있어 속도가 원래 모델과 같습니다.\n4. 처음에 BA = 0이 되어, 사전학습한 모델과 똑같은 상태에서 출발하기 위해서입니다.\n<\/details>\n", "link": "논문 연결: Hu 외 (2021) . 선형대수 한 줄로 거대한 모델을 값싸게 고치는 방법", "lesson": true}, {"id": "nm01", "short": "행렬 노름과 조건수", "md": "# 10단계. 행렬 노름과 조건수\n\n30분 · 논문 연결: 기울기 자르기는 벡터의 노름, 가중치 감쇠는 가중치의 노름, \"학습이 왜 느린가\"는 조건수로 설명합니다 (Deep Learning 2.5절, 4.2절)\n\n---\n\n## 오늘의 목표\n1. 벡터의 크기를 재는 세 가지 방법(L1, L2, L∞)을 계산할 수 있다.\n2. 행렬의 크기를 재는 두 가지 방법(프로베니우스 노름, 스펙트럼 노름)을 특이값으로 설명할 수 있다.\n3. 조건수가 크면 왜 계산이 불안정하고 경사하강이 느린지 숫자로 보일 수 있다.\n\n**복습 (1분):** [3, 4]의 길이는? (답: 5. [Day 01](#day01))\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 노름: 크기를 재는 자\n**노름**은 벡터나 행렬의 \"크기\"를 숫자 하나로 재는 방법입니다. 자가 여러 종류 있습니다.\n\n| 이름 | 계산 | [3, −4]의 값 | 비유 |\n|---|---|---|---|\n| L2 노름 $\\|x\\|_2$ | 제곱해서 더하고 √ | 5 | 직선 거리 |\n| L1 노름 $\\|x\\|_1$ | 절댓값을 더함 | 7 | 바둑판 길로 걷는 거리 |\n| L∞ 노름 $\\|x\\|_\\infty$ | 절댓값 중 가장 큰 것 | 4 | 가로, 세로 중 더 멀리 간 쪽 |\n\n절댓값은 부호를 뗀 크기입니다. −4의 절댓값은 4입니다. ∞는 \"무한대\"라고 읽습니다. \"L 무한대 노름\"이라고 부르면 됩니다.\n\n지금까지 \"길이\"라고 부른 것이 L2 노름입니다. [기울기 자르기](#gv01)가 쟀던 것, 가중치 감쇠가 벌점을 주는 것도 L2 노름(의 제곱)입니다.\n\n### 1-2. 행렬의 크기 ①: 프로베니우스 노름\n행렬의 숫자를 한 줄로 늘어놓고 L2 노름을 구한 것입니다.\n\n$$\\|A\\|_F = \\sqrt{\\text{모든 칸의 제곱의 합}}$$\n\n놀라운 사실: 이 값은 **특이값들의 제곱의 합의 제곱근**과 같습니다. [SVD](#svd01)의 저랭크 근사에서 \"가장 가깝다\"를 잴 때 쓰는 자가 이것입니다.\n\n### 1-3. 행렬의 크기 ②: 스펙트럼 노름\n행렬을 변환으로 볼 때 **벡터를 최대 몇 배까지 늘이는가**입니다.\n\n$$\\|A\\|_2 = \\text{가장 큰 특이값 } \\sigma_{\\max}$$\n\n\"이 층을 지나면 신호가 최대 몇 배 커질 수 있나\"를 알려 줍니다. 층마다 이 값이 1보다 작으면 신호가 반드시 줄어들어 소실 쪽으로 가고, 1보다 크면 [폭발](#gv01)할 수 있습니다.\n\n### 1-4. 조건수: 가장 많이 늘이는 방향 ÷ 가장 적게 늘이는 방향\n$$\\kappa(A) = \\frac{\\sigma_{\\max}}{\\sigma_{\\min}}$$\n\nκ(카파)가 1이면 모든 방향을 똑같이 늘이는 반듯한 변환. κ가 크면 한 방향은 크게, 다른 방향은 거의 안 늘이는 **찌그러진** 변환입니다.\n\n조건수가 크면 생기는 일\n- **작은 오차가 크게 번집니다.** 조금 다른 입력이 크게 다른 답을 냅니다. 흐릿한 사진을 확대하면 잡티가 같이 커지는 것과 같습니다\n- **경사하강이 느립니다.** 손실의 그릇이 길쭉한 골짜기가 됩니다\n\n### 1-5. 길쭉한 골짜기에서 걷기\n손실이 $L = \\frac{1}{2}(100\\, w_1^2 + w_2^2)$라고 합시다. [헤시안](#sp01)의 고유값이 100과 1, 조건수 100입니다.\n\n- 가파른 방향 $w_1$: 기울기가 $100 w_1$입니다. 한 걸음 가면 $w_1$은 (1 − 100 × 학습률)배가 됩니다. 학습률이 0.01이면 0배라서 한 걸음에 바닥에 닿습니다. 0.02이면 −1배라서 반대편 같은 높이로 건너뛰기만 합니다. 0.02를 넘으면 걸을수록 더 멀어집니다. 그네를 너무 세게 미는 것과 같습니다. 그래서 한계가 2 ÷ 100 = 0.02입니다\n- 그래서 학습률을 0.01로 잡습니다. 완만한 방향 $w_2$는 기울기가 $w_2$입니다. 한 걸음 가면 $w_2 - 0.01 \\times w_2 = 0.99\\, w_2$입니다. 한 걸음에 **1%**만 줄어듭니다\n\n완만한 쪽에서 100걸음을 걸어도 $0.99^{100} \\approx 0.37$. 아직 37%가 남습니다. **필요한 걸음 수가 조건수에 비례**합니다.\n\n[Adam](#opt01)이 방향마다 보폭을 따로 맞추고, [정규화](#norm01)가 층의 입력 크기를 고르게 하는 것은 모두 이 조건수를 낮추려는 노력입니다.\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n**벡터 노름.** x = [1, −2, 2]\n- L1: 1 + 2 + 2 = **5**\n- L2: √(1 + 4 + 4) = √9 = **3**\n- L∞: **2**\n\n**행렬 노름.** A = [[3, 0], [0, 1]] (대각선에만 숫자가 있는 행렬입니다. 가로로 3배, 세로로 1배 늘이므로 특이값은 3과 1입니다)\n- 프로베니우스: √(9 + 0 + 0 + 1) = √10 ≈ **3.16**. 특이값으로도 √(3² + 1²) = √10 ✓\n- 스펙트럼: 가장 큰 특이값 **3**\n- 조건수: 3 ÷ 1 = **3**\n\n**조건수가 큰 경우.** B = [[1, 0], [0, 0.001]] → κ = 1 ÷ 0.001 = **1000**\n\nB는 첫째 칸은 그대로 두고 둘째 칸에 0.001을 곱하는 행렬입니다. 이제 거꾸로 묻습니다. B x = [1, 0.001]이 되는 x는 무엇일까요? 첫째 칸은 그대로 1입니다. 둘째 칸은 0.001 ÷ 0.001 = 1입니다. 그래서 x = [1, 1]입니다. 그런데 오른쪽이 측정 오차로 [1, 0.002]가 되면 x = [1, 2]입니다. (둘째 칸이 0.002 ÷ 0.001 = 2가 되기 때문입니다.) 둘째 칸의 **0.001짜리 오차가 답을 1만큼(1000배)** 바꿨습니다.\n\n---\n\n## 3. 능동 연습 (10분)\n\n### 손계산\n1. x = [−6, 8]의 L1, L2, L∞ 노름은?\n2. [[1, 2], [2, 4]]의 프로베니우스 노름은?\n3. 특이값이 5와 2인 행렬의 스펙트럼 노름과 조건수는?\n4. [[4, 0], [0, 4]]의 조건수는? 어떤 변환인가요?\n5. 조건수가 10인 그릇과 1000인 그릇. 경사하강이 더 오래 걸리는 쪽은? 대략 몇 배?\n6. $L = \\frac{1}{2}(100 w_1^2 + w_2^2)$에서 학습률 0.01일 때, $w_2 = 1$에서 한 걸음 후의 $w_2$는? (기울기는 $w_2$)\n\n### 미니 챌린지\n가중치 감쇠에 L2 대신 **L1 노름**을 쓰면 가중치 중 많은 수가 정확히 0이 됩니다. [1, 0]과 [0.7, 0.7]은 L2 노름이 거의 같은데(1과 0.99), L1 노름은 각각 얼마인가요? L1 벌점은 어느 쪽을 더 좋아할까요?\n\n### 코드 (선택)\n```python\nimport numpy as np\nx = np.array([3.0, -4.0])\nprint(np.linalg.norm(x, 1), np.linalg.norm(x), np.linalg.norm(x, np.inf))   # 7.0 5.0 4.0\n\nA = np.array([[3.0, 0.0], [0.0, 1.0]])\nprint(np.linalg.norm(A, 'fro').round(2), np.linalg.norm(A, 2), np.linalg.cond(A))   # 3.16 3.0 3.0\n\nw = np.array([1.0, 1.0])                  # 길쭉한 골짜기에서 100걸음\nfor step in range(100):\n    w = w - 0.01 * np.array([100 * w[0], w[1]])\nprint(w.round(3))                         # [0.    0.366]  가파른 쪽은 끝났는데 완만한 쪽은 37% 남음\n```\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n1. L1, L2, L∞ 노름은 각각 어떻게 계산하나요?\n2. 스펙트럼 노름은 무엇을 뜻하나요?\n3. O/X: 조건수가 1에 가까울수록 계산이 불안정하다.\n4. 조건수가 큰 손실 함수에서 경사하강이 느린 이유는?\n\n---\n\n## 한 줄 정리\n노름은 크기를 재는 자이고, 조건수(가장 큰 특이값 ÷ 가장 작은 특이값)가 크면 오차가 크게 번지고 경사하강이 길쭉한 골짜기에서 느려진다.\n\n---\n\n<details>\n<summary>정답 보기 (먼저 풀고 열기!)<\/summary>\n\n**손계산**\n1. L1 = 6 + 8 = **14**, L2 = √(36 + 64) = **10**, L∞ = **8**\n2. √(1 + 4 + 4 + 16) = √25 = **5** (이 행렬의 0이 아닌 특이값이 5 하나뿐인 것과 맞습니다)\n3. 스펙트럼 노름 **5**, 조건수 5 ÷ 2 = **2.5**\n4. **1**. 모든 방향을 똑같이 4배 늘이는 변환입니다.\n5. **1000인 쪽**, 대략 **100배** 오래 걸립니다.\n6. 1 − 0.01 × 1 = **0.99**\n\n**미니 챌린지**\n[1, 0]의 L1 노름은 **1**, [0.7, 0.7]은 **1.4**. L1 벌점은 값을 한 칸에 몰고 나머지를 0으로 두는 [1, 0] 쪽을 더 좋아합니다. 그래서 0이 많은(성긴) 가중치가 나옵니다.\n\n**퀴즈**\n1. L1은 절댓값의 합, L2는 제곱의 합의 제곱근, L∞는 절댓값 중 최댓값\n2. 그 행렬이 벡터를 최대 몇 배까지 늘이는가 (가장 큰 특이값)\n3. X. 1에 가까울수록 안정적입니다. **클수록** 불안정합니다.\n4. 학습률을 가장 가파른 방향에 맞춰 작게 잡아야 해서, 완만한 방향으로는 한 걸음에 아주 조금씩만 나아가기 때문입니다.\n<\/details>\n", "link": "논문 연결: 기울기 자르기는 벡터의 노름, 가중치 감쇠는 가중치의 노름, 는 조건수로 설명합니다 (Deep Learning 2.5절, 4.", "lesson": true}, {"id": "pf01", "short": "증명 읽고 쓰기", "md": "# 10단계. 증명 읽고 쓰기\n\n30분 · 논문 연결: 대학원 교재와 이론 논문은 \"정의 → 정리 → 증명\"으로 쓰여 있습니다. 이 형식을 읽는 법이 10단계의 첫 도구입니다 (Axler, *Linear Algebra Done Right*)\n\n---\n\n## 오늘의 목표\n1. 정의, 정리, 증명이 각각 무엇인지 구별하고, 기호 ∀, ∃, ⇒를 읽을 수 있다.\n2. 증명의 세 가지 기본 방법(곧바로 보이기, 모순으로 보이기, 반례 들기)을 알아볼 수 있다.\n3. 세 줄짜리 선형대수 증명을 따라가며 줄마다 \"왜 되는지\"를 말할 수 있다.\n\n**복습 (1분):** 고유벡터의 정의를 식으로 쓰면? (답: $Av = \\lambda v$. [고유값과 고유벡터](#eg01))\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 왜 증명인가\n지금까지는 \"예를 계산해 보니 맞더라\"로 배웠습니다. 하지만 예 100개가 맞아도 101번째가 틀릴 수 있습니다. **증명**은 \"모든 경우에 맞다\"를 한 번에 보장하는 글입니다.\n\n증명은 어려운 계산이 아닙니다. **변호사의 변론**과 같습니다. 이미 인정된 사실만 써서, 한 줄씩, 빈틈없이 결론까지 가는 것입니다.\n\n### 1-2. 수학 글의 세 가지 문단\n| 이름 | 뜻 | 예 |\n|---|---|---|\n| **정의** | 낱말의 약속. 맞고 틀림이 없다 | \"2로 나누어떨어지는 정수를 짝수라 한다\" |\n| **정리** | 참이라고 주장하는 문장 | \"짝수 둘을 더하면 짝수다\" |\n| **증명** | 그 주장이 왜 참인지 | 아래 2절 |\n\n읽다가 막히면 대개 **정의를 잊어서**입니다. 증명을 읽는 첫 요령은 낱말이 나올 때마다 정의로 **바꿔 써 보는 것**입니다.\n\n### 1-3. 기호 세 개\n| 기호 | 읽기 | 예 |\n|---|---|---|\n| ∀ | \"모든 ~에 대해\" | ∀x: 모든 x에 대해 |\n| ∃ | \"~가 (하나 이상) 있다\" | ∃x: 어떤 x가 있어서 |\n| P ⇒ Q | \"P이면 Q이다\" | 비가 오면 ⇒ 땅이 젖는다 |\n\n\"P ⇒ Q\"가 참이어도 **거꾸로 \"Q ⇒ P\"는 참이 아닐 수 있습니다.** 땅이 젖었다고 꼭 비가 온 것은 아니죠.\n\n### 1-4. 증명의 세 가지 방법\n**① 곧바로 보이기 (직접 증명).** 가정에서 출발해 정의와 계산으로 결론까지 간다. 가장 흔합니다.\n\n**② 모순으로 보이기 (귀류법).** \"결론이 틀렸다고 해 보자\"에서 출발해 말이 안 되는 상황에 닿으면, 결론이 맞는 것이다. 알리바이와 같습니다. \"이 사람이 범인이라고 해 보자. 그러면 그 시각에 현장에 있었어야 한다. 그런데 그때 다른 도시에 있었다. 말이 안 된다. 따라서 범인이 아니다.\"\n\n**③ 반례 들기.** \"모든 ~는 ~이다\"가 **틀렸음**을 보이려면 안 맞는 예 **하나**면 충분합니다. \"모든 백조는 희다\"는 검은 백조 한 마리로 무너집니다.\n\n> 맞음을 보이려면 모든 경우를 덮어야 하고(증명), 틀림을 보이려면 하나면 됩니다(반례). 이 비대칭을 기억하세요.\n\n### 1-5. 증명을 읽는 순서\n1. 정리에서 **가정**(주어진 것)과 **결론**(보일 것)을 가른다\n2. 낱말을 정의로 바꿔 쓴다\n3. 한 줄씩 읽으며 \"이 줄은 왜 되지?\"에 답한다 (정의, 가정, 앞 줄, 계산 규칙 중 하나)\n4. 작은 숫자 예로 확인해 본다\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n### 직접 증명\n**정리.** 짝수 둘을 더하면 짝수다.\n\n**증명.**\n1. a, b가 짝수라고 하자. (가정)\n2. 그러면 a = 2m, b = 2n인 정수 m, n이 있다. (짝수의 정의)\n3. a + b = 2m + 2n = 2(m + n). (계산)\n4. m + n은 정수이므로 a + b는 2로 나누어떨어진다. 즉 짝수다. (짝수의 정의) ∎\n\n∎는 \"증명 끝\" 표시입니다. 예(4 + 6 = 10)를 든 것이 아니라 **모든** 짝수에 대해 보였습니다.\n\n정수는 −2, −1, 0, 1, 2처럼 소수점이 없는 수입니다. 2번 줄의 \"~인 정수가 있다\"가 바로 ∃입니다. 기호로는 \"∃m: a = 2m\"이라고 씁니다. 정리 전체는 \"모든 짝수 a, b에 대해\"이므로 ∀가 숨어 있습니다.\n\n### 선형대수 증명\n**정리.** v가 A의 고유벡터이고 고유값이 λ이면, v는 $A^2$의 고유벡터이고 고유값은 $\\lambda^2$이다.\n\n**증명.**\n1. $Av = \\lambda v$. (고유벡터의 정의)\n2. $A^2 v = A(Av) = A(\\lambda v)$. (1을 대입)\n3. $= \\lambda (Av) = \\lambda (\\lambda v) = \\lambda^2 v$. (숫자는 행렬 밖으로 꺼낼 수 있음, 다시 1을 대입) ∎\n\n[고유값](#eg01)에서 \"행렬을 여러 번 곱하면 고유값의 거듭제곱\"이라고 했던 것의 증명입니다.\n\n### 반례\n**주장.** 모든 행렬 A, B에 대해 AB = BA이다. → **거짓.**\n\nA = [[1, 1], [0, 1]], B = [[1, 0], [1, 1]]이면 AB = [[2, 1], [1, 1]], BA = [[1, 1], [1, 2]]. 다릅니다. 반례 하나로 끝.\n\n---\n\n## 3. 능동 연습 (10분)\n\n### 풀어 보기\n1. \"∀x, x² ≥ 0\"을 우리말로 읽어 보세요.\n2. \"어떤 수가 4의 배수이면 짝수이다.\" 이 문장의 가정과 결론은? 거꾸로(\"짝수이면 4의 배수이다\")도 참인가요?\n3. 주장 \"두 벡터의 내적이 0이면 둘 중 하나는 영벡터 [0, 0]이다\"의 반례를 드세요.\n4. 다음 증명의 빈칸을 채우세요. **정리:** v가 A의 고유벡터(고유값 λ)이면 2v도 고유벡터다.\n   증명: A(2v) = 2(Av) = 2(＿＿) = λ(＿＿). ∎\n5. 다음은 어떤 증명 방법인가요? \"가장 큰 자연수 N이 있다고 하자. 그런데 N + 1도 자연수이고 N보다 크다. 말이 안 된다. 따라서 가장 큰 자연수는 없다.\"\n6. \"홀수 둘을 더하면 짝수다\"를 2절의 증명을 흉내 내어 증명해 보세요. (홀수는 2m + 1 꼴)\n\n### 미니 챌린지\n\"행렬 100개로 실험해 보니 모두 성립했다\"는 왜 증명이 아닐까요? 반대로, 논문이 실험 결과만 싣고 증명 없이 주장할 때 우리는 그것을 어떻게 받아들여야 할까요?\n\n### 코드 (선택): 반례는 컴퓨터로 찾을 수 있다\n```python\nimport numpy as np\nA = np.array([[1, 1], [0, 1]])\nB = np.array([[1, 0], [1, 1]])\nprint(A @ B)                 # [[2 1] [1 1]]\nprint(B @ A)                 # [[1 1] [1 2]]\nprint((A @ B == B @ A).all())   # False → \"AB = BA\"의 반례\n```\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n1. 정의와 정리의 차이는?\n2. \"모든 ~는 ~이다\"가 틀렸음을 보이려면 무엇이 필요한가요?\n3. O/X: \"P이면 Q\"가 참이면 \"Q이면 P\"도 반드시 참이다.\n4. 귀류법(모순으로 보이기)은 어떻게 진행하나요?\n\n---\n\n## 한 줄 정리\n증명은 인정된 사실만으로 한 줄씩 결론에 닿는 글이다. 맞음은 모든 경우를 덮어야 하고, 틀림은 반례 하나면 된다.\n\n---\n\n<details>\n<summary>정답 보기 (먼저 풀고 열기!)<\/summary>\n\n**풀어 보기**\n1. \"모든 x에 대해 x의 제곱은 0 이상이다.\"\n2. 가정: 4의 배수이다. 결론: 짝수이다. 거꾸로는 **거짓**입니다(반례: 6은 짝수지만 4의 배수가 아님).\n3. [1, 0] · [0, 1] = 0. 둘 다 영벡터가 아닙니다. (직교하는 벡터면 무엇이든 반례)\n4. A(2v) = 2(Av) = 2(**λv**) = λ(**2v**). 2v에 A를 곱하니 2v의 λ배가 나왔고, v가 영벡터가 아니므로 2v도 영벡터가 아닙니다. 따라서 2v는 고유벡터입니다.\n5. **귀류법**(모순으로 보이기)\n6. a = 2m + 1, b = 2n + 1이라 하자. a + b = 2m + 2n + 2 = 2(m + n + 1). m + n + 1은 정수이므로 a + b는 짝수다. ∎\n\n**미니 챌린지**\n101번째 행렬에서 깨질 수 있기 때문입니다. 증명은 \"모든 경우\"를 덮어야 합니다. 실험뿐인 주장은 \"지금까지의 증거로는 그럴듯하다\"로 받아들이고, 어떤 조건에서 실험했는지를 함께 봐야 합니다. 딥러닝 논문의 주장은 대부분 이쪽입니다.\n\n**퀴즈**\n1. 정의는 낱말의 약속이라 증명할 것이 없고, 정리는 참임을 증명해야 하는 주장입니다.\n2. 반례 하나\n3. X. 4의 배수이면 짝수지만, 짝수라고 4의 배수는 아닙니다.\n4. 결론이 틀렸다고 가정하고, 거기서 말이 안 되는 결과(모순)를 끌어내 가정이 잘못됐음을 보입니다.\n<\/details>\n", "link": "논문 연결: 대학원 교재와 이론 논문은 으로 쓰여 있습니다. 이 형식을 읽는 법이 10단계의 첫 도구입니다 (Axler, *Linear A", "lesson": true}, {"id": "sp01", "short": "스펙트럼 정리와 양의 정부호", "md": "# 10단계. 스펙트럼 정리와 양의 정부호\n\n30분 · 논문 연결: 기울기가 0인 곳에서 손실 함수의 \"휘어진 정도\"를 담은 행렬(헤시안)이 양의 정부호이면 그곳은 그릇의 바닥입니다. 최적화 이론 논문의 기본 낱말입니다 (Deep Learning 4.3절)\n\n---\n\n## 오늘의 목표\n1. 대칭 행렬은 \"서로 직교하는 축을 따라 늘이기\"로 완전히 풀린다는 스펙트럼 정리를 설명할 수 있다.\n2. 이차형식 $x^\\top A x$를 2×2에서 손으로 계산할 수 있다.\n3. 양의 정부호를 \"고유값이 모두 양수\"로 판별하고, 그것이 그릇 모양을 뜻한다는 걸 안다.\n\n**복습 (1분):** [[2, 1], [1, 2]]의 고유값과 고유벡터는? (답: 3과 [1, 1], 1과 [1, −1]. [고유값과 고유벡터](#eg01))\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 대칭 행렬은 특별하다\n**대칭 행렬**은 대각선을 따라 접으면 마주 보는 숫자가 같은 행렬입니다. [[2, 1], [1, 2]]처럼요. 기호로는 $A^\\top = A$ (⊤는 행과 열을 맞바꾼다는 표시).\n\nAI에서 중요한 행렬은 대칭인 것이 많습니다.\n- 공분산 행렬 (데이터가 어느 방향으로 얼마나 퍼졌는지 적은 표입니다. [PCA](#svd01)에서 \"가장 넓게 퍼진 방향\"을 찾을 때 쓰는 행렬의 이름입니다)\n- 헤시안 (기울기가 얼마나 빨리 변하는지를 적은 표입니다. \"기울기의 기울기\"라고 생각하면 됩니다. 손실 함수가 방향마다 얼마나 휘었는지 알려 줍니다. 오늘은 계산하지 않고 이름만 씁니다)\n- $A^\\top A$ 꼴 (어떤 A로든 만들 수 있음)\n\n### 1-2. 스펙트럼 정리\n**정리.** 실수로 된 대칭 행렬은\n1. 고유값이 모두 **실수**(수직선 위에 찍을 수 있는 보통 수)이고\n2. 서로 **직교하는** 고유벡터들로 [기저](#vs01)를 만들 수 있다.\n\n식으로는 $A = Q \\Lambda Q^\\top$. Q는 길이 1인 고유벡터들을 세로로 세운 행렬(돌리기), Λ(람다 대문자)는 고유값을 대각선에 둔 행렬(늘이기)입니다.\n\n복습의 [[2, 1], [1, 2]]로 확인해 봅시다. 고유벡터 [1, 1]과 [1, −1]의 내적은 1 − 1 = 0입니다. 정말 직교합니다. 이 행렬은 [1, 1] 방향으로 3배, [1, −1] 방향으로 1배 늘입니다. 고무판을 서로 직각인 두 방향으로 잡아당기는 것과 같습니다.\n\n[SVD](#svd01)의 \"돌리기 → 늘이기 → 돌리기\"에서 **앞뒤 돌리기가 같은 축**인 경우입니다. (고유값이 음수이면 특이값은 그 절댓값이고, 그 축은 방향이 뒤집힙니다.) 일반 행렬은 고유벡터가 비스듬하거나 없을 수 있지만, 대칭 행렬은 **언제나 반듯한 직교 축**이 나옵니다.\n\n### 1-3. 이차형식: 행렬로 만든 그릇\n벡터 x를 넣으면 숫자 하나가 나오는 식입니다.\n\n$$x^\\top A x$$\n\n계산은 두 걸음입니다. 먼저 Ax를 구합니다. 그다음 그 결과와 x를 내적합니다. 예를 들어 A = [[2, 1], [1, 2]], x = [1, 1]이면 Ax = [3, 3]입니다. x와 내적하면 1 × 3 + 1 × 3 = 6입니다. 이 두 걸음을 글자로 한 번에 정리한 것이 아래 공식입니다.\n\n2×2에서 A = [[a, b], [b, d]], x = [$x_1$, $x_2$]이면\n\n$$x^\\top A x = a x_1^2 + 2b\\, x_1 x_2 + d\\, x_2^2$$\n\n[기울기를 숫자로 느끼기](#dx01)의 U자 함수 $w^2$를 여러 변수로 넓힌 것입니다. 손실 함수는 바닥 근처에서 이 모양으로 보입니다.\n\n### 1-4. 양의 정부호: 어느 쪽으로 가도 오르막\n**정의.** 영벡터가 아닌 모든 x에 대해 $x^\\top A x > 0$이면 A를 **양의 정부호**라고 한다.\n\n원점에서 어느 방향으로 가도 값이 커지는 **그릇 모양**이라는 뜻입니다.\n\n**정리.** 대칭 행렬 A가 양의 정부호 ⇔ A의 **고유값이 모두 양수**. (⇔는 \"양쪽이 같은 말\"이라는 뜻)\n\n왜 그럴까요? 고유벡터 방향 v(길이 1)를 넣어 봅니다. 고유벡터의 정의로 Av = λv입니다. 그래서 $v^\\top A v = v^\\top (\\lambda v) = \\lambda\\,(v^\\top v)$입니다. $v^\\top v$는 v와 v의 내적, 곧 길이의 제곱이라 1입니다. 결국 값은 λ입니다. 그 방향의 휘어짐이 고유값입니다. 모든 축에서 위로 휘어 있으면 그릇입니다.\n\n| 고유값 | 이름 | 모양 |\n|---|---|---|\n| 모두 양수 | 양의 정부호 | 그릇 (바닥이 하나) |\n| 모두 0 이상 | 양의 준정부호 | 그릇인데 평평한 골이 있을 수 있음 |\n| 양수와 음수가 섞임 | 부정부호 | **안장** (한쪽은 오르막, 한쪽은 내리막) |\n\n### 1-5. 딥러닝에서\n- 기울기가 0인 곳이 **바닥인지 안장인지**는 헤시안의 고유값 부호로 가립니다. 차원이 높은 신경망에서는 안장이 아주 많습니다\n- (선택) $A^\\top A$는 항상 양의 준정부호입니다. $x^\\top A^\\top A x$는 Ax를 자기 자신과 내적한 것, 곧 Ax의 길이의 제곱입니다. 길이의 제곱은 음수가 될 수 없습니다\n- (선택) A의 [특이값](#svd01)은 $A^\\top A$의 고유값의 제곱근입니다. 지금은 \"SVD와 고유값이 이어져 있다\"만 알면 충분합니다\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n**A = [[2, 1], [1, 2]]** (고유값 3, 1)\n\n이차형식: $2x_1^2 + 2x_1x_2 + 2x_2^2$\n\n| x | 계산 | 값 |\n|---|---|---|\n| [1, 0] | 2 + 0 + 0 | 2 |\n| [1, 1] | 2 + 2 + 2 | 6 |\n| [1, −1] | 2 − 2 + 2 | 2 |\n\n모두 양수. 고유값이 3, 1로 모두 양수이니 **양의 정부호**(그릇)입니다.\n\n고유벡터 방향 확인: [1, 1]은 길이의 제곱이 2. 값 6 = 고유값 3 × 2 ✓. [1, −1]도 2 = 고유값 1 × 2 ✓.\n\n**B = [[1, 2], [2, 1]]**\n\n고유값: 합 2, 곱 1 − 4 = −3 → **3과 −1**. 음수가 섞여 있으니 양의 정부호가 **아닙니다.**\n\n이차형식: $x_1^2 + 4x_1x_2 + x_2^2$\n- x = [1, 1]: 1 + 4 + 1 = 6 (오르막)\n- x = [1, −1]: 1 − 4 + 1 = **−2** (내리막)\n\n안장입니다. 말안장처럼 앞뒤로는 올라가고 좌우로는 내려갑니다.\n\n---\n\n## 3. 능동 연습 (10분)\n\n### 손계산\n1. [[3, 0], [0, 2]]는 대칭인가요? 고유값은? 양의 정부호인가요?\n2. A = [[2, 1], [1, 2]], x = [2, 1]일 때 $x^\\top A x$는?\n3. [[2, 0], [0, −1]]의 이차형식을 식으로 쓰고, x = [0, 1]을 넣어 보세요. 양의 정부호인가요?\n4. [[2, −1], [−1, 2]]의 고유값은? (합과 곱 이용) 양의 정부호인가요?\n5. [[1, 3], [3, 1]]의 고유값은? 어떤 모양인가요?\n6. (선택) A = [[1, 2]] (1행 2열)일 때 $A^\\top A$ = [[1, 2], [2, 4]]입니다. 고유값을 구하고, 양의 준정부호인지 확인하세요.\n\n### 미니 챌린지\n기울기가 0인 지점에서 헤시안의 고유값이 [5, 0.01]입니다. 바닥인가요? 경사하강으로 이 그릇을 내려갈 때 어떤 어려움이 있을까요? (다음 레슨의 예고입니다.)\n\n### 코드 (선택)\n```python\nimport numpy as np\nA = np.array([[2.0, 1.0], [1.0, 2.0]])\nvals, Q = np.linalg.eigh(A)                  # 대칭 행렬용. 작은 고유값부터\nprint(vals)                                   # [1. 3.]\nprint((Q @ np.diag(vals) @ Q.T).round(6))     # [[2. 1.] [1. 2.]]  A = QΛQᵀ\nprint((Q.T @ Q).round(6))                     # [[1. 0.] [0. 1.]]  고유벡터가 서로 직교\n\nx = np.array([1.0, -1.0])\nB = np.array([[1.0, 2.0], [2.0, 1.0]])\nprint(x @ A @ x, x @ B @ x)                   # 2.0 -2.0\n```\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n1. 스펙트럼 정리가 대칭 행렬에 대해 보장하는 두 가지는?\n2. 양의 정부호의 정의는?\n3. O/X: 고유값이 2와 −1인 대칭 행렬은 양의 정부호다.\n4. 헤시안의 고유값에 양수와 음수가 섞여 있으면 그 지점은 어떤 모양인가요?\n\n---\n\n## 한 줄 정리\n대칭 행렬은 직교하는 고유벡터 축을 따라 늘이는 변환이고, 고유값이 모두 양수이면(양의 정부호) 그 이차형식은 바닥이 하나인 그릇이다.\n\n---\n\n<details>\n<summary>정답 보기 (먼저 풀고 열기!)<\/summary>\n\n**손계산**\n1. 대칭입니다. 고유값 **3과 2**(대각선 숫자). 모두 양수라 **양의 정부호**\n2. 2 × 4 + 2 × 2 × 1 + 2 × 1 = 8 + 4 + 2 = **14**\n3. $2x_1^2 - x_2^2$. x = [0, 1]이면 **−1**. 음수가 나왔으니 양의 정부호가 **아닙니다**\n4. 합 4, 곱 4 − 1 = 3 → **3과 1**. **양의 정부호**\n5. 합 2, 곱 1 − 9 = −8 → **4와 −2**. **안장** 모양\n6. 합 5, 곱 4 − 4 = 0 → **5와 0**. 모두 0 이상이라 **양의 준정부호** (0인 방향으로는 평평)\n\n**미니 챌린지**\n둘 다 양수라 **바닥**입니다. 하지만 한 방향은 500배 더 가파른 길쭉한 골짜기 모양이라, 학습률을 가파른 쪽에 맞추면 완만한 쪽으로는 거의 나아가지 못합니다. 이 비율을 조건수라고 합니다.\n\n**퀴즈**\n1. 고유값이 모두 실수라는 것, 서로 직교하는 고유벡터로 기저를 만들 수 있다는 것\n2. 영벡터가 아닌 모든 x에 대해 $x^\\top A x > 0$\n3. X. 음수 고유값이 있어 그 방향으로는 내리막입니다.\n4. 안장 (어떤 방향은 오르막, 어떤 방향은 내리막)\n<\/details>\n", "link": "논문 연결: 기울기가 0인 곳에서 손실 함수의 를 담은 행렬(헤시안)이 양의 정부호이면 그곳은 그릇의 바닥입니다. 최적화 이론 논문의 기본", "lesson": true}, {"id": "mm01", "short": "멀티모달: ViT와 CLIP", "md": "# 11단계. 멀티모달: ViT와 CLIP\n\n30분 · 논문 연결: Dosovitskiy 외 (2020) \"An Image is Worth 16x16 Words\" (ViT), Radford 외 (2021) \"Learning Transferable Visual Models From Natural Language Supervision\" (CLIP). 글을 읽던 트랜스포머가 그림을 보게 된 방법\n\n---\n\n## 오늘의 목표\n1. 그림을 조각(패치)으로 잘라 트랜스포머에 넣는 ViT의 생각을 설명하고, 조각의 개수를 계산할 수 있다.\n2. CLIP이 그림과 글을 같은 벡터 공간에 놓는다는 것을 설명할 수 있다.\n3. 유사도 계산으로 \"본 적 없는 종류\"를 분류하는 제로샷 분류를 손으로 해 볼 수 있다.\n\n**복습 (1분):** 길이가 1인 두 벡터의 내적은 무엇과 같나요? (답: 코사인 유사도. [Day 01](#day01))\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 멀티모달\n글, 그림, 소리처럼 정보가 담기는 형식을 **모달**이라고 합니다. 여러 형식을 함께 다루는 모델이 **멀티모달** 모델입니다. 사진을 보여 주고 질문하는 AI가 그 예입니다.\n\n지금까지 배운 [트랜스포머](#bg01)는 **토큰의 줄**을 받았습니다. 그림은 줄이 아니라 점(픽셀)이 가로세로로 놓인 판입니다. 어떻게 넣을까요?\n\n### 1-2. ViT: 그림을 낱말처럼\n2020년의 답은 단순했습니다. **그림을 작은 네모 조각으로 잘라 한 줄로 늘어놓는다.** 조각 하나가 낱말 하나입니다. 이 조각을 **패치**라고 합니다.\n\n- 그림: 가로 224 × 세로 224 점\n- 패치: 16 × 16 점 → 가로로 224 ÷ 16 = 14개, 세로로 14개 → **14 × 14 = 196개**\n- 패치 하나의 숫자: 16 × 16 × 3(빨강, 초록, 파랑) = **768개**\n\n패치마다 768개의 숫자를 한 줄로 펴고, 행렬 하나를 곱해 [임베딩](#day01) 벡터로 바꿉니다. 여기에 [위치 인코딩](#mh01)을 더합니다. 조각을 한 줄로 늘어놓으면 \"어디에 있던 조각인지\"가 사라지기 때문입니다. 그다음은 글과 **똑같은** 트랜스포머입니다.\n\n퍼즐 조각을 한 줄로 늘어놓되, 조각마다 원래 자리 번호를 적어 두는 것과 같습니다. [셀프 어텐션](#sa01) 덕분에 왼쪽 위 조각이 오른쪽 아래 조각을 바로 볼 수 있습니다.\n\n논문 제목 \"그림 한 장은 16 × 16 낱말의 값어치\"가 이 생각을 그대로 말합니다.\n\n### 1-3. CLIP: 그림과 글을 한 공간에\nViT로 그림을 벡터로 바꿀 수 있게 됐습니다. 글도 벡터로 바꿀 수 있습니다. **CLIP**은 둘을 **같은 공간**에 놓습니다.\n\n- 그림 인코더: 그림 → 벡터\n- 글 인코더: 글 → 벡터\n- 목표: **짝이 맞는** 그림과 글은 벡터가 가깝게, 짝이 아니면 멀게\n\n학습 데이터는 인터넷에서 모은 (그림, 설명 글) 4억 쌍입니다. 사람이 \"이건 개, 이건 고양이\" 하고 표를 붙인 것이 아니라, 원래 그림 옆에 붙어 있던 글을 그대로 썼습니다.\n\n### 1-4. 대조 학습: 짝 맞추기 놀이\n한 번에 그림 N장과 글 N개를 가져와 모든 조합의 유사도를 표로 만듭니다.\n\n| | 글 1 | 글 2 | 글 3 |\n|---|---|---|---|\n| **그림 1** | **짝** | × | × |\n| **그림 2** | × | **짝** | × |\n| **그림 3** | × | × | **짝** |\n\n대각선(진짜 짝) N칸은 유사도를 **높이고**, 나머지 N² − N칸은 **낮춥니다**. 줄 하나를 봅시다. 그림 1과 글 세 개의 유사도가 세 칸에 있습니다. 이 세 수에 [소프트맥스](#day05)를 하면 \"그림 1의 짝이 글 1, 2, 3일 확률\"이 됩니다. 정답은 글 1입니다. 그래서 줄마다 \"이 그림의 짝은 몇 번 글?\"을 맞히는 분류 문제이고, 손실은 [크로스엔트로피](#day07)입니다. 객관식 문제를 N개 푸는 것과 같습니다. 맞는 것과 틀린 것을 **대조**해서 배운다고 **대조 학습**이라고 합니다.\n\n### 1-5. 제로샷 분류\n학습이 끝난 CLIP은 **따로 배우지 않은 종류**도 분류합니다.\n\n1. 후보마다 글을 만든다: \"개 사진\", \"고양이 사진\", \"자동차 사진\"\n2. 글들을 벡터로 바꾼다\n3. 그림을 벡터로 바꾼다\n4. 그림 벡터와 **가장 가까운 글**을 고른다\n\n예시를 0개 보고 한다고 **제로샷**이라고 합니다. CLIP은 이 방법으로, 이미지넷(사물 사진 분류 대회의 데이터)의 학습 사진 128만 장을 하나도 쓰지 않고도 그 사진들로 학습한 ResNet-50의 정확도와 맞먹었습니다. ResNet-50은 그림 분류의 기준으로 오래 쓰인 유명한 모델입니다. 기출 문제를 한 번도 안 본 학생이 기출만 판 학생과 같은 점수를 받은 셈입니다.\n\n글로 그림을 주문하는 [확산 모델](#dif01) 서비스 가운데에는 CLIP의 글 인코더로 글의 뜻을 읽는 것도 있습니다.\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n**패치 세기.** 그림 32 × 32, 패치 8 × 8\n\n- 가로 32 ÷ 8 = 4개, 세로 4개 → **16개**\n- 패치 하나의 숫자: 8 × 8 × 3 = **192개**\n\n**제로샷 분류.** 벡터는 모두 길이 1로 맞춰져 있어 내적이 곧 코사인 유사도입니다. 그림 벡터 v = [0.6, 0.8]\n\n| 후보 글 | 벡터 | 내적 |\n|---|---|---|\n| \"개 사진\" | [0.8, 0.6] | 0.48 + 0.48 = **0.96** |\n| \"고양이 사진\" | [0, 1] | 0 + 0.8 = **0.8** |\n| \"자동차 사진\" | [1, 0] | 0.6 + 0 = **0.6** |\n\n가장 큰 **\"개 사진\"**이 답입니다.\n\n**대조 학습의 칸 수.** N = 4이면 표는 4 × 4 = 16칸. 진짜 짝 **4칸**, 가짜 짝 16 − 4 = **12칸**.\n\n---\n\n## 3. 능동 연습 (10분)\n\n### 손계산\n1. 그림 64 × 64, 패치 16 × 16이면 패치는 몇 개?\n2. 1번에서 패치 하나에 들어 있는 숫자는 몇 개? (색 3가지)\n3. 그림 224 × 224를 패치 32 × 32로 자르면 몇 개? 16 × 16일 때(196개)보다 많은가요, 적은가요?\n4. 그림 벡터 v = [1, 0]. 후보 \"바다\" [0.6, 0.8], \"산\" [0.8, 0.6], \"도시\" [0, 1]. 어느 것으로 분류되나요?\n5. 대조 학습에서 한 번에 N = 10쌍을 가져오면 진짜 짝과 가짜 짝은 각각 몇 칸?\n6. ViT가 패치에 위치 인코딩을 더하는 이유는?\n\n### 미니 챌린지\nCLIP에게 \"개\", \"고양이\" 대신 \"웃는 개\", \"자는 고양이\", \"비 오는 날의 도시\"처럼 **아무 글이나** 후보로 줄 수 있습니다. 표를 붙여 학습한 보통의 분류기(정해진 1000가지 중 하나만 답함)와 비교해 이것이 왜 큰 변화인지 설명해 보세요.\n\n### 코드 (선택)\n```python\nimport numpy as np\nH = W = 224; P = 16\nprint((H // P) * (W // P), P * P * 3)        # 196 768\n\nimg = np.arange(32 * 32 * 3).reshape(32, 32, 3)          # 32 × 32 색 그림 (숫자는 아무거나)\npatches = img.reshape(4, 8, 4, 8, 3).swapaxes(1, 2).reshape(16, -1)   # 8 × 8 패치 16개로 자르기\nprint(patches.shape)                         # (16, 192)\n\nv = np.array([0.6, 0.8])\ntexts = np.array([[0.8, 0.6], [0.0, 1.0], [1.0, 0.0]])   # 개, 고양이, 자동차\nsims = texts @ v\nprint(sims.round(2), sims.argmax())          # [0.96 0.8  0.6 ] 0  → \"개 사진\"\n```\n(reshape와 swapaxes 줄은 \"판을 조각으로 자르는 요령\"입니다. 지금은 결과 모양 (16, 192)만 확인하세요.)\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n1. ViT는 그림을 어떻게 트랜스포머에 넣나요?\n2. CLIP의 학습 목표는?\n3. O/X: CLIP으로 제로샷 분류를 하려면 분류하려는 종류의 사진으로 다시 학습해야 한다.\n4. 대조 학습에서 \"대조\"하는 두 가지는?\n\n---\n\n## 한 줄 정리\nViT는 그림을 패치로 잘라 낱말처럼 트랜스포머에 넣고, CLIP은 짝이 맞는 그림과 글의 벡터를 가깝게 배워 글만으로 그림을 분류한다.\n\n---\n\n<details>\n<summary>정답 보기 (먼저 풀고 열기!)<\/summary>\n\n**손계산**\n1. 가로 4개 × 세로 4개 = **16개**\n2. 16 × 16 × 3 = **768개**\n3. 224 ÷ 32 = 7 → 7 × 7 = **49개**. 더 **적습니다** (조각이 커지면 개수가 줄어듭니다)\n4. 바다 0.6, 산 0.8, 도시 0 → **\"산\"**\n5. 진짜 짝 **10칸**, 가짜 짝 100 − 10 = **90칸**\n6. 패치를 한 줄로 늘어놓으면 원래 어디에 있던 조각인지 알 수 없기 때문입니다.\n\n**미니 챌린지**\n보통의 분류기는 학습할 때 정한 종류 안에서만 답할 수 있고, 새 종류를 넣으려면 표 붙인 사진을 모아 다시 학습해야 합니다. CLIP은 글과 그림이 같은 공간에 있어서, 후보를 **글로 쓰기만 하면** 새 종류가 됩니다. 분류할 종류를 사람이 말로 정할 수 있게 된 것입니다.\n\n**퀴즈**\n1. 그림을 작은 패치로 잘라 한 줄로 늘어놓고, 패치마다 임베딩 벡터로 바꾼 뒤 위치 인코딩을 더해 넣습니다.\n2. 짝이 맞는 그림과 글의 벡터는 가깝게, 짝이 아닌 것은 멀게 만드는 것\n3. X. 후보를 글로 써서 그림 벡터와 가장 가까운 글을 고르기만 하면 됩니다.\n4. 진짜 짝(가깝게)과 가짜 짝(멀게)\n<\/details>\n", "link": "논문 연결: Dosovitskiy 외 (2020) (ViT), Radford 외 (2021) (CLIP). 글을 읽던 트랜스포머가 그림을 ", "lesson": true}, {"id": "moe01", "short": "Mixture of Experts: 전문가에게 나눠 맡기기", "md": "# 11단계. Mixture of Experts: 전문가에게 나눠 맡기기\n\n30분 · 논문 연결: Fedus, Zoph, Shazeer (2021) \"Switch Transformers: Scaling to Trillion Parameter Models with Simple and Efficient Sparsity\". 모델은 키우되 계산은 늘리지 않는 방법\n\n---\n\n## 오늘의 목표\n1. \"모델 전체를 매번 다 쓰지 않는다\"는 MoE의 생각을 설명할 수 있다.\n2. 라우터의 점수에서 전문가를 고르고 출력을 섞는 계산을 손으로 할 수 있다.\n3. 전체 파라미터 수와 실제로 쓰이는 파라미터 수를 구별해 계산할 수 있다.\n\n**복습 (1분):** 점수 [0, 0]에 소프트맥스를 하면? (답: [0.5, 0.5]. [Day 05](#day05))\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 종합병원\n[스케일링 법칙](#sl01)은 \"키우면 좋아진다\"고 했습니다. 그런데 보통의 모델은 토큰 하나를 처리할 때 **모든 가중치**를 씁니다. 10배 큰 모델은 계산도 10배입니다.\n\n종합병원을 떠올려 보세요. 의사는 수백 명이지만, 환자 한 명은 **접수처가 정해 준 한두 명**만 만납니다. 병원이 커져도 환자 한 명의 진료 시간은 그대로입니다.\n\n**MoE**(전문가 섞기)가 이 구조입니다.\n\n### 1-2. 구조: 전문가들과 라우터\n[트랜스포머](#bg01) 블록 안에는 어텐션 다음에 작은 신경망(피드포워드 층)이 있습니다. MoE는 이 자리에\n\n- **전문가** 여러 개: 똑같은 모양의 피드포워드 층 E₁, E₂, …, Eₙ\n- **라우터**: 토큰을 보고 \"어느 전문가에게 보낼지\" 점수를 매기는 작은 층 (접수처)\n\n를 둡니다. \"전문가\"라고 부르지만 사람이 \"너는 문법, 너는 수학\"이라고 정해 주지 않습니다. 누가 무엇을 맡을지는 **학습으로 저절로** 나뉩니다.\n\n### 1-3. 고르고 섞기\n1. 라우터가 전문가마다 점수를 냅니다\n2. [소프트맥스](#day05)로 확률로 바꿉니다\n3. 확률이 큰 **k명만** 고릅니다 (top-k). 나머지는 **계산하지 않습니다**\n4. 고른 전문가의 출력을, 그 확률을 다시 합이 1이 되게 맞춘 비율로 섞습니다\n\n$$y = \\sum_{i \\in \\text{고른 전문가}} p_i \\, E_i(x)$$\n\n식을 읽어 봅시다. x는 들어온 토큰의 벡터입니다. $E_i(x)$는 i번 전문가가 x를 받아 내놓은 출력입니다. $p_i$는 4번에서 다시 맞춘 비율입니다. Σ(시그마)는 \"모두 더하라\"는 기호였습니다. Σ 아래의 ∈는 \"~에 속한다\"는 뜻이라, 고른 전문가만 더하라는 말입니다. 풀어 쓰면 \"고른 전문가의 출력에 비율을 곱해 더한다\"입니다. k는 고르는 사람 수이고 우리가 정합니다. Switch Transformer는 가장 단순하게 **k = 1**, 한 명에게만 보냅니다.\n\n이렇게 대부분을 쉬게 하는 것을 **희소**하다고 합니다. 듬성듬성 쓴다는 뜻입니다.\n\n### 1-4. 숫자 세기\n전문가 8명, 한 명이 1억 개의 파라미터를 가졌다면\n\n- 전체: 8 × 1억 = **8억 개** (모델이 담을 수 있는 지식의 양)\n- 토큰 하나에 쓰이는 것(k = 2): 2 × 1억 = **2억 개** (실제 계산량)\n\n**크기는 8억짜리, 계산은 2억짜리**입니다. Switch Transformer는 이 방법으로 파라미터 1조 개가 넘는 모델까지 키웠고, 비슷한 품질에 닿는 속도가 T5-XXL보다 4배 빨랐다고 보고했습니다. T5-XXL은 전문가 없이 모든 가중치를 매번 쓰는 보통의 큰 모델입니다.\n\n### 1-5. 어려운 점\n- **쏠림**: 라우터가 한두 전문가에게만 일을 몰아 주면 나머지는 배우지 못합니다. 그래서 \"골고루 나눠 주라\"는 벌점(부하 균형 손실)을 더합니다\n- **메모리**: 계산은 줄어도 전문가 전부를 메모리에 올려 둬야 합니다\n- **뽑힌 사람만 배운다**: 역전파는 계산에 참여한 곳으로만 흐릅니다 ([역전파](#bp01)). 고르지 않은 전문가는 그 토큰에서 아무것도 배우지 못합니다. 경기에 나가지 못한 선수는 실력이 늘지 않는 것과 같습니다. 그래서 위의 쏠림이 한번 생기면 점점 심해질 수 있습니다\n\n요즘의 여러 큰 언어 모델이 이 구조를 씁니다.\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n쓸 값: e² ≈ 7.39, e¹ ≈ 2.72, e⁰ = 1\n\n**라우터.** 전문가 3명에 대한 점수가 [2, 1, 0]입니다.\n\n- 소프트맥스: 합 = 7.39 + 2.72 + 1 = 11.11 → [7.39, 2.72, 1] ÷ 11.11 ≈ **[0.67, 0.24, 0.09]**\n\n**k = 1 (Switch).** 가장 큰 전문가 1에게만 보냅니다. 우리 규칙대로 비율을 다시 맞추면 1이 되어 출력은 y = E₁(x)입니다. (실제 Switch Transformer는 비율을 다시 맞추지 않고 라우터 확률을 그대로 곱해 y = 0.67 × E₁(x)로 씁니다. 그래야 라우터도 학습됩니다.)\n\n**k = 2.** 전문가 1과 2를 고릅니다. 확률을 둘만으로 다시 맞춥니다.\n\n- 0.67 ÷ (0.67 + 0.24) ≈ **0.74**, 0.24 ÷ 0.91 ≈ **0.26**\n- 전문가 1의 출력이 10, 전문가 2의 출력이 20이라면 y = 0.74 × 10 + 0.26 × 20 = 7.4 + 5.2 = **12.6**\n\n전문가 3은 계산하지 않았습니다.\n\n**숫자 세기.** 전문가 16명, 한 명에 5000만 개, k = 2\n\n- 전체 16 × 5000만 = **8억 개**, 쓰이는 것 2 × 5000만 = **1억 개** (전체의 12.5%)\n\n---\n\n## 3. 능동 연습 (10분)\n\n쓸 값: e² ≈ 7.39, e¹ ≈ 2.72, e⁰ = 1\n\n### 손계산\n1. 라우터 점수가 [0, 2, 1]입니다. 소프트맥스 확률은? (예제와 순서만 다릅니다)\n2. 1번에서 k = 1이면 몇 번 전문가에게 보내나요?\n3. 고른 두 전문가의 비율이 0.74와 0.26이고 출력이 각각 4와 8이면 y는?\n4. 전문가 4명, 한 명에 2억 개, k = 1. 전체 파라미터와 토큰 하나에 쓰이는 파라미터는?\n5. 전문가 64명, k = 2이면 토큰 하나가 쓰는 전문가는 전체의 몇 %?\n6. 라우터가 모든 토큰을 전문가 1에게만 보냅니다. 무엇이 문제이고, 무엇으로 막나요?\n\n### 미니 챌린지\n[멀티헤드 어텐션](#mh01)도 \"여러 개를 나란히 둔다\"는 점에서 MoE와 닮았습니다. 가장 큰 차이는 무엇일까요? (힌트: 헤드는 몇 개가 일하나요?)\n\n### 코드 (선택)\n```python\nimport numpy as np\ndef softmax(v):\n    e = np.exp(v)\n    return e / e.sum()\n\nscores = np.array([2.0, 1.0, 0.0])\np = softmax(scores)\nprint(p.round(2))                       # [0.67 0.24 0.09]\n\nk = 2\ntop = np.argsort(-p)[:k]                # 확률이 큰 전문가 k명의 번호\nw = p[top] / p[top].sum()               # 합이 1이 되게 다시 맞춤\nprint(top, w.round(2))                  # [0 1] [0.73 0.27]\n\nouts = np.array([10.0, 20.0, 99.0])     # 전문가 3의 출력 99는 쓰이지 않음\nprint((w * outs[top]).sum().round(1))   # 12.7\n```\n(손계산 0.74, 0.26, 12.6과 끝자리가 다른 것은 손계산에서 확률을 먼저 반올림했기 때문입니다.)\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n1. MoE에서 라우터가 하는 일은?\n2. \"희소하다\"는 여기서 무슨 뜻인가요?\n3. O/X: MoE 모델은 전문가가 늘어날수록 토큰 하나를 처리하는 계산량도 그만큼 늘어난다.\n4. 부하 균형 손실은 왜 필요한가요?\n\n---\n\n## 한 줄 정리\nMoE는 전문가 여러 명을 두고, 라우터가 토큰마다 한두 명만 골라 일을 시킨다. 모델은 커지지만 토큰 하나의 계산량은 그대로다.\n\n---\n\n<details>\n<summary>정답 보기 (먼저 풀고 열기!)<\/summary>\n\n**손계산**\n1. [1, 7.39, 2.72] ÷ 11.11 ≈ **[0.09, 0.67, 0.24]**\n2. **2번** 전문가\n3. 0.74 × 4 + 0.26 × 8 = 2.96 + 2.08 = **5.04**\n4. 전체 **8억 개**, 쓰이는 것 **2억 개**\n5. 2 ÷ 64 ≈ **3.1%**\n6. 다른 전문가들이 배우지 못해 있으나 마나가 됩니다(쏠림). **부하 균형 손실**로 골고루 나눠 주게 합니다.\n\n**미니 챌린지**\n멀티헤드 어텐션은 **모든 헤드가 매번 일하고** 결과를 다 합칩니다. MoE는 **고른 몇 명만** 일하고 나머지는 쉽니다. 그래서 멀티헤드 어텐션은 가진 헤드를 매번 모두 계산하지만, MoE는 전문가를 아무리 늘려도 토큰 하나의 계산이 늘지 않습니다.\n\n**퀴즈**\n1. 토큰을 보고 어느 전문가에게 보낼지 점수를 매겨 고릅니다.\n2. 전문가 대부분은 쉬고 일부만 계산에 쓰인다는 뜻입니다.\n3. X. 토큰 하나는 고른 k명만 쓰므로 계산량은 거의 그대로입니다.\n4. 라우터가 몇몇 전문가에게만 일을 몰아 주는 쏠림을 막기 위해서입니다.\n<\/details>\n", "link": "논문 연결: Fedus, Zoph, Shazeer (2021) . 모델은 키우되 계산은 늘리지 않는 방법", "lesson": true}, {"id": "rag01", "short": "RAG와 생각의 사슬", "md": "# 11단계. RAG와 생각의 사슬\n\n30분 · 논문 연결: Lewis 외 (2020) \"Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks\", Wei 외 (2022) \"Chain-of-Thought Prompting Elicits Reasoning in Large Language Models\". 모델을 다시 학습시키지 않고 더 똑똑하게 쓰는 두 가지 방법\n\n---\n\n## 오늘의 목표\n1. 언어 모델이 왜 모르는 것을 지어내는지, RAG가 그것을 어떻게 줄이는지 설명할 수 있다.\n2. 질문 벡터와 문서 벡터의 내적으로 \"가장 관련 있는 문서\"를 손으로 고를 수 있다.\n3. 생각의 사슬(풀이 과정을 쓰게 하기)이 왜 정답률을 올리는지 설명할 수 있다.\n\n**복습 (1분):** [1, 2] · [3, 1]은? (답: 1 × 3 + 2 × 1 = 5. [Day 01](#day01))\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 오픈북 시험\n언어 모델의 지식은 모두 **가중치 안에** 들어 있습니다. 그래서 세 가지 약점이 있습니다.\n\n- 학습이 끝난 뒤의 일을 모른다\n- 우리 회사 문서처럼 본 적 없는 것을 모른다\n- 모르면서 그럴듯하게 **지어낸다** (환각이라고 부릅니다)\n\n사람도 외워서만 보는 시험에서는 기억이 흐릿하면 틀린 답을 씁니다. 해법은 **오픈북 시험**입니다. 책을 찾아보고 답하게 하는 것. 이것이 **RAG**(검색 증강 생성)입니다.\n\n### 1-2. RAG의 세 걸음\n1. **찾기.** 질문과 관련 있는 문서 조각을 창고에서 찾는다\n2. **붙이기.** 찾은 조각을 질문과 함께 모델의 입력에 넣는다\n3. **답하기.** 모델이 그 조각을 읽고 답한다\n\n왜 문서를 통째로 넣지 않고 조각낼까요? 모델이 한 번에 읽을 수 있는 글의 길이에는 한계가 있기 때문입니다. 그래서 문서를 미리 몇 문단씩 잘라 둡니다. 책을 통째로 건네지 않고 필요한 쪽만 복사해 주는 것과 같습니다.\n\n새 지식을 넣으려고 모델을 다시 학습시킬 필요가 없습니다. (2020년 논문은 찾는 부분과 답하는 부분을 함께 학습시켰지만, 요즘은 이미 학습된 모델을 그대로 두고 쓰는 경우가 많습니다.) 창고의 문서만 바꾸면 새 지식을 쓸 수 있고, 어느 문서를 보고 답했는지 **출처**도 보여 줄 수 있습니다.\n\n### 1-3. 찾기는 벡터로\n\"관련 있는 문서\"를 어떻게 찾을까요? 낱말이 겹치는지만 보면 \"자동차\"와 \"승용차\"를 놓칩니다. 그래서 **뜻**을 벡터로 바꿉니다.\n\n- 미리: 문서 조각마다 [임베딩](#day01) 벡터를 만들어 저장해 둔다 (벡터 창고)\n- 질문이 오면: 질문도 같은 방법으로 벡터로 바꾼다\n- 질문 벡터와 각 문서 벡터의 [내적](#day01)을 구해, **가장 큰 k개**를 고른다 (k는 몇 개를 가져올지 우리가 정하는 수입니다)\n\nRAG는 내적이 클수록 관련이 깊다고 봅니다. 벡터의 길이가 같다면 내적이 크다는 것은 방향이 비슷하다, 곧 뜻이 가깝다는 뜻이었습니다. (길이가 다르면 긴 벡터가 유리해지므로, 실제로는 길이를 1로 맞춰 쓰는 경우도 많습니다.) 도서관 사서가 질문을 듣고 가장 가까운 서가로 걸어가는 것과 같습니다. 2020년 RAG 논문은 위키백과 전체를 이런 벡터 창고로 만들었습니다.\n\n### 1-4. 생각의 사슬: 풀이를 쓰게 하기\n두 번째 방법은 더 단순합니다. 모델에게 **답만 말하지 말고 풀이 과정을 쓰게** 합니다.\n\n> 질문: 사과가 23개 있었습니다. 20개를 쓰고 6개를 더 샀습니다. 몇 개인가요?\n>\n> 바로 답하기: \"27개\" (틀림)\n>\n> 생각의 사슬: \"23개에서 20개를 쓰면 3개. 6개를 더 사면 3 + 6 = 9. 답은 9개.\" (맞음)\n\n2022년 논문은 프롬프트(모델에게 주는 입력 글)에 **풀이가 달린 예시 몇 개**를 넣어 주기만 했습니다. 그러자 큰 모델이 수학 문장제를 훨씬 잘 풀었습니다. 가중치는 하나도 바꾸지 않았습니다.\n\n### 1-5. 왜 통할까\n[GPT](#bg01)는 한 번에 토큰 하나를 쓰고, 그때까지 **쓴 글 전체**를 다시 봅니다. 풀이를 쓰면 중간 결과(\"3개\")가 글로 남고, 다음 걸음은 그것을 **읽고** 이어 갑니다. 암산 대신 연습장에 적어 가며 푸는 것과 같습니다.\n\n두 방법의 공통점: **모델의 입력에 필요한 것을 넣어 준다.** RAG는 필요한 지식을, 생각의 사슬은 중간 계산을 넣습니다.\n\n조심할 점\n- RAG는 찾은 문서가 틀렸거나 엉뚱하면 답도 틀립니다\n- 풀이가 그럴듯하다고 정답이라는 보장은 없습니다. 틀린 풀이도 유창하게 씁니다\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n**찾기.** 질문 벡터 q = [1, 2]. 창고에 문서가 세 개 있습니다.\n\n| 문서 | 벡터 | q와의 내적 |\n|---|---|---|\n| ㄱ: 환불 규정 | [2, 1] | 1 × 2 + 2 × 1 = **4** |\n| ㄴ: 배송 안내 | [1, 3] | 1 × 1 + 2 × 3 = **7** |\n| ㄷ: 회사 연혁 | [−1, 1] | 1 × (−1) + 2 × 1 = **1** |\n\nk = 2라면 내적이 큰 순서대로 **ㄴ, ㄱ**을 고릅니다. ㄷ은 버립니다.\n\n**붙이기.** 모델에게 가는 입력은 이렇게 됩니다.\n\n> 다음 자료를 보고 답하세요.\n> [자료 1] 배송 안내 …\n> [자료 2] 환불 규정 …\n> 질문: 배송이 늦으면 환불되나요?\n\n**생각의 사슬.** \"한 상자에 연필이 12자루. 3상자를 사서 친구에게 10자루를 줬다. 남은 연필은?\"\n\n풀이: 12 × 3 = 36자루. 36 − 10 = **26자루**. 걸음이 두 개이고, 첫 걸음의 결과(36)가 둘째 걸음의 재료입니다.\n\n---\n\n## 3. 능동 연습 (10분)\n\n### 손계산\n1. q = [2, 1], 문서 A = [1, 1], B = [3, 0], C = [0, 2]. 각 내적은?\n2. 1번에서 k = 1이면 어느 문서를 고르나요? k = 2이면?\n3. q = [1, −1], 문서 D = [2, 2], E = [1, −2]. 어느 쪽이 더 관련 있나요?\n4. 생각의 사슬로 풀어 보세요. \"버스에 15명이 타고 있었다. 정류장에서 7명이 내리고 4명이 탔다. 다음 정류장에서 절반이 내렸다. 남은 사람은?\" 걸음마다 중간 결과를 쓰세요.\n5. 다음 중 RAG가 특히 도움이 되는 질문은? (가) \"어제 바뀐 우리 회사 휴가 규정은?\" (나) \"2 + 3은?\"\n6. RAG의 세 걸음을 순서대로 쓰세요.\n\n### 미니 챌린지\nRAG를 썼는데도 모델이 틀린 답을 했습니다. 어디에서 잘못됐을 수 있는지 세 걸음(찾기, 붙이기, 답하기)마다 하나씩 생각해 보세요.\n\n### 코드 (선택)\n```python\nimport numpy as np\nq = np.array([1, 2])\ndocs = np.array([[2, 1], [1, 3], [-1, 1]])    # ㄱ, ㄴ, ㄷ\nscores = docs @ q\nprint(scores)                                  # [4 7 1]\ntop2 = np.argsort(-scores)[:2]                 # 점수가 큰 순서로 2개의 번호\nprint(top2)                                    # [1 0]  → ㄴ, ㄱ\n\nnames = [\"환불 규정\", \"배송 안내\", \"회사 연혁\"]\nprompt = \"다음 자료를 보고 답하세요.\\n\" + \"\\n\".join(f\"[자료] {names[i]}\" for i in top2)\nprint(prompt)\n```\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n1. 환각이란 무엇인가요?\n2. RAG에서 관련 있는 문서를 어떻게 찾나요?\n3. O/X: 생각의 사슬을 쓰려면 모델의 가중치를 다시 학습시켜야 한다.\n4. 풀이 과정을 쓰게 하면 정답률이 오르는 이유는?\n\n---\n\n## 한 줄 정리\nRAG는 관련 문서를 찾아 입력에 붙여 주고, 생각의 사슬은 풀이 과정을 쓰게 한다. 둘 다 가중치를 바꾸지 않고 입력을 잘 채워 모델을 더 잘 쓰는 방법이다.\n\n---\n\n<details>\n<summary>정답 보기 (먼저 풀고 열기!)<\/summary>\n\n**손계산**\n1. A: 2 + 1 = **3**, B: 6 + 0 = **6**, C: 0 + 2 = **2**\n2. k = 1이면 **B**. k = 2이면 **B, A**\n3. D: 2 − 2 = 0, E: 1 + 2 = 3. **E**\n4. 15 − 7 = 8명. 8 + 4 = 12명. 절반이 내리면 12 ÷ 2 = **6명**\n5. **(가)**. 모델이 학습한 적 없는 새 정보라 찾아봐야 합니다.\n6. 찾기(관련 문서 검색) → 붙이기(입력에 넣기) → 답하기\n\n**미니 챌린지**\n찾기: 엉뚱한 문서를 찾았거나, 맞는 문서가 창고에 없었다. 붙이기: 문서가 너무 길어 중요한 부분이 잘렸거나 조각이 어중간하게 나뉘었다. 답하기: 자료에 답이 있는데도 모델이 무시하고 기억에 기대 답했거나, 자료를 잘못 읽었다.\n\n**퀴즈**\n1. 모델이 모르는 것을 사실인 것처럼 그럴듯하게 지어내는 현상\n2. 질문과 문서를 벡터로 바꿔, 내적(유사도)이 가장 큰 문서 k개를 고릅니다.\n3. X. 프롬프트에 풀이가 달린 예시를 넣기만 하면 됩니다.\n4. 중간 결과가 글로 남아, 다음 걸음이 그것을 읽고 이어 갈 수 있기 때문입니다.\n<\/details>\n", "link": "논문 연결: Lewis 외 (2020) , Wei 외 (2022) . 모델을 다시 학습시키지 않고 더 똑똑하게 쓰는 두 가지 방법", "lesson": true}, {"id": "rl01", "short": "RLHF와 DPO: 사람의 선호로 다듬기", "md": "# 11단계. RLHF와 DPO: 사람의 선호로 다듬기\n\n30분 · 논문 연결: Ouyang 외 (2022) \"Training language models to follow instructions with human feedback\" (InstructGPT), Rafailov 외 (2023) \"Direct Preference Optimization\". 글을 잇던 모델이 \"말을 듣는 비서\"가 된 방법\n\n---\n\n## 오늘의 목표\n1. \"다음 단어 맞히기\"만 배운 모델이 왜 좋은 비서가 아닌지 설명할 수 있다.\n2. RLHF의 세 걸음(시범 보이기, 채점기 만들기, 채점기로 다듬기)을 순서대로 말할 수 있다.\n3. \"A가 B보다 낫다\"는 비교 한 쌍에서 손실을 계산할 수 있고, DPO가 무엇을 줄였는지 안다.\n\n**복습 (1분):** GPT가 사전학습에서 배우는 일은? (답: 다음 단어 맞히기. [BERT와 GPT](#bg01))\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 글을 잘 잇는 것과 말을 잘 듣는 것\n사전학습한 모델은 **인터넷 글을 그럴듯하게 잇는** 법을 배웠습니다. \"김치찌개 끓이는 법 알려 줘\"라고 하면 요리법 대신 \"라고 친구가 물었다. 나는…\" 하고 이야기를 이어 갈 수도 있습니다. 틀린 것은 아니지만 우리가 원한 답은 아닙니다.\n\n문제는 \"좋은 답\"을 식으로 쓰기 어렵다는 것입니다. 하지만 사람은 두 답을 나란히 보면 **어느 쪽이 나은지**는 쉽게 고릅니다. 이 **비교**를 학습에 쓰는 것이 오늘의 주제입니다.\n\n### 1-2. RLHF의 세 걸음\nRLHF는 \"사람의 피드백으로 하는 강화학습\"의 영어 줄임말입니다. 강화학습은 **점수(보상)를 많이 받는 쪽으로 행동을 고쳐 가는** 학습입니다([9단계 강화학습 기초](#mdp01)에서 배웠습니다). 강아지에게 간식을 주며 \"앉아\"를 가르치는 것과 같습니다.\n\n1. **시범 보이기.** 사람이 쓴 모범 답안으로 [미세조정](#bg01)합니다\n2. **채점기 만들기.** 모델의 답 두 개를 사람에게 보여 주고 더 나은 쪽을 고르게 합니다. 이 비교를 모아, 답에 점수를 매기는 신경망(**보상 모델**)을 학습시킵니다\n3. **채점기로 다듬기.** 모델이 답을 쓰면 보상 모델이 점수를 줍니다. 점수가 높아지는 쪽으로 모델을 고칩니다. 사람이 매번 채점하지 않아도 됩니다\n\n요리 학원으로 치면 1은 선생님 따라 하기, 2는 맛을 볼 줄 아는 심사위원 키우기, 3은 심사위원 점수를 보며 혼자 연습하기입니다.\n\n### 1-3. 채점기는 비교에서 어떻게 배울까\n보상 모델이 답 A에 점수 $r_A$, 답 B에 $r_B$를 줬다고 합시다. \"A가 더 낫다\"고 볼 확률을 점수 **차이**로 정합니다.\n\n$$P(A \\text{가 낫다}) = \\sigma(r_A - r_B)$$\n\nσ(시그마)는 **시그모이드**, 어떤 수든 0과 1 사이로 눌러 주는 함수입니다 ([LSTM 게이트](#day11)에서 수도꼭지로 썼습니다). 오늘 쓸 값은 네 개뿐입니다.\n\n| 차이 | −1 | 0 | 1 | 2 |\n|---|---|---|---|---|\n| σ(차이) | 0.27 | 0.5 | 0.73 | 0.88 |\n\n사람이 정말 A를 골랐다면 손실은 $-\\ln P(A\\text{가 낫다})$. [크로스엔트로피](#day07)입니다. 점수 차이가 사람의 선택과 같은 방향으로 벌어질수록 손실이 줄어듭니다.\n\n### 1-4. 고삐: 너무 멀리 가지 않게\n3번 걸음에서 점수만 쫓으면 모델이 채점기의 허점을 파고들어 이상한 답을 낼 수 있습니다. 그래서 \"원래 모델에서 너무 멀어지면 벌점\"([KL 발산](#day07))을 붙입니다. 강아지 목줄처럼, 마음껏 움직이되 너무 멀리 가지는 못하게 하는 것입니다. (InstructGPT가 쓴 강화학습 방법은 [액터-크리틱과 PPO](#ac01)에서 배운 PPO입니다. 그 챕터의 \"한 번에 너무 많이 바꾸지 않기\"가 여기서는 목줄과 함께 쓰입니다.)\n\n결과: 파라미터 13억 개짜리 InstructGPT의 답을, 사람들은 1750억 개짜리 GPT-3의 답보다 더 좋아했습니다. **100배 넘게 작은 모델이 \"말을 듣는 법\"을 배워 이긴 것**입니다.\n\n### 1-5. DPO: 채점기 없이 바로\nRLHF는 모델이 둘(채점기와 본 모델)이고 강화학습은 다루기 까다롭습니다. 2023년의 **DPO**는 \"채점기를 따로 만들지 말고, 비교 데이터로 **모델을 바로** 고치자\"고 했습니다.\n\n생각은 이렇습니다. 모델이 어떤 답에 주는 [로그 확률](#day05)이 원래 모델보다 얼마나 **올랐는지**를 그 답의 점수로 칩니다.\n\n$$\\text{점수}(y) = \\ln \\pi(y) - \\ln \\pi_{\\text{원래}}(y)$$\n\nπ(파이)는 여기서 원주율이 아니라 \"모델이 그 답을 쓸 확률\"의 이름표입니다. 점수가 0이면 원래 모델과 똑같다는 뜻입니다. 점수가 0보다 크면 그 답을 전보다 더 자주 쓰게 됐다는 뜻입니다. 0보다 작으면 덜 쓰게 됐다는 뜻입니다. 시험 점수 자체가 아니라 \"지난 시험보다 몇 점 올랐나\"를 보는 것과 같습니다. 이제 1-3의 식에서 채점기 점수 $r_A$, $r_B$ 자리에 이 점수를 넣습니다. 식의 모양은 똑같습니다.\n\n$$\\text{손실} = -\\ln \\sigma\\big(\\beta \\times (\\text{점수}(\\text{좋은 답}) - \\text{점수}(\\text{나쁜 답}))\\big)$$\n\nβ(베타)는 세기를 정하는 수입니다. 좋은 답의 확률은 올리고 나쁜 답의 확률은 내릴수록 손실이 줄어듭니다. 강화학습 없이 **분류 문제처럼** 풀리고, \"원래 모델에서 얼마나 달라졌는지\"가 식에 들어 있어 고삐 역할도 합니다.\n\n| | RLHF | DPO |\n|---|---|---|\n| 필요한 데이터 | 답 두 개의 비교 | 답 두 개의 비교 |\n| 채점기(보상 모델) | 따로 학습 | **없음** |\n| 학습 방법 | 강화학습 | 분류 손실 하나 |\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n쓸 값: −ln 0.88 ≈ 0.13, −ln 0.73 ≈ 0.31, −ln 0.5 ≈ 0.69, −ln 0.27 ≈ 1.31\n\n**채점기 학습.** 사람이 A를 골랐습니다.\n\n- 채점기가 $r_A$ = 3, $r_B$ = 1을 줬다면: 차이 2 → P = 0.88 → 손실 **0.13** (잘 맞힘)\n- 채점기가 $r_A$ = 1, $r_B$ = 2를 줬다면: 차이 −1 → P = 0.27 → 손실 **1.31** (거꾸로 매김, 크게 혼남)\n\n**DPO.** β = 1. 학습 전에는 모델이 원래 모델과 같으므로 두 점수 모두 0.\n\n- 학습 전: 차이 0 → σ(0) = 0.5 → 손실 **0.69**\n- 조금 학습해서 좋은 답의 로그 확률이 0.5 오르고 나쁜 답은 0.5 내렸다면: 점수 0.5와 −0.5, 차이 1 → 0.73 → 손실 **0.31**\n\n손실이 0.69에서 0.31로 줄었습니다.\n\n---\n\n## 3. 능동 연습 (10분)\n\n쓸 값: σ(−1) = 0.27, σ(0) = 0.5, σ(1) = 0.73, σ(2) = 0.88 / −ln 0.88 ≈ 0.13, −ln 0.73 ≈ 0.31, −ln 0.5 ≈ 0.69, −ln 0.27 ≈ 1.31\n\n### 손계산\n1. 채점기 점수가 $r_A$ = 2, $r_B$ = 1입니다. \"A가 낫다\"고 볼 확률은?\n2. 1번에서 사람이 A를 골랐다면 손실은? B를 골랐다면? (B가 낫다고 볼 확률은 1 − P)\n3. 두 답의 점수가 똑같으면 A가 낫다고 볼 확률은?\n4. DPO(β = 1)에서 좋은 답의 로그 확률이 원래보다 1.5 오르고, 나쁜 답은 0.5 내렸습니다. 점수 차이와 손실은?\n5. DPO에서 좋은 답의 확률이 오히려 내려가 점수가 −0.5, 나쁜 답의 점수가 0.5가 됐습니다. 손실은? 학습 전(0.69)보다 큰가요?\n6. RLHF의 세 걸음을 순서대로 쓰세요.\n\n### 미니 챌린지\n사람에게 답 하나를 보여 주고 \"10점 만점에 몇 점?\"이라고 묻지 않고, 답 두 개를 보여 주고 \"어느 쪽이 나아요?\"라고 묻는 이유는 무엇일까요? 맛집 별점을 떠올려 보세요.\n\n### 코드 (선택)\n```python\nimport numpy as np\ndef sigmoid(x):\n    return 1 / (1 + np.exp(-x))\n\nfor diff in [-1, 0, 1, 2]:\n    p = sigmoid(diff)\n    print(diff, p.round(2), (-np.log(p)).round(2))\n# -1 0.27 1.31\n# 0 0.5 0.69\n# 1 0.73 0.31\n# 2 0.88 0.13\n\ndef dpo_loss(up_good, up_bad, beta=1.0):     # 로그 확률이 원래 모델보다 얼마나 올랐는지\n    return -np.log(sigmoid(beta * (up_good - up_bad)))\nprint(dpo_loss(0, 0).round(2), dpo_loss(0.5, -0.5).round(2))   # 0.69 0.31\n```\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n1. 사전학습만 한 모델이 좋은 비서가 아닌 이유는?\n2. 보상 모델은 어떤 데이터로 학습하나요?\n3. O/X: DPO도 RLHF처럼 보상 모델을 따로 학습시킨다.\n4. RLHF에서 \"원래 모델에서 너무 멀어지지 않게\" 벌점을 주는 이유는?\n\n---\n\n## 한 줄 정리\nRLHF는 사람의 비교로 채점기를 만들고 그 점수로 모델을 다듬는다. DPO는 채점기 없이 같은 비교 데이터로 모델을 바로 고친다.\n\n---\n\n<details>\n<summary>정답 보기 (먼저 풀고 열기!)<\/summary>\n\n**손계산**\n1. 차이 1 → σ(1) = **0.73**\n2. A를 골랐다면 −ln 0.73 ≈ **0.31**. B를 골랐다면 −ln(1 − 0.73) = −ln 0.27 ≈ **1.31**\n3. 차이 0 → **0.5**\n4. 점수 1.5와 −0.5, 차이 **2** → σ(2) = 0.88 → 손실 **0.13**\n5. 차이 −0.5 − 0.5 = −1 → σ(−1) = 0.27 → 손실 **1.31**. 학습 전보다 **큽니다** (잘못된 방향)\n6. 모범 답안으로 미세조정 → 사람의 비교로 보상 모델 학습 → 보상 모델의 점수로 모델 다듬기\n\n**미니 챌린지**\n점수는 사람마다 기준이 다릅니다. 누구는 웬만하면 5점을 주고, 누구는 3점이 칭찬입니다. 하지만 \"둘 중 어느 쪽이 나은가\"는 사람들 사이에 훨씬 잘 일치하고 답하기도 쉽습니다. 그래서 비교가 더 믿을 만한 데이터가 됩니다.\n\n**퀴즈**\n1. 그럴듯하게 글을 잇는 법만 배워서, 시킨 일을 하는 대신 글을 이어 갈 수 있기 때문입니다.\n2. 답 두 개 중 사람이 더 낫다고 고른 비교 데이터\n3. X. DPO는 보상 모델 없이 비교 데이터로 모델을 바로 학습시킵니다.\n4. 점수만 쫓다 채점기의 허점을 파고든 이상한 답을 내지 않게 하려고요.\n<\/details>\n", "link": "논문 연결: Ouyang 외 (2022) (InstructGPT), Rafailov 외 (2023) . 글을 잇던 모델이 가 된 방법", "lesson": true}, {"id": "sl01", "short": "스케일링 법칙: 키우면 얼마나 좋아질까", "md": "# 11단계. 스케일링 법칙: 키우면 얼마나 좋아질까\n\n30분 · 논문 연결: Kaplan 외 (2020) \"Scaling Laws for Neural Language Models\", Hoffmann 외 (2022) \"Training Compute-Optimal Large Language Models\" (Chinchilla). 요즘 모델이 왜 이렇게 커졌는지 설명하는 두 논문\n\n---\n\n## 오늘의 목표\n1. 모델의 손실이 크기, 데이터, 계산량에 따라 \"거듭제곱 법칙\"으로 줄어든다는 걸 설명할 수 있다.\n2. \"10배 키우면 손실이 몇 배\"를 손으로 계산할 수 있다.\n3. 정해진 계산 예산을 모델 크기와 데이터에 어떻게 나눌지(Chinchilla의 답)를 계산할 수 있다.\n\n**복습 (1분):** log₁₀ 1000은? (답: 3. 10을 3번 곱하면 1000. [준비 4](#prep04))\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 세 개의 손잡이\n언어 모델을 더 좋게 만들 때 돌릴 수 있는 손잡이는 크게 세 개입니다.\n\n- **N**: 모델 크기 (파라미터, 곧 가중치의 개수)\n- **D**: 데이터 양 (학습에 쓴 토큰 수. 토큰은 글을 자른 조각으로, 대략 단어 하나쯤입니다)\n- **C**: 계산량 (학습에 쓴 컴퓨터의 일. 대략 N × D에 비례)\n\n2020년 OpenAI의 연구자들은 이 손잡이를 돌려 가며 손실([크로스엔트로피](#day07))을 쟀습니다. 결과는 놀랄 만큼 **규칙적**이었습니다.\n\n### 1-2. 거듭제곱 법칙\n$$\\text{손실} \\approx a \\times N^{-\\alpha}$$\n\na는 출발점의 손실을 정하는 수입니다. α(알파)는 작은 양수입니다. 지수 앞의 마이너스는 \"곱하지 말고 나눠라\"는 뜻입니다 (10⁻¹ = 1 ÷ 10처럼요). 그래서 N이 커질수록 손실은 작아집니다. 지수가 0.076 같은 소수여도 놀라지 마세요. 손으로 계산하지 않고 계산기가 준 값을 그대로 씁니다. 식이 낯설어도 괜찮습니다. 뜻은 한 문장입니다.\n\n> **N을 10배 키울 때마다 손실이 똑같은 비율로 줄어든다.**\n\n논문이 잰 α는 약 0.076이었습니다. $10^{-0.076} \\approx 0.84$이므로, 모델을 10배 키울 때마다 손실이 약 **0.84배**가 됩니다.\n\n| 모델 크기 | 1배 | 10배 | 100배 | 1000배 |\n|---|---|---|---|---|\n| 손실 (처음을 5라 하면) | 5 | 4.2 | 3.52 | 2.96 |\n\n로그 눈금은 1, 10, 100, 1000을 **같은 간격**으로 놓는 눈금입니다. 위 표를 보면 오른쪽으로 한 칸 갈 때마다 손실이 똑같이 0.84배가 됩니다. 한 칸 갈 때마다 같은 만큼 내려가는 것, 그것이 직선입니다. 그래서 가로축과 세로축을 모두 [로그](#prep04) 눈금으로 그리면 이 관계가 **직선**이 됩니다. 직선은 계속 그어 볼 수 있습니다. \"100배 더 키우면 어디쯤일지\"를 **미리 짐작**할 수 있다는 뜻입니다. 회사들이 큰돈을 들여 모델을 키울 수 있었던 근거입니다.\n\n논문의 다른 발견: 층을 깊게 하느냐 넓게 하느냐 같은 **모양은 별로 중요하지 않았습니다.** 중요한 것은 전체 크기였습니다.\n\n### 1-3. 좋은 소식과 나쁜 소식\n- 좋은 소식: 키우면 **계속** 좋아집니다. 벽이 보이지 않았습니다\n- 나쁜 소식: **10배**를 들여야 같은 비율만큼 좋아집니다. 5 → 4.2는 1배에서 10배로 가는 값이고, 4.2 → 3.52은 10배에서 100배로 가는 값입니다. 줄어드는 양은 작아지는데 값은 10배씩 비싸집니다\n\n계단을 한 칸 오를 때마다 계단 높이가 10배가 되는 탑과 같습니다.\n\n### 1-4. Chinchilla: 예산을 어떻게 나눌까\n계산 예산 C가 정해져 있다고 합시다. C는 대략 N × D에 비례하므로, **큰 모델에 적은 데이터**를 쓸 수도, **작은 모델에 많은 데이터**를 쓸 수도 있습니다.\n\n2022년 DeepMind의 답: **둘을 같은 비율로 키워라.** 모델을 2배로 하면 데이터도 2배로. 이 논문 전의 큰 모델들은 크기에 비해 데이터를 너무 적게 먹였다는 것입니다.\n\n| | 파라미터 N | 학습 토큰 D | D ÷ N |\n|---|---|---|---|\n| Gopher | 2800억 | 3000억 | 약 1 |\n| Chinchilla | 700억 | 1조 4000억 | **20** |\n\n계산량은 비슷한데, 4분의 1 크기인 Chinchilla가 Gopher를 이겼습니다. 여기서 나온 어림 규칙이 **\"파라미터 1개당 토큰 20개쯤\"**입니다.\n\n요리에 빗대면, 큰 냄비(모델)만 사고 재료(데이터)를 조금 넣으면 냄비가 아깝습니다. 냄비와 재료를 함께 늘려야 합니다.\n\n### 1-5. 조심할 점\n- 이것은 **관찰에서 나온 경험 법칙**입니다. 증명된 정리가 아니고, 잰 범위 밖에서도 맞는다는 보장은 없습니다 ([증명 읽고 쓰기](#pf01)의 \"백 번 맞았다 ≠ 언제나 맞다\")\n- 손실이 줄어든다고 우리가 원하는 능력이 똑같은 속도로 느는 것은 아닙니다\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n**거듭제곱 법칙.** 10배 키울 때마다 손실이 0.8배가 되는 모델이 있습니다 (계산하기 쉽게 0.84 대신 0.8). 지금 손실은 5.\n\n- 10배: 5 × 0.8 = **4**\n- 100배: 4 × 0.8 = **3.2**\n- 1000배: 3.2 × 0.8 = **2.56**\n\n손실 2.56에 닿으려면 모델을 1000배 키워야 합니다. 데이터까지 같은 비율로 늘리면 계산량은 1000 × 1000 = 100만 배가 됩니다.\n\n**2배 규칙.** 모델을 2배로 키우면 Chinchilla 규칙으로 데이터도 2배. 계산량 C는 N × D에 비례하므로, N이 2배이고 D가 2배이면 2 × 2 = **4배**가 듭니다. 가로와 세로를 모두 2배로 늘린 밭의 넓이가 4배인 것과 같습니다.\n\n**예산 나누기.** 예산이 N × D = 2000 (단위: 억 × 억)이고 D = 20 × N으로 맞추고 싶다면\n\n한 걸음씩 갑니다. 여기서 N과 D는 \"억\" 단위로 셉니다.\n\n- D 자리에 20 × N을 넣습니다: N × 20 × N = 2000\n- 양쪽을 20으로 나눕니다: N × N = 100\n- 같은 수를 두 번 곱해 100이 되는 수는 10입니다: **N = 10억**\n- D = 20 × 10 = **200억** 토큰\n\n---\n\n## 3. 능동 연습 (10분)\n\n### 손계산\n1. 10배 키울 때마다 손실이 0.8배가 되는 모델의 손실이 지금 10입니다. 100배 키우면?\n2. 같은 모델에서 손실을 10에서 5.12로 줄이려면 몇 배 키워야 하나요? (0.8³ = 0.512)\n3. 파라미터가 100억 개인 모델에 Chinchilla 어림 규칙으로 필요한 학습 토큰 수는?\n4. 모델을 3배 키우고 데이터도 3배로 늘리면 계산량은 몇 배?\n5. Gopher의 D ÷ N은 약 1, Chinchilla는 20입니다. 어느 쪽이 \"냄비에 비해 재료가 적은\" 모델인가요?\n6. 예산 N × D = 500이고 D = 20N으로 맞추면 N과 D는? (N과 D는 억 단위. 힌트: 같은 수를 두 번 곱해 25가 되는 수는?)\n\n### 미니 챌린지\n\"모델을 10배 키우면 손실이 0.84배\"는 얼핏 별것 아닌 것처럼 보입니다. 그런데도 회사들이 이 법칙을 보고 큰돈을 쓴 이유는 무엇일까요? \"직선\"과 \"미리 짐작\"이라는 낱말을 써서 설명해 보세요.\n\n### 코드 (선택)\n```python\nimport numpy as np\nN = np.array([1, 10, 100, 1000])\nloss = 5 * N ** (-0.076)\nprint(loss.round(2))                          # [5.   4.2  3.52 2.96]\nprint(np.diff(np.log10(loss)).round(3))       # [-0.076 -0.076 -0.076]  로그 눈금에서는 같은 간격 = 직선\n\nn, d = 2800e8, 3000e8                         # Gopher\nn2, d2 = 700e8, 1.4e12                        # Chinchilla\nprint(round(d / n, 2), d2 / n2)               # 1.07 20.0\nprint(n * d, n2 * d2)                         # 8.4e+22 9.8e+22  계산량은 비슷\n```\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n1. 스케일링 법칙에서 손실을 줄이는 세 가지 손잡이는?\n2. 거듭제곱 법칙을 한 문장으로 말하면?\n3. O/X: Chinchilla 논문은 \"데이터는 그대로 두고 모델만 키우는 것이 가장 좋다\"고 했다.\n4. 스케일링 법칙이 \"정리\"가 아니라 \"경험 법칙\"이라는 말의 뜻은?\n\n---\n\n## 한 줄 정리\n모델 크기, 데이터, 계산량을 10배 키울 때마다 손실은 일정한 비율로 줄어든다. 정해진 예산에서는 모델과 데이터를 같은 비율로 키우는 것이 좋다.\n\n---\n\n<details>\n<summary>정답 보기 (먼저 풀고 열기!)<\/summary>\n\n**손계산**\n1. 10 × 0.8 × 0.8 = **6.4**\n2. 0.8을 세 번 곱해야 하므로 10배를 세 번, **1000배**\n3. 100억 × 20 = **2000억 토큰**\n4. 3 × 3 = **9배**\n5. **Gopher**. 크기에 비해 데이터를 적게 먹였습니다.\n6. 20N² = 500 → N² = 25 → **N = 5억, D = 100억**\n\n**미니 챌린지**\n로그 눈금에서 직선이라는 것은, 지금까지의 점들을 이어 그은 선을 더 길게 그으면 아직 만들지 않은 큰 모델의 성능을 **미리 짐작**할 수 있다는 뜻입니다. 큰돈을 쓰기 전에 \"이만큼 쓰면 이만큼 좋아진다\"를 알 수 있으니 투자를 결정할 수 있습니다. 그리고 0.84배가 여러 번 쌓이면 큰 차이가 됩니다.\n\n**퀴즈**\n1. 모델 크기(파라미터 수), 데이터 양, 계산량\n2. 크기를 10배 키울 때마다 손실이 같은 비율로 줄어든다.\n3. X. 모델과 데이터를 **같은 비율로** 키우라고 했습니다.\n4. 실험으로 관찰한 규칙이라, 잰 범위 밖에서도 맞는다고 증명된 것은 아니라는 뜻입니다.\n<\/details>\n", "link": "논문 연결: Kaplan 외 (2020) , Hoffmann 외 (2022) (Chinchilla). 요즘 모델이 왜 이렇게 커졌는지 설명", "lesson": true}, {"id": "day01", "short": "논문 지도 그리기 + 벡터와 내적", "md": "# Day 01. 논문 지도 그리기 + 벡터와 내적\n\n30분 · 논문 연결: **2장 The model** (단어를 벡터로 바꾸는 부분), 초록(Abstract)\n\n---\n\n## 오늘의 목표\n1. 이 논문이 \"무엇을 입력받아 무엇을 출력하는지\" 그림 한 장으로 그릴 수 있다.\n2. 벡터를 \"숫자들의 목록\"이자 \"공간 속의 화살표\"로 이해한다.\n3. 내적(dot product)을 손으로 계산하고, 그것이 **두 벡터가 얼마나 비슷한지**를 나타낸다는 걸 설명할 수 있다.\n\n---\n\n## 1. 논문 지도 (5분)\n\n논문의 아이디어를 한 장 그림으로 먼저 봅니다. **노트에 그대로 따라 그리세요.**\n\n<div class=\"widget\" data-w=\"papermap\"><\/div>\n\n- **인코더**: 입력 문장을 한 단어씩 읽어서, 마지막에 문장 전체의 의미를 담은 벡터 `v` 하나를 만든다.\n- **디코더**: `v`에서 출발해 출력 문장을 한 단어씩 만든다. 방금 만든 단어를 다음 칸의 입력으로 다시 넣는다.\n\n여기서 질문: 컴퓨터는 \"cat\"이라는 글자를 어떻게 계산에 넣을까요? → **벡터로 바꿉니다.** 그게 오늘의 주제입니다.\n\n---\n\n## 2. 개념: 벡터 (8분)\n\n### 2-1. 벡터는 숫자 목록이다\n```\nv = [2, 1]          ← 2차원 벡터\nw = [0.3, -1.2, 0.8, ...] (1000개)  ← 논문의 단어 벡터는 1000차원\n```\n\n### 2-2. 벡터는 화살표이기도 하다\n2차원 벡터 `[2, 1]`은 원점에서 오른쪽으로 2, 위로 1 가는 화살표입니다.\n**중요한 직관:** 화살표의 *방향*이 비슷하면 비슷한 것.\n\n### 2-3. 단어 임베딩 (word embedding)\n단어마다 벡터 하나를 정해 두는 것을 **임베딩**이라고 합니다. 잘 학습되면 의미가 비슷한 단어는 비슷한 방향을 가리킵니다.\n\n```\n\"고양이\" → [0.9, 0.8]\n\"강아지\" → [0.8, 0.9]\n\"자동차\" → [-0.7, 0.2]\n```\n고양이와 강아지는 거의 같은 방향, 자동차는 딴 방향입니다.\n\n### 2-4. 내적: \"얼마나 같은 방향인가\"\n두 벡터의 같은 자리 숫자끼리 곱해서 모두 더합니다.\n\n$$\\mathbf{a}\\cdot\\mathbf{b} = a_1b_1 + a_2b_2 + \\dots + a_nb_n$$\n\n- 같은 방향 → 큰 양수\n- 직각 → 0\n- 반대 방향 → 음수\n\n길이의 영향을 없애면 **코사인 유사도**가 됩니다. cos와 θ(세타, 두 화살표 사이의 각도)는 삼각함수 기호지만, 오늘은 **\"−1(정반대)부터 1(같은 방향) 사이의 닮음 점수\"라는 이름표**로만 읽으면 충분합니다. 직각이면 0입니다. 예: [1, 0]과 [0, 1]은 오른쪽과 위쪽을 가리키는 직각 화살표이고, 내적은 1×0 + 0×1 = 0입니다.\n\n$$\\cos\\theta = \\frac{\\mathbf{a}\\cdot\\mathbf{b}}{\\|\\mathbf{a}\\|\\,\\|\\mathbf{b}\\|},\\qquad \\|\\mathbf{a}\\| = \\sqrt{a_1^2 + \\dots + a_n^2}$$\n\n값은 −1(정반대) ~ 1(같은 방향) 사이입니다.\n\n> **왜 중요한가:** 신경망 안의 거의 모든 계산은 \"입력 벡터와 가중치 벡터의 내적\"입니다. 내적은 \"이 입력이 내가 찾는 패턴과 얼마나 닮았나?\"를 묻는 질문이에요.\n\n---\n\n## 3. 예제 따라하기 (6분)\n\n`a = [0.9, 0.8]` (고양이), `b = [0.8, 0.9]` (강아지), `c = [-0.7, 0.2]` (자동차)\n\n**① a·b** = 0.9×0.8 + 0.8×0.9 = 0.72 + 0.72 = **1.44**\n\n**② a·c** = 0.9×(−0.7) + 0.8×0.2 = −0.63 + 0.16 = **−0.47**\n\n**③ 코사인 유사도 cos(a, b)**\n- ‖a‖ = √(0.81 + 0.64) = √1.45 ≈ 1.204\n- ‖b‖ = √(0.64 + 0.81) = √1.45 ≈ 1.204\n- cos = 1.44 / (1.204 × 1.204) = 1.44 / 1.45 ≈ **0.993** → 거의 같은 방향!\n\n---\n\n## 직접 만져보기\n\n<div class=\"widget\" data-w=\"dot\"><\/div>\n\n## 4. 능동 연습 (10분)\n\n### 손계산\n1. `p = [1, 2, 3]`, `q = [4, -5, 6]`일 때 `p·q`를 구하세요.\n2. `[3, 4]`의 길이(노름)는?\n3. `[1, 0]`과 `[0, 1]`의 내적은? 이 결과가 그림에서 의미하는 것은?\n4. `[1, 2]`와 같은 방향이면서 길이가 정확히 1인 벡터를 구하세요. (힌트: 길이로 나누기)\n\n### 코드 (직접 타이핑하고 실행)\n```python\nimport numpy as np\n\nwords = {\n    \"고양이\": np.array([0.9, 0.8]),\n    \"강아지\": np.array([0.8, 0.9]),\n    \"자동차\": np.array([-0.7, 0.2]),\n}\n\ndef cosine(a, b):\n    return a @ b / (np.linalg.norm(a) * np.linalg.norm(b))   # @ 는 내적\n\nfor w1 in words:\n    for w2 in words:\n        if w1 < w2:\n            print(f\"{w1} vs {w2}: {cosine(words[w1], words[w2]):.3f}\")\n```\n\n**도전 과제 (선택: 시간이 남을 때만)**\n- (a) `\"트럭\"` 벡터를 직접 만들어 넣으세요. 자동차와는 코사인 0.9 이상, 고양이와는 0 이하가 되도록 숫자를 골라 보세요.\n- (b) `words[\"고양이\"] * 10`처럼 벡터 길이만 키우면 코사인 유사도는 변할까요? 먼저 예측하고 실행해서 확인하세요.\n\n---\n\n## 5. 셀프 체크 퀴즈 (4분)\n\n1. 논문에서 입력 문장 전체의 의미를 담는 벡터는 무엇이 만드나요? (인코더 / 디코더)\n2. 두 벡터의 내적이 0이라는 것은 기하학적으로 무엇을 뜻하나요?\n3. 내적과 코사인 유사도의 차이는 무엇인가요?\n4. O/X: 벡터에 양수를 곱해 길이를 바꿔도 방향은 그대로다.\n5. 논문의 단어 벡터는 몇 차원인가요? (논문 3.4절에서 확인)\n\n---\n\n## 한 줄 정리 (학습노트에)\n> \"단어는 1000차원 벡터가 되고, 신경망은 그 벡터들의 내적으로 '닮음'을 잰다.\"\n\n---\n\n<details>\n<summary>정답 보기 (먼저 풀고 열기!)<\/summary>\n\n**손계산**\n1. 1×4 + 2×(−5) + 3×6 = 4 − 10 + 18 = **12**\n2. √(9+16) = **5**\n3. **0**. 두 화살표가 직각 → 서로 아무 관련이 없는 방향.\n4. 길이 √5 ≈ 2.236 → **[1/√5, 2/√5] ≈ [0.447, 0.894]**\n\n**코드 도전**\n- (a) 예: `\"트럭\": np.array([-0.8, 0.1])` → 자동차와 약 0.99, 고양이와 음수.\n- (b) **변하지 않습니다.** 코사인은 길이로 나누기 때문에 방향만 봅니다. (내적 값 자체는 10배가 됩니다.)\n\n**퀴즈**\n1. 인코더\n2. 두 벡터가 직각(서로 무관한 방향)\n3. 내적은 길이의 영향을 받고, 코사인 유사도는 길이로 나눠서 방향만 비교한다.\n4. O\n5. 1000차원 (\"1000 dimensional word embeddings\")\n<\/details>\n", "link": "논문 연결: 2장 The model (단어를 벡터로 바꾸는 부분), 초록(Abstract)", "lesson": true}, {"id": "day02", "short": "행렬곱은 신경망의 \"층\"이다", "md": "# Day 02. 행렬곱은 신경망의 \"층\"이다\n\n30분 · 논문 연결: **2장** LSTM 수식 안의 `W·x`, **3.4절** 층마다 셀 1000개, 1000차원 단어 임베딩, 입력 어휘 160,000단어\n\n---\n\n## 오늘의 목표\n1. 행렬 × 벡터를 \"내적 여러 개를 한꺼번에 하는 것\"으로 이해한다.\n2. `y = Wx + b`의 각 기호가 무엇이고 shape(크기)가 어떻게 맞물리는지 설명할 수 있다.\n3. 단어 임베딩 조회가 사실은 \"원-핫 벡터 × 행렬\"이라는 걸 확인한다.\n\n**복습 (1분):** 어제 배운 내적 `[1,2]·[3,4]` = ? (답: 11)\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 행렬 = 벡터를 여러 줄 쌓은 것\n```\nW = [[1, 0, 2],     ← 1행: 패턴 탐지기 1\n     [0, 3, 1]]     ← 2행: 패턴 탐지기 2\n```\n이 행렬의 shape은 **(2, 3)** = 2행 3열.\n\n### 1-2. 행렬 × 벡터 = 행마다 내적\n`x = [1, 2, 3]`일 때\n```\nWx = [ 1·1 + 0·2 + 2·3 ,     = [7,\n       0·1 + 3·2 + 1·3 ]        9]\n```\n**직관:** W의 각 행은 \"나는 이런 패턴을 찾는다\"는 탐지기입니다. 입력 x와 각 탐지기의 내적(닮음 정도)을 계산해 결과 벡터에 줄줄이 적습니다.\n\n### 1-3. shape 규칙 (가장 중요!)\n```\n W   ×   x   =   y\n(m,n)  (n,)    (m,)\n   └─ 같아야 함 ─┘\n```\n- 안쪽 숫자(n)가 같아야 곱할 수 있다.\n- 결과는 바깥 숫자(m) 크기가 된다.\n- 즉 **행렬은 n차원 벡터를 m차원 벡터로 바꾸는 기계**.\n\n### 1-4. 신경망의 한 층\n$$\\mathbf{y} = f(W\\mathbf{x} + \\mathbf{b})$$\n- `W`: 가중치 행렬 (학습되는 값)\n- `b`: 편향 벡터 (학습되는 값, 결과를 살짝 밀어줌)\n- `f`: 비선형 함수, 즉 직선이 아닌 휘어진 함수 (예: tanh, sigmoid. 모양과 값표는 [준비 6. 함수와 그래프](#prep06)). 이게 없으면 층을 아무리 쌓아도 행렬 하나와 같아집니다.\n\n파라미터 개수 = `m×n` (W) + `m` (b)\n\n### 1-5. 임베딩 조회 = 원-핫 × 행렬\n어휘가 `[나, 너, 밥]` 3개, 임베딩이 2차원이라면 임베딩 행렬 E는 (2, 3):\n```\nE = [[0.1, 0.5, -0.3],\n     [0.7, -0.2, 0.4]]\n       나    너    밥\n```\n\"너\"는 원-핫 벡터 `[0, 1, 0]`. 그러면 `E @ [0,1,0]` = E의 2번째 **열** = `[0.5, -0.2]`.\n→ 실제로는 곱셈 대신 그 열을 \"꺼내기\"만 합니다. 그래서 160,000단어 어휘도 빠르게 처리할 수 있어요.\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n**문제:** 입력 3차원, 출력 2차원인 층. `W = [[1, -1, 0], [2, 0, 1]]`, `b = [0.5, -1]`, `x = [3, 1, 2]`. `f = ReLU` (음수면 0, 양수면 그대로).\n\n1. `Wx` = [1·3 + (−1)·1 + 0·2, 2·3 + 0·1 + 1·2] = [2, 8]\n2. `Wx + b` = [2.5, 7]\n3. `ReLU` → **[2.5, 7]** (둘 다 양수라 그대로)\n4. 파라미터 수 = 2×3 + 2 = **8개**\n\n---\n\n## 직접 만져보기\n\n<div class=\"widget\" data-w=\"matvec\"><\/div>\n\n## 3. 능동 연습 (10분)\n\n### 손계산\n1. `A = [[2, 1], [0, -1], [1, 1]]`, `x = [3, 4]`일 때 `Ax`를 구하세요. 결과 shape은?\n2. (5, 7) 행렬 × (7,) 벡터의 결과 shape은? (5, 7) × (5,)는 가능한가요?\n3. 논문 규모 계산: 입력 어휘 160,000개, 임베딩 1000차원. 입력 임베딩 행렬의 파라미터는 몇 개? (단위: 백만)\n4. 1000차원 입력을 받아 1000차원을 내는 층 하나(W와 b)의 파라미터 수는?\n\n### 코드\n```python\nimport numpy as np\n\nW = np.array([[1, -1, 0],\n              [2,  0, 1]])\nb = np.array([0.5, -1])\nx = np.array([3, 1, 2])\n\ndef relu(z):\n    return np.maximum(0, z)\n\ny = relu(W @ x + b)\nprint(\"W shape:\", W.shape, \" x shape:\", x.shape, \" y:\", y, \" y shape:\", y.shape)\n\n# 임베딩 조회 = 원-핫 곱셈\nE = np.array([[0.1, 0.5, -0.3],\n              [0.7, -0.2, 0.4]])\nvocab = [\"나\", \"너\", \"밥\"]\nonehot = np.zeros(3); onehot[vocab.index(\"너\")] = 1\nprint(\"원-핫 곱:\", E @ onehot, \"  열 꺼내기:\", E[:, 1])\n```\n\n**도전 과제 (선택: 시간이 남을 때만)**\n- (a) `x`를 `np.array([3, 1])`로 바꾸면 어떤 에러가 나나요? 에러 메시지에서 shape 숫자를 찾아 읽어 보세요.\n- (b) 2층 신경망 만들기: `W2` (shape (1, 2))를 직접 정해서 `relu(W2 @ y)`를 계산하세요. 전체 흐름의 shape을 `(3,) → (2,) → (1,)`로 적어 보세요.\n- (c) (행렬끼리 곱하기가 처음이면 건너뛰어도 됩니다) 비선형 함수 없이 두 층을 쌓으면 `W2 @ (W @ x)` = `(W2 @ W) @ x`임을 코드로 확인하세요. 왜 비선형 함수가 꼭 필요한지 한 문장으로 적어 보세요.\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n\n1. (m, n) 행렬은 몇 차원 벡터를 몇 차원 벡터로 바꾸나요?\n2. 행렬 × 벡터의 결과 한 칸은 무엇과 무엇의 내적인가요?\n3. 임베딩 조회가 원-핫 벡터 곱셈과 같은 이유는?\n4. 비선형 함수 f가 없으면 어떤 문제가 생기나요?\n5. 논문에서 LSTM은 몇 층이고, 층마다 셀이 몇 개인가요? (3.4절)\n\n---\n\n## 한 줄 정리\n> \"LSTM의 핵심 계산은 `Wx + b`이고, shape만 맞춰 읽으면 논문의 수식이 두렵지 않다.\"\n\n---\n\n<details>\n<summary>정답 보기<\/summary>\n\n**손계산**\n1. [2·3+1·4, 0·3+(−1)·4, 1·3+1·4] = **[10, −4, 7]**, shape (3,)\n2. **(5,)**. (5,7)×(5,)는 **불가능** (안쪽 숫자 7 ≠ 5)\n3. 160,000 × 1000 = **1억 6천만 개 (160M)**. 모델 전체 파라미터(논문: 384M)의 상당 부분이 임베딩입니다.\n4. 1000×1000 + 1000 = **1,001,000개**\n\n**코드 도전**\n- (a) `ValueError: matmul: Input operand 1 has a mismatch in its core dimension 0 ... (size 2 is different from 3)` 같은 메시지. 안쪽 숫자가 맞지 않는다는 뜻.\n- (b) 예: `W2 = np.array([[1, -0.5]])` → `relu(2.5 − 3.5) = relu(−1) = [0]`\n- (c) 선형 층을 몇 개 쌓아도 행렬 하나(W2@W)로 합쳐지므로, 비선형 함수가 없으면 깊게 쌓는 의미가 사라진다.\n\n**퀴즈**\n1. n차원 → m차원\n2. W의 해당 행과 입력 벡터 x\n3. 원-핫 벡터는 한 자리만 1이라, 곱하면 그 자리에 해당하는 열만 남는다.\n4. 여러 층이 결국 하나의 선형 변환으로 합쳐져서 복잡한 패턴을 배울 수 없다.\n5. 4층, 층마다 1000개 셀\n<\/details>\n", "link": "논문 연결: 2장 LSTM 수식 안의 `W·x`, 3.4절 층마다 셀 1000개, 1000차원 단어 임베딩, 입력 어휘 160,000단어", "lesson": true}, {"id": "day03", "short": "확률, 조건부확률, 그리고 연쇄법칙", "md": "# Day 03. 확률, 조건부확률, 그리고 연쇄법칙\n\n30분 · 논문 연결: **2장 식 (1)** — 논문 전체에서 가장 중요한 수식\n\n---\n\n## 오늘의 목표\n1. 결합확률 P(A, B)와 조건부확률 P(B | A)의 차이를 말로 설명할 수 있다.\n2. 연쇄법칙(chain rule)으로 \"문장의 확률\"을 \"단어별 확률의 곱\"으로 쪼갤 수 있다.\n3. 논문의 식 (1)을 읽고 각 기호의 뜻을 말할 수 있다.\n\n**복습 (1분):** (4, 1000) 행렬 × (1000,) 벡터의 결과 shape은? (답: (4,))\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 확률의 기본\n- P(A): 사건 A가 일어날 확률, 0 ~ 1 사이\n- 가능한 모든 경우의 확률을 더하면 1\n\n### 1-2. 결합확률 vs 조건부확률\n반 학생 100명을 조사했습니다.\n\n|  | 안경 O | 안경 X | 합계 |\n|---|---|---|---|\n| 코딩 좋아함 | 30 | 10 | 40 |\n| 코딩 안 좋아함 | 20 | 40 | 60 |\n| 합계 | 50 | 50 | 100 |\n\n- **결합확률** P(코딩, 안경) = 30/100 = 0.3 → \"전체 중에서 둘 다인 사람\"\n- **조건부확률** P(안경 | 코딩) = 30/40 = 0.75 → \"코딩 좋아하는 사람 *중에서* 안경 쓴 사람\"\n- 전체 비율로 바꿔도 같습니다: (30/100) ÷ (40/100) = 30/40. 같은 분모끼리 나누면 분자끼리의 나눗셈만 남아요 ([준비 1](#prep01)). 아래 공식은 이 한 줄을 기호로 쓴 것입니다.\n\n`|` 기호는 \"~가 주어졌을 때\", \"~라는 걸 이미 알 때\"라고 읽습니다. **분모(관심 범위)가 좁아지는 것**이 핵심 직관입니다.\n\n$$P(B\\mid A) = \\frac{P(A, B)}{P(A)}$$\n\n### 1-3. 곱셈 규칙과 연쇄법칙\n위 식을 뒤집으면: $P(A, B) = P(A)\\,P(B\\mid A)$\n\n사건이 3개, 4개로 늘어나도 계속 쪼갤 수 있습니다:\n$$P(A, B, C) = P(A)\\,P(B\\mid A)\\,P(C\\mid A, B)$$\n\n이것이 **연쇄법칙**입니다. 근사가 아니라 **항상 정확히 성립하는 등식**이에요.\n\n### 1-4. 문장에 적용하기\n\"나는 밥을 먹었다\"의 확률:\n$$P(\\text{나는, 밥을, 먹었다}) = P(\\text{나는})\\cdot P(\\text{밥을}\\mid\\text{나는})\\cdot P(\\text{먹었다}\\mid\\text{나는, 밥을})$$\n\n→ \"다음 단어 맞히기\"를 반복하면 문장 전체의 확률이 나옵니다. **오늘날의 LLM도 정확히 이 구조**입니다.\n\n### 1-5. 논문의 식 (1)\n$$p(y_1,\\dots,y_{T'}\\mid x_1,\\dots,x_T) = \\prod_{t=1}^{T'} p(y_t\\mid v, y_1,\\dots,y_{t-1})$$\n\n| 기호 | 뜻 |\n|---|---|\n| $x_1..x_T$ | 입력 문장 (영어) 단어들, 길이 T |\n| $y_1..y_{T'}$ | 출력 문장 (프랑스어) 단어들, 길이 T' (\"T 프라임\", T와 다른 길이라는 표시. 달라도 됨!) |\n| $v$ | 인코더가 입력 문장을 압축한 벡터 |\n| $\\prod$ | 전부 곱하라 ([준비 5. Σ와 ∏ 읽기](#prep05)) |\n| $p(y_t\\mid v, y_1..y_{t-1})$ | 입력 의미 v와 지금까지 쓴 단어들이 주어졌을 때, t번째 단어의 확률 |\n\n말로 읽으면: **\"번역문 전체의 확률 = 각 단어를, (원문 의미 + 앞에 쓴 단어들)을 보고 맞힐 확률들의 곱.\"**\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n입력: \"I am hungry\" → 출력 후보: \"배 고파 <EOS>\"\n\n모델이 이렇게 예측했다고 합시다.\n- p(배 | v) = 0.6\n- p(고파 | v, 배) = 0.9\n- p(<EOS> | v, 배, 고파) = 0.8\n\n**문장 확률** = 0.6 × 0.9 × 0.8 = **0.432**\n\n`<EOS>`(End Of Sentence)도 하나의 \"단어\"로 예측합니다. 그래야 모델이 **언제 멈출지**도 배울 수 있어요. 논문 2장에도 \"각 문장 끝에 <EOS>를 붙인다\"고 나옵니다.\n\n---\n\n## 직접 만져보기\n\n<div class=\"widget\" data-w=\"condprob\"><\/div>\n\n## 3. 능동 연습 (10분)\n\n### 손계산\n1. 위 표에서 P(코딩 | 안경)을 구하세요. P(안경 | 코딩)과 같나요?\n2. P(A) = 0.5, P(B | A) = 0.4일 때 P(A, B)는?\n3. 출력 \"Je t'aime beaucoup <EOS>\"(4토큰)에 대해 모델이 각 단계에서 정답 단어에 0.5, 0.7, 0.9, 0.95를 주었습니다. 문장 확률은?\n4. 확률을 곱하면 문장이 길어질수록 값이 어떻게 되나요? 단어 50개, 각 0.5면? (계산기 사용) 이것이 왜 컴퓨터에 문제가 될까요?\n\n### 코드: 표에서 확률 계산 + 연쇄법칙 확인\n```python\nimport numpy as np\n\n# 행: 코딩(좋아함, 안좋아함) / 열: 안경(O, X)\ncounts = np.array([[30, 10],\n                   [20, 40]])\nP = counts / counts.sum()          # 결합확률표\nP_coding = P.sum(axis=1)           # 행 합 = P(코딩)\nP_glasses = P.sum(axis=0)          # 열 합 = P(안경)\n\np_glasses_given_coding = P[0, 0] / P_coding[0]\nprint(\"P(안경|코딩) =\", p_glasses_given_coding)\n\n# 곱셈 규칙 확인: P(코딩, 안경) == P(코딩) * P(안경|코딩)\nprint(P[0, 0], \"==\", P_coding[0] * p_glasses_given_coding)\n\n# 문장 확률\nstep_probs = [0.6, 0.9, 0.8]\nprint(\"문장 확률:\", np.prod(step_probs))\n```\n\n**도전 과제 (선택: 시간이 남을 때만)**\n- (a) `P(코딩 | 안경)`을 계산하는 줄을 직접 추가하세요.\n- (b) `step_probs = [0.5] * 50`으로 바꿔 `np.prod`를 출력해 보세요. 그리고 `[0.5] * 2000`으로도 해 보세요. 무슨 일이 생기나요? (→ Day 05의 \"로그\"가 이걸 해결합니다.)\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n\n1. P(B | A)에서 `|` 뒤에 오는 A는 어떤 역할인가요?\n2. O/X: 연쇄법칙은 근사식이다.\n3. 식 (1)에서 T와 T'가 다를 수 있다는 것이 번역에서 왜 중요한가요?\n4. 논문이 문장 끝에 `<EOS>`를 붙이는 이유는?\n5. 식 (1)에서 t번째 단어를 예측할 때 모델이 참고하는 두 가지 정보는?\n\n---\n\n## 한 줄 정리\n> \"문장의 확률은 '다음 단어 확률'의 곱이다 — 식 (1)은 연쇄법칙을 번역에 적용한 것뿐이다.\"\n\n---\n\n<details>\n<summary>정답 보기<\/summary>\n\n**손계산**\n1. 30/50 = **0.6**. P(안경|코딩)=0.75와 **다릅니다.** 조건과 대상을 바꾸면 값이 달라집니다. (내일 베이즈 정리의 출발점!)\n2. 0.5 × 0.4 = **0.2**\n3. 0.5 × 0.7 × 0.9 × 0.95 ≈ **0.299**\n4. 0.5⁵⁰ ≈ 8.9 × 10⁻¹⁶. 점점 0에 가까워집니다. 매우 길면 컴퓨터가 표현할 수 있는 가장 작은 수보다 작아져 **0으로 뭉개집니다(underflow)**.\n\n**코드 도전**\n- (a) `P[0, 0] / P_glasses[0]` → 0.6\n- (b) 50개: 약 8.88e-16. 2000개: **0.0** (underflow)\n\n**퀴즈**\n1. \"이미 알고 있는 정보\", 즉 관심 범위를 A인 경우로 좁히는 조건.\n2. X (항상 정확히 성립)\n3. 언어마다 같은 뜻을 표현하는 단어 수가 다르기 때문. 입력·출력 길이를 따로 둘 수 있는 게 이 논문의 핵심 장점.\n4. 모델이 문장을 언제 끝낼지도 확률로 예측하도록 하기 위해. 덕분에 다양한 길이의 출력이 가능.\n5. 입력 문장의 요약 벡터 v, 그리고 지금까지 생성한 단어들 $y_1..y_{t-1}$\n<\/details>\n", "link": "논문 연결: 2장 식 (1) — 논문 전체에서 가장 중요한 수식", "lesson": true}, {"id": "day04", "short": "베이즈 정리: 조건을 뒤집는 법", "md": "# Day 04. 베이즈 정리: 조건을 뒤집는 법\n\n30분 · 논문 연결: **3.2절** 번역 결과 고르기 $\\hat T = \\arg\\max_T p(T\\mid S)$, **1장** 기존 통계 번역(SMT)과의 비교\n\n---\n\n## 오늘의 목표\n1. 베이즈 정리를 유도하고, 사전확률·가능도·사후확률이라는 이름을 붙일 수 있다.\n2. \"검사 양성인데 실제로 병일 확률\" 같은 직관에 반하는 문제를 풀 수 있다.\n3. argmax를 할 때 분모 P(B)를 무시해도 되는 이유를 설명할 수 있다.\n4. 옛날 번역기(SMT)와 이 논문이 확률을 다루는 방식의 차이를 한 문장으로 말할 수 있다.\n\n**복습 (1분):** 어제 표에서 P(안경|코딩)=0.75, P(코딩|안경)=0.6이었죠. 왜 다를까요? 오늘 그 둘을 잇는 다리를 놓습니다.\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 유도 (외우지 말고 만들어 내기)\n곱셈 규칙은 두 방향으로 쓸 수 있습니다.\n$$P(A, B) = P(A)\\,P(B\\mid A) = P(B)\\,P(A\\mid B)$$\n오른쪽 두 개가 같으니 P(B)로 나누면:\n\n$$\\boxed{P(A\\mid B) = \\frac{P(B\\mid A)\\,P(A)}{P(B)}}$$\n\n### 1-2. 이름 붙이기\n\"A = 가설(원인), B = 관찰한 증거\"라고 생각하세요.\n\n| 항 | 이름 | 뜻 |\n|---|---|---|\n| P(A) | **사전확률 (prior)** | 증거를 보기 *전* 가설에 대한 믿음 |\n| P(B \\| A) | **가능도 (likelihood)** | 가설이 맞다면 이 증거가 나올 확률 |\n| P(A \\| B) | **사후확률 (posterior)** | 증거를 본 *후* 업데이트된 믿음 |\n| P(B) | **증거 (evidence)** | 증거 자체가 나올 전체 확률 (정규화 상수) |\n\n한 줄로: **사후 ∝ 가능도 × 사전** (∝는 \"비례한다\")\n\n### 1-3. P(B) 구하기: 전체 확률의 법칙\n$$P(B) = P(B\\mid A)P(A) + P(B\\mid \\text{not }A)P(\\text{not }A)$$\n\"B가 일어나는 모든 경로를 더한다.\"\n\n### 1-4. argmax에서는 분모가 필요 없다\n여러 가설 A₁, A₂, ... 중 가장 그럴듯한 것을 고를 때, 분모 P(B)는 모두에게 똑같습니다. 그래서\n$$\\arg\\max_A P(A\\mid B) = \\arg\\max_A P(B\\mid A)\\,P(A)$$\n`argmax`는 \"값이 가장 큰 *것*(값 자체가 아니라 그 후보)\"을 돌려준다는 뜻입니다.\n\n### 1-5. 번역 이야기: 옛날 방식 vs 이 논문 (선택)\n- **옛날 통계 번역(SMT):** 영어 S를 프랑스어 T로 바꿀 때 베이즈 정리로 뒤집어서\n  $\\arg\\max_T P(T\\mid S) = \\arg\\max_T P(S\\mid T)\\cdot P(T)$\n  \"번역 모델 P(S|T)\"와 \"프랑스어다움을 재는 언어 모델 P(T)\"를 따로 만들어 곱했습니다.\n- **Seq2Seq (이 논문):** 뒤집지 않고 **P(T | S)를 신경망 하나로 직접** 학습합니다 (식 (1)). 그리고 3.2절에서 그대로 $\\hat T = \\arg\\max_T p(T\\mid S)$를 찾습니다.\n\n베이즈 정리를 알면 \"왜 이 논문이 새로웠는지\"가 보입니다.\n\n---\n\n## 2. 예제 따라하기 (6분): 검사의 함정\n\n- 어떤 병의 유병률: 1% → P(병) = 0.01\n- 병이 있으면 양성 나올 확률: 90% → P(양성 | 병) = 0.9\n- 병이 없어도 양성 나올 확률: 5% → P(양성 | 건강) = 0.05\n\n**질문:** 양성이 나왔을 때 실제로 병일 확률은? (먼저 감으로 답을 적어 보세요!)\n\n1. P(양성) = 0.9×0.01 + 0.05×0.99 = 0.009 + 0.0495 = 0.0585\n2. P(병 | 양성) = 0.009 / 0.0585 ≈ **0.154 (약 15%)**\n\n90%짜리 검사인데 15%밖에 안 됩니다! 이유: 사전확률(1%)이 너무 작아서, 건강한 99%에서 나오는 오탐이 진짜 양성보다 훨씬 많기 때문.\n\n**그림으로 확인 (10,000명):** 병 100명 중 양성 90명 / 건강 9,900명 중 양성 495명 → 양성 585명 중 진짜 병은 90명 = 15.4%.\n\n---\n\n## 직접 만져보기\n\n<div class=\"widget\" data-w=\"bayes\"><\/div>\n\n## 3. 능동 연습 (10분)\n\n### 손계산\n1. 위 문제에서 유병률을 10%로 바꾸면 P(병 | 양성)은?\n2. 같은 사람이 **두 번째 검사도 양성**이 나왔습니다 (병이 있는지 없는지가 정해지면 두 검사 결과는 서로 독립이라고 가정합니다. 이것을 조건부 독립이라고 부릅니다). 첫 검사 후 사후확률 0.154를 새 사전확률로 삼아 다시 계산하세요.\n3. 번역 후보가 두 개 있습니다. 어느 쪽을 고르나요? (P(S)는 모름)\n   - T₁: P(S|T₁) = 0.02, P(T₁) = 0.3\n   - T₂: P(S|T₂) = 0.05, P(T₂) = 0.1\n\n### 코드: 시뮬레이션으로 베이즈 정리 검증\n```python\nimport numpy as np\nrng = np.random.default_rng(0)\n\nN = 1_000_000\nsick = rng.random(N) < 0.01                       # 1%가 병\npos = np.where(sick,\n               rng.random(N) < 0.90,              # 병이면 90% 양성\n               rng.random(N) < 0.05)              # 건강하면 5% 양성\n\nprint(\"시뮬레이션 P(병|양성):\", sick[pos].mean())\n\ndef bayes(prior, p_pos_given_sick, p_pos_given_healthy):\n    evidence = p_pos_given_sick * prior + p_pos_given_healthy * (1 - prior)\n    return p_pos_given_sick * prior / evidence\n\nprint(\"공식 P(병|양성):    \", bayes(0.01, 0.9, 0.05))\n```\n\n**도전 과제 (선택: 시간이 남을 때만)**\n- (a) 검사를 연속 3번 양성 받을 때 사후확률이 어떻게 변하는지 `for` 문으로 출력하세요. (매번 결과를 다음 prior로)\n- (b) 오탐률 0.05를 0.01로 줄이면 첫 검사 후 사후확률은? 유병률과 오탐률 중 무엇이 결과를 더 크게 흔드는지 몇 가지 값으로 실험해 보세요.\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n\n1. 베이즈 정리를 기억 없이 유도하려면 어떤 식에서 출발하나요?\n2. 사전확률, 가능도, 사후확률 중 \"증거를 본 뒤의 믿음\"은?\n3. argmax로 최선의 후보를 고를 때 분모 P(B)를 무시해도 되는 이유는?\n4. 옛날 SMT와 Seq2Seq는 P(T|S)를 어떻게 다르게 다루나요?\n5. O/X: 정확도 90% 검사에서 양성이면 병일 확률은 항상 90%다.\n\n---\n\n## 한 줄 정리\n> \"베이즈 정리는 조건을 뒤집는 도구이고, Seq2Seq는 뒤집지 않고 P(번역|원문)을 직접 배운다.\"\n\n---\n\n<details>\n<summary>정답 보기<\/summary>\n\n**손계산**\n1. P(양성) = 0.9×0.1 + 0.05×0.9 = 0.09 + 0.045 = 0.135 → 0.09/0.135 ≈ **0.667 (67%)**\n2. 0.9×0.154 / (0.9×0.154 + 0.05×0.846) = 0.1386 / (0.1386 + 0.0423) ≈ **0.766 (약 77%)**\n3. T₁: 0.02×0.3 = 0.006, T₂: 0.05×0.1 = 0.005 → **T₁** 선택. (가능도는 T₂가 크지만 사전확률이 결과를 뒤집음)\n\n**코드 도전**\n- (a) 0.154 → 0.766 → 약 0.983\n  ```python\n  p = 0.01\n  for i in range(3):\n      p = bayes(p, 0.9, 0.05); print(i + 1, round(p, 3))\n  ```\n- (b) 오탐률 0.01 → 0.009/(0.009+0.0099) ≈ 0.476. 사전확률이 작을 때는 오탐률이 결과를 크게 좌우한다.\n\n**퀴즈**\n1. 곱셈 규칙 P(A,B) = P(A)P(B|A) = P(B)P(A|B)\n2. 사후확률\n3. 모든 후보에 똑같이 들어가는 상수라서 크기 순서를 바꾸지 않기 때문\n4. SMT는 베이즈로 뒤집어 P(S|T)·P(T)로 계산, Seq2Seq는 P(T|S)를 신경망 하나로 직접 모델링\n5. X (사전확률에 따라 크게 달라짐)\n<\/details>\n", "link": "논문 연결: 3.2절 번역 결과 고르기 , 1장 기존 통계 번역(SMT)과의 비교", "lesson": true}, {"id": "day05", "short": "소프트맥스와 로그: 점수를 확률로, 곱을 합으로", "md": "# Day 05. 소프트맥스와 로그: 점수를 확률로, 곱을 합으로\n\n30분 · 논문 연결: **2장** \"each p(y_t | v, y_1..y_{t-1}) distribution is represented with a softmax over all the words in the vocabulary\", **3.2절** 학습 목표의 `log`\n\n---\n\n## 오늘의 목표\n1. 소프트맥스가 아무 실수 점수(logit)를 확률분포로 바꾸는 과정을 손으로 계산할 수 있다.\n2. 로그의 핵심 성질 \"곱 → 합\"을 이용해 Day 03의 underflow 문제를 해결할 수 있다.\n3. 논문의 출력층이 \"80,000개 단어에 대한 소프트맥스\"라는 걸 shape으로 설명할 수 있다.\n\n**복습 (1분):** Day 03 도전 과제에서 0.5를 2000번 곱하면 무슨 일이 생겼나요? (답: 0.0이 됨)\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 왜 소프트맥스가 필요한가\n디코더의 마지막 층은 `z = W h + b`로 단어마다 점수 하나를 냅니다 (Day 02). 이 점수(**logit**)는 음수일 수도, 10일 수도 있어요. 확률로 쓰려면 두 조건을 맞춰야 합니다:\n- 모두 0 이상\n- 합이 1\n\n### 1-2. 소프트맥스 공식\n$$\\text{softmax}(\\mathbf z)_i = \\frac{e^{z_i}}{\\sum_j e^{z_j}}$$\n1. `e^z`로 모두 양수로 만들고 (지수함수는 항상 양수)\n2. 전체 합으로 나눠 합을 1로 만든다.\n\n**직관:** 점수 차이를 \"배율\"로 바꿉니다. 점수가 1 크면 확률은 e ≈ 2.718배. 가장 큰 점수가 \"부드럽게(soft)\" 최대(max)를 차지해서 softmax.\n\n### 1-3. 논문 규모로 보기\n디코더 맨 위 은닉 벡터 h: (1000,) → W: (80000, 1000) → z: (80000,) → softmax → 80,000개 단어의 확률.\n매 단어 위치마다 이걸 계산합니다. (그래서 논문은 계산을 GPU 여러 개에 나눴어요. 3.5절)\n\n### 1-4. 로그 다시 보기\n[준비 4. 로그 처음부터](#prep04)에서 배운 내용입니다. $\\log$는 \"e를 몇 제곱해야 이 수가 되나\" (자연로그, ln). 핵심 성질:\n\n| 성질 | 식 |\n|---|---|\n| 곱 → 합 | $\\log(ab) = \\log a + \\log b$ |\n| 나눗셈 → 뺄셈 | $\\log(a/b) = \\log a - \\log b$ |\n| 거듭제곱 → 곱 | $\\log(a^k) = k\\log a$ |\n| 단조증가 | a > b 이면 log a > log b |\n| 특수값 | log 1 = 0, 0<p<1 이면 log p < 0 |\n\n### 1-5. 로그 확률로 underflow 해결\n$$\\log\\prod_t p_t = \\sum_t \\log p_t$$\n0.5를 2000번 곱하는 대신 log 0.5 ≈ −0.693을 2000번 더하면 −1386.3. 컴퓨터가 아주 편하게 다루는 숫자입니다.\n그리고 log는 **단조증가**라 argmax 결과도 바뀌지 않아요. 그래서 논문의 학습 목표도 확률 대신 **로그 확률의 합** $\\sum \\log p(T\\mid S)$로 씁니다.\n\n### 1-6. 실전 팁: 최댓값 빼기\n$e^{1000}$은 컴퓨터에서 무한대(overflow)가 됩니다. 모든 z에서 같은 값(보통 max)을 빼도 소프트맥스 결과는 같습니다 (분자·분모에 같은 $e^{-c}$가 곱해져 약분). 그래서 실제 구현은 `z - z.max()`부터 합니다.\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n어휘 3개 [고양이, 개, 차], logit `z = [2, 1, 0]`\n\n1. e^z = [e², e¹, e⁰] ≈ [7.389, 2.718, 1.000]\n2. 합 ≈ 11.107\n3. softmax ≈ [7.389/11.107, 2.718/11.107, 1/11.107] ≈ **[0.665, 0.245, 0.090]**\n\n확인: 합 = 1.000 ✓, 점수 순서 그대로 ✓\n\n**최댓값 빼기 확인:** z − 2 = [0, −1, −2] → e^ = [1, 0.368, 0.135], 합 1.503 → [0.665, 0.245, 0.090]. 같습니다!\n\n---\n\n## 직접 만져보기\n\n<div class=\"widget\" data-w=\"softmax\"><\/div>\n\n## 3. 능동 연습 (10분)\n\n### 손계산 (e ≈ 2.718, e² ≈ 7.389, e⁻¹ ≈ 0.368, e⁻² ≈ 0.135 사용)\n1. z = [0, 0, 0]의 소프트맥스는? 이 결과의 의미는?\n2. z = [1, 1, 3]의 소프트맥스를 구하세요. (힌트: 최댓값 빼면 [−2, −2, 0])\n3. log(0.5) ≈ −0.693일 때, log(0.25)와 log(0.125)를 계산 없이 구하세요.\n4. 단어 확률 0.6, 0.9, 0.8 (Day 03 예제)의 로그 확률 합을 구하세요. (log 0.6 ≈ −0.511, log 0.9 ≈ −0.105, log 0.8 ≈ −0.223) 그리고 e^(합)이 0.432인지 확인하세요.\n\n### 코드\n```python\nimport numpy as np\n\ndef softmax(z):\n    z = z - z.max()                # 최댓값 빼기 (안정성)\n    e = np.exp(z)\n    return e / e.sum()\n\nz = np.array([2.0, 1.0, 0.0])\np = softmax(z)\nprint(\"softmax:\", p.round(3), \" 합:\", p.sum())\n\n# overflow 실험\nbig = np.array([1000.0, 999.0, 998.0])\nprint(\"안전한 softmax:\", softmax(big).round(3))\nprint(\"순진한 방법:\", np.exp(big) / np.exp(big).sum())   # 경고와 nan이 나옵니다\n\n# 로그로 underflow 피하기\nprobs = np.full(2000, 0.5)\nprint(\"곱:\", np.prod(probs), \"  로그 합:\", np.log(probs).sum())\n```\n\n**도전 과제 (선택: 시간이 남을 때만)**\n- (a) **온도(temperature)**: `softmax(z / T)`를 T = 0.5, 1, 2, 10으로 계산해 보세요. T가 커지면/작아지면 분포가 어떻게 바뀌나요? (ChatGPT·Claude 같은 챗봇의 \"temperature\" 설정이 바로 이것)\n- (b) 논문 규모 흉내: `h = np.random.randn(1000)`, `W = np.random.randn(80000, 1000) * 0.01`로 `softmax(W @ h)`를 만들고 shape, 합, 가장 확률이 큰 단어 번호(`argmax`)를 출력하세요.\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n\n1. 소프트맥스의 두 단계는?\n2. logit이 [5, 5, 5, 5]이면 각 확률은?\n3. 소프트맥스 전에 최댓값을 빼도 결과가 같은 이유는?\n4. 확률의 곱 대신 로그 확률의 합을 쓰는 이유 두 가지는?\n5. 논문 디코더의 소프트맥스는 몇 개 단어에 대해 계산되나요?\n\n---\n\n## 1주차 마무리 (시간 남으면)\n이번 주에 배운 것을 이어서 논문 식 (1)을 다시 읽어 보세요.\n- 단어 → 벡터 (Day 01) → `Wx+b` 층 (Day 02) → 점수 → **소프트맥스** (Day 05) → $p(y_t\\mid\\dots)$ → **연쇄법칙**으로 곱 (Day 03) → **argmax**로 번역 선택 (Day 04)\n\n이 흐름을 노트에 화살표로 그려 두세요. 2주차는 \"이 모델을 어떻게 학습시키나\"입니다.\n\n---\n\n## 한 줄 정리\n> \"소프트맥스는 점수를 확률로, 로그는 곱을 합으로 — 논문의 출력층과 학습 목표가 이 두 개로 만들어진다.\"\n\n---\n\n<details>\n<summary>정답 보기<\/summary>\n\n**손계산**\n1. **[1/3, 1/3, 1/3]**. 모델이 아무 선호도 없음 (완전히 모름).\n2. e^[−2, −2, 0] ≈ [0.135, 0.135, 1], 합 1.271 → **[0.107, 0.107, 0.787]**\n3. log 0.25 = log(0.5²) = 2×(−0.693) = **−1.386**, log 0.125 = 3×(−0.693) = **−2.079**\n4. −0.511 − 0.105 − 0.223 = **−0.839**, e^−0.839 ≈ 0.432 ✓\n\n**코드 도전**\n- (a) T가 작을수록 가장 큰 값에 확률이 몰리고 (T→0이면 argmax와 같음), T가 클수록 균등분포에 가까워짐.\n- (b) shape (80000,), 합 1.0 (부동소수 오차 정도), argmax는 무작위 정수.\n  ```python\n  rng = np.random.default_rng(0)\n  h = rng.standard_normal(1000); W = rng.standard_normal((80000, 1000)) * 0.01\n  p = softmax(W @ h); print(p.shape, p.sum(), p.argmax())\n  ```\n\n**퀴즈**\n1. 지수함수로 양수화 → 합으로 나눠 정규화\n2. 각각 0.25\n3. 분자와 분모에 똑같이 e^(−max)가 곱해져서 약분되기 때문\n4. (1) 긴 문장에서 곱이 0으로 뭉개지는 underflow 방지, (2) 곱보다 합이 계산·미분이 쉬움. (+ log가 단조증가라 argmax가 그대로)\n5. 80,000개 (출력 어휘 크기)\n<\/details>\n", "link": "논문 연결: 2장 , 3.2절 학습 목표의 `log`", "lesson": true}, {"id": "day06", "short": "정보량과 엔트로피: \"놀람\"을 숫자로", "md": "# Day 06. 정보량과 엔트로피: \"놀람\"을 숫자로\n\n30분 · 논문 연결: 다음 날 배울 학습 목표(크로스엔트로피)와 **3.3절** perplexity의 기초\n\n---\n\n## 오늘의 목표\n1. 정보량 $-\\log p$가 \"얼마나 놀라운가\"를 뜻한다는 걸 직관적으로 설명할 수 있다.\n2. 엔트로피를 \"평균 놀람\"으로 계산할 수 있다 (손계산 + numpy).\n3. 엔트로피가 언제 최대·최소가 되는지 말할 수 있다.\n\n**복습 (1분):** log(ab) = ? / 0 < p < 1이면 log p의 부호는? (답: log a + log b / 음수)\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 정보량 = 놀람의 크기\n- \"내일 해가 뜬다\" (p ≈ 1) → 하나도 안 놀람 → 정보 거의 0\n- \"내일 서울에 눈이 1미터 온다\" (p 아주 작음) → 엄청 놀람 → 정보 많음\n\n이걸 식으로:\n$$I(x) = -\\log_2 p(x) \\quad \\text{(단위: 비트, bit)}$$\n\n| p | −log₂ p | 해석 |\n|---|---|---|\n| 1 | 0 | 확실한 일, 정보 없음 |\n| 1/2 | 1 | 동전 앞뒤 하나 = 1비트 |\n| 1/4 | 2 | |\n| 1/8 | 3 | 예/아니오 질문 3번 분량 |\n\n**왜 로그?** 독립인 두 사건(한쪽이 일어나도 다른 쪽 확률이 바뀌지 않는 사건, 예: 동전 두 번 던지기)의 정보량이 **더해지게** 하려고. p(A,B) = p(A)p(B) → −log p(A,B) = −log p(A) − log p(B). (Day 05의 \"곱 → 합\")\n\n### 1-2. 엔트로피 = 평균 놀람\n$$H(p) = -\\sum_x p(x)\\log_2 p(x)$$\n가능한 결과마다 \"놀람 × 그 결과가 나올 확률\"을 더한 것, 즉 **놀람의 기댓값**입니다 (기댓값 = 확률로 가중한 평균, [기댓값과 분산](#ev01)).\n\n### 1-3. 언제 크고 언제 작은가\n- **최소 (0):** 한 결과의 확률이 1 → 결과를 이미 앎\n- **최대:** 모든 결과가 똑같이 그럴듯함 (균등분포). 결과가 n개면 $\\log_2 n$\n- **직관:** 엔트로피 = **불확실성**. \"다음에 뭐가 나올지 얼마나 모르는가\"\n\n### 1-4. 언어 모델과 연결\n모델이 다음 단어로 80,000개 단어에 균등하게 확률을 주면 엔트로피는 $\\log_2 80000 ≈ 16.3$비트. 학습된 모델은 \"the 다음엔 명사가 오겠지\" 같은 지식으로 불확실성을 확 줄입니다. 학습 = 엔트로피(정확히는 내일 배울 크로스엔트로피)를 줄이는 과정!\n\n> 자연로그(ln)를 쓰면 단위가 \"nat\"이 됩니다. 딥러닝 코드는 대부분 자연로그를 씁니다. 비트와 nat은 상수배 차이일 뿐 (1 nat ≈ 1.443 bit).\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n**① 공정한 동전** p = [0.5, 0.5]\nH = −(0.5×log₂0.5 + 0.5×log₂0.5) = −(0.5×(−1) + 0.5×(−1)) = **1비트**\n\n**② 찌그러진 동전** p = [0.9, 0.1] (log₂0.9 ≈ −0.152, log₂0.1 ≈ −3.322)\nH = −(0.9×(−0.152) + 0.1×(−3.322)) = 0.137 + 0.332 = **0.469비트**\n→ 결과가 거의 예측되니 불확실성이 절반 이하로.\n\n**③ 주사위** p = [1/6]×6\nH = log₂6 ≈ **2.585비트**\n\n---\n\n## 직접 만져보기\n\n<div class=\"widget\" data-w=\"entropy\"><\/div>\n\n## 3. 능동 연습 (10분)\n\n### 손계산\n1. 확률 1/16인 사건이 일어났을 때 정보량은 몇 비트?\n2. p = [0.25, 0.25, 0.25, 0.25]의 엔트로피는?\n3. p = [0.5, 0.25, 0.25]의 엔트로피는? (log₂ 값은 −1, −2, −2)\n4. p = [1, 0, 0]의 엔트로피는? (약속: 0 × log 0 = 0)\n5. 다음 두 모델 중 \"the cat sat on the ___\" 다음 단어에 대해 엔트로피가 더 낮은 쪽은? 그게 꼭 좋은 걸까요?\n   - A: [mat 0.7, floor 0.2, 기타 0.1]\n   - B: [mat 0.34, floor 0.33, 기타 0.33]\n\n### 코드\n```python\nimport numpy as np\n\ndef entropy(p, base=2):\n    p = np.asarray(p, dtype=float)\n    p = p[p > 0]                          # 0 * log 0 = 0 처리\n    return -(p * np.log(p)).sum() / np.log(base) + 0.0   # +0.0: -0.0 표시 방지\n\nfor name, p in [(\"공정 동전\", [0.5, 0.5]),\n                (\"찌그러진 동전\", [0.9, 0.1]),\n                (\"주사위\", [1/6] * 6),\n                (\"확실\", [1, 0, 0])]:\n    print(f\"{name:8s} H = {entropy(p):.3f} bit\")\n\n# 동전 앞면 확률 q를 0~1로 바꾸며 엔트로피 관찰\nfor q in [0.01, 0.1, 0.3, 0.5, 0.7, 0.9, 0.99]:\n    print(q, round(entropy([q, 1 - q]), 3))\n```\n\n**도전 과제 (선택: 시간이 남을 때만)**\n- (a) 위 결과를 보고 \"동전 엔트로피 곡선\"을 노트에 손으로 그려 보세요 (가로 q, 세로 H). 어디서 최대인가요?\n- (b) 한국어 문장 하나(예: \"가나다라가나가가\")의 글자 빈도로 확률분포를 만들고 엔트로피를 구해 보세요. (힌트: `from collections import Counter`)\n- (c) `entropy([1/80000] * 80000)`이 `np.log2(80000)`과 같은지 확인하세요.\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n\n1. 정보량을 −log p로 정의하면 좋은 점은?\n2. 엔트로피를 한 단어로 표현하면?\n3. 결과가 n가지일 때 엔트로피의 최댓값은?\n4. O/X: 엔트로피가 0이면 결과를 확실히 안다는 뜻이다.\n5. 언어 모델이 학습할수록 다음 단어 예측의 불확실성은 어떻게 되어야 하나요?\n\n---\n\n## 한 줄 정리\n> \"엔트로피 = 평균 놀람 = 불확실성. 좋은 언어 모델은 다음 단어에 대한 놀람을 줄인다.\"\n\n---\n\n<details>\n<summary>정답 보기<\/summary>\n\n**손계산**\n1. −log₂(1/16) = **4비트**\n2. log₂4 = **2비트**\n3. −(0.5×(−1) + 0.25×(−2) + 0.25×(−2)) = 0.5 + 0.5 + 0.5 = **1.5비트**\n4. **0**\n5. **A**가 더 낮음. 하지만 낮은 엔트로피 자체가 좋은 건 아님. 정답이 실제로 \"floor\"인데 A가 엉뚱하게 확신하면 나쁨. **\"확신이 맞는지\"를 재려면 정답 분포와 비교해야** → 내일의 크로스엔트로피.\n\n**코드 도전**\n- (a) q=0.5에서 최대(1비트), 양 끝에서 0. 뒤집힌 U자 곡선.\n- (b) 예:\n  ```python\n  from collections import Counter\n  s = \"가나다라가나가가\"\n  c = Counter(s); p = np.array(list(c.values())) / len(s)\n  print(entropy(p))   # 가 4, 나 2, 다 1, 라 1 → 1.75비트\n  ```\n- (c) 둘 다 약 16.288\n\n**퀴즈**\n1. 독립 사건의 정보량이 더해지고, 드문 사건일수록 값이 커져 \"놀람\"과 맞아떨어짐.\n2. 불확실성 (평균 놀람)\n3. log₂ n (균등분포일 때)\n4. O\n5. 줄어들어야 함\n<\/details>\n", "link": "논문 연결: 다음 날 배울 학습 목표(크로스엔트로피)와 3.3절 perplexity의 기초", "lesson": true}, {"id": "day07", "short": "크로스엔트로피와 KL 발산: 모델의 \"틀림\"을 재는 자", "md": "# Day 07. 크로스엔트로피와 KL 발산: 모델의 \"틀림\"을 재는 자\n\n30분 · 논문 연결: **3.2절** 학습 목표\n$$\\frac{1}{|S|}\\sum_{(T,S)\\in S}\\log p(T\\mid S)$$\n\"를 최대화한다\" = 크로스엔트로피를 최소화한다.\n\n> 이 식은 1-5절 끝에서 기호를 하나씩 풀어 읽습니다. 지금은 모양만 보고 넘어가세요.\n\n---\n\n## 오늘의 목표\n1. 크로스엔트로피 H(p, q)를 \"정답 분포 p 기준으로, 모델 q가 느끼는 평균 놀람\"으로 설명할 수 있다.\n2. 정답이 원-핫일 때 크로스엔트로피가 $-\\log q(\\text{정답})$ 하나로 줄어든다는 걸 보일 수 있다.\n3. KL 발산 = 크로스엔트로피 − 엔트로피 관계를 이해한다.\n4. 논문의 학습 목표를 \"토큰별 크로스엔트로피의 합\"으로 다시 쓸 수 있다.\n\n**복습 (1분):** p = [0.5, 0.5]의 엔트로피는? (답: 1비트) 어제 퀴즈 5번: \"확신이 맞는지 재려면?\" → 오늘 답합니다.\n\n---\n\n## 1. 개념 (8분)\n\n> 오늘부터는 딥러닝 관례대로 **자연로그(ln)** 를 씁니다 (단위 nat).\n\n### 1-1. 두 분포 비교하기\n- **p**: 진짜 분포 (정답)\n- **q**: 모델이 예측한 분포\n\n$$H(p, q) = -\\sum_x p(x)\\log q(x)$$\n\n엔트로피 식에서 log 안만 q로 바뀌었습니다. 뜻: \"**실제로는 p를 따라 일이 벌어지는데, 나는 q라고 믿고 있을 때** 느끼는 평균 놀람.\"\n\n### 1-2. 핵심 성질\n$$H(p, q) \\ge H(p), \\qquad \\text{등호는 } q = p \\text{ 일 때만}$$\n모델이 진짜 분포와 정확히 같아질 때 크로스엔트로피가 가장 작습니다. → **크로스엔트로피를 줄이면 모델이 진짜에 가까워진다.** 이것이 학습의 원리!\n\n### 1-3. KL 발산 = \"추가로 놀란 양\" (선택)\n$$D_{KL}(p\\,\\|\\,q) = H(p, q) - H(p) = \\sum_x p(x)\\log\\frac{p(x)}{q(x)} \\ \\ge 0$$\n진짜 분포를 몰라서 생기는 **낭비(추가 놀람)**. p가 고정이면 H(p)는 상수라서, **크로스엔트로피 최소화 = KL 최소화**입니다.\n주의: KL은 거리처럼 쓰지만 대칭이 아닙니다. $D_{KL}(p\\|q) \\ne D_{KL}(q\\|p)$.\n\n### 1-4. 정답이 원-핫일 때 (분류·언어모델의 실제 상황)\n학습 데이터에서 다음 단어 정답은 하나, 예를 들어 \"mat\". 그러면 p = [0, ..., 1(mat), ..., 0].\n$$H(p, q) = -\\big(0 + \\dots + 1\\cdot\\log q(\\text{mat}) + \\dots + 0\\big) = -\\log q(\\text{mat})$$\n→ **\"정답 단어에 준 확률의 음의 로그.\"** 정답에 1을 주면 손실 0, 0에 가깝게 주면 손실 → ∞.\n\n### 1-5. 논문의 학습 목표 다시 쓰기\nDay 03 식 (1) + Day 05 로그:\n$$\\log p(T\\mid S
