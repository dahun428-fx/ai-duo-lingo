실제로 초기 번역 신경망은 긴 문장에서 성적이 뚝 떨어졌습니다.\n\n### 1-2. 생각: 번역하다가 원문을 다시 보면 되잖아\n사람은 번역할 때 원문을 계속 다시 봅니다. \"지금 쓰려는 단어와 관련 있는 부분\"을 골라서요.\n\n인코더는 단어를 하나 읽을 때마다 기억 h를 만들었는데, Seq2Seq는 마지막 h만 쓰고 나머지는 버렸습니다. 어텐션은 버리던 h를 모두 보관해 둡니다.\n\n**어텐션**은 디코더가 단어 하나를 만들 때마다, 인코더의 **모든 단어의 기억**($h_1, h_2, \\dots$)을 다시 보게 합니다. 다만 똑같이 보지 않고, 관련 있는 곳에 **더 큰 가중치**를 줍니다.\n\n### 1-3. 세 단계\n디코더의 지금 상태를 s라고 합시다.\n\n1. **점수 매기기**: 입력 단어마다 \"지금 얼마나 관련 있나\" 점수를 준다. 가장 간단한 방법은 [내적](#day01) $s \\cdot h_i$\n2. **소프트맥스**: 점수들을 합이 1인 **가중치** $\\alpha_i$로 바꾼다\n3. **가중 평균**: $c = \\sum_i \\alpha_i h_i$. 이것이 **문맥 벡터**\n\n[기댓값](#ev01)에서 \"확률로 가중한 평균\"을 구한 것과 같은 계산입니다. 값 대신 벡터를 평균 낼 뿐입니다.\n\n디코더는 이제 고정된 v 대신, **단어마다 새로 만든 c**를 보고 다음 단어를 예측합니다.\n\n### 1-4. 무엇이 좋아졌나\n- **병목이 사라짐**: 문장이 길어도 필요한 곳을 직접 봅니다. 긴 문장에서도 성적이 떨어지지 않았습니다\n- **먼 단어도 한 걸음**: 아무리 먼 단어도 한 번에 연결됩니다. [LSTM](#day11)처럼 50스텝을 건너 기억을 실어 나를 필요가 없습니다\n- **들여다볼 수 있음**: 가중치 표를 그리면 \"이 프랑스어 단어를 쓸 때 영어의 어디를 봤는지\"가 보입니다\n\n| | The | cat | sat |\n|---|---|---|---|\n| chat(고양이)을 쓸 때 | 0.1 | **0.8** | 0.1 |\n\n모델이 어디를 봤는지 이렇게 숫자로 드러납니다.\n\n> (선택) 원 논문은 점수를 내적이 아니라 작은 신경망으로 계산했습니다. 이듬해 Luong 외(2015)가 내적 방식을 정리했고, Transformer가 이를 이어받았습니다.\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n입력 세 단어의 기억이 $h_1$ = [1, 0], $h_2$ = [0, 1], $h_3$ = [1, 1]입니다.\n\n**가중치가 주어졌을 때.** α = [0.7, 0.2, 0.1]이면\n\nc = 0.7 × [1, 0] + 0.2 × [0, 1] + 0.1 × [1, 1] = [0.7 + 0.1, 0.2 + 0.1] = **[0.8, 0.3]**\n\n첫 단어를 70% 반영한 섞음입니다.\n\n**가중치를 직접 구할 때.** 디코더 상태 s = [1, 0].\n\n1. 점수(내적): $s \\cdot h_1$ = 1, $s \\cdot h_2$ = 0, $s \\cdot h_3$ = 1\n2. 소프트맥스: $e^1 \\approx 2.72$, $e^0 = 1$, $e^1 \\approx 2.72$. 합 6.44\n   - α ≈ [2.72 ÷ 6.44, 1 ÷ 6.44, 2.72 ÷ 6.44] = **[0.42, 0.16, 0.42]**\n3. 문맥 벡터: 0.42 × [1, 0] + 0.16 × [0, 1] + 0.42 × [1, 1] = **[0.84, 0.58]**\n\ns와 같은 방향 성분이 큰 $h_1$, $h_3$에 가중치가 몰렸습니다.\n\n---\n\n## 3. 능동 연습 (10분)\n\n### 손계산\n$h_1$ = [2, 0], $h_2$ = [0, 2]\n\n1. α = [0.5, 0.5]일 때 문맥 벡터 c는?\n2. α = [0.9, 0.1]일 때 c는?\n3. s = [1, 0]일 때 두 점수 $s \\cdot h_1$, $s \\cdot h_2$는?\n4. 3번 점수 [2, 0]의 소프트맥스 가중치는? ($e^2 \\approx 7.39$)\n5. 4번 가중치로 구한 c는?\n6. 점수가 모두 같으면(예: [1, 1, 1]) 가중치는 어떻게 되나요?\n\n### 미니 챌린지\n\"The cat sat on the mat\"을 프랑스어로 번역하며 \"chat\"(고양이)을 쓸 차례입니다. 가중치가 가장 클 영어 단어는 무엇일까요? 한국어처럼 어순이 다른 언어로 번역할 때 어텐션이 특히 도움이 되는 이유는?\n\n### 코드 (선택)\n```python\nimport numpy as np\nH = np.array([[1, 0], [0, 1], [1, 1]])       # 입력 단어 3개의 기억\ns = np.array([1, 0])                          # 디코더 상태\n\nscores = H @ s                                # [1 0 1]\nalpha = np.exp(scores) / np.exp(scores).sum() # 소프트맥스\nc = alpha @ H                                 # 가중 평균\nprint(alpha.round(2), c.round(2))             # [0.42 0.16 0.42] [0.84 0.58]\n```\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n1. Seq2Seq의 병목이란 무엇인가요?\n2. 어텐션의 세 단계를 순서대로 말해 보세요.\n3. O/X: 어텐션 가중치들의 합은 1이다.\n4. 어텐션을 쓰면 긴 문장에서 왜 유리한가요?\n\n---\n\n## 한 줄 정리\n어텐션은 출력 단어를 만들 때마다 입력의 모든 단어에 점수를 매기고, 소프트맥스 가중치로 평균 낸 문맥 벡터를 본다.\n\n---\n\n<details>\n<summary>정답 보기 (먼저 풀고 열기!)<\/summary>\n\n**손계산**\n1. 0.5 × [2, 0] + 0.5 × [0, 2] = **[1, 1]**\n2. 0.9 × [2, 0] + 0.1 × [0, 2] = **[1.8, 0.2]**\n3. **2와 0**\n4. $e^2$ ≈ 7.39, $e^0$ = 1, 합 8.39 → **[0.88, 0.12]**\n5. 0.88 × [2, 0] + 0.12 × [0, 2] = **[1.76, 0.24]**\n6. 모두 **같은 가중치**(셋이면 1/3씩)가 됩니다. 그냥 평균입니다.\n\n**미니 챌린지**\n**cat**입니다. 어순이 다르면 번역할 단어가 원문의 엉뚱한 위치에 있는데, 어텐션은 위치와 상관없이 관련 있는 단어를 직접 찾아봅니다.\n\n**퀴즈**\n1. 길이에 상관없이 입력 문장 전체를 고정된 크기의 벡터 하나에 담아야 하는 문제입니다.\n2. 점수 매기기 → 소프트맥스로 가중치 만들기 → 가중 평균(문맥 벡터)\n3. O. 소프트맥스의 출력이라 합이 1입니다.\n4. 필요한 입력 단어를 거리와 상관없이 직접 볼 수 있어서, 긴 문장도 벡터 하나에 구겨 넣을 필요가 없습니다.\n<\/details>\n", "link": "논문 연결: Bahdanau, Cho, Bengio (2014) . Seq2Seq의 병목을 없앤 논문", "lesson": true}, {"id": "bg01", "short": "BERT와 GPT", "md": "# 7단계. BERT와 GPT\n\n30분 · 논문 연결: Devlin 외 (2018) BERT, Brown 외 (2020) GPT-3. Transformer의 두 갈래\n\n---\n\n## 오늘의 목표\n1. \"사전학습 → 필요한 일에 맞추기\"라는 두 단계 방식을 설명할 수 있다.\n2. BERT(빈칸 맞히기, 양쪽을 다 봄)와 GPT(다음 단어 맞히기, 앞만 봄)의 차이를 말할 수 있다.\n3. 미래 단어를 가리는 마스크가 어텐션 가중치를 어떻게 바꾸는지 손으로 계산할 수 있다.\n\n**복습 (1분):** Seq2Seq의 디코더는 무엇을 보고 다음 단어를 예측했나요? (답: 벡터 v와 앞에서 만든 단어들. [Day 10](#day10))\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 정답 붙은 데이터는 귀하고, 그냥 글은 넘친다\n번역 데이터처럼 사람이 정답을 달아 준 데이터는 적습니다. 반면 인터넷에는 글이 끝없이 있습니다.\n\n**생각:** 글 자체에서 문제와 정답을 만들자. 글의 일부를 가리고 맞히게 하면 사람이 정답을 달 필요가 없습니다. 이렇게 큰 모델을 미리 학습시키는 것이 **사전학습**입니다. 그 뒤에 원하는 일(감정 분류, 질문 답하기)에 맞춰 조금 더 학습시키는 것이 **미세조정**입니다.\n\n국어를 폭넓게 읽어 둔 사람이 계약서 검토를 금방 배우는 것과 같습니다.\n\n### 1-2. BERT: 빈칸 맞히기\n문장의 단어 중 **15%를 가리고** 맞히게 합니다.\n\n\"나는 [가림] 밥을 먹었다\" → 정답 \"아침에\"\n\n빈칸의 **왼쪽과 오른쪽을 모두** 보고 풉니다. Transformer의 **인코더** 블록만 쌓은 모델이고, 문장을 **이해**하는 일(분류, 검색, 질문에서 답 찾기)에 강합니다.\n\n### 1-3. GPT: 다음 단어 맞히기\n앞 단어들만 보고 **다음 단어**를 맞힙니다.\n\n\"나는 아침에 밥을\" → 정답 \"먹었다\"\n\n[Day 03](#day03)의 연쇄법칙 그대로, 문장의 확률을 \"앞 단어들이 주어졌을 때 다음 단어의 확률\"의 곱으로 학습합니다. Transformer의 **디코더** 블록만 쌓은 모델이고, 한 단어씩 이어 쓰면 되므로 글을 **생성**하는 일에 강합니다.\n\n### 1-4. 미래를 가리는 마스크\nGPT가 학습할 때 문장 전체가 한꺼번에 들어갑니다. 그런데 셀프 어텐션은 모든 단어를 보니, 그대로 두면 **정답(다음 단어)을 미리 훔쳐봅니다.**\n\n그래서 자기보다 **뒤에 있는 단어의 점수를 −∞로** 바꿉니다. −∞는 \"끝없이 작은 수\"라는 표시입니다. $e^{-10} \\approx 0.00005$처럼 지수가 작아질수록 0에 가까워지니, −∞를 넣으면 0으로 봅니다. 그래서 소프트맥스 뒤의 가중치가 0이 됩니다.\n\n| 보는 단어 → | 1번 | 2번 | 3번 |\n|---|---|---|---|\n| 1번 단어가 볼 수 있나 | ✓ | | |\n| 2번 단어 | ✓ | ✓ | |\n| 3번 단어 | ✓ | ✓ | ✓ |\n\n시험지에서 아직 풀지 않은 문제의 답을 종이로 가려 두는 것입니다. BERT에는 이 마스크가 없습니다.\n\n### 1-5. 크기와 쓰는 법\n| 모델 | 해 | 파라미터 수 | 쓰는 법 |\n|---|---|---|---|\n| Seq2Seq | 2014 | 3.8억 | 번역만 |\n| BERT (large) | 2018 | 3.4억 | 일마다 미세조정 |\n| GPT-3 | 2020 | **1750억** | 미세조정 없이 **글로 부탁**(프롬프트) |\n\nGPT-3는 예시 몇 개를 입력에 적어 주기만 해도 새 일을 해냈습니다(few-shot). 예: \"사과 → apple, 포도 → grape, 수박 → \"까지만 적어 주면 \"watermelon\"을 이어 씁니다. 번역하라고 따로 가르친 적이 없는데도요. 지금 Claude에게 직접 해 보세요. 가중치를 고치지 않고 입력만으로 일을 시키는 방식, 지금 Claude나 ChatGPT를 쓰는 방식의 시작입니다.\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n**마스크 계산.** 단어 3개 문장에서 2번 단어의 점수가 [1, 1, 1]입니다.\n\n- **BERT (마스크 없음):** 소프트맥스 → [1/3, 1/3, 1/3]. 세 단어를 고루 봅니다\n- **GPT (미래 가림):** 3번을 가려 [1, 1, −∞] → $e^1, e^1, 0$ = 2.72, 2.72, 0. 합 5.44 → 2.72 ÷ 5.44 = 0.5씩 → **[0.5, 0.5, 0]**. 1번과 2번만 봅니다\n\n**문제 수 세기.** \"나는 아침에 밥을 먹었다\" (4단어)\n\n- GPT: \"나는\" → 아침에, \"나는 아침에\" → 밥을, \"나는 아침에 밥을\" → 먹었다. 문장 하나에서 **3문제**\n- BERT: 100단어짜리 글이면 15%인 **15개**를 가리고 맞힘\n\n**손실.** 둘 다 [크로스엔트로피](#day07)입니다. 모델이 정답 단어에 준 확률이 0.25면 손실은 −ln 0.25 ≈ 1.39.\n\n---\n\n## 3. 능동 연습 (10분)\n\n### 손계산\n1. 200단어짜리 글에서 BERT는 몇 단어를 가리나요?\n2. 6단어 문장에서 GPT는 다음 단어 맞히기 문제를 몇 개 만드나요?\n3. 4단어 문장에서 3번 단어는 몇 번 단어까지 볼 수 있나요? (GPT)\n4. 4단어 문장에서 3번 단어의 점수가 [2, 2, 2, 2]일 때 GPT의 가중치는?\n5. 같은 점수에서 BERT의 가중치는?\n6. 모델이 정답 단어에 확률 0.5를 줬을 때 손실 −ln 0.5는? (ln 0.5 ≈ −0.69)\n\n### 미니 챌린지\n\"이 영화 리뷰가 긍정인지 부정인지 분류하기\"와 \"이야기의 뒷부분 이어 쓰기\". 각각 BERT와 GPT 중 어느 쪽 구조가 자연스러울까요? 그런데 요즘은 왜 GPT 방식 하나로 둘 다 할까요?\n\n### 코드 (선택)\n```python\nimport numpy as np\nscores = np.ones((3, 3))                       # 단어 3개, 모든 점수 1\nmask = np.triu(np.ones((3, 3)), k=1) == 1      # 대각선 위쪽(미래)이 True\nscores[mask] = -np.inf                         # 미래를 가림\nA = np.exp(scores) / np.exp(scores).sum(axis=1, keepdims=True)\nprint(A.round(2))\n# [[1.   0.   0.  ]\n#  [0.5  0.5  0.  ]\n#  [0.33 0.33 0.33]]\n```\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n1. 사전학습과 미세조정은 각각 무엇인가요?\n2. BERT와 GPT의 학습 문제는 어떻게 다른가요?\n3. O/X: GPT는 학습할 때 맞혀야 할 단어의 뒤쪽 단어도 본다.\n4. 미래 단어의 점수를 −∞로 바꾸면 가중치는 어떻게 되나요?\n\n---\n\n## 한 줄 정리\nBERT는 양쪽을 다 보고 빈칸을 맞히며 이해를, GPT는 앞만 보고 다음 단어를 맞히며 생성을 배운다. 둘 다 정답 없는 글로 사전학습한 Transformer다.\n\n---\n\n<details>\n<summary>정답 보기 (먼저 풀고 열기!)<\/summary>\n\n**손계산**\n1. 200 × 0.15 = **30단어**\n2. **5개** (1단어 뒤, 2단어 뒤, …, 5단어 뒤)\n3. **3번까지** (1, 2, 3번. 4번은 미래)\n4. [2, 2, 2, −∞] → **[1/3, 1/3, 1/3, 0]**\n5. **[1/4, 1/4, 1/4, 1/4]**\n6. **약 0.69**\n\n**미니 챌린지**\n분류는 문장 전체를 양쪽에서 보는 BERT 구조가, 이어 쓰기는 GPT 구조가 자연스럽습니다. 하지만 충분히 큰 GPT는 \"이 리뷰는 긍정인가 부정인가? 답:\" 뒤에 올 단어를 맞히는 식으로 분류도 **다음 단어 맞히기**로 풀 수 있어서, 모델 하나로 여러 일을 합니다.\n\n**퀴즈**\n1. 사전학습은 정답 없는 많은 글로 미리 학습하는 것, 미세조정은 그 모델을 특정한 일의 데이터로 조금 더 학습하는 것입니다.\n2. BERT는 가린 단어를 양쪽 문맥으로 맞히고, GPT는 앞 단어들만 보고 다음 단어를 맞힙니다.\n3. X. GPT는 미래를 가리는 마스크 때문에 앞 단어만 봅니다.\n4. 0이 됩니다. 그 단어를 전혀 보지 않습니다.\n<\/details>\n", "link": "논문 연결: Devlin 외 (2018) BERT, Brown 외 (2020) GPT-3. Transformer의 두 갈래", "lesson": true}, {"id": "cnn01", "short": "합성곱과 풀링: 같은 돋보기로 그림 전체를 훑기", "md": "# 7단계. 합성곱과 풀링: 같은 돋보기로 그림 전체를 훑기\n\n30분 · 논문 연결: Goodfellow 외 (2016) 『Deep Learning』 9장, Dumoulin, Visin (2016) \"A guide to convolution arithmetic for deep learning\". 그림을 보는 신경망(CNN)의 기본 부품\n\n---\n\n## 오늘의 목표\n1. 3×3 필터를 그림 위로 미끄러뜨리며 \"같은 자리끼리 곱해서 더하기\"를 손으로 할 수 있다.\n2. 출력 크기를 \"필터를 몇 번 옮길 수 있나 + 1\"로 구하고, 패딩과 스트라이드가 크기를 어떻게 바꾸는지 안다.\n3. 합성곱층이 완전연결층보다 파라미터가 훨씬 적은 이유(가중치 공유)와 최대 풀링이 하는 일을 말할 수 있다.\n\n**복습 (1분):** W의 한 행이 [1, 0, 0]인 \"패턴 탐지기\"가 가장 크게 반응하는 입력은 [5, 0, 0], [0, 5, 0] 중 어느 쪽인가요? (답: [5, 0, 0]. 출력 한 칸은 그 행과 입력의 내적. [행렬곱과 신경망 층](#day02))\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 문제: 그림을 통째로 층에 넣으면\n흑백 그림은 점(픽셀)마다 밝기 숫자 하나가 있는 표입니다. 28 × 28 그림이면 숫자 784개입니다. [Day 02](#day02)의 층에 그대로 넣으면 두 가지가 곤란합니다.\n\n- **파라미터가 너무 많습니다.** 컬러 사진 224 × 224 × 3(빨강, 초록, 파랑)이면 입력이 150,528개. 출력 1000칸짜리 층 하나에 가중치가 약 1억 5천만 개입니다.\n- **위치가 바뀌면 처음부터 다시 배워야 합니다.** 같은 고양이라도 왼쪽에 있을 때와 오른쪽에 있을 때를 따로 배웁니다. 완전연결층(입력의 모든 칸이 출력의 모든 칸과 이어진, 지금까지 써 온 보통 층)은 자리마다 다른 가중치를 쓰기 때문입니다.\n\n### 1-2. 필터: 작은 돋보기 하나\n**필터**(커널이라고도 함)는 3 × 3 같은 작은 숫자 판입니다. 그림의 3 × 3 조각 위에 올려 **같은 자리끼리 곱해서 모두 더합니다.** 숫자 9개짜리 [내적](#day01)입니다.\n\n돋보기를 그림의 한 자리에 대고 \"여기 세로선 있나?\"만 묻는다고 생각하세요. 세로선 탐지 필터는 이렇게 생겼습니다.\n\n| −1 | 0 | 1 |\n|---|---|---|\n| **−1** | **0** | **1** |\n| **−1** | **0** | **1** |\n\n왼쪽이 어둡고(0) 오른쪽이 밝은(1) 곳에서 큰 값이 나오고, 고르게 밝은 곳에서는 0이 나옵니다.\n\n### 1-3. 미끄러뜨리기와 출력 크기\n필터를 한 칸씩 오른쪽으로, 줄이 끝나면 한 줄 아래로 옮기며 매번 곱해서 더합니다. 이 계산 전체가 **합성곱**, 결과 표가 **특징 지도**입니다.\n\n5칸짜리 줄 위에서 3칸짜리 필터는 몇 자리에 놓일까요? 처음 자리에서 오른쪽으로 2번 옮길 수 있으니 자리는 2 + 1 = **3**개입니다. 그래서 5 × 5 그림에 3 × 3 필터를 쓰면 출력은 **3 × 3**입니다.\n\n$$\\text{출력 크기} = (\\text{입력} - \\text{필터}) + 1$$\n\n### 1-4. 가중치 공유: 같은 돋보기를 어디서나\n여기가 핵심입니다. **모든 자리에서 같은 필터 9칸을 씁니다.** 그래서 이 필터가 배울 숫자는 9개 + 편향 1개 = **10개**뿐입니다.\n\n| 28 × 28 → 26 × 26 | 배울 숫자 |\n|---|---|\n| 완전연결층 | 784 × 676 = **529,984개** (편향 빼고) |\n| 3 × 3 합성곱 | **10개** |\n\n게다가 같은 필터가 그림 전체를 훑으니, 세로선이 왼쪽에 있든 오른쪽에 있든 **같은 방식으로** 찾습니다. 1-1의 두 문제가 함께 풀립니다.\n\n### 1-5. 패딩과 스트라이드\n- **패딩**: 그림 둘레에 0을 한 겹 두릅니다. 출력이 줄어드는 것을 막고, 가장자리도 필터 가운데에 오게 합니다.\n- **스트라이드**: 필터를 한 번에 몇 칸씩 옮기나. 2칸씩 옮기면 출력이 약 절반이 됩니다.\n\n$$\\text{출력 크기} = \\frac{\\text{입력} - \\text{필터} + 2 \\times \\text{패딩}}{\\text{스트라이드}} + 1$$\n\n외우지 않아도 됩니다. \"패딩을 붙인 길이에서 필터가 몇 번 옮겨 갈 수 있나 + 1\"입니다. 예: 32 × 32에 3 × 3 필터, 패딩 1, 스트라이드 1 → (32 − 3 + 2) ÷ 1 + 1 = 32. 크기가 그대로입니다.\n\n### 1-6. 채널: 색 필름 3장\n컬러 그림은 빨강, 초록, 파랑 투명 필름 3장을 겹친 것과 같습니다(채널 3개). 그래서 필터도 3 × 3 × **3** 두께를 가집니다. 27칸을 곱해 더해 숫자 **하나**를 냅니다.\n\n필터를 16개 쓰면 특징 지도 16장, 곧 다음 층의 채널 16개가 나옵니다. 하나는 세로선, 하나는 가로선, 하나는 빨간 점… 필터의 숫자는 사람이 정하지 않고 [역전파](#bp01)로 학습합니다.\n\n### 1-7. 최대 풀링: 요약해서 줄이기\n특징 지도를 2 × 2 칸씩 나눠 **가장 큰 값만** 남깁니다. 가로세로가 절반이 됩니다.\n\n\"이 구역 어딘가에 세로선이 있었다\"는 사실만 남기고 정확한 자리는 흐리게 합니다. 그래서 그림이 한 칸쯤 밀려도 결과가 잘 안 바뀝니다. 풀링에는 배울 숫자가 **없습니다.**\n\n> (선택) 수학 교재의 \"합성곱\"은 필터를 뒤집어서 곱합니다. 딥러닝 라이브러리는 뒤집지 않고 그대로 곱하는데(교차상관), 필터 숫자를 어차피 학습하므로 결과에 차이가 없습니다. 이름만 합성곱으로 부릅니다(Goodfellow 외 9.1절).\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n**쓸 값**\n\n| 그림 (5 × 5) | 세로선 필터 (3 × 3) |\n|---|---|\n| 줄마다 [0, 0, 1, 1, 1] (왼쪽 두 칸 어둡고 나머지 밝음) | 줄마다 [−1, 0, 1] |\n\n**1. 첫 자리 (왼쪽 위).** 그림의 1~3열은 줄마다 [0, 0, 1]. 필터와 곱하면 줄마다 (−1)×0 + 0×0 + 1×1 = 1. 세 줄이니 **3**.\n\n**2. 한 칸 오른쪽.** 2~4열은 줄마다 [0, 1, 1]. 줄마다 0 + 0 + 1 = 1 → **3**.\n\n**3. 또 한 칸 오른쪽.** 3~5열은 줄마다 [1, 1, 1]. 줄마다 −1 + 0 + 1 = 0 → **0**.\n\n아래 줄들도 똑같으니 특징 지도는\n\n| 3 | 3 | 0 |\n|---|---|---|\n| **3** | **3** | **0** |\n| **3** | **3** | **0** |\n\n어둠과 밝음의 **경계가 걸친 자리에서 3**, 고르게 밝은 자리에서 0. 필터가 세로 경계를 찾았습니다.\n\n**최대 풀링.** 4 × 4 특징 지도 [[1, 3, 2, 0], [5, 2, 1, 1], [0, 1, 4, 6], [2, 0, 3, 1]]을 2 × 2씩 나누면 왼쪽 위 {1, 3, 5, 2} → 5, 오른쪽 위 {2, 0, 1, 1} → 2, 왼쪽 아래 {0, 1, 2, 0} → 2, 오른쪽 아래 {4, 6, 3, 1} → 6. 결과 **[[5, 2], [2, 6]]**.\n\n---\n\n## 직접 만져보기\n\n<div class=\"widget\" data-w=\"cnn01\"><\/div>\n\n## 3. 능동 연습 (10분)\n\n아래 실습 위젯에서 6 × 6 그림 \"7\" 위로 필터를 한 칸씩 옮겨 보세요. 필터를 세로선, 가로선, 흐림으로 바꾸면 특징 지도가 어떻게 달라지는지, 풀링 단추를 누르면 4 × 4가 2 × 2로 어떻게 줄어드는지 확인하세요.\n\n### 손계산\n1. 그림 조각 [[1, 2, 0], [0, 1, 0], [2, 0, 1]]에 대각선 필터 [[1, 0, 0], [0, 1, 0], [0, 0, 1]]을 쓰면?\n2. 7 × 7 그림에 3 × 3 필터, 스트라이드 2. 출력 크기는?\n3. 32 × 32 그림에 5 × 5 필터, 패딩 2, 스트라이드 1. 출력 크기는?\n4. 컬러 그림(채널 3)에 3 × 3 필터 16개를 쓰는 층. 배울 숫자는 모두 몇 개? (필터마다 편향 1개)\n5. 특징 지도 [[2, 0, 1, 1], [1, 3, 0, 2], [4, 1, 0, 0], [0, 2, 5, 1]]에 2 × 2 최대 풀링을 하면?\n6. 28 × 28 그림 → 3 × 3 합성곱(패딩 0) → 2 × 2 최대 풀링. 최종 크기는?\n\n### 미니 챌린지\n숫자 \"7\" 그림을 오른쪽으로 한 칸 민 그림이 있습니다. 완전연결층과 \"합성곱 + 최대 풀링\" 중 어느 쪽이 두 그림을 더 비슷하게 볼까요? 이유를 한 문장으로 써 보세요.\n\n### 코드 (선택)\n```python\nimport numpy as np\nimg = np.array([[0, 0, 1, 1, 1]] * 5)         # 5 × 5 그림\nf = np.array([[-1, 0, 1]] * 3)                # 세로선 필터\nout = np.zeros((3, 3), dtype=int)\nfor i in range(3):                            # 아래로 옮기기\n    for j in range(3):                        # 오른쪽으로 옮기기\n        out[i, j] = (img[i:i+3, j:j+3] * f).sum()   # 같은 자리끼리 곱해서 더하기\nprint(out)                                    # [[3 3 0] [3 3 0] [3 3 0]]\n\n```\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n1. 필터 하나가 그림의 한 자리에서 하는 계산은?\n2. 출력 크기를 구하는 말로 된 규칙은?\n3. O/X: 합성곱층은 그림의 자리마다 다른 필터를 쓴다.\n4. 최대 풀링이 배우는 숫자는 몇 개인가요?\n5. 합성곱이 완전연결층보다 그림에 유리한 이유 두 가지는?\n\n---\n\n## 한 줄 정리\n합성곱은 작은 필터 하나를 그림 전체에 미끄러뜨리며 곱해서 더하고(가중치 공유), 최대 풀링은 구역마다 가장 큰 값만 남겨 그림을 줄인다.\n\n다음 챕터에서는 이 부품을 쌓아 만든 유명한 CNN들을 봅니다. (예고: 11단계의 ViT가 그림을 16 × 16 조각으로 자르는 일은 16 × 16 필터를 16칸씩 옮기는 합성곱과 같습니다.)\n\n---\n\n<details>\n<summary>정답 보기 (먼저 풀고 열기!)<\/summary>\n\n**손계산**\n1. 대각선 자리 1, 1, 1만 남습니다 → 1 + 1 + 1 = **3**\n2. (7 − 3) ÷ 2 + 1 = **3 × 3**\n3. (32 − 5 + 4) ÷ 1 + 1 = **32 × 32** (크기 그대로)\n4. 필터 하나 3 × 3 × 3 = 27 + 편향 1 = 28 → 28 × 16 = **448개**\n5. {2, 0, 1, 3} → 3, {1, 1, 0, 2} → 2, {4, 1, 0, 2} → 4, {0, 0, 5, 1} → 5 → **[[3, 2], [4, 5]]**\n6. 28 − 3 + 1 = 26 → 26 ÷ 2 = **13 × 13**\n\n**미니 챌린지**\n합성곱 + 최대 풀링입니다. 같은 필터가 모든 자리를 훑으니 밀린 그림에서도 같은 특징이 한 칸 옆에서 나오고, 최대 풀링이 2 × 2 구역 안의 작은 이동을 흡수합니다. 완전연결층은 자리마다 가중치가 달라 한 칸만 밀려도 완전히 다른 입력으로 봅니다.\n\n**퀴즈**\n1. 필터와 그 아래 그림 조각을 같은 자리끼리 곱해서 모두 더합니다(내적).\n2. 필터가 몇 번 옮겨 갈 수 있는지 세고 1을 더합니다. 패딩은 길이에 더하고, 스트라이드로 나눕니다.\n3. X. 모든 자리에서 같은 필터를 씁니다(가중치 공유).\n4. 0개. 정해진 규칙(최댓값 고르기)만 씁니다.\n5. 배울 숫자가 훨씬 적고(가중치 공유), 같은 무늬를 어느 자리에서나 같은 방식으로 찾습니다.\n<\/details>\n", "link": "논문 연결: Goodfellow 외 (2016) 『Deep Learning』 9장, Dumoulin, Visin (2016) . 그림을 보", "lesson": true}, {"id": "cnn02", "short": "CNN 계보: LeNet에서 ResNet까지", "md": "# 7단계. CNN 계보: LeNet에서 ResNet까지\n\n30분 · 논문 연결: LeCun 외 (1998) LeNet-5, Krizhevsky, Sutskever, Hinton (2012) AlexNet, Simonyan, Zisserman (2014) VGG, He 외 (2015) ResNet. 그림 인식이 딥러닝 시대를 연 네 장면\n\n---\n\n## 오늘의 목표\n1. 합성곱층을 쌓을수록 한 칸이 보는 범위(수용 영역)가 넓어지는 것을 계산할 수 있다.\n2. LeNet, AlexNet, VGG, ResNet이 각각 무엇을 바꿨는지 한 문장씩 말할 수 있다.\n3. VGG가 3×3 필터만 쓴 이유를 배울 숫자의 개수로 설명할 수 있다.\n\n**복습 (1분):** 28 × 28 그림 → 3 × 3 합성곱(패딩 0) → 2 × 2 최대 풀링. 최종 크기는? (답: 26 × 26을 거쳐 13 × 13. [합성곱과 풀링](#cnn01))\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 수용 영역: 층을 쌓으면 더 넓게 본다\n3 × 3 필터 하나는 그림의 3 × 3 조각만 봅니다. 그런데 2층의 한 칸은 1층 특징 지도의 3 × 3을 보고, 그 9칸이 각각 그림의 3 × 3을 봅니다. 겹치는 부분을 빼면 그림에서 **5 × 5**를 보는 셈입니다. 한 칸이 원래 그림에서 보는 범위를 **수용 영역**이라고 합니다.\n\n| 3 × 3 합성곱 층 수 | 1 | 2 | 3 | n |\n|---|---|---|---|---|\n| 수용 영역 (한 변) | 3 | 5 | 7 | 2n + 1 |\n\n층마다 양옆으로 한 칸씩, 한 변이 2칸 넓어집니다. 풀링을 지나면 한 칸이 그림의 2칸을 대표하니, 그 뒤로는 범위가 **두 배 빠르게** 넓어집니다.\n\n그림 맞히기 릴레이를 떠올리세요. 1층은 작은 조각만 보고 \"여기 선이 있다\"를 찾습니다. 2층은 선 몇 개를 모아 \"눈\", \"귀\" 같은 모양을 찾습니다. 3층은 그 모양들을 모아 \"고양이 얼굴\"을 봅니다. 위로 갈수록 넓게, 더 큰 뜻을 봅니다.\n\n### 1-2. LeNet-5 (1998): 손글씨 숫자 읽기\nLeCun 등이 만든 이 신경망은 32 × 32 손글씨 숫자를 0~9로 분류했습니다.\n\n32 → (5 × 5 합성곱) 28 → (풀링) 14 → (5 × 5 합성곱) 10 → (풀링) 5 → 완전연결층 → 숫자 10개 중 하나\n\n배울 숫자는 약 6만 개. 논문에 따르면 이를 바탕으로 만든 시스템이 **하루 수백만 장의 수표**를 읽었습니다. \"합성곱 → 풀링을 번갈아 쌓고 끝에 완전연결층\"이라는 뼈대가 여기서 정해졌습니다.\n\n### 1-3. AlexNet (2012): 딥러닝의 전환점\n**이미지넷 대회**는 사진 약 120만 장을 1000가지 종류로 나누는 시합입니다. 점수는 **top-5 오류**로 봅니다. 모델이 고른 후보 5개 안에 정답이 없으면 틀린 것으로 칩니다.\n\n2012년 AlexNet의 top-5 오류는 **15.3%**, 2등은 **26.2%**였습니다. 10%p(퍼센트포인트: 퍼센트 숫자끼리의 차이) 넘는 차이로, 사람이 특징을 손으로 설계하던 방법들을 크게 이겼습니다. 바꾼 것은 이렇습니다.\n\n- 시그모이드·tanh 대신 [ReLU](#gv01): 기울기가 덜 사라져 깊은 망이 빨리 배움\n- [드롭아웃](#reg01): 완전연결층의 과적합을 막음\n- GPU 2장: 큰 망을 현실적인 시간에 학습\n- 데이터 늘리기: 사진을 자르고 좌우로 뒤집어 학습 데이터를 불림\n\n합성곱 5층 + 완전연결 3층에 배울 숫자는 약 **6천만 개**, LeNet의 1000배입니다. 저자 중 Sutskever는 2단계에서 읽은 Seq2Seq 논문의 첫 저자이기도 합니다.\n\n### 1-4. VGG (2014): 3 × 3만 깊게\nVGG는 필터를 **3 × 3 하나로 통일**하고 16~19층까지 쌓았습니다. 왜 큰 필터를 안 썼을까요?\n\n- 3 × 3을 두 번 쌓으면 수용 영역이 **5 × 5**. 5 × 5 필터 한 번과 같은 범위입니다\n- 배울 숫자(채널 1개, 편향 빼고): 3 × 3 두 번은 9 + 9 = **18개**, 5 × 5 한 번은 **25개**\n- 층 사이마다 ReLU가 한 번 더 들어가 더 복잡한 모양을 표현합니다\n\n같은 범위를 더 적은 숫자로, 더 깊게 봅니다. (채널이 많아져도 두 쪽 모두 같은 배수로 늘어서 이 비율은 그대로입니다.)\n\n### 1-5. ResNet (2015): 152층의 비밀은 이미 배웠다\nVGG 뒤 사람들은 더 깊이 쌓으려 했지만, 층을 늘리면 **학습 데이터에서의 오류까지** 오히려 커졌습니다. 논문의 그림 1(작은 사진 데이터 CIFAR-10)에서 잔차 연결 없는 56층 신경망이 20층보다 학습 오류가 높았습니다. 외워서 생기는 과적합이 아니라, 깊은 망이 **잘 배우지 못하는** 문제입니다.\n\n해결책은 [정규화와 잔차 연결](#norm01)에서 본 **잔차 연결** y = x + F(x)입니다. 바로 그 챕터에서 출처로 읽은 He 외(2015) 논문이 이것입니다. 더하기 길로 기울기가 그대로 흘러 **152층**을 학습했고, 2015년 이미지넷 대회에서 top-5 오류 **3.57%**(여러 모델을 합친 결과)로 1등을 했습니다. 3년 만에 15.3%에서 3.57%가 된 것입니다.\n\nResNet은 마지막 특징 지도를 한 장씩 통째로 평균 내어 숫자 하나로 만든 뒤(전역 평균 풀링) 분류합니다. 그래서 VGG처럼 큰 완전연결층이 필요 없습니다.\n\n### 1-6. 한눈에 보기\n| 모델 | 해 | 깊이 | 바꾼 것 |\n|---|---|---|---|\n| LeNet-5 | 1998 | 약 7층 | 합성곱·풀링을 번갈아 쌓는 뼈대 |\n| AlexNet | 2012 | 8층 | ReLU, 드롭아웃, GPU로 크게 |\n| VGG | 2014 | 16~19층 | 3 × 3만 깊게 |\n| ResNet | 2015 | 152층 | 잔차 연결 |\n\nCNN은 가까운 칸부터 차근차근 넓혀 봅니다. 먼 곳끼리 이으려면 층을 많이 쌓아야 합니다. 다음 챕터의 **어텐션**은 처음부터 멀리 떨어진 곳도 한 번에 보는 방법입니다.\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n**쓸 값:** 3 × 3 합성곱은 한 변을 2 줄이고 수용 영역을 2 넓힘. 5 × 5 합성곱은 한 변을 4 줄임. 2 × 2 풀링은 한 변을 절반으로.\n\n**1. LeNet 따라가기.** 32 − 4 = **28** → 28 ÷ 2 = **14** → 14 − 4 = **10** → 10 ÷ 2 = **5**. 5 × 5 특징 지도가 완전연결층으로 들어갑니다.\n\n**2. 수용 영역.** 3 × 3 합성곱 3층: 3 → 5 → **7**. 7 × 7 필터 한 번과 같은 범위입니다.\n\n**3. 배울 숫자 비교 (채널 1, 편향 빼고).** 3 × 3 세 번: 9 × 3 = **27**. 7 × 7 한 번: 7 × 7 = **49**. 22개를 아끼고 ReLU는 세 번 들어갑니다.\n\n**4. 얼마나 커졌나.** AlexNet 6천만 ÷ LeNet 6만 = **1000배**.\n\n---\n\n## 직접 만져보기\n\n<div class=\"widget\" data-w=\"cnn02\"><\/div>\n\n## 3. 능동 연습 (10분)\n\n아래 실습 위젯에서 28 × 28 그림 위에 합성곱과 풀링 블록을 쌓아 보세요. 블록을 하나 쌓을 때마다 그림 크기와 수용 영역이 표시됩니다. 미션은 \"출력을 1 × 1로 만들기\"입니다. 아래쪽에서는 네 모델 카드를 나온 순서대로 눌러 보세요.\n\n### 손계산\n1. 3 × 3 합성곱을 4층 쌓으면 마지막 층 한 칸의 수용 영역은?\n2. 3 × 3 두 번과 5 × 5 한 번의 배울 숫자 차이는? (채널 1, 편향 빼고)\n3. 3 × 3 세 번과 7 × 7 한 번의 배울 숫자는 각각? (채널 1, 편향 빼고)\n4. LeNet의 32 × 32 입력이 5 × 5 합성곱을 지나면? 이어서 2 × 2 풀링을 지나면?\n5. AlexNet(top-5 오류 15.3%)은 2등(26.2%)보다 몇 %p 낮았나요?\n6. 잔차 연결 복습: x = 5, F(x) = 0.3이면 출력은?\n7. (도전) 3 × 3 합성곱 → 2 × 2 풀링 → 3 × 3 합성곱. 마지막 한 칸의 수용 영역은? (힌트: 풀링 뒤의 한 칸은 그림의 2칸을 대표합니다)\n\n### 미니 챌린지\n층을 20개에서 56개로 늘렸더니 **학습 데이터의 오류**가 커졌습니다. 이것을 [과적합](#of01)이라고 부를 수 있을까요? 왜 그런가요?\n\n### 코드 (선택)\n```python\ndef stack(size, layers):\n    rf, jump = 1, 1                  # 수용 영역, 한 칸이 대표하는 그림 칸 수\n    for L in layers:\n        if L == \"conv\":              # 3 × 3 합성곱, 패딩 0\n            size -= 2; rf += 2 * jump\n        else:                        # 2 × 2 최대 풀링\n            size //= 2; rf += jump; jump *= 2\n        print(L, size, \"수용 영역\", rf)\n\nstack(28, [\"conv\", \"pool\", \"conv\"])  # 26/3 → 13/4 → 11/8\n```\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n1. 수용 영역이란?\n2. AlexNet이 바꾼 것 세 가지는?\n3. O/X: VGG는 큰 필터를 써서 적은 층으로 넓은 범위를 봤다.\n4. ResNet이 152층을 학습할 수 있었던 비결은?\n5. 네 모델을 나온 순서대로 쓰세요.\n\n---\n\n## 한 줄 정리\nCNN은 층을 쌓을수록 넓게 보며, LeNet이 뼈대를 세우고 AlexNet이 ReLU·드롭아웃·GPU로 크게 키웠고, VGG는 3 × 3을 깊게 쌓았고, ResNet은 잔차 연결로 152층에 닿았다.\n\n---\n\n<details>\n<summary>정답 보기 (먼저 풀고 열기!)<\/summary>\n\n**손계산**\n1. 2 × 4 + 1 = **9**\n2. 25 − 18 = **7개**\n3. **27개**와 **49개**\n4. 32 − 4 = **28**, 28 ÷ 2 = **14**\n5. 26.2 − 15.3 = **10.9%p**\n6. 5 + 0.3 = **5.3**\n7. 첫 합성곱 뒤 3 → 풀링 뒤 4 (한 칸이 2칸을 대표하게 됨) → 다음 3 × 3은 양옆으로 \"한 칸 = 그림 2칸\"씩 넓히므로 4 + 2 × 2 = **8**\n\n**미니 챌린지**\n아닙니다. 과적합은 학습 데이터 오류는 **낮은데** 새 데이터 오류가 높은 상태입니다. 여기서는 학습 데이터 오류부터 높으니, 깊은 망이 제대로 **배우지 못한** 것입니다. ResNet 논문이 이 문제를 잔차 연결로 풀었습니다.\n\n**퀴즈**\n1. 한 층의 한 칸이 원래 그림에서 보는 범위\n2. ReLU, 드롭아웃, GPU 학습 (데이터 늘리기도 정답)\n3. X. 3 × 3만 깊게 쌓아, 같은 범위를 더 적은 숫자로 봤습니다.\n4. 잔차 연결 y = x + F(x). 더하기 길로 기울기가 줄지 않고 흐릅니다.\n5. LeNet-5(1998) → AlexNet(2012) → VGG(2014) → ResNet(2015)\n<\/details>\n", "link": "논문 연결: LeCun 외 (1998) LeNet-5, Krizhevsky, Sutskever, Hinton (2012) AlexNet, ", "lesson": true}, {"id": "mh01", "short": "멀티헤드와 위치 인코딩", "md": "# 7단계. 멀티헤드와 위치 인코딩\n\n30분 · 논문 연결: \"Attention Is All You Need\" **3.2.2절** 멀티헤드 어텐션, **3.5절** 위치 인코딩, **그림 1** Transformer 전체 구조\n\n---\n\n## 오늘의 목표\n1. 어텐션을 여러 개(헤드) 나란히 돌리는 이유를 설명할 수 있다.\n2. 셀프 어텐션이 순서를 모른다는 것과, 위치 인코딩이 그것을 어떻게 채우는지 안다.\n3. Transformer 블록 하나의 구성(어텐션 → 더하고 정규화 → 작은 신경망 → 더하고 정규화)을 말할 수 있다.\n\n**복습 (1분):** 셀프 어텐션에서 Q, K, V는 각각 무엇인가요? (답: 질문, 열쇠, 값. [셀프 어텐션](#sa01))\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 한 번에 한 가지만 볼 수는 없다\n\"나는 어제 친구가 추천한 영화를 봤다\"에서 \"봤다\"는 **누가**(나는), **무엇을**(영화를), **언제**(어제)를 모두 알아야 합니다. 어텐션 하나는 가중치 한 벌만 만들기 때문에 이 여러 관계를 한꺼번에 담기 어렵습니다.\n\n### 1-2. 멀티헤드: 어텐션을 여러 벌 나란히\n**헤드** 하나 = [Q·K·V 셀프 어텐션](#sa01) 한 벌. 헤드마다 $W_Q, W_K, W_V$가 따로 있어서 **서로 다른 관계**를 봅니다. 한 헤드는 주어를, 다른 헤드는 목적어를, 또 다른 헤드는 바로 옆 단어를 보는 식입니다.\n\n회의에서 한 사람은 일정만, 한 사람은 예산만, 한 사람은 위험만 듣고 나중에 메모를 합치는 것과 같습니다.\n\n논문의 숫자: 단어 벡터 512칸, 헤드 **8개**. 헤드마다 $W_Q, W_K, W_V$가 512칸 벡터를 512 ÷ 8 = **64칸**으로 줄여서 작은 어텐션을 합니다. 결과 8개를 옆으로 나란히 이어 붙이면(64 × 8) 다시 512칸입니다. 그래서 전체 계산량은 헤드 하나짜리와 비슷합니다.\n\n### 1-3. 문제: 셀프 어텐션은 순서를 모른다\n셀프 어텐션은 \"모든 단어 쌍의 내적\"입니다. 단어를 섞어도 쌍은 그대로라 결과가 같습니다.\n\n영어의 \"dog bites man\"(개가 사람을 문다)과 \"man bites dog\"(사람이 개를 문다)은 단어가 완전히 같고 순서만 다릅니다. 단어 카드를 주머니에 넣고 흔든 것처럼, 셀프 어텐션은 어느 카드가 앞에 있었는지 모릅니다. 순서 정보를 따로 넣어 주지 않으면 두 문장을 구별할 수 없습니다.\n\n### 1-4. 위치 인코딩: 자리 번호를 벡터로 더하기\n단어 벡터에 **\"몇 번째 자리인지\"를 나타내는 벡터**를 더합니다.\n\n$$\\text{입력} = \\text{단어 벡터} + \\text{위치 벡터}$$\n\n논문은 위치 벡터를 sin과 cos 물결로 만들었습니다. sin과 cos는 처음 보셔도 괜찮습니다. 숫자를 넣으면 −1과 1 사이를 물결처럼 오르내리는 값을 돌려주는 함수이고, 값은 계산기가 구해 줍니다. 오늘은 아래 표를 그대로 가져다 쓰기만 합니다. 가장 작은 경우(2칸)를 보면\n\n| 자리 pos | sin(pos) | cos(pos) |\n|---|---|---|\n| 0 | 0 | 1 |\n| 1 | 0.84 | 0.54 |\n| 2 | 0.91 | −0.42 |\n\n자리마다 다른 벡터가 됩니다. 실제로는 512칸에 **빠르기가 다른 물결**을 여러 개 씁니다. 시계의 초침, 분침, 시침처럼 빠른 바늘은 가까운 자리를, 느린 바늘은 먼 자리를 구별합니다.\n\n> 요즘 모델은 위치 벡터를 학습시키거나 다른 방식(회전 위치 인코딩 등)을 쓰기도 합니다.\n\n### 1-5. Transformer 블록 조립\n지금까지 배운 부품이 모두 모입니다.\n\n1. **멀티헤드 셀프 어텐션**: 단어들이 서로 정보를 주고받음\n2. **더하고 정규화**: 어텐션에 들어가기 전의 벡터를 결과에 다시 더하고([잔차 연결](#norm01)), 크기를 고르게 맞춥니다(층 정규화)\n3. **작은 신경망**(영어로 feed-forward): 어텐션으로 모은 정보를 단어마다 혼자 곱씹는 단계입니다. [Day 02](#day02)의 층 두 개(`Wx + b` → ReLU → `Wx + b`)입니다\n4. **더하고 정규화**\n\n논문의 Transformer는 이 블록을 두 종류로 씁니다. 입력 문장을 읽는 쪽이 **인코더 블록**, 번역문을 한 단어씩 쓰는 쪽이 **디코더 블록**입니다. 디코더 블록은 \"아직 쓰지 않은 뒤쪽 단어를 못 보게 가린다\"는 점이 다릅니다. 다음 레슨에서 다시 만납니다.\n\n> (선택) 논문은 인코더 블록과 디코더 블록을 각각 **6번** 쌓았습니다. 더 큰 버전(1024칸, 헤드 16개)은 영어→독일어 BLEU 28.4, 영어→프랑스어 41.8로 당시 최고 기록을 냈습니다. RNN이 하나도 없어서 제목이 \"어텐션만 있으면 된다\"입니다.\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n**헤드 크기.** 단어 벡터 768칸, 헤드 12개인 모델이라면 헤드 하나는 768 ÷ 12 = **64칸**.\n\n**위치 더하기.** 단어 \"cat\"의 벡터가 [0.5, 0.2]이고 1번 자리에 있다면\n\n입력 = [0.5, 0.2] + [0.84, 0.54] = **[1.34, 0.74]**\n\n같은 \"cat\"이 2번 자리에 있다면 [0.5, 0.2] + [0.91, −0.42] = **[1.41, −0.22]**. 같은 단어도 자리에 따라 다른 벡터로 들어갑니다.\n\n**두 헤드 합치기.** 어떤 단어에 대해 헤드 A의 출력이 [1, 0], 헤드 B의 출력이 [0.3, 0.7]이면, 이어 붙여 **[1, 0, 0.3, 0.7]**. 평균이 아니라 **나란히 붙입니다.**\n\n---\n\n## 3. 능동 연습 (10분)\n\n### 손계산\n1. 단어 벡터 512칸, 헤드 8개면 헤드 하나는 몇 칸?\n2. 단어 벡터 1024칸, 헤드 16개면?\n3. 단어 벡터 [1, 1]이 0번 자리에 있을 때 위치 벡터를 더한 입력은? (표 사용)\n4. 같은 단어가 2번 자리에 있을 때는?\n5. 헤드 3개의 출력이 각각 [1, 2], [3, 4], [5, 6]이면 합친 벡터는?\n6. 블록을 6번 쌓고 블록마다 헤드가 8개면 어텐션 헤드는 모두 몇 개?\n\n### 미니 챌린지\n위치 인코딩 없이 \"dog bites man\"과 \"man bites dog\"을 넣으면 \"bites\"의 셀프 어텐션 출력은 두 문장에서 어떻게 될까요? 그 이유는?\n\n### 코드 (선택)\n```python\nimport numpy as np\npos = np.arange(3)                                   # 자리 0, 1, 2\npe = np.stack([np.sin(pos), np.cos(pos)], axis=1)    # 2칸짜리 위치 벡터\nprint(pe.round(2))             # [[ 0.    1.  ] [ 0.84  0.54] [ 0.91 -0.42]]\n\ncat = np.array([0.5, 0.2])\nprint((cat + pe[1]).round(2), (cat + pe[2]).round(2))   # [1.34 0.74] [ 1.41 -0.22]\n\nprint(np.concatenate([[1, 0], [0.3, 0.7]]))             # [1.  0.  0.3 0.7]\n```\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n1. 헤드를 여러 개 쓰는 이유는?\n2. 위치 인코딩이 없으면 어떤 문제가 생기나요?\n3. O/X: 여러 헤드의 출력은 평균을 내어 합친다.\n4. Transformer 블록 하나에 들어 있는 것을 순서대로 말해 보세요.\n\n---\n\n## 한 줄 정리\n멀티헤드는 서로 다른 관계를 보는 어텐션 여러 벌을 이어 붙이고, 위치 인코딩은 순서를 모르는 어텐션에 자리 번호를 더해 준다.\n\n---\n\n<details>\n<summary>정답 보기 (먼저 풀고 열기!)<\/summary>\n\n**손계산**\n1. 512 ÷ 8 = **64칸**\n2. 1024 ÷ 16 = **64칸**\n3. [1, 1] + [0, 1] = **[1, 2]**\n4. [1, 1] + [0.91, −0.42] = **[1.91, 0.58]**\n5. **[1, 2, 3, 4, 5, 6]**\n6. 6 × 8 = **48개**\n\n**미니 챌린지**\n**똑같습니다.** 두 문장에서 \"bites\"가 보는 단어 묶음(dog, bites, man)이 같고, 셀프 어텐션은 순서 없이 가중 평균만 내기 때문입니다. 누가 물었는지 구별하려면 위치 인코딩이 필요합니다.\n\n**퀴즈**\n1. 헤드마다 다른 관계(주어, 목적어, 옆 단어 등)를 볼 수 있어서요.\n2. 단어의 순서를 구별하지 못해, 단어는 같고 순서만 다른 문장을 같은 것으로 봅니다.\n3. X. 이어 붙입니다(concatenate).\n4. 멀티헤드 셀프 어텐션 → 더하고 정규화 → 작은 신경망 → 더하고 정규화\n<\/details>\n", "link": "논문 연결: 3.2.2절 멀티헤드 어텐션, 3.5절 위치 인코딩, 그림 1 Transformer 전체 구조", "lesson": true}, {"id": "sa01", "short": "셀프 어텐션과 Q·K·V", "md": "# 7단계. 셀프 어텐션과 Q·K·V\n\n30분 · 논문 연결: Vaswani 외 (2017) \"Attention Is All You Need\" **3.2.1절** Scaled Dot-Product Attention. GPT와 Claude의 뼈대인 Transformer 논문\n\n---\n\n## 오늘의 목표\n1. 셀프 어텐션이 \"문장 안의 단어들이 서로를 보는 것\"이라는 걸 설명할 수 있다.\n2. Query, Key, Value 세 역할을 도서관 비유로 말할 수 있다.\n3. 식 $\\text{softmax}(QK^\\top / \\sqrt{d_k})\\,V$가 어텐션의 세 단계와 같다는 것을 알고, 단어 하나에 대해 손으로 계산할 수 있다.\n\n**복습 (1분):** 어텐션의 세 단계는? (답: 점수 → 소프트맥스 → 가중 평균. [어텐션](#att01))\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. \"그것\"은 무엇을 가리킬까\n\"동물이 길을 건너지 않았다. **그것**이 너무 피곤했기 때문이다.\"\n\n\"그것\"은 동물일까요, 길일까요? 사람은 \"피곤했다\"를 보고 동물이라고 압니다. 단어의 뜻은 **같은 문장의 다른 단어들**을 봐야 정해집니다.\n\n[어텐션](#att01)은 디코더가 입력 문장을 보는 방법이었습니다. **셀프 어텐션**은 문장이 **자기 자신**을 봅니다. 모든 단어가 다른 모든 단어를 보고, 관련 있는 단어의 정보를 끌어와 자기 벡터를 고칩니다.\n\n### 1-2. 세 가지 역할: Query, Key, Value\n도서관에서 책을 찾는 장면을 떠올리세요.\n\n| 역할 | 도서관 | 셀프 어텐션 |\n|---|---|---|\n| **Query (질문)** | 내가 적어 낸 검색어 | \"나는 이런 정보를 찾고 있어\" |\n| **Key (열쇠)** | 책등에 붙은 분류 라벨 | \"나는 이런 정보를 갖고 있어\" |\n| **Value (값)** | 책의 실제 내용 | 실제로 건네줄 정보 |\n\n단어마다 원래 벡터 x에 행렬 세 개를 곱해 세 벡터를 만듭니다: $q = W_Q x$, $k = W_K x$, $v = W_V x$. 이 세 행렬이 학습되는 가중치입니다.\n\n### 1-3. 계산: 어텐션과 똑같은 세 단계\n단어 i가 문장을 볼 때\n\n1. **점수**: 내 q와 모든 단어의 k를 내적 → $q_i \\cdot k_j$. 검색어와 라벨이 얼마나 맞는지\n2. **소프트맥스**: 점수를 $\\sqrt{d_k}$로 나눈 뒤 가중치로\n3. **가중 평균**: 가중치로 모든 단어의 v를 평균 → 단어 i의 새 벡터\n\n단어마다 만든 q를 한 줄씩 쌓은 표가 Q, k를 쌓은 표가 K, v를 쌓은 표가 V입니다. 이 표로 한꺼번에 쓰면 논문의 식이 됩니다. 식이 낯설어도 괜찮습니다. 위의 세 단계를 모든 단어에 대해 한 번에 적은 것일 뿐입니다.\n\n$$\\text{Attention}(Q, K, V) = \\text{softmax}\\left(\\frac{QK^\\top}{\\sqrt{d_k}}\\right) V$$\n\n- $QK^\\top$: 모든 단어 쌍의 점수표 (단어 5개면 5 × 5 표)\n- $d_k$: q와 k 벡터의 칸 수. 논문은 64\n- $^\\top$: 행렬을 눕힌다는 표시. \"모든 q와 모든 k를 내적한다\"로 읽으면 됩니다\n\n### 1-4. 왜 √d_k로 나눌까\n벡터의 칸이 많을수록 내적은 큰 숫자가 되기 쉽습니다. 예를 들어 [1, 1] · [1, 1] = 2지만, 1이 64칸이면 내적은 64입니다. 점수가 [20, 0]처럼 크게 벌어지면 소프트맥스가 [1, 0]에 달라붙어, 한 단어만 보고 나머지는 무시합니다. 그 영역에서는 기울기도 거의 0이라 학습이 멈춥니다 ([기울기 소실](#gv01)).\n\n$\\sqrt{d_k}$로 나눠 점수를 적당한 크기로 **식혀 줍니다.** $d_k$ = 64이면 8로 나눕니다.\n\n### 1-5. RNN과 무엇이 다른가\n| | RNN / LSTM | 셀프 어텐션 |\n|---|---|---|\n| 먼 단어와의 거리 | 단어 수만큼의 스텝 | **1** |\n| 계산 | 한 단어씩 차례로 | 모든 단어를 **동시에** |\n| 순서 정보 | 저절로 있음 | 없음 (다음 레슨의 위치 인코딩이 채움) |\n\n동시에 계산할 수 있어서 GPU로 훨씬 큰 데이터를 학습할 수 있게 됐습니다.\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n단어 2개, $d_k$ = 4. 첫째 단어의 질문이 $q_1$이고, 점수(내적)가 이미 계산되어 있다고 합시다.\n\n| | 단어 1의 k | 단어 2의 k |\n|---|---|---|\n| $q_1 \\cdot k_j$ | 4 | 0 |\n\n값 벡터는 $v_1$ = [2, 0], $v_2$ = [0, 2].\n\n1. **식히기:** $\\sqrt{4} = 2$로 나눔 → [2, 0]\n2. **소프트맥스:** $e^2 \\approx 7.39$, $e^0 = 1$, 합 8.39 → **[0.88, 0.12]**\n3. **가중 평균:** 0.88 × [2, 0] + 0.12 × [0, 2] = **[1.76, 0.24]**\n\n단어 1의 새 벡터는 자기 정보 88%에 단어 2의 정보 12%를 섞은 것입니다.\n\n**식히지 않았다면?** 점수 [4, 0] 그대로면 $e^4 \\approx 54.6$ → 가중치 [0.98, 0.02]. 훨씬 한쪽으로 쏠립니다.\n\n---\n\n## 3. 능동 연습 (10분)\n\n### 손계산\n1. $d_k$ = 64이면 점수를 얼마로 나누나요?\n2. q = [1, 2], k = [3, 1]의 점수(내적)는?\n3. 식힌 점수가 [0, 0]이면 가중치는?\n4. 식힌 점수가 [1, 0], 값이 $v_1$ = [4, 0], $v_2$ = [0, 4]일 때 새 벡터는? ($e^1 \\approx 2.72$)\n5. 단어가 6개인 문장의 점수표 $QK^\\top$는 몇 행 몇 열인가요?\n6. 단어 1000개인 글의 점수표에는 칸이 몇 개 있나요? 글이 2배 길어지면 칸은 몇 배가 되나요?\n\n### 미니 챌린지\n\"나는 은행에서 돈을 찾았다\"와 \"나는 은행을 구워 먹었다\". 두 문장의 \"은행\"은 처음에 같은 벡터로 시작합니다. 셀프 어텐션을 지나면 두 벡터는 어떻게 달라질까요?\n\n### 코드 (선택)\n```python\nimport numpy as np\ndef softmax(z):\n    e = np.exp(z - z.max(axis=-1, keepdims=True))\n    return e / e.sum(axis=-1, keepdims=True)\n\nQ = np.array([[2.0, 0.0, 0.0, 0.0],        # 단어 2개, d_k = 4\n              [0.0, 2.0, 0.0, 0.0]])\nK = Q.copy()\nV = np.array([[2.0, 0.0], [0.0, 2.0]])\n\nscores = Q @ K.T                           # [[4. 0.] [0. 4.]]\nA = softmax(scores / np.sqrt(4))           # 가중치 표\nprint(A.round(2))                          # [[0.88 0.12] [0.12 0.88]]\nprint((A @ V).round(2))                    # [[1.76 0.24] [0.24 1.76]]\n```\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n1. 셀프 어텐션에서 문장은 무엇을 보나요?\n2. Query, Key, Value를 도서관 비유로 말해 보세요.\n3. O/X: 점수를 $\\sqrt{d_k}$로 나누는 이유는 계산을 빠르게 하기 위해서다.\n4. 셀프 어텐션이 RNN보다 유리한 점 두 가지는?\n\n---\n\n## 한 줄 정리\n셀프 어텐션은 단어마다 질문(Q)을 내고 모든 단어의 열쇠(K)와 맞춰 본 뒤, 그 가중치로 값(V)을 평균 내어 문맥이 담긴 새 벡터를 만든다.\n\n---\n\n<details>\n<summary>정답 보기 (먼저 풀고 열기!)<\/summary>\n\n**손계산**\n1. √64 = **8**\n2. 1 × 3 + 2 × 1 = **5**\n3. **[0.5, 0.5]**. 점수가 같으면 똑같이 봅니다.\n4. $e^1$ ≈ 2.72, $e^0$ = 1, 합 3.72 → 가중치 [0.73, 0.27] → 0.73 × [4, 0] + 0.27 × [0, 4] = **[2.92, 1.08]**\n5. **6행 6열** (모든 단어 쌍)\n6. 1000 × 1000 = **100만 개**. 2배 길어지면 **4배**. 긴 글에서 계산이 무거워지는 이유입니다.\n\n**미니 챌린지**\n첫 문장의 \"은행\"은 \"돈\", \"찾았다\"에 큰 가중치를 주어 금융 기관 쪽으로, 둘째 문장의 \"은행\"은 \"구워\", \"먹었다\"를 끌어와 열매 쪽으로 벡터가 움직입니다. 같은 글자가 문맥에 따라 **다른 벡터**가 됩니다.\n\n**퀴즈**\n1. 자기 자신, 즉 같은 문장의 모든 단어를 봅니다.\n2. Query는 검색어, Key는 책에 붙은 라벨, Value는 책의 내용입니다.\n3. X. 점수가 너무 커져 소프트맥스가 한쪽으로 쏠리고 기울기가 사라지는 것을 막기 위해서입니다.\n4. 먼 단어도 한 번에 연결되고(거리 1), 모든 단어를 동시에 계산할 수 있습니다.\n<\/details>\n", "link": "논문 연결: Vaswani 외 (2017) 3.2.1절 Scaled Dot-Product Attention. GPT와 Claude의 뼈대인", "lesson": true}, {"id": "smp01", "short": "온도와 샘플링: 다음 토큰을 뽑는 법", "md": "# 7단계. 온도와 샘플링: 다음 토큰을 뽑는 법\n\n30분 · 논문 연결: Holtzman 외 (2020) \"The Curious Case of Neural Text Degeneration\" (top-p), Fan, Lewis, Dauphin (2018) \"Hierarchical Neural Story Generation\" (top-k). 같은 질문에 챗봇이 매번 조금씩 다르게 답하는 이유\n\n---\n\n## 오늘의 목표\n1. greedy와 샘플링의 차이를 말하고, 온도가 확률 막대를 어떻게 바꾸는지 손으로 계산할 수 있다.\n2. top-k와 top-p가 후보를 어떻게 잘라 내는지 계산할 수 있다.\n3. 사실을 묻는 일과 창작하는 일에 맞는 설정을 고르고 이유를 말할 수 있다.\n\n**복습 (1분):** GPT가 사전학습에서 배우는 일은? (답: 앞 토큰들을 보고 다음 토큰 맞히기. [BERT와 GPT](#bg01))\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 확률은 나왔다. 이제 무엇을 쓸까\nGPT는 한 걸음마다 다음 [토큰](#tok01) 후보 전체에 확률을 매깁니다. 그다음 그중 **하나를 골라** 글에 붙이고, 다시 다음 걸음으로 갑니다. 오늘은 \"어떻게 고르나\"입니다.\n\n[Day 12](#day12)의 **greedy**는 늘 1등만 고릅니다. 번역처럼 정답이 거의 하나인 일에는 좋습니다. 하지만 긴 글을 쓰게 하면 밋밋해지고 같은 말을 되풀이하는 경향이 있습니다. Holtzman 외(2020)는 확률이 가장 큰 글을 찾는 방법(greedy, [빔 서치](#day12))이 오히려 이렇게 **망가진 글**을 낸다고 보고했습니다.\n\n### 1-2. 샘플링: 확률대로 제비뽑기\n**샘플링**은 확률을 그대로 제비뽑기 비율로 씁니다. 후보 확률이 [0.67, 0.24, 0.09]라면 100번 뽑을 때 1등이 약 67번, 2등이 약 24번, 3등이 약 9번 나옵니다. 그래서 같은 질문에도 답이 조금씩 달라집니다.\n\n문제는 꼬리입니다. 확률이 아주 작은 후보도 수만 개가 모이면 꽤 자주 뽑혀서, 엉뚱한 토큰이 끼어듭니다. 아래 세 가지 손잡이가 이것을 조절합니다.\n\n### 1-3. 온도: 확신 다이얼\n[Day 05](#day05) 도전 과제 (a)에서 만져 본 그 **temperature**입니다. 소프트맥스에 넣기 전에 점수를 **온도 T로 나눕니다.**\n\n$$p = \\text{softmax}(z / T)$$\n\n- T < 1: 점수 차이가 커져 1등이 더 높아집니다. 막대가 **뾰족**해집니다\n- T = 1: 원래 확률 그대로\n- T > 1: 점수 차이가 줄어 막대가 **평평**해집니다. 낮은 후보도 자주 뽑힙니다\n- T → 0: 1등이 확률 1에 다가가 greedy와 같아집니다\n\n확신 다이얼이라고 생각하세요. 다이얼을 내리면 모델이 \"1등 말고는 안 쓴다\"고 고집하고, 올리면 \"이것도 저것도 괜찮다\"고 느슨해집니다.\n\n> 같은 글자, 다른 뜻: [Day 04](#day04)의 $\\hat T$에서 T는 **번역문**이었습니다($\\hat T$는 모델이 고른 번역문). 오늘의 T는 **온도**(temperature)라는 숫자 하나입니다.\n\n### 1-4. top-k: 위에서 k개만 남기기\n확률이 큰 순서로 **k개만 남기고** 나머지는 0으로 만든 뒤, 남은 것을 다시 합이 1이 되게 나눕니다. Fan 외(2018)는 이야기를 쓰게 할 때 k = 10을 썼습니다.\n\n약점은 k가 고정이라는 점입니다. 모델이 확신할 때(1등이 0.95)는 k개도 너무 많아 엉뚱한 후보가 섞이고, 헷갈릴 때(비슷한 후보가 20개)는 k개가 너무 적습니다.\n\n> 같은 이름, 다른 대상: 나중에 11단계의 MoE 챕터에서도 top-k가 나옵니다. 거기서는 \"확률이 큰 **전문가** k명을 골라 그 출력을 **모두 섞어** 씁니다\". 오늘의 top-k는 \"다음 **토큰 후보** k개를 남겨 그중 **하나를 뽑습니다**\". 위에서 k개를 고르는 방법만 같고, 고르는 대상과 그다음에 하는 일이 다릅니다.\n\n### 1-5. top-p: 누적 확률 p까지만 남기기\nHoltzman 외(2020)의 **top-p**(nucleus 샘플링이라고도 함)는 개수 대신 **확률의 합**으로 자릅니다. 큰 것부터 막대를 하나씩 쌓다가, 쌓은 합이 **p에 닿거나 넘는 순간** 멈추고 거기까지만 남깁니다.\n\n모델이 확신하면 한두 개만, 헷갈리면 여러 개가 남습니다. 남는 개수가 상황에 맞게 저절로 바뀌는 것이 top-k보다 나은 점입니다.\n\n### 1-6. 순서와 쓰임새\n보통 순서는 **온도로 막대 모양 바꾸기 → top-k나 top-p로 자르기 → 남은 후보에서 뽑기**입니다.\n\n| 하는 일 | 흔히 쓰는 출발점 | 이유 |\n|---|---|---|\n| 사실 질문, 코드, 계산 | 온도 낮게 (0~0.3) | 답이 거의 하나. 매번 같은 답이 좋음 |\n| 이야기, 시, 아이디어 | 온도 0.7~1 + top-p 0.9 안팎 | 다양함이 좋되 엉뚱한 꼬리는 자름 |\n\n서비스와 모델마다 기본값은 다르니 표의 숫자는 출발점으로만 보세요. 그리고 **확률이 높다고 사실인 것은 아닙니다.** 모델이 틀린 내용에 높은 확률을 주면, 온도 0은 그 틀린 답을 매번 똑같이 냅니다. (모델이 그럴듯하게 지어내는 문제는 나중에 RAG 챕터에서 다룹니다.)\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n**쓸 값:** 점수 z = [2, 1, 0]. e ≈ 2.718, e² ≈ 7.389, e⁴ ≈ 54.6, $e^{0.5}$ ≈ 1.649\n\n**1. 온도 T = 1.** e^z = [7.389, 2.718, 1], 합 11.107 → **[0.67, 0.24, 0.09]** ([Day 05](#day05) 예제와 같음)\n\n**2. 온도 T = 0.5.** z/T = [4, 2, 0] → [54.6, 7.389, 1], 합 63.0 → **[0.87, 0.12, 0.02]**. 1등이 더 높아졌습니다.\n\n**3. 온도 T = 2.** z/T = [1, 0.5, 0] → [2.718, 1.649, 1], 합 5.367 → **[0.51, 0.31, 0.19]**. 평평해졌습니다.\n\n(2번과 3번은 반올림 때문에 합이 1.01로 보입니다. 반올림 전에는 정확히 1입니다.)\n\n**4. top-k (k = 2).** 확률 [0.5, 0.3, 0.15, 0.05]에서 위 2개만 남김 → 합 0.8로 나눔 → **[0.625, 0.375]**\n\n**5. top-p (p = 0.9).** 같은 확률에서 큰 것부터 쌓기: 0.5 → 0.8 → **0.95**. 0.95가 0.9를 넘었으니 3개에서 멈춤 → 합 0.95로 나눔 → **[0.53, 0.32, 0.16]** (이것도 반올림 때문에 합이 1.01)\n\n---\n\n## 직접 만져보기\n\n<div class=\"widget\" data-w=\"smp01\"><\/div>\n\n## 3. 능동 연습 (10분)\n\n아래 실습 위젯에서 \"오늘 날씨가 ___\" 다음 토큰 6개의 확률 막대를 보며 온도, top-k, top-p를 움직여 보세요. 잘린 후보는 흐리게 바뀝니다. \"10번 뽑기\"로 T = 0.2와 T = 1.5의 결과를 비교하고, 마지막에 상황별 설정 문제를 풀어 보세요.\n\n### 손계산 (e ≈ 2.718, e⁴ ≈ 54.6)\n1. 점수 [2, 0], 온도 T = 2일 때 1등의 확률은? (소수 둘째 자리까지)\n2. 점수 [2, 0], 온도 T = 0.5일 때 1등의 확률은?\n3. 확률 [0.4, 0.3, 0.2, 0.1]에 top-k (k = 2)를 쓰면?\n4. 같은 확률에 top-p (p = 0.8)를 쓰면 몇 개가 남고, 다시 나눈 확률은?\n5. 확률 [0.92, 0.05, 0.02, 0.01]에 top-p (p = 0.9)를 쓰면 몇 개가 남나요?\n6. 온도를 0에 아주 가깝게 내리면 어떤 방법과 같아지나요?\n7. 사실을 묻는 고객 상담 챗봇과 시를 쓰는 앱. 온도를 더 높게 둘 쪽은?\n\n### 미니 챌린지\n확신할 때의 확률 [0.92, 0.05, 0.02, 0.01]과 헷갈릴 때의 확률 [0.3, 0.25, 0.2, 0.15, 0.1]이 있습니다. top-k (k = 3)와 top-p (p = 0.85)는 각각 몇 개를 남기나요? 어느 쪽이 상황에 맞게 움직이나요?\n\n### 코드 (선택)\n```python\nimport numpy as np\ndef softmax(z): e = np.exp(z - z.max()); return e / e.sum()\n\nz = np.array([2.0, 1.0, 0.0])\nfor T in [1, 0.5, 2]:\n    print(T, softmax(z / T).round(2))          # [0.67 0.24 0.09] / [0.87 0.12 0.02] / [0.51 0.31 0.19]\n\np = np.array([0.5, 0.3, 0.15, 0.05])         # 큰 순서로 정렬돼 있다고 가정\nk = 2\nprint((p[:k] / p[:k].sum()).round(3))         # top-k → [0.625 0.375]\nn = np.searchsorted(np.cumsum(p), 0.9) + 1    # 누적 합이 0.9에 닿는 자리까지\nprint(n, (p[:n] / p[:n].sum()).round(2))      # top-p → 3 [0.53 0.32 0.16]\nprint(np.random.choice(n, size=10, p=p[:n] / p[:n].sum()))   # 10번 뽑기\n```\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n1. greedy와 샘플링의 차이는?\n2. 온도를 높이면 확률 막대는 어떻게 바뀌나요?\n3. O/X: 온도를 0에 가깝게 하면 모델의 답이 사실이라고 믿어도 된다.\n4. top-k와 top-p는 무엇으로 후보를 자르나요?\n5. top-p가 top-k보다 나은 점은?\n\n---\n\n## 한 줄 정리\n샘플링은 확률대로 제비를 뽑고, 온도는 막대를 뾰족하게(낮게)·평평하게(높게) 만들며, top-k는 개수로, top-p는 누적 확률로 엉뚱한 꼬리를 잘라 낸다.\n\n---\n\n<details>\n<summary>정답 보기 (먼저 풀고 열기!)<\/summary>\n\n**손계산**\n1. z/T = [1, 0] → 2.718 ÷ (2.718 + 1) ≈ **0.73**\n2. z/T = [4, 0] → 54.6 ÷ 55.6 ≈ **0.98**\n3. 위 2개 [0.4, 0.3]을 합 0.7로 나눔 → **[0.57, 0.43]**\n4. 0.4 → 0.7 → 0.9 (0.8을 넘음) → **3개**, 합 0.9로 나눔 → **[0.44, 0.33, 0.22]** (반올림)\n5. 첫 막대 0.92가 이미 0.9를 넘으니 **1개**. 이때는 greedy와 같습니다.\n6. **greedy** (늘 1등만 고르기)\n7. **시를 쓰는 앱.** 상담 챗봇은 같은 질문에 늘 같은 답이 나오도록 온도를 낮게 둡니다.\n\n**미니 챌린지**\ntop-k는 두 경우 모두 **3개**를 남깁니다. top-p는 확신할 때 0.92에서 바로 멈춰 **1개**, 헷갈릴 때 0.3 → 0.55 → 0.75 → 0.9에서 멈춰 **4개**를 남깁니다. 상황에 맞게 움직이는 쪽은 **top-p**입니다.\n\n**퀴즈**\n1. greedy는 늘 확률 1등을 고르고, 샘플링은 확률을 비율로 삼아 제비를 뽑습니다.\n2. 평평해집니다. 낮은 후보도 자주 뽑힙니다.\n3. X. 온도는 고르는 방식만 바꿉니다. 모델이 틀린 답에 높은 확률을 주면 그 틀린 답을 매번 냅니다.\n4. top-k는 개수(위에서 k개), top-p는 누적 확률(합이 p에 닿을 때까지)\n5. 모델이 확신하면 적게, 헷갈리면 많이 남겨 후보 수가 상황에 맞게 바뀝니다.\n<\/details>\n", "link": "논문 연결: Holtzman 외 (2020) (top-p), Fan, Lewis, Dauphin (2018) (top-k). 같은 질문에 ", "lesson": true}, {"id": "tok01", "short": "토큰과 컨텍스트 윈도우: 모델이 글을 자르는 법", "md": "# 7단계. 토큰과 컨텍스트 윈도우: 모델이 글을 자르는 법\n\n30분 · 논문 연결: Sennrich, Haddow, Birch (2016) \"Neural Machine Translation of Rare Words with Subword Units\". 처음 보는 단어도 조각으로 읽게 만든 BPE\n\n---\n\n## 오늘의 목표\n1. 토큰이 무엇이고, 왜 단어나 글자가 아니라 \"단어 조각(서브워드)\"을 쓰는지 설명할 수 있다.\n2. BPE의 \"가장 자주 붙어 나오는 쌍 합치기\"를 손으로 두세 번 할 수 있다.\n3. 컨텍스트 윈도우를 토큰 수로 계산하고, 길이에 한계가 있는 이유를 말할 수 있다.\n\n**복습 (1분):** 셀프 어텐션은 단어의 순서를 모릅니다. 그래서 Transformer는 단어 벡터에 무엇을 더하나요? (답: 자리마다 다른 위치 벡터. [멀티헤드와 위치 인코딩](#mh01))\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 지금까지 대충 넘어간 말: 토큰\n[Day 03](#day03)에서 \"Je t'aime beaucoup &lt;EOS&gt;\"를 **4토큰**이라고 불렀습니다. [Day 07](#day07)과 [Day 08](#day08)에서도 \"토큰별 크로스엔트로피\", \"전체 토큰 수\"라고 썼습니다. 그때는 \"토큰 ≈ 단어 하나\"로 읽어도 충분했습니다.\n\n정확히는, **토큰**은 모델이 글을 읽고 쓰는 **조각 하나**입니다. 단어일 수도, 단어의 일부일 수도, 문장 끝 표시 &lt;EOS&gt; 같은 특수 기호일 수도 있습니다. 모델은 글자를 직접 보지 않습니다. 글을 토큰으로 자르고, 토큰마다 번호를 붙이고, 그 번호로 [임베딩](#day02) 행렬의 한 열을 꺼냅니다. 글을 토큰으로 자르는 도구를 **토크나이저**라고 합니다.\n\n### 1-2. 단어 단위의 문제: 사전에 없는 단어\nSeq2Seq 논문은 출력 어휘를 단어 **80,000개**로 정했고([Day 05](#day05)의 80,000칸 소프트맥스, [Day 12](#day12)의 빔 서치가 고르던 그 단어들), 나머지는 모두 `UNK`(모르는 단어)로 바꿨습니다([논문 코스](#course-seq2seq)의 논문 사실 카드). 사람 이름, 새로 생긴 말, 드문 활용형은 전부 `UNK` 하나로 뭉개집니다. 번역에 `UNK`가 나오면 그 자리는 비어 버립니다.\n\n그럼 글자 단위로 자르면? 모르는 단어는 사라지지만, 문장 하나가 수백 토큰이 되고 글자 하나에는 뜻이 거의 없어서 모델이 할 일이 많아집니다.\n\n### 1-3. 서브워드: 레고 덩어리\n가운데 길이 **서브워드**(단어 조각)입니다. 자주 쓰는 단어는 통째로 한 토큰, 드문 단어는 아는 조각 몇 개로 나눕니다.\n\n레고를 떠올리세요. 자주 만드는 모양은 미리 붙여 둔 덩어리로 보관하고, 처음 보는 모양은 덩어리와 작은 블록을 조립해 만듭니다. 그러면 **어휘 크기는 정해 둔 만큼만** 쓰면서도 **어떤 단어든** 쓸 수 있습니다.\n\n### 1-4. BPE: 가장 자주 붙어 나오는 쌍을 합친다\nSennrich 외(2016)는 서브워드를 만드는 데 **BPE**(바이트 쌍 인코딩)를 썼습니다. 원래 파일 압축 방법이었습니다. 규칙은 단순합니다.\n\n1. 모든 단어를 글자로 쪼갭니다.\n2. 붙어 있는 두 토큰 쌍마다 몇 번 나오는지 셉니다(단어가 5번 나오면 그 안의 쌍도 5번).\n3. 가장 많이 나온 쌍을 하나로 합쳐 새 토큰으로 삼습니다. **동점이면 먼저 나온 쌍**을 합칩니다.\n4. 정해 둔 횟수만큼 2~3을 반복합니다.\n\n합친 쌍은 순서대로 기록해 둡니다. 새 글을 자를 때도 이 순서대로 합칩니다. 어휘 크기 = 처음 글자 수 + 합친 횟수입니다(특수 기호가 있으면 그만큼 더). GPT-2의 어휘 50,257개는 바이트 256개 + 합치기 50,000번 + 특수 기호 1개입니다.\n\n### 1-5. 컨텍스트 윈도우: 책상 넓이\n**컨텍스트 윈도우**는 모델이 한 번에 볼 수 있는 토큰 수의 상한입니다. **입력과 출력을 합친** 수입니다. 책상 위에 펼쳐 둔 것만 보며 일하는 사람과 같아서, 책상이 꽉 차면 무언가를 치워야 합니다. GPT-3(2020)의 윈도우는 2,048토큰이었습니다. 지금 모델들은 훨씬 길지만 한계는 여전히 있습니다.\n\n왜 한계가 있을까요? [셀프 어텐션](#sa01)은 모든 토큰이 다른 모든 토큰과 점수를 냅니다. 토큰이 1,000개면 1,000 × 1,000 = 100만 개의 점수입니다. 길이를 2배로 늘리면 점수는 **4배**가 됩니다.\n\n길다고 다 잘 쓰는 것도 아닙니다. Liu 외(2024) \"Lost in the Middle\"은 긴 입력의 **가운데**에 둔 정보를 모델이 처음이나 끝에 둔 정보보다 덜 활용하는 경향을 보고했습니다.\n\n> 토큰 수는 토크나이저마다 다릅니다. 영어 글을 많이 보고 만든 토크나이저는 한국어를 더 잘게 자르는 경우가 많아서, 같은 뜻의 글도 언어에 따라 토큰 수가 달라집니다. 정확한 수는 그 모델의 토크나이저로 직접 세어 봐야 합니다.\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n**쓸 값:** Sennrich 외(2016) 알고리즘 1의 단어와 빈도\n\n| 단어 | low | lower | newest | widest |\n|---|---|---|---|---|\n| 나온 횟수 | 5 | 2 | 6 | 3 |\n\n**0. 글자로 쪼개기.** 토큰 수 = 3×5 + 5×2 + 6×6 + 6×3 = **79**\n\n**1. 쌍 세기.** e+s는 newest(6)와 widest(3)에 있어 **9**, s+t도 **9**, w+e는 lower(2) + newest(6) = **8**, l+o와 o+w는 low(5) + lower(2) = **7**.\ne+s와 s+t가 동점입니다. 규칙대로 **먼저 나온 e+s**를 합칩니다 → `es`. newest와 widest에서 한 토큰씩 줄어 79 − 9 = **70**.\n\n**2. 다시 세기.** 이제 es+t가 **9**로 1등 → `est`. 토큰 수 **61**.\n\n**3.** l+o와 o+w가 7로 동점 → 먼저 나온 l+o → `lo`. 토큰 수 **54**.\n\n**4.** lo+w가 7로 1등 → `low`. 토큰 수 **47**.\n\n네 번 합쳐 `est`와 `low`라는 조각이 생겼습니다. 이제 이 단어 목록에 **한 번도 없던** 단어 \"lowest\"가 와도 l-o-w-e-s-t를 같은 순서로 합치면 `low` + `est`, **2토큰**으로 읽습니다. `UNK`가 없습니다.\n\n**토큰 예산.** 윈도우 8,000토큰에 시스템 지시 500 + 붙여 넣은 문서 6,000 = 6,500. 답에 쓸 수 있는 것은 최대 8,000 − 6,500 = **1,500토큰**.\n\n> (선택) 논문의 실제 코드는 단어 끝에 표시 `<\/w>`를 붙입니다(\"low\"의 끝 w와 \"lower\" 가운데의 w를 구별하려고). 그러면 t+`<\/w>`도 9가 되어 세 쌍이 동점입니다. 오늘은 단순하게 이 표시를 뺐습니다.\n\n---\n\n## 직접 만져보기\n\n<div class=\"widget\" data-w=\"tok01\"><\/div>\n\n## 3. 능동 연습 (10분)\n\n아래 실습 위젯의 첫 화면에서 위 예제의 합치기를 직접 해 보세요. 가장 많이 나오는 쌍을 누르면 칩이 합쳐지고 토큰 수가 줄어듭니다(동점인 쌍은 어느 쪽을 눌러도 정답). 두 번째 화면 \"책상 넓이\"에서는 지시, 문서, 답의 길이를 바꾸며 윈도우가 넘치면 어떻게 되는지 보세요.\n\n### 손계산\n단어와 빈도: hat 4번, cat 6번, cats 3번, at 2번\n1. 글자로 쪼갰을 때 전체 토큰 수는?\n2. 가장 많이 나오는 쌍과 그 횟수는?\n3. 2번의 쌍을 합친 뒤 전체 토큰 수는?\n4. 그다음에 합칠 쌍은? 합친 뒤 \"cats\"는 몇 토큰인가요?\n5. 윈도우 4,000토큰, 시스템 지시 300, 문서 2,500. 답에 쓸 수 있는 최대 토큰은?\n6. 토큰 2,000개에 셀프 어텐션을 하면 점수는 몇 개? 토큰이 4,000개가 되면 몇 배?\n7. 위 예제의 합치기 4번을 마친 뒤, 새 단어 \"newer\"(n-e-w-e-r)는 몇 토큰으로 읽히나요?\n\n### 미니 챌린지\n어휘를 아주 작게(글자만) 하면 무엇이 나빠지고, 아주 크게(단어 수백만 개) 하면 무엇이 나빠질까요? 1-2, 1-3, 1-5를 근거로 한 가지씩 써 보세요.\n\n### 코드 (선택)\n```python\nfrom collections import Counter\nwords = {\"low\": 5, \"lower\": 2, \"newest\": 6, \"widest\": 3}\nvocab = {tuple(w): c for w, c in words.items()}          # 글자로 쪼개기\nfor step in range(4):\n    pairs = Counter()\n    for w, c in vocab.items():\n        for a, b in zip(w, w[1:]):\n            pairs[(a, b)] += c                            # 단어 빈도만큼 세기\n    best = max(pairs, key=pairs.get)                      # 동점이면 먼저 나온 쌍\n    new = {}\n    for w, c in vocab.items():\n        out, i = [], 0\n        while i < len(w):\n            if w[i:i+2] == best: out.append(w[i] + w[i+1]); i += 2\n            else: out.append(w[i]); i += 1\n        new[tuple(out)] = c\n    vocab = new\n    print(best, pairs[best], sum(len(w) * c for w, c in vocab.items()))\n# ('e','s') 9 70 / ('es','t') 9 61 / ('l','o') 7 54 / ('lo','w') 7 47\n```\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n1. 토큰이란?\n2. 단어 단위 토큰의 가장 큰 문제는? 글자 단위의 문제는?\n3. BPE가 매번 합치는 쌍은 무엇인가요? 동점이면?\n4. O/X: 컨텍스트 윈도우는 입력 글의 길이만 센다.\n5. 컨텍스트 윈도우를 2배로 늘리면 셀프 어텐션의 점수 개수는?\n\n---\n\n## 한 줄 정리\n모델은 글을 토큰이라는 조각으로 읽고, BPE는 가장 자주 붙어 나오는 쌍을 합쳐 조각을 만들어 처음 보는 단어도 읽게 하며, 컨텍스트 윈도우는 입력과 출력을 합친 토큰 수의 상한이다.\n\n다음 챕터의 GPT가 \"다음 단어를 맞힌다\"고 할 때, 그 단어는 사실 토큰입니다.\n\n---\n\n<details>\n<summary>정답 보기 (먼저 풀고 열기!)<\/summary>\n\n**손계산**\n1. 3×4 + 3×6 + 4×3 + 2×2 = 12 + 18 + 12 + 4 = **46**\n2. a+t: hat(4) + cat(6) + cats(3) + at(2) = **15번** (c+a는 9, h+a는 4, t+s는 3)\n3. 46 − 15 = **31**\n4. c+at(9번)을 합쳐 `cat`. \"cats\"는 `cat` + `s` = **2토큰**\n5. 4,000 − 300 − 2,500 = **1,200토큰**\n6. 2,000 × 2,000 = **400만 개**. 4,000개면 1,600만 개로 **4배**\n7. 합친 쌍(es, est, lo, low)이 하나도 맞지 않아 n, e, w, e, r 그대로 **5토큰**. 단어 목록에 없는 조각은 글자로 남습니다. 합치기를 더 하면(예: n+e, w+e) 줄어듭니다.\n\n**미니 챌린지**\n글자만 쓰면 문장이 아주 많은 토큰이 되어 윈도우를 빨리 채우고 계산도 커집니다(1-5). 단어를 수백만 개 넣으면 임베딩 행렬이 거대해지고, 드문 단어는 학습 데이터에 몇 번 안 나와 잘 배우지 못하며, 그래도 사전 밖 단어는 `UNK`가 됩니다(1-2). 서브워드는 그 사이에서 균형을 잡습니다(1-3).\n\n**퀴즈**\n1. 모델이 글을 읽고 쓰는 조각 하나. 단어, 단어 조각, 특수 기호일 수 있습니다.\n2. 단어 단위는 사전에 없는 단어가 `UNK`로 뭉개집니다. 글자 단위는 문장이 너무 길어지고 조각 하나에 뜻이 거의 없습니다.\n3. 지금 가장 많이 붙어 나오는 두 토큰 쌍. 동점이면 먼저 나온 쌍.\n4. X. 입력과 출력을 합친 토큰 수입니다.\n5. 4배\n<\/details>\n", "link": "논문 연결: Sennrich, Haddow, Birch (2016) . 처음 보는 단어도 조각으로 읽게 만든 BPE", "lesson": true}, {"id": "dif01", "short": "확산 모델: 잡음을 지워 가며 그리기", "md": "# 8단계. 확산 모델: 잡음을 지워 가며 그리기\n\n30분 · 논문 연결: Ho, Jain, Abbeel (2020) \"Denoising Diffusion Probabilistic Models\" (DDPM). 지금의 이미지 생성 AI가 쓰는 방법\n\n---\n\n## 오늘의 목표\n1. 확산 모델의 두 방향(잡음 더하기, 잡음 지우기)을 설명할 수 있다.\n2. 잡음을 한 걸음 더하는 식을 손으로 계산할 수 있다.\n3. 모델이 \"더해진 잡음을 맞히도록\" 학습한다는 것과 그 손실을 계산할 수 있다.\n\n**복습 (1분):** VAE에서 z를 뽑던 식은? (답: z = μ + σ × ε. [VAE](#vae01))\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 잉크 한 방울\n물컵에 잉크를 떨어뜨리면 서서히 퍼져 온 물이 뿌옇게 됩니다. 이 과정은 쉽습니다. **거꾸로**, 뿌연 물에서 잉크 방울을 되살리는 것은 어렵습니다.\n\n확산 모델은 이 거꾸로 가는 법을 배웁니다. 한 번에 되돌리기는 어려우니 **아주 조금씩, 여러 번** 되돌립니다.\n\n### 1-2. 정방향: 조금씩 잡음 더하기 (학습 없음)\n그림 $x_0$에 잡음을 조금씩 섞어 $x_1, x_2, \\dots, x_T$를 만듭니다.\n\n$$x_t = \\sqrt{1 - \\beta}\\; x_{t-1} + \\sqrt{\\beta}\\; \\varepsilon, \\quad \\varepsilon \\sim \\mathcal{N}(0, 1)$$\n\n- β(베타): 한 걸음에 섞는 잡음의 양 (0과 1 사이의 작은 수)\n- 원래 그림은 $\\sqrt{1 - \\beta}$배로 **옅어지고**, 잡음이 $\\sqrt{\\beta}$배만큼 **더해집니다**\n\n루트는 섞은 뒤에도 전체 크기(분산)가 1로 유지되게 하는 장치입니다. 지금은 \"제곱해서 더하면 1이 되는 두 비율\"(0.8² + 0.6² = 1)로만 기억하세요. T는 마지막 걸음 번호입니다.\n\n걸음을 거듭하면 원래 그림은 사라지고 **순수한 잡음**만 남습니다. DDPM은 T = 1000걸음을 썼습니다.\n\n### 1-3. 한 번에 건너뛰기\n걸음마다 계산할 필요 없이, 원본에서 t번째로 **바로** 갈 수 있습니다.\n\n$$x_t = \\sqrt{\\bar\\alpha_t}\\; x_0 + \\sqrt{1 - \\bar\\alpha_t}\\; \\varepsilon$$\n\nα = 1 − β라고 부릅니다. 이것을 t번 곱한 것이 $\\bar\\alpha_t$(알파 바)이고, 위의 줄은 \"지금까지 다 곱했다\"는 표시입니다. β = 0.2로 2걸음이면 0.8 × 0.8 = 0.64. 원본에 실제로 곱해지는 수는 그 제곱근 $\\sqrt{\\bar\\alpha_t}$ = 0.8입니다.\n\n### 1-4. 역방향: 잡음을 맞혀서 지우기 (여기를 학습)\n신경망에게 잡음 섞인 그림 $x_t$와 걸음 번호 t를 주고, **\"여기에 섞인 잡음 ε이 무엇이었는지\"** 맞히게 합니다.\n\n$$\\text{손실} = (\\varepsilon - \\hat\\varepsilon)^2$$\n\n학습 한 번의 순서\n1. 진짜 그림 $x_0$을 고른다\n2. 걸음 t와 잡음 ε을 무작위로 뽑는다\n3. 1-3의 식으로 $x_t$를 만든다\n4. 모델이 $\\hat\\varepsilon$을 예측하고, 실제 ε과의 차이를 줄인다\n\n정답(ε)을 **우리가 직접 섞었으니** 사람이 정답을 달 필요가 없습니다. [GAN](#gan01)처럼 두 모델이 싸우지도 않아 학습이 안정적입니다.\n\n### 1-5. 그림 만들기\n1. 순수한 잡음 $x_T$에서 시작\n2. 모델이 잡음을 예측 → 조금 지움 → $x_{T-1}$\n3. 1000번 반복 → 새 그림 $x_0$\n\n조각가가 돌덩이에서 \"그림이 아닌 부분\"을 조금씩 깎아 내는 것과 같습니다.\n\n| | VAE | GAN | 확산 모델 |\n|---|---|---|---|\n| 배우는 법 | 압축 후 복원 | 생성자 대 판별자 | 잡음 맞히기 |\n| 학습 안정성 | 안정 | 불안정 | 안정 |\n| 그림 품질 | 흐릿한 편 | 선명 | 선명하고 다양 |\n| 만드는 속도 | 한 번에 | 한 번에 | **여러 걸음 (느림)** |\n\n글로 그림을 주문하는 서비스들은 확산 모델에 글의 뜻을 [어텐션](#att01)으로 넣어 줍니다.\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n그림의 점 하나의 값이 $x_0$ = 1.0이라고 합시다.\n\n**한 걸음 더하기.** β = 0.36 (그러면 √0.64 = 0.8, √0.36 = 0.6), 뽑힌 ε = 0.5\n\n$x_1$ = 0.8 × 1.0 + 0.6 × 0.5 = 0.8 + 0.3 = **1.1**\n\n**건너뛰기.** 한 걸음이라 $\\bar\\alpha$ = 1 − 0.36 = 0.64. ε = 0.5이면 같은 계산입니다: 0.8 × 1.0 + 0.6 × 0.5 = **1.1**\n\n**손실.** 실제 ε = 0.5, 모델 예측 $\\hat\\varepsilon$ = 0.3 → (0.5 − 0.3)² = **0.04**\n\n**되돌리기.** 모델이 잡음을 정확히 맞혔다면($\\hat\\varepsilon$ = 0.5)\n\n$x_0$ ≈ (1.1 − 0.6 × 0.5) ÷ 0.8 = 0.8 ÷ 0.8 = **1.0**. 원본이 되살아납니다. 건너뛰기 식을 $x_0$에 대해 거꾸로 푼 것입니다. 잡음을 정확히 맞혔을 때만 이렇게 한 번에 됩니다. 실제 모델의 예측은 조금씩 틀리므로, 조금만 지우고 다시 묻기를 반복합니다.\n\n**원본이 사라지는 속도.** 원본에 곱해지는 수가 걸음마다 0.8배가 되면 10걸음 뒤 $0.8^{10} \\approx 0.11$. 원본 성분은 0.11배만 남습니다.\n\n---\n\n## 3. 능동 연습 (10분)\n\nβ = 0.36 (√(1 − β) = 0.8, √β = 0.6)으로 계산하세요.\n\n### 손계산\n1. $x_0$ = 2.0, ε = 1.0일 때 $x_1$은?\n2. $x_0$ = 0.5, ε = −1.0일 때 $x_1$은?\n3. 실제 잡음 ε = 1.0, 예측 $\\hat\\varepsilon$ = 0.7일 때 손실은?\n4. $x_1$ = 2.2이고 모델이 $\\hat\\varepsilon$ = 1.0이라고 맞혔습니다. 되돌린 $x_0$은?\n5. β = 0.2로 3걸음 가면 $\\bar\\alpha$는? (0.8을 세 번 곱하기)\n6. $x_0$ = 1.0에서 걸음마다 ε = 0.5가 뽑혔다고 하고 두 걸음 가 보세요. $x_2$는? 원본에 곱해진 수는 얼마가 됐나요?\n\n### 미니 챌린지\n왜 \"잡음에서 그림으로 한 번에\" 가지 않고 1000걸음으로 나눌까요? [기울기 소실](#gv01)의 \"0.9를 50번 곱하기\"와는 반대로, 여기서는 여러 걸음이 왜 도움이 되는지 생각해 보세요.\n\n### 코드 (선택)\n```python\nimport numpy as np\nrng = np.random.default_rng(0)\nx = np.array([1.0, -1.0, 0.5])              # \"그림\" (점 3개)\nbeta = 0.2\nfor t in range(1, 11):\n    x = np.sqrt(1 - beta) * x + np.sqrt(beta) * rng.normal(size=3)\nprint(x.round(2))                            # 잡음이 많이 섞인 값\nprint(0.8 ** 10, np.sqrt(0.8 ** 10))         # 0.107... 0.327...  알파 바와, 원본에 곱해진 수(그 제곱근)\n\nx0, eps, abar = 1.0, 0.5, 0.64\nxt = np.sqrt(abar) * x0 + np.sqrt(1 - abar) * eps\nprint(xt, (xt - np.sqrt(1 - abar) * eps) / np.sqrt(abar))   # 1.1 1.0\n```\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n1. 정방향과 역방향 과정은 각각 무엇을 하나요?\n2. 확산 모델의 신경망이 맞히는 것은?\n3. O/X: 정방향 과정(잡음 더하기)에도 학습할 가중치가 있다.\n4. 확산 모델의 가장 큰 단점은?\n\n---\n\n## 한 줄 정리\n확산 모델은 그림에 잡음을 조금씩 섞는 과정을 거꾸로 돌리는 법을 배운다. 섞인 잡음을 맞히도록 학습하고, 순수한 잡음에서 조금씩 지워 가며 새 그림을 만든다.\n\n---\n\n<details>\n<summary>정답 보기 (먼저 풀고 열기!)<\/summary>\n\n**손계산**\n1. 0.8 × 2.0 + 0.6 × 1.0 = **2.2**\n2. 0.8 × 0.5 + 0.6 × (−1.0) = 0.4 − 0.6 = **−0.2**\n3. (1.0 − 0.7)² = **0.09**\n4. (2.2 − 0.6 × 1.0) ÷ 0.8 = 1.6 ÷ 0.8 = **2.0**\n5. 0.8 × 0.8 × 0.8 = **0.512**\n6. $x_1$ = 1.1, $x_2$ = 0.8 × 1.1 + 0.6 × 0.5 = 0.88 + 0.3 = **1.18**. 원본에 곱해진 수는 0.8 × 0.8 = **0.64**\n\n**미니 챌린지**\n순수한 잡음에서 완성된 그림까지는 너무 먼 길이라 한 번에 맞히기 어렵습니다. \"잡음이 조금 섞인 그림에서 그 조금을 지우기\"는 훨씬 쉬운 문제입니다. 쉬운 문제 1000개로 나누면 걸음마다 작은 실수는 다음 걸음이 고칠 수 있습니다.\n\n**퀴즈**\n1. 정방향은 그림에 잡음을 조금씩 더해 순수한 잡음으로 만들고, 역방향은 잡음을 조금씩 지워 그림으로 되돌립니다.\n2. 지금 그림에 섞여 있는 잡음 ε\n3. X. 정방향은 정해진 식대로 잡음을 섞을 뿐입니다. 학습은 역방향에서만 합니다.\n4. 그림 하나를 만들 때 신경망을 여러 번(수십~1000번) 돌려야 해서 느립니다.\n<\/details>\n", "link": "논문 연결: Ho, Jain, Abbeel (2020) (DDPM). 지금의 이미지 생성 AI가 쓰는 방법", "lesson": true}, {"id": "gan01", "short": "GAN: 위조범과 감별사의 대결", "md": "# 8단계. GAN: 위조범과 감별사의 대결\n\n30분 · 논문 연결: Goodfellow 외 (2014) \"Generative Adversarial Networks\". 두 신경망을 싸움 붙여 진짜 같은 데이터를 만드는 방법\n\n---\n\n## 오늘의 목표\n1. 생성자와 판별자가 각각 무엇을 하려 하는지 설명할 수 있다.\n2. 판별자와 생성자의 손실을 작은 숫자로 계산할 수 있다.\n3. 두 모델의 균형점(판별자가 0.5라고 답하는 상태)과 GAN 학습이 어려운 이유를 안다.\n\n**복습 (1분):** 정답에 확률 0.9를 준 모델의 손실 −ln 0.9는 대략? (답: 0.105. [Day 07](#day07))\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 싸우면서 큰다\n- **생성자 G** (위조범): 무작위 숫자 z를 받아 가짜 그림 G(z)를 만든다. 목표는 **감별사를 속이기**. z는 [VAE](#vae01)의 잠재 벡터와 같은 역할, 곧 그림의 씨앗입니다. 씨앗이 다르면 다른 그림이 나옵니다\n- **판별자 D** (감별사): 그림을 보고 \"진짜일 확률\" D(x)를 0~1로 답한다. 목표는 **가짜를 가려내기**\n\n위조범이 솜씨를 키우면 감별사도 눈이 높아지고, 감별사가 깐깐해지면 위조범은 더 정교해집니다. 이 경쟁이 **적대적**(adversarial) 학습입니다.\n\n[VAE](#vae01)는 \"원본과 얼마나 다른가\"를 식으로 정해 놓고 배웠습니다. GAN은 \"얼마나 진짜 같은가\"를 재는 **자를 통째로 신경망(D)에게 맡깁니다.**\n\n### 1-2. 판별자의 손실\n판별자는 분류기입니다. 진짜에는 1, 가짜에는 0에 가까운 답을 내고 싶습니다. [크로스엔트로피](#day07) 그대로입니다.\n\n$$L_D = -\\ln D(\\text{진짜}) - \\ln\\big(1 - D(\\text{가짜})\\big)$$\n\n- 진짜를 진짜라고 할수록(D(진짜) → 1) 첫 항이 0에 가까워짐\n- 가짜를 가짜라고 할수록(D(가짜) → 0) 둘째 항이 0에 가까워짐\n\n### 1-3. 생성자의 손실\n생성자는 판별자가 가짜를 **진짜라고 답하게** 만들고 싶습니다.\n\n$$L_G = -\\ln D(\\text{가짜})$$\n\nD(가짜)가 1에 가까울수록 손실이 0에 가까워집니다. 생성자는 진짜 그림을 **한 번도 직접 보지 않습니다.** 판별자의 답에서 흘러오는 기울기([역전파](#bp01))만으로 배웁니다.\n\n### 1-4. 번갈아 학습\n1. D를 한 걸음 학습 (G는 고정): 진짜와 가짜를 더 잘 가리게\n2. G를 한 걸음 학습 (D는 고정): D를 더 잘 속이게\n3. 반복\n\n**균형점:** 가짜가 진짜와 구별이 안 되면 판별자는 무엇을 보든 **0.5**라고 답할 수밖에 없습니다. 동전 던지기와 다를 바 없는 상태입니다. 생성자는 1을 원하지만 판별자도 계속 배웁니다. 가짜가 진짜와 똑같아지면 판별자가 낼 수 있는 가장 좋은 답이 0.5라서, 생성자가 갈 수 있는 끝도 여기입니다.\n\n### 1-5. 어려운 점\n- **불안정**: 두 모델의 실력이 맞아야 합니다. 판별자가 너무 잘하면 생성자가 배울 실마리(기울기)가 사라지고, 너무 못하면 배울 게 없습니다\n- **모드 붕괴**: 생성자가 판별자를 잘 속이는 **몇 가지 그림만** 반복해서 만드는 현상. 숫자 0~9를 배웠는데 1만 그리는 식입니다. 모드는 데이터의 \"종류\"(숫자 0, 1, …)라고 생각하세요\n- **평가가 어려움**: 손실이 줄었다고 그림이 좋아졌다는 보장이 없습니다\n\n그래도 선명한 그림을 한 번에 만들어 내서 2014~2020년 이미지 생성의 주역이었습니다. 지금은 다음 레슨의 확산 모델이 많이 쓰입니다.\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n쓸 로그 값: ln 0.9 ≈ −0.105, ln 0.8 ≈ −0.223, ln 0.5 ≈ −0.693, ln 0.2 ≈ −1.609\n\n**학습 초반.** 판별자가 잘 가려냅니다: D(진짜) = 0.9, D(가짜) = 0.2\n\n- $L_D$ = −ln 0.9 − ln(1 − 0.2) = 0.105 + 0.223 = **0.328** (작음: 판별자가 잘하는 중)\n- $L_G$ = −ln 0.2 = **1.609** (큼: 생성자가 못 속이는 중)\n\n**균형점.** D(진짜) = 0.5, D(가짜) = 0.5\n\n- $L_D$ = −ln 0.5 − ln 0.5 = 0.693 + 0.693 = **1.386**\n- $L_G$ = −ln 0.5 = **0.693**\n\n판별자의 손실 1.386(= 2 ln 2)은 \"찍는 것과 같다\"는 뜻입니다.\n\n---\n\n## 3. 능동 연습 (10분)\n\n쓸 로그 값: ln 0.6 ≈ −0.511, ln 0.5 ≈ −0.693, ln 0.4 ≈ −0.916, ln 0.1 ≈ −2.303, ln 0.9 ≈ −0.105\n\n### 손계산\n1. D(진짜) = 0.6, D(가짜) = 0.5일 때 판별자 손실 $L_D$는?\n2. 같은 상황의 생성자 손실 $L_G$는?\n3. D(가짜) = 0.1일 때와 0.9일 때 $L_G$는 각각? 생성자는 어느 쪽을 원하나요?\n4. D(진짜) = 0.9, D(가짜) = 0.1일 때 $L_D$는? 판별자가 잘하고 있나요?\n5. 판별자가 모든 그림에 0.5라고 답합니다. 누가 이긴 상태인가요?\n6. 생성자가 숫자 \"7\"만 계속 만듭니다. 이 현상의 이름은?\n\n### 미니 챌린지\n생성자는 진짜 그림을 직접 보지 못하는데 어떻게 진짜 같은 그림을 그리게 될까요? \"미술 선생님의 한마디\"에 빗대어 설명해 보세요.\n\n### 코드 (선택)\n```python\nimport numpy as np\ndef d_loss(d_real, d_fake):\n    return -np.log(d_real) - np.log(1 - d_fake)\ndef g_loss(d_fake):\n    return -np.log(d_fake)\n\nprint(d_loss(0.9, 0.2).round(3), g_loss(0.2).round(3))   # 0.329 1.609\nprint(d_loss(0.5, 0.5).round(3), g_loss(0.5).round(3))   # 1.386 0.693\n```\n(손계산 0.328과 끝자리가 다른 것은 로그 값을 반올림해서 더했기 때문입니다.)\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n1. 생성자와 판별자의 목표는 각각 무엇인가요?\n2. 균형점에서 판별자는 어떤 답을 내나요?\n3. O/X: 생성자는 진짜 데이터를 입력으로 받아 학습한다.\n4. 모드 붕괴란?\n\n---\n\n## 한 줄 정리\nGAN은 가짜를 만드는 생성자와 가짜를 가려내는 판별자를 번갈아 학습시켜, 판별자가 0.5라고 답할 만큼 진짜 같은 데이터를 만들게 한다.\n\n---\n\n<details>\n<summary>정답 보기 (먼저 풀고 열기!)<\/summary>\n\n**손계산**\n1. −ln 0.6 − ln(1 − 0.5) = 0.511 + 0.693 = **1.204**\n2. −ln 0.5 = **0.693**\n3. D(가짜) = 0.1이면 **2.303**, 0.9이면 **0.105**. 생성자는 손실이 작은 **0.9** 쪽(판별자가 속은 상태)을 원합니다.\n4. −ln 0.9 − ln 0.9 = 0.105 + 0.105 = **0.21**. 손실이 작으니 판별자가 **잘하고 있습니다.**\n5. **생성자**. 가짜가 진짜와 구별되지 않는 상태입니다.\n6. **모드 붕괴**\n\n**미니 챌린지**\n선생님(판별자)이 그림을 보고 \"이건 가짜 티가 나. 특히 여기가\"라고 알려 주면, 학생(생성자)은 그 지적을 따라 고칩니다. 판별자는 진짜를 보며 배웠기 때문에, 그 지적(기울기) 안에 진짜 그림의 정보가 간접적으로 들어 있습니다.\n\n**퀴즈**\n1. 생성자는 판별자를 속일 만큼 진짜 같은 가짜를 만드는 것, 판별자는 진짜와 가짜를 가려내는 것입니다.\n2. 무엇을 보든 0.5 (진짜일 확률 반반)\n3. X. 무작위 숫자 z를 입력으로 받고, 판별자를 거쳐 온 기울기로만 배웁니다.\n4. 생성자가 다양한 데이터를 만들지 않고 판별자를 잘 속이는 몇 가지만 반복해 만드는 현상입니다.\n<\/details>\n", "link": "논문 연결: Goodfellow 외 (2014) . 두 신경망을 싸움 붙여 진짜 같은 데이터를 만드는 방법", "lesson": true}, {"id": "mle01", "short": "최대가능도와 MAP", "md": "# 8단계. 최대가능도와 MAP\n\n30분 · 논문 연결: 지금까지 본 모든 모델의 학습 목표 \"정답의 로그 확률을 최대화\"가 바로 최대가능도입니다 (Seq2Seq 3.2절, GPT, BERT 모두)\n\n---\n\n## 오늘의 목표\n1. 가능도가 \"이 설정이라면 지금 데이터가 나올 확률\"이라는 걸 설명할 수 있다.\n2. 동전 예제로 최대가능도 추정(MLE)을 구하고, 그것이 크로스엔트로피 최소화와 같다는 걸 안다.\n3. 사전 믿음을 더한 MAP 추정이 데이터가 적을 때 왜 더 안전한지 계산으로 보일 수 있다.\n\n**복습 (1분):** 베이즈 정리에서 \"사후 확률\"은 무엇에 비례하나요? (답: 가능도 × 사전 확률. [Day 04](#day04))\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 거꾸로 묻기: 어떤 동전이었을까\n동전을 10번 던져 앞면이 7번 나왔습니다. 이 동전의 앞면 확률 θ(세타)는 얼마일까요? θ는 여기서 각도가 아니라 \"우리가 모르는 설정값\"의 이름표입니다. 신경망에서는 가중치 전체를 θ라고 부릅니다.\n\n확률은 보통 \"θ를 알 때 데이터가 어떻게 나올까\"를 묻습니다. 지금은 **거꾸로**입니다. 데이터를 보고 θ를 맞혀야 합니다. 신경망 학습이 정확히 이 일입니다. 데이터(글)를 보고 파라미터(가중치)를 맞히는 것.\n\n### 1-2. 가능도: 이 설정이라면 이 데이터가 나올 확률\n앞면 7번, 뒷면 3번이 나올 확률을 θ로 적으면 (앞앞뒤…처럼 한 줄로 나온 그 순서 그대로의 확률)\n\n$$L(\\theta) = \\theta^7 (1 - \\theta)^3$$\n\n이것이 **가능도**입니다. θ를 바꿔 가며 계산해 봅니다.\n\n| θ | 가능도 $\\theta^7 (1-\\theta)^3$ |\n|---|---|\n| 0.5 | 0.00098 |\n| 0.6 | 0.00179 |\n| **0.7** | **0.00222** |\n| 0.8 | 0.00168 |\n\nθ = 0.7일 때 가장 큽니다. 범인을 찾는 탐정처럼, **지금 증거를 가장 잘 설명하는 용의자**를 고르는 것입니다.\n\n### 1-3. 최대가능도 추정 (MLE)\n가능도가 가장 큰 θ를 고르는 방법입니다. 동전에서는 답이 단순합니다.\n\n$$\\hat\\theta_{\\text{MLE}} = \\frac{\\text{앞면 횟수}}{\\text{던진 횟수}} = \\frac{7}{10}$$\n\n작은 수의 곱은 다루기 어려우니 **로그**를 씌워 합으로 바꿉니다 ([준비 4](#prep04)).\n\n$$\\ln L(\\theta) = 7 \\ln\\theta + 3 \\ln(1 - \\theta)$$\n\n로그 가능도를 **최대화**하는 것은 부호를 바꾼 **−로그 가능도를 최소화**하는 것과 같습니다. 그런데 \"정답에 준 확률의 −로그\"는 [크로스엔트로피](#day07) 손실이었죠. **신경망이 크로스엔트로피를 줄이는 것 = 최대가능도 추정**입니다.\n\n### 1-4. MLE의 약점: 데이터가 적으면 과신한다\n동전을 3번 던져 3번 다 앞면이 나왔습니다. MLE는 θ = 3/3 = **1**. \"이 동전은 절대 뒷면이 안 나온다\"고 합니다. 겨우 3번 보고 내리기엔 너무 센 결론입니다.\n\n### 1-5. MAP: 사전 믿음을 섞는다\n우리는 \"동전은 보통 반반에 가깝다\"는 **사전 믿음**이 있습니다. [베이즈 정리](#day04)로 섞습니다.\n\n$$\\underbrace{p(\\theta \\mid \\text{데이터})}_{\\text{사후}} \\propto \\underbrace{p(\\text{데이터} \\mid \\theta)}_{\\text{가능도}} \\times \\underbrace{p(\\theta)}_{\\text{사전}}$$\n\n(∝는 \"비례한다\"는 뜻) 사후 확률이 가장 큰 θ를 고르는 것이 **MAP 추정**입니다.\n\n식을 직접 풀 필요는 없습니다. 사전 믿음을 \"미리 본 동전 던지기\"로 바꾸면 가능도에 곱해져서, 결국 데이터가 2개 더 있는 것처럼 세기만 하면 됩니다. 이것을 **가짜 관측**이라고 부르겠습니다. \"이미 앞면 1번, 뒷면 1번을 본 셈 치자\".\n\n$$\\hat\\theta_{\\text{MAP}} = \\frac{\\text{앞면} + 1}{\\text{던진 횟수} + 2}$$\n\n3번 다 앞면: (3 + 1) ÷ (3 + 2) = **0.8**. 1보다 훨씬 조심스러운 답입니다. 데이터가 많아지면 가짜 관측 2개는 묻혀서 MLE와 거의 같아집니다.\n\n> (선택) 신경망에서: \"가중치는 0 근처일 것\"이라는 사전 믿음을 넣으면 손실에 가중치 제곱의 합이 벌점으로 붙습니다. 이것이 **가중치 감쇠**(weight decay), 곧 가중치가 너무 커지지 않게 매번 살짝 줄이는 규칙이고, AdamW의 W입니다.\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n**문제.** 동전을 4번 던져 앞, 앞, 뒤, 앞이 나왔습니다.\n\n**가능도 비교**\n- θ = 0.5: 0.5 × 0.5 × 0.5 × 0.5 = **0.0625**\n- θ = 0.75: 0.75 × 0.75 × 0.25 × 0.75 ≈ **0.105**\n\n0.75 쪽이 데이터를 더 잘 설명합니다.\n\n**MLE:** 3 ÷ 4 = **0.75**\n\n**MAP (가짜 관측 앞 1, 뒤 1):** (3 + 1) ÷ (4 + 2) = 4 ÷ 6 ≈ **0.67**. 사전 믿음(0.5) 쪽으로 조금 당겨졌습니다.\n\n**데이터가 많으면:** 400번 중 300번 앞면이라면 MAP = 301 ÷ 402 ≈ 0.749. MLE(0.75)와 거의 같습니다.\n\n---\n\n## 3. 능동 연습 (10분)\n\n### 손계산\n1. 동전을 20번 던져 앞면 12번. MLE는?\n2. 같은 데이터의 MAP(가짜 관측 앞 1, 뒤 1)는?\n3. 동전을 2번 던져 2번 다 뒷면. MLE와 MAP는 각각?\n4. 데이터 \"앞, 뒤\"에 대해 θ = 0.5와 θ = 0.9의 가능도를 각각 구하세요. 어느 쪽이 큰가요?\n5. 가능도가 0.25일 때 로그 가능도는? (ln 0.25 ≈ −1.39) −로그 가능도는?\n6. 주사위를 60번 던져 6이 15번 나왔습니다. \"6이 나올 확률\"의 MLE는? 공정한 주사위의 값(1/6 ≈ 0.167)과 비교해 보세요.\n\n### 미니 챌린지\n새로 연 식당에 리뷰가 딱 1개, 별 5개입니다. 리뷰 500개에 평균 4.6인 식당과 비교해 어디가 더 믿을 만할까요? MLE와 MAP의 말로 설명해 보세요.\n\n### 코드 (선택)\n```python\nimport numpy as np\nthetas = np.array([0.5, 0.6, 0.7, 0.8])\nL = thetas ** 7 * (1 - thetas) ** 3\nprint(L.round(5))                    # [0.00098 0.00179 0.00222 0.00168]\n\ngrid = np.linspace(0.01, 0.99, 99)   # linspace는 구간을 같은 간격으로 나눈 수들: 0.01, 0.02, ..., 0.99\nlogL = 7 * np.log(grid) + 3 * np.log(1 - grid)\nprint(grid[logL.argmax()].round(2))  # 0.7  (로그 가능도가 최대인 θ)\n\nh, n = 3, 3\nprint(h / n, (h + 1) / (n + 2))      # 1.0 0.8\n```\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n1. 가능도란 무엇인가요?\n2. 최대가능도 추정과 크로스엔트로피 손실은 어떤 관계인가요?\n3. O/X: 데이터가 아주 많으면 MLE와 MAP는 거의 같아진다.\n4. MAP가 MLE보다 안전한 경우는?\n\n---\n\n## 한 줄 정리\nMLE는 데이터를 가장 잘 설명하는 설정을 고르고, MAP는 거기에 사전 믿음을 섞는다. 신경망의 크로스엔트로피 학습은 MLE, 가중치 감쇠를 더하면 MAP다.\n\n---\n\n<details>\n<summary>정답 보기 (먼저 풀고 열기!)<\/summary>\n\n**손계산**\n1. 12 ÷ 20 = **0.6**\n2. 13 ÷ 22 ≈ **0.59**\n3. MLE = 0 ÷ 2 = **0**, MAP = (0 + 1) ÷ (2 + 2) = **0.25**\n4. θ = 0.5: 0.5 × 0.5 = **0.25**. θ = 0.9: 0.9 × 0.1 = **0.09**. 0.5 쪽이 큽니다.\n5. 로그 가능도 **−1.39**, −로그 가능도 **1.39**\n6. 15 ÷ 60 = **0.25**. 0.167보다 꽤 커서 6이 잘 나오는 주사위로 의심됩니다.\n\n**미니 챌린지**\n리뷰 1개짜리의 MLE는 5.0이지만 데이터가 너무 적어 믿기 어렵습니다. \"식당은 보통 3.5점쯤\"이라는 사전 믿음을 섞으면(MAP) 5.0에서 한참 내려옵니다. 500개짜리의 4.6은 사전 믿음이 거의 영향을 못 줘 그대로 4.6. **500개짜리가 더 믿을 만합니다.**\n\n**퀴즈**\n1. 어떤 설정(파라미터)이 참이라고 할 때 지금 관측한 데이터가 나올 확률입니다.\n2. 같은 것입니다. −로그 가능도를 최소화하는 것이 크로스엔트로피를 최소화하는 것입니다.\n3. O. 사전 믿음(가짜 관측)의 영향이 데이터에 묻힙니다.\n4. 데이터가 적을 때. MLE는 적은 데이터를 과신해 0이나 1 같은 극단적인 답을 냅니다.\n<\/details>\n", "link": "논문 연결: 지금까지 본 모든 모델의 학습 목표 가 바로 최대가능도입니다 (Seq2Seq 3.2절, GPT, BERT 모두)", "lesson": true}, {"id": "vae01", "short": "VAE: 압축했다 되살리며 배우기", "md": "# 8단계. VAE: 압축했다 되살리며 배우기\n\n30분 · 논문 연결: Kingma, Welling (2013) \"Auto-Encoding Variational Bayes\". 새 데이터를 만들어 내는 생성 모델의 첫 갈래\n\n---\n\n## 오늘의 목표\n1. 오토인코더가 \"압축 → 복원\"으로 데이터의 핵심을 배운다는 걸 설명할 수 있다.\n2. VAE가 압축 결과를 점 하나가 아니라 \"평균과 표준편차\"로 내놓는 이유를 안다.\n3. VAE 손실의 두 조각(복원 오차, KL 벌점)을 작은 숫자로 계산할 수 있다.\n\n**복습 (1분):** 평균 0, 표준편차 1인 정규분포를 기호로 쓰면? (답: $\\mathcal{N}(0, 1)$. [정규분포](#nd01))\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 생성 모델: 분류가 아니라 만들기\n지금까지의 모델은 주로 **맞히는** 일을 했습니다. **생성 모델**은 데이터와 비슷한 **새 것을 만듭니다.** 세상에 없던 얼굴 사진, 새 문장.\n\n### 1-2. 오토인코더: 좁은 문을 지나게 하기\n- **인코더**: 입력 x를 작은 벡터 z로 **압축**\n- **디코더**: z에서 x를 **복원** → $\\hat x$\n- 손실: 원본과 복원의 차이 $(x - \\hat x)^2$\n\n784칸(28 × 28 점)짜리 손글씨 그림을 2칸짜리 z로 줄였다 되살려야 한다면, 모델은 \"어떤 숫자인지, 얼마나 기울었는지\" 같은 **핵심만** z에 담을 수밖에 없습니다. z가 사는 공간을 **잠재 공간**이라고 합니다. 잠재는 \"겉으로 안 보이게 숨어 있다\"는 뜻입니다. 그림 속에 숨은 핵심 특징이라 그렇게 부릅니다. 여행 가방에 꼭 필요한 것만 싸는 것과 같아요. [PCA](#svd01)가 직선 방향으로 줄였다면 오토인코더는 신경망으로 휘어지게 줄입니다.\n\n### 1-3. 문제: 잠재 공간에 구멍이 숭숭\n새 그림을 만들려면 아무 z나 골라 디코더에 넣으면 될 것 같습니다. 그런데 보통 오토인코더는 학습 데이터가 놓인 **점들만** 복원할 줄 압니다. 점과 점 사이의 빈 곳을 고르면 엉망인 그림이 나옵니다.\n\n### 1-4. VAE의 생각: 점 대신 구름\nVAE의 인코더는 z를 점 하나로 내놓지 않고 **\"평균 μ, 표준편차 σ인 정규분포\"**로 내놓습니다. 그리고 거기서 z를 **뽑습니다.**\n\n$$z = \\mu + \\sigma \\cdot \\varepsilon, \\quad \\varepsilon \\sim \\mathcal{N}(0, 1)$$\n\nε(엡실론)은 표준 정규분포에서 뽑은 무작위 수입니다. ~는 \"이 분포에서 무작위로 하나 뽑았다\"는 뜻이에요. 키 분포에서 사람 한 명을 아무나 고르는 것과 같습니다. 0 근처 값이 자주, ±2 밖은 드물게 나옵니다. (Adam에 나온 ε과는 다른, 여기서만 쓰는 이름입니다.) 같은 그림도 매번 조금씩 다른 z로 바뀌니, 디코더는 **그 주변 전체**를 복원하는 법을 배웁니다. 점이 구름이 되어 빈 곳이 메워집니다.\n\n> 이렇게 \"무작위는 ε에 몰아 두고, μ와 σ는 보통 계산으로\" 쓰는 것을 재매개변수화 요령이라고 합니다. 덕분에 [역전파](#bp01)가 μ와 σ까지 흘러갑니다.\n\n### 1-5. 손실 = 복원 오차 + KL 벌점\n구름들이 제멋대로 흩어지면 또 구멍이 생깁니다. 그래서 모든 구름이 **표준 정규분포 $\\mathcal{N}(0, 1)$ 근처에 모이도록** 벌점을 줍니다. 두 분포의 차이를 재는 [KL 발산](#day07)을 씁니다.\n\n$$\\text{손실} = \\underbrace{(x - \\hat x)^2}_{\\text{복원 오차}} + \\underbrace{\\text{KL}\\big(\\mathcal{N}(\\mu, \\sigma^2)\\,\\|\\,\\mathcal{N}(0, 1)\\big)}_{\\text{벌점}}$$\n\nz가 숫자 하나일 때 KL 벌점은 다음 식입니다.\n\n$$\\text{KL} = \\frac{1}{2}\\left(\\mu^2 + \\sigma^2 - 1 - \\ln \\sigma^2\\right)$$\n\nμ = 0, σ = 1이면 정확히 0. 거기서 멀어질수록 커집니다. [Day 07](#day07)의 KL을 건너뛰었어도 괜찮습니다. \"표준 정규분포에서 벗어난 만큼 내는 벌금\"이라고만 읽으세요. 식은 외우지 말고 숫자만 넣어 봅니다. μ²은 가운데서 벗어난 벌금, 나머지는 폭이 1에서 벗어난 벌금입니다.\n\n두 조각은 **줄다리기**를 합니다. 복원 오차는 \"그림마다 구름을 멀리 떨어뜨려 구별하자\", KL은 \"모두 가운데로 모여라\". 그 균형에서 **빈틈없이 정돈된** 잠재 공간이 만들어집니다.\n\n**만들 때:** $\\mathcal{N}(0, 1)$에서 z를 뽑아 디코더에 넣으면 새 데이터가 나옵니다.\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n**z 뽑기.** 인코더가 μ = 2, σ = 0.5를 내놓았고, 뽑힌 ε = −1이면\n\nz = 2 + 0.5 × (−1) = **1.5**\n\n**복원 오차.** x = [1, 0], 복원 $\\hat x$ = [0.8, 0.1]\n\n(1 − 0.8)² + (0 − 0.1)² = 0.04 + 0.01 = **0.05**\n\n**KL 벌점.**\n\n| μ | σ | 계산 | KL |\n|---|---|---|---|\n| 0 | 1 | ½(0 + 1 − 1 − ln 1) | **0** |\n| 1 | 1 | ½(1 + 1 − 1 − 0) | **0.5** |\n| 2 | 1 | ½(4 + 1 − 1 − 0) | **2** |\n\n(ln 1 = 0) 평균이 0에서 멀어질수록 벌점이 빠르게 커집니다.\n\n**전체 손실.** 복원 오차 0.05, KL 0.5면 0.05 + 0.5 = **0.55**\n\n---\n\n## 3. 능동 연습 (10분)\n\n### 손계산\n1. μ = 1, σ = 2, ε = 0.5일 때 z는?\n2. μ = 0, σ = 1, ε = −0.3일 때 z는?\n3. x = [2, 1], $\\hat x$ = [1.5, 1]의 복원 오차는?\n4. μ = 3, σ = 1일 때 KL 벌점은?\n5. μ = 0, σ = 1일 때 KL 벌점은? 이것이 뜻하는 바는?\n6. 복원 오차가 0.2, KL이 0.3이면 전체 손실은?\n7. μ = 0, σ = 2일 때 KL 벌점은? (ln 4 ≈ 1.386)\n\n### 미니 챌린지\nKL 벌점을 없애면(보통 오토인코더처럼) 복원은 더 잘 됩니다. 그런데 왜 새 그림 만들기는 더 못할까요? 반대로 KL 벌점만 아주 세게 주면 어떤 일이 생길까요?\n\n### 코드 (선택)\n```python\nimport numpy as np\ndef kl(mu, sigma):\n    return 0.5 * (mu**2 + sigma**2 - 1 - np.log(sigma**2))\n\nprint(kl(0, 1), kl(1, 1), kl(2, 1))      # 0.0 0.5 2.0\n\nrng = np.random.default_rng(0)\nmu, sigma = 2.0, 0.5\nz = mu + sigma * rng.normal(size=5)       # 같은 입력에서 z를 5번 뽑기\nprint(z.round(2))                         # 2 근처에서 조금씩 다른 값 5개\n\nx, x_hat = np.array([1, 0]), np.array([0.8, 0.1])\nprint(((x - x_hat) ** 2).sum().round(2))  # 0.05\n```\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n1. 오토인코더의 인코더와 디코더는 각각 무엇을 하나요?\n2. VAE의 인코더가 내놓는 두 가지는?\n3. O/X: KL 벌점은 잠재 벡터의 분포가 표준 정규분포에서 멀어질수록 작아진다.\n4. 학습이 끝난 VAE로 새 데이터를 만드는 방법은?\n\n---\n\n## 한 줄 정리\nVAE는 입력을 \"평균과 표준편차\"로 압축해 거기서 z를 뽑아 복원하고, KL 벌점으로 잠재 공간을 정돈해 아무 z에서나 새 데이터를 만들 수 있게 한다.\n\n---\n\n<details>\n<summary>정답 보기 (먼저 풀고 열기!)<\/summary>\n\n**손계산**\n1. 1 + 2 × 0.5 = **2**\n2. 0 + 1 × (−0.3) = **−0.3**\n3. (0.5)² + 0² = **0.25**\n4. ½(9 + 1 − 1 − 0) = **4.5**\n5. **0**. 이미 표준 정규분포와 똑같아서 벌점이 없습니다.\n6. **0.5**\n7. ½(0 + 4 − 1 − 1.386) ≈ **0.81**. 평균이 0이어도 폭이 1에서 벗어나면 벌점이 붙습니다.\n\n**미니 챌린지**\n벌점이 없으면 구름들이 제멋대로 흩어지고 좁아져, 잠재 공간에 디코더가 본 적 없는 빈 곳이 많아집니다. 거기서 뽑은 z는 엉망인 그림이 됩니다. 반대로 KL만 세게 주면 모든 입력이 똑같은 $\\mathcal{N}(0, 1)$로 뭉쳐 z가 입력의 정보를 담지 못하고, 복원이 다 비슷한 흐릿한 그림이 됩니다.\n\n**퀴즈**\n1. 인코더는 입력을 작은 잠재 벡터로 압축하고, 디코더는 그 벡터에서 입력을 복원합니다.\n2. 잠재 분포의 평균 μ와 표준편차 σ\n3. X. 멀어질수록 **커집니다**.\n4. 표준 정규분포에서 z를 뽑아 디코더에 넣습니다.\n<\/details>\n", "link": "논문 연결: Kingma, Welling (2013) . 새 데이터를 만들어 내는 생성 모델의 첫 갈래", "lesson": true}, {"id": "lr01", "short": "저랭크 근사와 LoRA", "md": "# 10단계. 저랭크 근사와 LoRA\n\n30분 · 논문 연결: Hu 외 (2021) \"LoRA: Low-Rank Adaptation of Large Language Models\". 선형대수 한 줄로 거대한 모델을 값싸게 고치는 방법\n\n---\n\n## 오늘의 목표\n1. 큰 모델을 통째로 미세조정하는 것이 왜 부담스러운지 설명할 수 있다.\n2. LoRA의 식 $W' = W + BA$를 작은 행렬로 손계산할 수 있다.\n3. 랭크 r을 정했을 때 학습할 숫자가 몇 개로 줄어드는지 계산할 수 있다.\n\n**복습 (1분):** m × n 행렬의 랭크 k 근사는 숫자 몇 개를 저장하나요? (답: k × (m + n + 1). [SVD와 PCA](#svd01))\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 문제: 모델이 너무 크다\n[미세조정](#bg01)은 사전학습한 모델의 가중치를 내 데이터로 조금 더 학습시키는 것입니다. 그런데 GPT-3의 가중치는 1750억 개. 일(번역, 요약, 상담…)마다 1750억 개짜리 사본을 하나씩 만들어 저장하고 학습시키는 것은 너무 비쌉니다.\n\n### 1-2. 관찰: 바뀌는 양은 단순하다\n미세조정 전의 가중치 행렬을 W, 후를 W'이라 하면\n\n$$W' = W + \\Delta W$$\n\nΔW(델타 W)는 **바뀐 양**입니다. LoRA 논문의 가설: 새 일에 맞추는 데 필요한 변화 ΔW는 **랭크가 아주 낮다.** 즉 [SVD](#svd01)에서 본 \"큰 조각 몇 개\"로 충분하다.\n\n수천 쪽짜리 백과사전을 새로 찍는 대신 **얇은 정오표 한 장**을 끼워 넣는 것과 같습니다.\n\n### 1-3. LoRA: 두 개의 얇은 행렬\nΔW를 직접 배우지 않고, 얇은 행렬 두 개의 곱으로 둡니다.\n\n$$\\Delta W = B A$$\n\n\"d × k\"는 세로 d줄, 가로 k칸이라는 뜻입니다. k는 이 층에 들어오는 숫자 수, d는 나가는 숫자 수입니다. 예를 들어 d = 1000, k = 1000, r = 8이면 A는 8 × 1000, B는 1000 × 8입니다. 가운데가 8칸으로 좁아지는 모래시계 모양입니다.\n\n- W: d × k (원래 가중치, **얼려 둠**. 학습하지 않음)\n- A: r × k (가로로 긴 얇은 행렬)\n- B: d × r (세로로 긴 얇은 행렬)\n- r: 랭크. 보통 1~64의 작은 수\n\nBA는 d × k 크기지만 [랭크](#rk01)는 r을 넘지 못합니다. BA의 모든 가로줄이 A의 가로줄 r개를 섞어 만든 것이기 때문입니다. 학습하는 것은 **A와 B뿐**입니다.\n\n### 1-4. 숫자 세기\n| | 학습할 숫자 수 |\n|---|---|\n| 통째로 미세조정 | d × k |\n| LoRA | r × (d + k) |\n\n복습의 k × (m + n + 1)과 닮았습니다. 다만 글자가 바뀌었으니 주의하세요. 여기서 k는 랭크가 아니라 가로 칸 수이고, 랭크는 r입니다. SVD는 조각마다 특이값 1개를 따로 저장해서 +1이 붙습니다. LoRA는 그 크기를 A와 B 안에 넣어 두어서 +1이 없습니다.\n\nd = k = 1000, r = 8이면 100만 개 대신 8 × 2000 = **16,000개**. 1.6%입니다. 논문은 GPT-3에서 학습할 파라미터 수를 **1만 분의 1**로, 학습에 필요한 GPU 메모리를 **3분의 1**로 줄였다고 보고합니다.\n\n### 1-5. 세 가지 요령\n1. **시작은 0에서.** B를 0으로, A를 작은 무작위 수로 시작합니다. 그러면 처음에 BA = 0이라 원래 모델과 **똑같이** 출발합니다\n2. **계산은 따로, 결과는 더해서.** $W'x = Wx + B(Ax)$. 큰 행렬 W'를 만들지 않고 x를 A로 줄였다가(r칸) B로 다시 늘립니다\n3. **다 배우면 합친다.** 학습이 끝나면 W + BA를 미리 계산해 하나로 합칠 수 있습니다. 쓸 때의 속도는 원래 모델과 같습니다\n\n일마다 작은 (A, B) 한 쌍만 저장하면 되니, 큰 모델 하나에 \"번역용\", \"요약용\" 정오표를 **갈아 끼워** 쓸 수 있습니다.\n\n---\n\n## 2. 예제 따라하기 (6분)\n\nW = [[1, 0], [0, 1]] (2 × 2), r = 1.\n\nB = [[1], [2]] (2 × 1), A = [[3, 4]] (1 × 2)\n\n**ΔW = BA** (B의 각 칸 × A의 가로줄)\n\n| | × 3 | × 4 |\n|---|---|---|\n| 1 | 3 | 4 |\n| 2 | 6 | 8 |\n\nΔW = [[3, 4], [6, 8]]. 둘째 줄이 첫째 줄의 2배라 랭크 1입니다.\n\n**W' = W + ΔW** = [[1 + 3, 0 + 4], [0 + 6, 1 + 8]] = **[[4, 4], [6, 9]]**\n\n**입력 x = [1, 1]을 넣으면**\n- 합친 뒤: W'x = [4 + 4, 6 + 9] = **[8, 15]**\n- 따로 계산: Wx = [1, 1]. Ax = 3 + 4 = 7. B × 7 = [7, 14]. 더하면 [1 + 7, 1 + 14] = **[8, 15]** ✓\n\n**숫자 세기.** 이 작은 예에서는 W가 4개, LoRA가 2 + 2 = 4개로 같습니다. 행렬이 커져야 이득이 납니다. 768 × 768에 r = 4면 589,824개 대신 4 × 1536 = **6,144개**(약 1%).\n\n---\n\n## 3. 능동 연습 (10분)\n\n### 손계산\n1. B = [[2], [1]], A = [[1, 3]]일 때 BA는?\n2. 1번의 BA의 랭크는?\n3. W = [[1, 1], [0, 1]]에 1번의 BA를 더한 W'는?\n4. d = 1000, k = 1000, r = 4일 때 LoRA가 학습하는 숫자는 몇 개? 통째로 할 때의 몇 %인가요?\n5. d = 4096, k = 4096, r = 16이면? (4096 × 4096 = 16,777,216)\n6. 학습을 시작할 때 B가 모두 0이면 BA는? 이때 모델의 출력은 원래 모델과 어떤 관계인가요?\n\n### 미니 챌린지\nr을 키우면 표현할 수 있는 변화가 늘어나지만 학습할 숫자도 늘어납니다. r = d = k로 키우면 LoRA는 무엇과 같아지나요? 반대로 r이 너무 작으면 어떤 일이 생길까요?\n\n### 코드 (선택)\n```python\nimport numpy as np\nW = np.eye(2)                          # [[1, 0], [0, 1]]\nB = np.array([[1.0], [2.0]])           # 2 × 1\nA = np.array([[3.0, 4.0]])             # 1 × 2\nx = np.array([1.0, 1.0])\n\ndW = B @ A\nprint(dW, np.linalg.matrix_rank(dW))   # [[3. 4.] [6. 8.]] 1\nprint((W + dW) @ x)                    # [ 8. 15.]\nprint(W @ x + B @ (A @ x))             # [ 8. 15.]  따로 계산해도 같음\n\nd, k, r = 1000, 1000, 8\nprint(r * (d + k), d * k, r * (d + k) / (d * k))   # 16000 1000000 0.016\n```\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n1. LoRA에서 학습하는 것과 얼려 두는 것은 각각 무엇인가요?\n2. ΔW = BA의 랭크는 최대 얼마인가요?\n3. O/X: LoRA를 쓰면 학습이 끝난 뒤에도 모델이 항상 느려진다.\n4. B를 0으로 시작하는 이유는?\n\n---\n\n## 한 줄 정리\nLoRA는 큰 가중치 W는 얼려 두고, 바뀌는 양을 얇은 두 행렬의 곱 BA(랭크 r)로만 배워서 학습할 숫자를 r × (d + k)개로 줄인다.\n\n---\n\n<details>\n<summary>정답 보기 (먼저 풀고 열기!)<\/summary>\n\n**손계산**\n1. **[[2, 6], [1, 3]]**\n2. **1** (첫째 줄이 둘째 줄의 2배)\n3. [[1 + 2, 1 + 6], [0 + 1, 1 + 3]] = **[[3, 7], [1, 4]]**\n4. 4 × 2000 = **8,000개**. 100만 개의 **0.8%**\n5. 16 × 8192 = **131,072개**. 약 **0.78%**\n6. 모든 칸이 **0**. 출력이 원래 모델과 **똑같습니다.**\n\n**미니 챌린지**\nr이 행렬 크기만큼 커지면 BA가 어떤 ΔW든 표현할 수 있어 **통째로 미세조정**하는 것과 같아지고, 절약도 사라집니다. r이 너무 작으면 새 일에 필요한 변화를 다 담지 못해 성능이 모자랄 수 있습니다. 논문은 아주 작은 r로도 충분한 경우가 많다고 보고합니다.\n\n**퀴즈**\n1. 학습하는 것은 얇은 행렬 A와 B, 얼려 두는 것은 원래 가중치 W\n2. r\n3. X. 학습이 끝나면 W + BA로 합칠 수 있어 속도가 원래 모델과 같습니다.\n4. 처음에 BA = 0이 되어, 사전학습한 모델과 똑같은 상태에서 출발하기 위해서입니다.\n<\/details>\n", "link": "논문 연결: Hu 외 (2021) . 선형대수 한 줄로 거대한 모델을 값싸게 고치는 방법", "lesson": true}, {"id": "nm01", "short": "행렬 노름과 조건수", "md": "# 10단계. 행렬 노름과 조건수\n\n30분 · 논문 연결: 기울기 자르기는 벡터의 노름, 가중치 감쇠는 가중치의 노름, \"학습이 왜 느린가\"는 조건수로 설명합니다 (Deep Learning 2.5절, 4.2절)\n\n---\n\n## 오늘의 목표\n1. 벡터의 크기를 재는 세 가지 방법(L1, L2, L∞)을 계산할 수 있다.\n2. 행렬의 크기를 재는 두 가지 방법(프로베니우스 노름, 스펙트럼 노름)을 특이값으로 설명할 수 있다.\n3. 조건수가 크면 왜 계산이 불안정하고 경사하강이 느린지 숫자로 보일 수 있다.\n\n**복습 (1분):** [3, 4]의 길이는? (답: 5. [Day 01](#day01))\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 노름: 크기를 재는 자\n**노름**은 벡터나 행렬의 \"크기\"를 숫자 하나로 재는 방법입니다. 자가 여러 종류 있습니다.\n\n| 이름 | 계산 | [3, −4]의 값 | 비유 |\n|---|---|---|---|\n| L2 노름 $\\|x\\|_2$ | 제곱해서 더하고 √ | 5 | 직선 거리 |\n| L1 노름 $\\|x\\|_1$ | 절댓값을 더함 | 7 | 바둑판 길로 걷는 거리 |\n| L∞ 노름 $\\|x\\|_\\infty$ | 절댓값 중 가장 큰 것 | 4 | 가로, 세로 중 더 멀리 간 쪽 |\n\n절댓값은 부호를 뗀 크기입니다. −4의 절댓값은 4입니다. ∞는 \"무한대\"라고 읽습니다. \"L 무한대 노름\"이라고 부르면 됩니다.\n\n지금까지 \"길이\"라고 부른 것이 L2 노름입니다. [기울기 자르기](#gv01)가 쟀던 것, 가중치 감쇠가 벌점을 주는 것도 L2 노름(의 제곱)입니다.\n\n### 1-2. 행렬의 크기 ①: 프로베니우스 노름\n행렬의 숫자를 한 줄로 늘어놓고 L2 노름을 구한 것입니다.\n\n$$\\|A\\|_F = \\sqrt{\\text{모든 칸의 제곱의 합}}$$\n\n놀라운 사실: 이 값은 **특이값들의 제곱의 합의 제곱근**과 같습니다. [SVD](#svd01)의 저랭크 근사에서 \"가장 가깝다\"를 잴 때 쓰는 자가 이것입니다.\n\n### 1-3. 행렬의 크기 ②: 스펙트럼 노름\n행렬을 변환으로 볼 때 **벡터를 최대 몇 배까지 늘이는가**입니다.\n\n$$\\|A\\|_2 = \\text{가장 큰 특이값 } \\sigma_{\\max}$$\n\n\"이 층을 지나면 신호가 최대 몇 배 커질 수 있나\"를 알려 줍니다. 층마다 이 값이 1보다 작으면 신호가 반드시 줄어들어 소실 쪽으로 가고, 1보다 크면 [폭발](#gv01)할 수 있습니다.\n\n### 1-4. 조건수: 가장 많이 늘이는 방향 ÷ 가장 적게 늘이는 방향\n$$\\kappa(A) = \\frac{\\sigma_{\\max}}{\\sigma_{\\min}}$$\n\nκ(카파)가 1이면 모든 방향을 똑같이 늘이는 반듯한 변환. κ가 크면 한 방향은 크게, 다른 방향은 거의 안 늘이는 **찌그러진** 변환입니다.\n\n조건수가 크면 생기는 일\n- **작은 오차가 크게 번집니다.** 조금 다른 입력이 크게 다른 답을 냅니다. 흐릿한 사진을 확대하면 잡티가 같이 커지는 것과 같습니다\n- **경사하강이 느립니다.** 손실의 그릇이 길쭉한 골짜기가 됩니다\n\n### 1-5. 길쭉한 골짜기에서 걷기\n손실이 $L = \\frac{1}{2}(100\\, w_1^2 + w_2^2)$라고 합시다. [헤시안](#sp01)의 고유값이 100과 1, 조건수 100입니다.\n\n- 가파른 방향 $w_1$: 기울기가 $100 w_1$입니다. 한 걸음 가면 $w_1$은 (1 − 100 × 학습률)배가 됩니다. 학습률이 0.01이면 0배라서 한 걸음에 바닥에 닿습니다. 0.02이면 −1배라서 반대편 같은 높이로 건너뛰기만 합니다. 0.02를 넘으면 걸을수록 더 멀어집니다. 그네를 너무 세게 미는 것과 같습니다. 그래서 한계가 2 ÷ 100 = 0.02입니다\n- 그래서 학습률을 0.01로 잡습니다. 완만한 방향 $w_2$는 기울기가 $w_2$입니다. 한 걸음 가면 $w_2 - 0.01 \\times w_2 = 0.99\\, w_2$입니다. 한 걸음에 **1%**만 줄어듭니다\n\n완만한 쪽에서 100걸음을 걸어도 $0.99^{100} \\approx 0.37$. 아직 37%가 남습니다. **필요한 걸음 수가 조건수에 비례**합니다.\n\n[Adam](#opt01)이 방향마다 보폭을 따로 맞추고, [정규화](#norm01)가 층의 입력 크기를 고르게 하는 것은 모두 이 조건수를 낮추려는 노력입니다.\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n**벡터 노름.** x = [1, −2, 2]\n- L1: 1 + 2 + 2 = **5**\n- L2: √(1 + 4 + 4) = √9 = **3**\n- L∞: **2**\n\n**행렬 노름.** A = [[3, 0], [0, 1]] (대각선에만 숫자가 있는 행렬입니다. 가로로 3배, 세로로 1배 늘이므로 특이값은 3과 1입니다)\n- 프로베니우스: √(9 + 0 + 0 + 1) = √10 ≈ **3.16**. 특이값으로도 √(3² + 1²) = √10 ✓\n- 스펙트럼: 가장 큰 특이값 **3**\n- 조건수: 3 ÷ 1 = **3**\n\n**조건수가 큰 경우.** B = [[1, 0], [0, 0.001]] → κ = 1 ÷ 0.001 = **1000**\n\nB는 첫째 칸은 그대로 두고 둘째 칸에 0.001을 곱하는 행렬입니다. 이제 거꾸로 묻습니다. B x = [1, 0.001]이 되는 x는 무엇일까요? 첫째 칸은 그대로 1입니다. 둘째 칸은 0.001 ÷ 0.001 = 1입니다. 그래서 x = [1, 1]입니다. 그런데 오른쪽이 측정 오차로 [1, 0.002]가 되면 x = [1, 2]입니다. (둘째 칸이 0.002 ÷ 0.001 = 2가 되기 때문입니다.) 둘째 칸의 **0.001짜리 오차가 답을 1만큼(1000배)** 바꿨습니다.\n\n---\n\n## 3. 능동 연습 (10분)\n\n### 손계산\n1. x = [−6, 8]의 L1, L2, L∞ 노름은?\n2. [[1, 2], [2, 4]]의 프로베니우스 노름은?\n3. 특이값이 5와 2인 행렬의 스펙트럼 노름과 조건수는?\n4. [[4, 0], [0, 4]]의 조건수는? 어떤 변환인가요?\n5. 조건수가 10인 그릇과 1000인 그릇. 경사하강이 더 오래 걸리는 쪽은? 대략 몇 배?\n6. $L = \\frac{1}{2}(100 w_1^2 + w_2^2)$에서 학습률 0.01일 때, $w_2 = 1$에서 한 걸음 후의 $w_2$는? (기울기는 $w_2$)\n\n### 미니 챌린지\n가중치 감쇠에 L2 대신 **L1 노름**을 쓰면 가중치 중 많은 수가 정확히 0이 됩니다. [1, 0]과 [0.7, 0.7]은 L2 노름이 거의 같은데(1과 0.99), L1 노름은 각각 얼마인가요? L1 벌점은 어느 쪽을 더 좋아할까요?\n\n### 코드 (선택)\n```python\nimport numpy as np\nx = np.array([3.0, -4.0])\nprint(np.linalg.norm(x, 1), np.linalg.norm(x), np.linalg.norm(x, np.inf))   # 7.0 5.0 4.0\n\nA = np.array([[3.0, 0.0], [0.0, 1.0]])\nprint(np.linalg.norm(A, 'fro').round(2), np.linalg.norm(A, 2), np.linalg.cond(A))   # 3.16 3.0 3.0\n\nw = np.array([1.0, 1.0])                  # 길쭉한 골짜기에서 100걸음\nfor step in range(100):\n    w = w - 0.01 * np.array([100 * w[0], w[1]])\nprint(w.round(3))                         # [0.    0.366]  가파른 쪽은 끝났는데 완만한 쪽은 37% 남음\n```\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n1. L1, L2, L∞ 노름은 각각 어떻게 계산하나요?\n2. 스펙트럼 노름은 무엇을 뜻하나요?\n3. O/X: 조건수가 1에 가까울수록 계산이 불안정하다.\n4. 조건수가 큰 손실 함수에서 경사하강이 느린 이유는?\n\n---\n\n## 한 줄 정리\n노름은 크기를 재는 자이고, 조건수(가장 큰 특이값 ÷ 가장 작은 특이값)가 크면 오차가 크게 번지고 경사하강이 길쭉한 골짜기에서 느려진다.\n\n---\n\n<details>\n<summary>정답 보기 (먼저 풀고 열기!)<\/summary>\n\n**손계산**\n1. L1 = 6 + 8 = **14**, L2 = √(36 + 64) = **10**, L∞ = **8**\n2. √(1 + 4 + 4 + 16) = √25 = **5** (이 행렬의 0이 아닌 특이값이 5 하나뿐인 것과 맞습니다)\n3. 스펙트럼 노름 **5**, 조건수 5 ÷ 2 = **2.5**\n4. **1**. 모든 방향을 똑같이 4배 늘이는 변환입니다.\n5. **1000인 쪽**, 대략 **100배** 오래 걸립니다.\n6. 1 − 0.01 × 1 = **0.99**\n\n**미니 챌린지**\n[1, 0]의 L1 노름은 **1**, [0.7, 0.7]은 **1.4**. L1 벌점은 값을 한 칸에 몰고 나머지를 0으로 두는 [1, 0] 쪽을 더 좋아합니다. 그래서 0이 많은(성긴) 가중치가 나옵니다.\n\n**퀴즈**\n1. L1은 절댓값의 합, L2는 제곱의 합의 제곱근, L∞는 절댓값 중 최댓값\n2. 그 행렬이 벡터를 최대 몇 배까지 늘이는가 (가장 큰 특이값)\n3. X. 1에 가까울수록 안정적입니다. **클수록** 불안정합니다.\n4. 학습률을 가장 가파른 방향에 맞춰 작게 잡아야 해서, 완만한 방향으로는 한 걸음에 아주 조금씩만 나아가기 때문입니다.\n<\/details>\n", "link": "논문 연결: 기울기 자르기는 벡터의 노름, 가중치 감쇠는 가중치의 노름, 는 조건수로 설명합니다 (Deep Learning 2.5절, 4.", "lesson": true}, {"id": "pf01", "short": "증명 읽고 쓰기", "md": "# 10단계. 증명 읽고 쓰기\n\n30분 · 논문 연결: 대학원 교재와 이론 논문은 \"정의 → 정리 → 증명\"으로 쓰여 있습니다. 이 형식을 읽는 법이 10단계의 첫 도구입니다 (Axler, *Linear Algebra Done Right*)\n\n---\n\n## 오늘의 목표\n1. 정의, 정리, 증명이 각각 무엇인지 구별하고, 기호 ∀, ∃, ⇒를 읽을 수 있다.\n2. 증명의 세 가지 기본 방법(곧바로 보이기, 모순으로 보이기, 반례 들기)을 알아볼 수 있다.\n3. 세 줄짜리 선형대수 증명을 따라가며 줄마다 \"왜 되는지\"를 말할 수 있다.\n\n**복습 (1분):** 고유벡터의 정의를 식으로 쓰면? (답: $Av = \\lambda v$. [고유값과 고유벡터](#eg01))\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 왜 증명인가\n지금까지는 \"예를 계산해 보니 맞더라\"로 배웠습니다. 하지만 예 100개가 맞아도 101번째가 틀릴 수 있습니다. **증명**은 \"모든 경우에 맞다\"를 한 번에 보장하는 글입니다.\n\n증명은 어려운 계산이 아닙니다. **변호사의 변론**과 같습니다. 이미 인정된 사실만 써서, 한 줄씩, 빈틈없이 결론까지 가는 것입니다.\n\n### 1-2. 수학 글의 세 가지 문단\n| 이름 | 뜻 | 예 |\n|---|---|---|\n| **정의** | 낱말의 약속. 맞고 틀림이 없다 | \"2로 나누어떨어지는 정수를 짝수라 한다\" |\n| **정리** | 참이라고 주장하는 문장 | \"짝수 둘을 더하면 짝수다\" |\n| **증명** | 그 주장이 왜 참인지 | 아래 2절 |\n\n읽다가 막히면 대개 **정의를 잊어서**입니다. 증명을 읽는 첫 요령은 낱말이 나올 때마다 정의로 **바꿔 써 보는 것**입니다.\n\n### 1-3. 기호 세 개\n| 기호 | 읽기 | 예 |\n|---|---|---|\n| ∀ | \"모든 ~에 대해\" | ∀x: 모든 x에 대해 |\n| ∃ | \"~가 (하나 이상) 있다\" | ∃x: 어떤 x가 있어서 |\n| P ⇒ Q | \"P이면 Q이다\" | 비가 오면 ⇒ 땅이 젖는다 |\n\n\"P ⇒ Q\"가 참이어도 **거꾸로 \"Q ⇒ P\"는 참이 아닐 수 있습니다.** 땅이 젖었다고 꼭 비가 온 것은 아니죠.\n\n### 1-4. 증명의 세 가지 방법\n**① 곧바로 보이기 (직접 증명).** 가정에서 출발해 정의와 계산으로 결론까지 간다. 가장 흔합니다.\n\n**② 모순으로 보이기 (귀류법).** \"결론이 틀렸다고 해 보자\"에서 출발해 말이 안 되는 상황에 닿으면, 결론이 맞는 것이다. 알리바이와 같습니다. \"이 사람이 범인이라고 해 보자. 그러면 그 시각에 현장에 있었어야 한다. 그런데 그때 다른 도시에 있었다. 말이 안 된다. 따라서 범인이 아니다.\"\n\n**③ 반례 들기.** \"모든 ~는 ~이다\"가 **틀렸음**을 보이려면 안 맞는 예 **하나**면 충분합니다. \"모든 백조는 희다\"는 검은 백조 한 마리로 무너집니다.\n\n> 맞음을 보이려면 모든 경우를 덮어야 하고(증명), 틀림을 보이려면 하나면 됩니다(반례). 이 비대칭을 기억하세요.\n\n### 1-5. 증명을 읽는 순서\n1. 정리에서 **가정**(주어진 것)과 **결론**(보일 것)을 가른다\n2. 낱말을 정의로 바꿔 쓴다\n3. 한 줄씩 읽으며 \"이 줄은 왜 되지?\"에 답한다 (정의, 가정, 앞 줄, 계산 규칙 중 하나)\n4. 작은 숫자 예로 확인해 본다\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n### 직접 증명\n**정리.** 짝수 둘을 더하면 짝수다.\n\n**증명.**\n1. a, b가 짝수라고 하자. (가정)\n2. 그러면 a = 2m, b = 2n인 정수 m, n이 있다. (짝수의 정의)\n3. a + b = 2m + 2n = 2(m + n). (계산)\n4. m + n은 정수이므로 a + b는 2로 나누어떨어진다. 즉 짝수다. (짝수의 정의) ∎\n\n∎는 \"증명 끝\" 표시입니다. 예(4 + 6 = 10)를 든 것이 아니라 **모든** 짝수에 대해 보였습니다.\n\n정수는 −2, −1, 0, 1, 2처럼 소수점이 없는 수입니다. 2번 줄의 \"~인 정수가 있다\"가 바로 ∃입니다. 기호로는 \"∃m: a = 2m\"이라고 씁니다. 정리 전체는 \"모든 짝수 a, b에 대해\"이므로 ∀가 숨어 있습니다.\n\n### 선형대수 증명\n**정리.** v가 A의 고유벡터이고 고유값이 λ이면, v는 $A^2$의 고유벡터이고 고유값은 $\\lambda^2$이다.\n\n**증명.**\n1. $Av = \\lambda v$. (고유벡터의 정의)\n2. $A^2 v = A(Av) = A(\\lambda v)$. (1을 대입)\n3. $= \\lambda (Av) = \\lambda (\\lambda v) = \\lambda^2 v$. (숫자는 행렬 밖으로 꺼낼 수 있음, 다시 1을 대입) ∎\n\n[고유값](#eg01)에서 \"행렬을 여러 번 곱하면 고유값의 거듭제곱\"이라고 했던 것의 증명입니다.\n\n### 반례\n**주장.** 모든 행렬 A, B에 대해 AB = BA이다. → **거짓.**\n\nA = [[1, 1], [0, 1]], B = [[1, 0], [1, 1]]이면 AB = [[2, 1], [1, 1]], BA = [[1, 1], [1, 2]]. 다릅니다. 반례 하나로 끝.\n\n---\n\n## 3. 능동 연습 (10분)\n\n### 풀어 보기\n1. \"∀x, x² ≥ 0\"을 우리말로 읽어 보세요.\n2. \"어떤 수가 4의 배수이면 짝수이다.\" 이 문장의 가정과 결론은? 거꾸로(\"짝수이면 4의 배수이다\")도 참인가요?\n3. 주장 \"두 벡터의 내적이 0이면 둘 중 하나는 영벡터 [0, 0]이다\"의 반례를 드세요.\n4. 다음 증명의 빈칸을 채우세요. **정리:** v가 A의 고유벡터(고유값 λ)이면 2v도 고유벡터다.\n   증명: A(2v) = 2(Av) = 2(＿＿) = λ(＿＿). ∎\n5. 다음은 어떤 증명 방법인가요? \"가장 큰 자연수 N이 있다고 하자. 그런데 N + 1도 자연수이고 N보다 크다. 말이 안 된다. 따라서 가장 큰 자연수는 없다.\"\n6. \"홀수 둘을 더하면 짝수다\"를 2절의 증명을 흉내 내어 증명해 보세요. (홀수는 2m + 1 꼴)\n\n### 미니 챌린지\n\"행렬 100개로 실험해 보니 모두 성립했다\"는 왜 증명이 아닐까요? 반대로, 논문이 실험 결과만 싣고 증명 없이 주장할 때 우리는 그것을 어떻게 받아들여야 할까요?\n\n### 코드 (선택): 반례는 컴퓨터로 찾을 수 있다\n```python\nimport numpy as np\nA = np.array([[1, 1], [0, 1]])\nB = np.array([[1, 0], [1, 1]])\nprint(A @ B)                 # [[2 1] [1 1]]\nprint(B @ A)                 # [[1 1] [1 2]]\nprint((A @ B == B @ A).all())   # False → \"AB = BA\"의 반례\n```\n\n---\n\n## 4. 셀프 체크 퀴즈 (4분)\n1. 정의와 정리의 차이는?\n2. \"모든 ~는 ~이다\"가 틀렸음을 보이려면 무엇이 필요한가요?\n3. O/X: \"P이면 Q\"가 참이면 \"Q이면 P\"도 반드시 참이다.\n4. 귀류법(모순으로 보이기)은 어떻게 진행하나요?\n\n---\n\n## 한 줄 정리\n증명은 인정된 사실만으로 한 줄씩 결론에 닿는 글이다. 맞음은 모든 경우를 덮어야 하고, 틀림은 반례 하나면 된다.\n\n---\n\n<details>\n<summary>정답 보기 (먼저 풀고 열기!)<\/summary>\n\n**풀어 보기**\n1. \"모든 x에 대해 x의 제곱은 0 이상이다.\"\n2. 가정: 4의 배수이다. 결론: 짝수이다. 거꾸로는 **거짓**입니다(반례: 6은 짝수지만 4의 배수가 아님).\n3. [1, 0] · [0, 1] = 0. 둘 다 영벡터가 아닙니다. (직교하는 벡터면 무엇이든 반례)\n4. A(2v) = 2(Av) = 2(**λv**) = λ(**2v**). 2v에 A를 곱하니 2v의 λ배가 나왔고, v가 영벡터가 아니므로 2v도 영벡터가 아닙니다. 따라서 2v는 고유벡터입니다.\n5. **귀류법**(모순으로 보이기)\n6. a = 2m + 1, b = 2n + 1이라 하자. a + b = 2m + 2n + 2 = 2(m + n + 1). m + n + 1은 정수이므로 a + b는 짝수다. ∎\n\n**미니 챌린지**\n101번째 행렬에서 깨질 수 있기 때문입니다. 증명은 \"모든 경우\"를 덮어야 합니다. 실험뿐인 주장은 \"지금까지의 증거로는 그럴듯하다\"로 받아들이고, 어떤 조건에서 실험했는지를 함께 봐야 합니다. 딥러닝 논문의 주장은 대부분 이쪽입니다.\n\n**퀴즈**\n1. 정의는 낱말의 약속이라 증명할 것이 없고, 정리는 참임을 증명해야 하는 주장입니다.\n2. 반례 하나\n3. X. 4의 배수이면 짝수지만, 짝수라고 4의 배수는 아닙니다.\n4. 결론이 틀렸다고 가정하고, 거기서 말이 안 되는 결과(모순)를 끌어내 가정이 잘못됐음을 보입니다.\n<\/details>\n", "link": "논문 연결: 대학원 교재와 이론 논문은 으로 쓰여 있습니다. 이 형식을 읽는 법이 10단계의 첫 도구입니다 (Axler, *Linear A", "lesson": true}, {"id": "sp01", "short": "스펙트럼 정리와 양의 정부호", "md": "# 10단계. 스펙트럼 정리와 양의 정부호\n\n30분 · 논문 연결: 기울기가 0인 곳에서 손실 함수의 \"휘어진 정도\"를 담은 행렬(헤시안)이 양의 정부호이면 그곳은 그릇의 바닥입니다. 최적화 이론 논문의 기본 낱말입니다 (Deep Learning 4.3절)\n\n---\n\n## 오늘의 목표\n1. 대칭 행렬은 \"서로 직교하는 축을 따라 늘이기\"로 완전히 풀린다는 스펙트럼 정리를 설명할 수 있다.\n2. 이차형식 $x^\\top A x$를 2×2에서 손으로 계산할 수 있다.\n3. 양의 정부호를 \"고유값이 모두 양수\"로 판별하고, 그것이 그릇 모양을 뜻한다는 걸 안다.\n\n**복습 (1분):** [[2, 1], [1, 2]]의 고유값과 고유벡터는? (답: 3과 [1, 1], 1과 [1, −1]. [고유값과 고유벡터](#eg01))\n\n---\n\n## 1. 개념 (8분)\n\n### 1-1. 대칭 행렬은 특별하다\n**대칭 행렬**은 대각선을 따라 접으면 마주 보는 숫자가 같은 행렬입니다. [[2, 1], [1, 2]]처럼요. 기호로는 $A^\\top = A$ (⊤는 행과 열을 맞바꾼다는 표시).\n\nAI에서 중요한 행렬은 대칭인 것이 많습니다.\n- 공분산 행렬 (데이터가 어느 방향으로 얼마나 퍼졌는지 적은 표입니다. [PCA](#svd01)에서 \"가장 넓게 퍼진 방향\"을 찾을 때 쓰는 행렬의 이름입니다)\n- 헤시안 (기울기가 얼마나 빨리 변하는지를 적은 표입니다. \"기울기의 기울기\"라고 생각하면 됩니다. 손실 함수가 방향마다 얼마나 휘었는지 알려 줍니다. 오늘은 계산하지 않고 이름만 씁니다)\n- $A^\\top A$ 꼴 (어떤 A로든 만들 수 있음)\n\n### 1-2. 스펙트럼 정리\n**정리.** 실수로 된 대칭 행렬은\n1. 고유값이 모두 **실수**(수직선 위에 찍을 수 있는 보통 수)이고\n2. 서로 **직교하는** 고유벡터들로 [기저](#vs01)를 만들 수 있다.\n\n식으로는 $A = Q \\Lambda Q^\\top$. Q는 길이 1인 고유벡터들을 세로로 세운 행렬(돌리기), Λ(람다 대문자)는 고유값을 대각선에 둔 행렬(늘이기)입니다.\n\n복습의 [[2, 1], [1, 2]]로 확인해 봅시다. 고유벡터 [1, 1]과 [1, −1]의 내적은 1 − 1 = 0입니다. 정말 직교합니다. 이 행렬은 [1, 1] 방향으로 3배, [1, −1] 방향으로 1배 늘입니다. 고무판을 서로 직각인 두 방향으로 잡아당기는 것과 같습니다.\n\n[SVD](#svd01)의 \"돌리기 → 늘이기 → 돌리기\"에서 **앞뒤 돌리기가 같은 축**인 경우입니다. (고유값이 음수이면 특이값은 그 절댓값이고, 그 축은 방향이 뒤집힙니다.) 일반 행렬은 고유벡터가 비스듬하거나 없을 수 있지만, 대칭 행렬은 **언제나 반듯한 직교 축**이 나옵니다.\n\n### 1-3. 이차형식: 행렬로 만든 그릇\n벡터 x를 넣으면 숫자 하나가 나오는 식입니다.\n\n$$x^\\top A x$$\n\n계산은 두 걸음입니다. 먼저 Ax를 구합니다. 그다음 그 결과와 x를 내적합니다. 예를 들어 A = [[2, 1], [1, 2]], x = [1, 1]이면 Ax = [3, 3]입니다. x와 내적하면 1 × 3 + 1 × 3 = 6입니다. 이 두 걸음을 글자로 한 번에 정리한 것이 아래 공식입니다.\n\n2×2에서 A = [[a, b], [b, d]], x = [$x_1$, $x_2$]이면\n\n$$x^\\top A x = a x_1^2 + 2b\\, x_1 x_2 + d\\, x_2^2$$\n\n[기울기를 숫자로 느끼기](#dx01)의 U자 함수 $w^2$를 여러 변수로 넓힌 것입니다. 손실 함수는 바닥 근처에서 이 모양으로 보입니다.\n\n### 1-4. 양의 정부호: 어느 쪽으로 가도 오르막\n**정의.** 영벡터가 아닌 모든 x에 대해 $x^\\top A x > 0$이면 A를 **양의 정부호**라고 한다.\n\n원점에서 어느 방향으로 가도 값이 커지는 **그릇 모양**이라는 뜻입니다.\n\n**정리.** 대칭 행렬 A가 양의 정부호 ⇔ A의 **고유값이 모두 양수**. (⇔는 \"양쪽이 같은 말\"이라는 뜻)\n\n왜 그럴까요? 고유벡터 방향 v(길이 1)를 넣어 봅니다. 고유벡터의 정의로 Av = λv입니다. 그래서 $v^\\top A v = v^\\top (\\lambda v) = \\lambda\\,(v^\\top v)$입니다. $v^\\top v$는 v와 v의 내적, 곧 길이의 제곱이라 1입니다. 결국 값은 λ입니다. 그 방향의 휘어짐이 고유값입니다. 모든 축에서 위로 휘어 있으면 그릇입니다.\n\n| 고유값 | 이름 | 모양 |\n|---|---|---|\n| 모두 양수 | 양의 정부호 | 그릇 (바닥이 하나) |\n| 모두 0 이상 | 양의 준정부호 | 그릇인데 평평한 골이 있을 수 있음 |\n| 양수와 음수가 섞임 | 부정부호 | **안장** (한쪽은 오르막, 한쪽은 내리막) |\n\n### 1-5. 딥러닝에서\n- 기울기가 0인 곳이 **바닥인지 안장인지**는 헤시안의 고유값 부호로 가립니다. 차원이 높은 신경망에서는 안장이 아주 많습니다\n- (선택) $A^\\top A$는 항상 양의 준정부호입니다. $x^\\top A^\\top A x$는 Ax를 자기 자신과 내적한 것, 곧 Ax의 길이의 제곱입니다. 길이의 제곱은 음수가 될 수 없습니다\n- (선택) A의 [특이값](#svd01)은 $A^\\top A$의 고유값의 제곱근입니다. 지금은 \"SVD와 고유값이 이어져 있다\"만 알면 충분합니다\n\n---\n\n## 2. 예제 따라하기 (6분)\n\n**A = [[2, 1], [1, 2]]** (고유값 3, 1)\n\n이차형식: $2x_1^2 + 2x_1x_2 + 2x_2^2$\n\n| x | 계산 | 값 |\n|---|---|---|\n| [1, 0] | 2 + 0 + 0 | 2 |\n| [1, 1] | 2 + 2 + 2 | 6 |\n| [1, −1] | 2 − 2 + 2 | 2 |\n\n모두 양수. 고유값이 3, 1로 모두 양수이니 **양의 정부호**(그릇)입니다.\n\n고유벡터 방향 확인: [1, 1]은 길이의 제곱이 2. 값 6 = 고유값 3 × 2 ✓. [1, −1]도 2 = 고유값 1 × 2 ✓.\n\n**B = [[1, 2], [2, 1]]**\n\n고유값: 합 2, 곱 1 − 4 = −3 → **3과 −1**. 음수가 섞여 있으니 양의 정부호가 **아닙니다.**\n\n이차형식: $x_1^2 + 4x_1x_2 + x_2^2$\n- x = [1, 1]: 1 + 4 + 1 = 6 (오르막)\n- x = [1, −1]: 1 − 4 + 1 = **−2** (내리막)\n\n안장입니다. 말안장처럼 앞뒤로는 올라가고 좌우로는 내려갑니다.\n\n---\n\n## 3. 능동 연습 (10분)\n\n### 손계산\n1. [[3, 0], [0, 2]]는 대칭인가요? 고유값은? 양의 정부호인가요?\n2. A = [[2, 1], [1, 2]], x = [2, 1]일 때 $x^\\top A x$는?\n3. [[2, 0], [0, −1]]의 이차형식을 식으로 쓰고, x = [0, 1]을 넣어 보세요. 양의 정부호인가요?\n4. [[2, −1], [−1, 2]]의 고유값은? (합과 곱 이용) 양의 정부호인가요?\n5. [[1, 3], [3, 1]]의 고유값은? 어떤 모양인가요?\n6. (선택) A = [[1, 2]] (1행 2열)일 때 $A^\\top A$ = [[1, 2], [2, 4]]입니다. 고유값을 구하고, 양의 준정부호인지 확인하세요.\n\n### 미니 챌린지\n기울기가 0인 지점에서 헤시안의 고유값이 [5, 0.01]입니다. 바닥인가요? 경사하강으로 이 그릇을 내려갈 때 어떤 어려움이 있을까요? (다음 레슨의 예고입니다.)\n\n### 코드 (선택)\n```python\nimport numpy as np\nA = np.array([[2.0, 1.0], [1.0, 2.0]])\nvals, Q = np.linalg.eigh(A)                  # 대칭 행렬용. 작은 고유값부터\nprint(vals)
